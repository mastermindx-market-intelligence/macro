# Bound the persistent journal on the droplet's 77G root disk (2026-10-19
# root-disk incident: /var/log/journal had grown to 790M with no cap; journald's
# default allows up to 10% of the filesystem). Installed to
# /etc/systemd/journald.conf.d/10-macro-vps-cap.conf by update.sh and setup.sh.
[Journal]
SystemMaxUse=300M
SystemKeepFree=2G
SystemMaxFileSize=50M
