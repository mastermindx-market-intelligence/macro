# config/ai_pricing.yml — AI provider pricing table.
#
# OPERATOR-MAINTAINED: rates change without notice. Review against Anthropic and
# DeepSeek billing pages before each billing cycle.
#
# Subscription-key costs (claude_oauth, claude_cli "subscription" cost_basis):
#   est_cost_usd is the API-EQUIVALENT VALUE of the call — what the same tokens
#   would cost at the pay-as-you-go rate. These are NOT billed dollars (the
#   subscription has a flat monthly fee), but they track usage burden and
#   inform model-routing decisions.
#
# Schema: ai_pricing.v1
schema: ai_pricing.v1

# per_mtok: cost in USD per 1,000,000 tokens for each direction.
# Prefix-match is used for model resolution:
#   "claude-haiku-4-5-20251001" matches prefix "claude-haiku-4-5"
per_mtok:
  # placeholder = opus rates; operator to update when official Fable pricing lands
  claude-fable-5:
    input: 5.00
    output: 25.00
  claude-opus-4-8:
    input: 5.00
    output: 25.00
  claude-sonnet-4-6:
    input: 3.00
    output: 15.00
  claude-haiku-4-5:
    input: 1.00
    output: 5.00
  deepseek-v4-pro:
    input: 0.435
    output: 0.87
  deepseek-v4-flash:
    input: 0.14
    output: 0.28

  # BytePlus commercial ModelArk Standard, source checked 2026-10-30:
  # https://console.byteplus.com/ark/region:ap-southeast-1/docs/model-pricing
  # Distinct from Z.ai direct pricing, BytePlus Personal Coding Plan, and
  # dynamic DeepSeek V4.1 peak/off-peak. No paid call or model activation
  # follows from these reviewed estimates.
  glm-5-3-flash-260828:
    input: 0.15
    output: 0.50
    cache_read_multiplier: 0.20  # $0.03/M / $0.15/M
    cache_write_5m_multiplier: null  # storage-hour basis is not write tokens
  dola-seed-2-1-turbo-260628:
    input: 0.50
    output: 2.50
    cache_read_multiplier: 0.20  # rate published for family alias, verify issuer
    cache_write_5m_multiplier: null

# Time-variable BytePlus Standard pricing. Without an explicit timezone-aware
# as-of instant the existing cost owner returns UNKNOWN rather than claiming a
# fixed DeepSeek V4.1 rate. Zone Asia/Shanghai (UTC+8) Mon-Fri 09-12, 14-18
# is PEAK; offpeak all other hours. On published October 30 model pricing.
temporal_per_mtok:
  deepseek-v4-1-flash-261017:
    schedule: asia_shanghai_weekday_peak_09_12_14_18_v1
    peak:
      input: 0.30
      output: 1.20
      cache_read_multiplier: 0.02
      cache_write_5m_multiplier: null
    offpeak:
      input: 0.15
      output: 0.60
      cache_read_multiplier: 0.02
      cache_write_5m_multiplier: null

# cache: multipliers applied on top of the input rate.
#   read_multiplier:       cache-read tokens cost this fraction of the input rate.
#   write_5m_multiplier:   cache-creation tokens cost this multiple of the input rate.
cache:
  read_multiplier: 0.10
  write_5m_multiplier: 1.25
