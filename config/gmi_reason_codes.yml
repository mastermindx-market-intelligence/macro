schema: gmi_explorer.reason_codes.v1
# Plain EN/ZH words for every reason/state code the GMI coverage proof
# (scripts/gmi_coverage_proof.py) can emit. Pages print these words, never the
# code. tests/test_gmi_reason_codes.py pins every constant and every code found
# in a live report to this file, so a new code fails the test until words land.
# Register: plain, lower-case sentence fragment, no code, no underscore, no
# vendor name, never "validated", no falsifier/refutation language.

reasons:
  IDENTITY_NOT_QUALIFIED:
    en: company identity not confirmed
    zh: 公司身份尚未确认
  ADMITTED_SCOPE_STALE:
