# ---------------------------------------------------------------------------
# CN concept vocabulary — policy (GMI W1b, masterplan §4.3)
# ---------------------------------------------------------------------------
cn_concepts:
  source: data/baskets_china_ths/concept_map.json
  source_asof_field: asof
  mapped_note: >
    61 of the ~373 同花顺 concept boards are mapped into the 18 theme rows above, and
    conservatively: a code is listed only where the board IS the theme in that market,
    not where it merely touches it. ths_concept_ids join to a THS basket through the
    basket's own ths_concept name via concept_map.json — the graph never invents the
    link, and a code whose board carries no priced basket simply yields no edge.
  unmapped_note: >
    The remaining concepts are deliberately NOT enumerated here. The W1a weekly re-scrape
    means the taxonomy moves; a static list of unmapped concepts in this file would be
    stale within a week and would then read as a claim about coverage that is no longer
    true. Unmapped CN concepts resolve through the graph's own basket nodes instead
    (basket:baskets_china_ths:<id>), and the LIVING unmapped count is printed nightly in
    data/theme_graph/_meta.json (ths_unmapped_concept_count, unknown_ths_codes).
  ai_applications_note: >
    The AI-application boards (AI应用, AI智能体, 多模态AI, AI眼镜, DeepSeek概念 …) are
    deliberately unmapped: foresight-18 has no application-tier AI theme, and G0.9 forbids
    minting vocabulary to cover the gap. They stay reachable as basket nodes until an
    owner adds an application-tier theme to the foresight vocabulary itself.
  authority_note: >
    Display-tier, like every other column here. These mappings order nothing, weight
    nothing and gate nothing (G0.11).

