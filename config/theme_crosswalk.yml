# config/theme_crosswalk.yml — Canonical TIL theme registry (W0 — PR-A)
#
# Maps 18 foresight canonical theme ids → baskets, subsector_rotation theme keys,
# and reserves citrini_basket_ids (always [] in PR-A; populated post CITR-2).
#
# Rules:
#   • Every foresight theme MUST appear exactly once as a canonical id.
#   • basket_ids reference data/baskets/membership.json keys (49 baskets total).
#   • primary_basket_id (v2) — the ONE basket that IS this theme, or null. It is the
#     only mapping that is sound in the REVERSE direction (basket → theme): basket_ids
#     answers "which baskets give this theme a price surface", which legitimately
#     includes supply-chain and proxy baskets (ai_infra for ai_semiconductors,
#     uranium_miners for nuclear_power, managed_care for medical_devices). Reading
#     those backwards would tell a managed_care holder they own the medical-devices
#     theme. Each primary is TRANSCRIBED from the row's own note — a note asserting a
#     direct identity ("direct match" / "maps directly" / "Basket is named X") sets it;
#     a note disclaiming one ("No dedicated ... basket exists") leaves it null, even
#     where basket_ids lists a "closest" proxy. 13 set, 5 honest nulls.
#   • subsector_keys reference site/marketdata/subsector_rotation.json themes[].theme strings.
#   • Baskets not mapped to any canonical theme are listed in unmapped_baskets below.
#   • citrini_basket_ids: still [] on every row. Operator ruling 2026-08-11 (masterplan
#     §4.3 / §10.3): the FEEDS stay closed forever (CITR-0/1/3/4), but the column may now
#     be filled from the in-hand Citrini theme DEFINITIONS as operator-reviewed curated
#     evidence. It stays empty until those definitions are committed to the repo — a
#     mapping to a definition that lives only in someone's inbox is not citable.
#   • Honest nulls: basket/subsector mappings are empty where no token overlap exists.
#   • DO NOT add may_rank/may_gate/may_size/may_escalate overrides — display-only law.
#
# Derivation: programmatic token-overlap candidates, then curated by foresight rationale.
# Version: 1 (2026-07-09, TIL W0 PR-A)
#          2 (2026-08-02, SI follow-ups PR-A1) — added primary_basket_id. Additive
#            only: basket_ids / subsector_keys / citrini_basket_ids are byte-unchanged,
#            so every existing consumer keeps its current behaviour.
#          3 (2026-08-11, GMI W1b) — added theme_node_id, ths_concept_ids, cn_basket_ids
#            + the cn_concepts policy block; additive only. Every v2 field on every row is
#            byte-identical (verified field-by-field in the wave PR), so the nightly TIL
#            consumers keep their current behaviour. theme_node_id is the join key into
#            data/theme_graph/nodes.parquet; the two CN columns are the CN half of the
#            crosswalk the GMI masterplan §4.3 charters — this file EXTENDS the live TIL
#            vocabulary in place and never forks it (G0.9: no vocabulary N+1).

