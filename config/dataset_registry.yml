  # ── R00 consumer A (D00.D6, 2026-10-13): Terminal daily OHLC JSON ───────────
  # Cross-repo producer (repo mastermind-terminal @ 06a49a6104f6): status stays
  # PROPOSED — this registry does not pretend an in-repo pipeline evidences a
  # store another repo writes (R00.01), so the producer, basis and population
  # below are cited, not claimed as produced here.
  - dataset_id: terminal.bars.daily.ohlc_json
    layer: L3
    status: PROPOSED
    owner: charting-app       # outside the in-repo owner vocabulary: the Terminal
                              # app owns its own published output (R00 note)
    producer: mastermind-terminal@06a49a6104f6:ingest/build_universe.py::build_ohlc_json
    storage: mastermind-terminal:terminal/public/data/{ticker}.json   # OUT = $TERMINAL_DATA_DIR
                              # override; manifest.json beside it (see notes)
    format: json
    grain: [ticker, date]
    identity:
      id_column: ticker
      id_type: symbol         # storage key = vendor spelling frozen at write (D00.D2),
                              # resolved through the alias table — never an identity
    temporal_profile: DERIVED
    frequency: 1d
    version: "0.1.0"
    basis: tradj
    population:
      market: US
      venues: [XNYS, XNAS, XASE, ARCX]
      universe: US tickers present in the Macro deep store data/stocks/<T>.parquet
        (last MAX_BARS=3900) and existing Terminal flagship daily histories whose
        store and yahoo_fetch aliases resolve to the same supported US listing;
        direct Yahoo history is bounded by the observed per-file coverage
    clocks: [derived]          # a DERIVED profile carries no clock of its own (D00.D1)
    point_in_time_corporate_actions: false
    rights:
      purchase_access: unverified
      internal_computation: unverified
      redistribution: not_granted
    notes: >
      PROPOSED, never PRODUCED on this registry's evidence: the producer lives in
      another repo (R00.01) — mastermind-terminal@06a49a6104f6:ingest/
      build_universe.py::build_ohlc_json (def at :142), US input = the Macro deep
      store data/stocks/<T>.parquet via MACRO_REPO/ohlc_rel (:376-384, :423-428),
      i.e. this registry's equity.bars.daily.stocks (tradj close). Output written
      per ticker at :429 under OUT = $TERMINAL_DATA_DIR or terminal/public/data
      (:54), manifest.json at :450 (:56); MAX_BARS=3900 (~15y daily, :58/:145).
      BASIS (R00 ruling): mixed per-ticker vendor-adjusted sources selected by
      `src` (deep = Macro equity.bars.daily.stocks tradj close with synthetic
      open; polygon = adjusted=true aggs; yahoo = auto_adjust); vendor-adjusted,
      not house SADJ (D00.D3), not executable; per-ticker basis is not declared
      in the output -> GAP. One row label may never claim LESS adjustment than a
      constituent may carry, and `sadj` would claim a house qualification D00.D3
      reserves for qualified split events. The `o` field is SYNTHETIC (= prior
      close, :147-149) with high/low clamped to include it (:152-153) and
      bar_quality synthetic_open_deepstore — displayed, never a traded open
      (D00.D4). Never-clobber (:415-421): an existing per-ticker JSON whose src
      is polygon or yahoo is kept; those files come from other producers —
      ingest/refresh_ohlc.py:40-41 (Polygon grouped daily aggs, adjusted=true)
      and ingest/refresh_ohlc_intl.py:86 (yfinance auto_adjust). CN/HK/Intl
      inputs (:23-26) are outside the D00.D6 positive witness (identity-only).
      POPULATION: market US; venues measured from the Polygon primary_exchange
      MIC map (:89-91, :211) — XNYS/XNAS/XASE/ARCX; D00.D6 names XNAS/XNYS/ARCX,
      the XASE difference is recorded as a GAP. No lineage edge in `inputs:`: the
      in-repo DAG is in-repo lineage, and a cross-repo build is named here, not
      graphed as an in-repo pipeline.
      2026-10-19 direct-source integration: the existing Terminal producer
      ingest/build_polygon_universe.py may bind its own fresh Yahoo max/1d
      auto_adjust observation through lib/dataos/terminal_materialization.py.
      This explicit source variant closes the basis gap only for its bound
      per-symbol materializations, using the actual requested yahoo_fetch alias,
      canonical store identity, source/module versions, exact reference-file
      hashes and dataos.terminal_ohlc.rows.v1 digest of all published OHLCV rows.
      It does not claim the Macro parquet as an upstream dependency. Reused
      documents retain their original observation; any mixed-source append or
      content change invalidates the active binding until a full rebind.
      CURRENT TRADJ is a non-executable vendor total-return proxy; historical
      availability, action revisions and unattested identity generations remain
      explicit. No rights or PROPOSED status change is implied. Contract and
      acceptance limits: research/TERMINAL_YAHOO_MATERIALIZATION_2026-10-19.md.

