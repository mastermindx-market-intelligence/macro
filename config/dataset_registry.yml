# ─────────────────────────────────────────────────────────────────────────────
# Mastermind Data OS — dataset registry (§D5 / §D9)
#
# WHAT THIS IS.  One row per dataset: who produces it, where it lives, which clocks
# it carries, what its columns actually MEAN, and which datasets it reads. Loaded by
# lib/dataos/registry.py::load_registry and checked by
# tests/test_dataos_registry.py.
#
# WHY IT EXISTS.  Nothing in this repo declared what a dataset IS, so every consumer's
# assumption lived only in the consumer — which is how the same NVDA close came to be
# 114.80 in two stores, 115.00 in a third column and 1150.00 in a fourth, all named
# some form of "close" (§D4). The registry is where a basis stops being folklore.
#
# THE HONESTY RULE — THE ONLY ONE THAT MATTERS HERE.  A registry that lists a dataset
# which does not exist is WORSE than no registry, because the next session builds
# against it. Every row is either:
#     status: PRODUCED   the store exists today and a named producer writes it, and
#                        every fact below was verified before it was written down;
#     status: PROPOSED   declared so it has a stable dataset_id, produced by NOTHING.
# This seed is deliberately SMALL: only datasets whose facts are verified in the
# pinned design spec are PRODUCED. Growing it is cheap; un-lying is not.
#
# THE COLUMN NAMES BELOW ARE THE NAMES ON DISK TODAY, not the canonical ones. Where a
# stored name is ambiguous (`close`), `basis:` carries the MEASURED truth and `renames_to:`
# carries the canonical §D4 name the V1 reader shim will expose. That pairing is the
# whole V1 migration: 132 files keep reading `close`, and the basis stops being a guess.
#
# TWO KINDS OF "CONSUMER", AND THEY ARE NOT THE SAME FIELD. `inputs:` holds
# dataset_ids ONLY — it IS the lineage DAG, and the reverse edge (Registry.consumers_of)
# is DERIVED from it, never hand-maintained. Functions that read a store go in
# `code_consumers:` and are prose. Both once lived under the name "consumers", and a
# caller could not tell which of the two answers it was holding.
#
# temporal_profile ∈ BARS | REVISABLE_RELEASE | SNAPSHOT_SERIES | EVENT | DERIVED | INTELLIGENCE
# layer            ∈ L0 (SOURCE) | L1 (NORMALIZED) | L2 (CANONICAL) | L3 (DERIVED) | L4 (INTELLIGENCE)
# conflict_policy  ∈ PRIMARY_ONLY | FALLBACK | DOMAIN_AUTHORITY | CROSS_VALIDATE | COMPOSITE
# ─────────────────────────────────────────────────────────────────────────────
schema: dataset_registry.v1
updated: "2026-10-12"

datasets:

  # ── Equity bars ────────────────────────────────────────────────────────────
  - dataset_id: equity.bars.daily.stocks
    layer: L1
    status: PRODUCED
    owner: macro-dashboard
    producer: collectors/sector_holdings.py::StockPriceAdapter
    storage: data/stocks/{ticker}.parquet
    format: parquet
    grain: [ticker, date]
    identity:
      id_column: ticker
      id_type: symbol            # NOT an identity (§D2) — the alias table is the join
    temporal_profile: BARS
    timezone: America/New_York
    frequency: 1d
    adjustment: total_return     # measured, not declared by the store
    vendor: yahoo
    conflict_policy: PRIMARY_ONLY
    quality_checks: [uniqueness, validity, freshness, continuity]
    version: "1.0.0"
    licensing: vendor_terms_personal_use
    # ── R00 consumer declarations (D00.D6 consumer B, 2026-10-13) ─────────────
    basis: tradj                       # row-level, agrees with schema close (R00)
    clocks: [ingested_at]              # no per-row published_at is captured; first
                                       # system observation is the nightly collect (D00.D1)
    point_in_time_corporate_actions: false   # no action revision set bound to this store
    rights:                            # separately stated; never inferred (K01.02)
      purchase_access: unverified
      internal_computation: unverified
      redistribution: not_granted
    code_consumers:                    # DataWorkspace canonical read (D00.D6 consumer B)
      - lib/dataos/web_workspace.py
      - lib/dataos/web_api.py
      - lib/dataos/web_readers.py
    schema:
      close:
        dtype: float64
        unit: quote_currency
        basis: tradj
        renames_to: close_tradj
        nullable: false
        note: >
          MEASURED NVDA 2024-06-03 = 114.80, identical to data/yahoo `close` — i.e. this
          store carries the TOTAL-RETURN series under a name that says nothing. The
          split-adjusted basis the house itself calls correct for structure math is
          ABSENT from this store, which 132 files read.
    notes: >
      This store has NO `open` column (§D4 measurement). An OHLC-shaped read against it
      returns a frame quietly missing a leg rather than raising, so consumers must check
      rather than assume. The producer splices short auto_adjust=True windows onto deep
      history, which is how 30/231 names came to be stranded on a stale adjustment basis
      (measured 2026-07-19, healed by scripts/heal_stocks_basis.py) — the concrete cost of
      an adjusted series whose adjustment vintage is not recorded (§D4).
      R00 POPULATION (2026-10-13, D00.D6 consumer B): market US. No `population:`
      block is declared because venues are NOT measurable from the producer or any
      in-repo source without reading `data/` (the yfinance fetch exposes no per-row
      venue; the fetch universe is the union of top-N holdings per
      collectors/sector_holdings.py plus every stored name, and holdings may include
      foreign shares per that adapter's own session-routing comment) — an honest
      partial stays in this note rather than guessing a MIC list.

  - dataset_id: equity.bars.daily.yahoo
    layer: L1
    status: PRODUCED
    owner: macro-dashboard
    producer: collectors/yahoo.py
    storage: data/yahoo/{ticker}.parquet
    format: parquet
    grain: [ticker, date]
    identity:
      id_column: ticker
      id_type: symbol
    temporal_profile: BARS
    timezone: America/New_York
    frequency: 1d
    adjustment: dual_basis
    vendor: yahoo
    endpoint: yfinance
    conflict_policy: PRIMARY_ONLY
    quality_checks: [uniqueness, validity, freshness, continuity]
    version: "1.0.0"
    licensing: vendor_terms_personal_use
    schema:
      close:
        dtype: float64
        unit: quote_currency
        basis: tradj
        renames_to: close_tradj
        nullable: false
        note: >
          Adj Close from yfinance auto_adjust=False. MEASURED NVDA 2024-06-03 = 114.80.
      close_price:
        dtype: float64
        unit: quote_currency
        basis: sadj
        renames_to: close_sadj
        nullable: false
        note: >
          Close from yfinance auto_adjust=False — split-adjusted, dividend-UNadjusted.
          MEASURED NVDA 2024-06-03 = 115.00. collectors/yahoo.py calls this "the correct
          basis for all structure math"; the NAMES invert intuition, which is exactly the
          §D4 defect.
      volume:
        dtype: int64
        unit: shares
        nullable: true
    notes: >
      Both stored bases are RE-ADJUSTED by Yahoo at every fetch, so an adjusted series
      here is a point-in-time quantity with an UNRECORDED vintage (§D4). collectors/yahoo.py
      detects the resulting overlap disagreement via store.basis_shifted and re-pulls
      period='max' instead of splicing. `adjustment_asof` is owed and not yet carried.

  - dataset_id: equity.bars.daily.massive
    layer: L1
    status: PRODUCED
    owner: macro-dashboard
    producer: collectors/massive_stock_day.py
    storage: data/massive_stock_day/{ticker}.parquet
    format: parquet
    grain: [ticker, date]
    identity:
      id_column: ticker
      id_type: symbol
    temporal_profile: BARS
    timezone: America/New_York
    frequency: 1d
    adjustment: none
    basis: raw
    rights:
      purchase_access: granted
      internal_computation: granted
      redistribution: granted
      evidence:
        purchase_access: research/licenses/MASSIVE_ENTITLEMENT_RECORD.md
        internal_computation: research/licenses/MASSIVE_ENTITLEMENT_RECORD.md
        redistribution: research/licenses/MASSIVE_ENTITLEMENT_RECORD.md
    code_consumers:
      - scripts/stock_liquidity_profile.py
    conflict_policy: PRIMARY_ONLY
    quality_checks: [uniqueness, validity, freshness]
    version: "1.0.0"
    schema:
      close:
        dtype: float64
        unit: quote_currency
        basis: raw
        renames_to: close_raw
        nullable: false
        note: >
          MEASURED NVDA 2024-06-03 = 1150.00 — the price actually PRINTED, pre the 10:1
          split. Same column name as the two stores above, 10x the number.
      volume:
        dtype: int64
        unit: shares
        nullable: false
        note: >
          Native _parse_day normalizes missing source volume to zero. Non-null
          storage does not certify source completeness; the F08 qualified
          projection refuses a zero-volume window because missingness was erased.
    notes: >
      The only raw-print equity store here, and therefore the only lawful input for
      limit-price / tick-size / exchange-rule work — see DNR:KILL-CN-ADJUSTED-TAPE-LEGAL-LIMIT,
      where using an adjusted tape for exactly that stop-shipped a whole program.
      Rights adopt the existing operator-confirmed enterprise record, not a new
      grant. Currency and per-row publication/ingestion clocks are not declared
      by these daily files; the F08 liquidity projection must qualify its window
      separately and cannot infer USD or known_at from this registry entry.

  # ── Macro releases ─────────────────────────────────────────────────────────
  - dataset_id: macro.fred.observations
    layer: L1
    status: PRODUCED
    owner: macro-dashboard
    producer: collectors/fred.py
    storage: data/fred/{series}.parquet
    format: parquet
    grain: [series, date]
    identity:
      id_column: series
      id_type: fred_series_id
    temporal_profile: REVISABLE_RELEASE
    timezone: UTC
    frequency: mixed
    vendor: fred
    endpoint: https://api.stlouisfed.org/fred/series/observations
    conflict_policy: PRIMARY_ONLY
    quality_checks: [freshness, completeness, temporal_integrity]
    version: "1.0.0"
    licensing: public_domain
    schema:
      value:
        dtype: float64
        nullable: true
        null_reasons: [NOT_YET_AVAILABLE, VENDOR_FAILED]
        note: >
          LATEST VINTAGE ONLY. This store answers "what is the series now", never "what
          did we know on date t" — macro.fred.vintages is the point-in-time reader.
          REVISABLE_RELEASE declares published_at as owed; the store does not carry it
          yet, which is a contract gap this row exists to make visible.
    notes: >
      config.yml `fred.vintage_series` decides which of these survive into the ALFRED
      store and REPLACES (never extends) collectors/fred.py:DEFAULT_VINTAGE_SERIES. A
      one-line deletion there silently drops series from the vintage store on the next
      keyed collect; it has happened twice (IC4WSA/CCSA restored #3710, then
      PPIFES/ECIALLCIV/ECIWAG #3735).

  - dataset_id: macro.fred.vintages
    layer: L1
    status: PRODUCED
    owner: macro-dashboard
    producer: collectors/fred.py::fetch_vintages
    storage: data/fred_vintage/vintages.parquet
    format: parquet
    grain: [series, period, realtime_start]
    identity:
      id_column: series
      id_type: fred_series_id
    temporal_profile: REVISABLE_RELEASE
    timezone: UTC
    frequency: mixed
    vendor: fred
    endpoint: https://api.stlouisfed.org/fred/series/observations (ALFRED realtime)
    conflict_policy: PRIMARY_ONLY
    quality_checks: [uniqueness, temporal_integrity, completeness]
    version: "1.0.0"
    licensing: public_domain
    # NO `inputs:`. This store and macro.fred.observations are L1 SIBLINGS off one
    # vendor API, not a producer/consumer pair: collectors/fred.py::_vintage_series
    # (:153-174) takes its series list from config.yml / DEFAULT_VINTAGE_SERIES, and
    # _fetch_vintage_one (:177-195) calls the ALFRED realtime endpoint directly. It
    # never reads data/fred/*.parquet. An edge here was declared and was FALSE — see
    # tests/test_dataos_registry.py::test_the_two_fred_stores_are_siblings_...
    # for what a false edge costs a lineage query.
    code_consumers: [collectors/fred.py::as_of_series, collectors/fred.py::initial_release]
    schema:
      series: {dtype: string, nullable: false}
      period: {dtype: "datetime64[ns]", nullable: false, note: "the interval the observation describes"}
      value: {dtype: float64, nullable: true}
      realtime_start:
        dtype: "datetime64[ns]"
        nullable: false
        note: >
          The published_at clock in ALFRED's own vocabulary — the date this vintage
          became knowable. This is what makes the store point-in-time readable.
      realtime_end: {dtype: "datetime64[ns]", nullable: true}
    notes: >
      ONE of the six independent, locally-correct PIT implementations §D0 names. It is
      correct; it is also unregistered and shares no vocabulary with the other five,
      which is the whole thesis. fetch_vintages() REWRITES this parquet wholesale, so
      the append-only revision chain lives in ALFRED, not here.

  # ── Reference / identity spine (§D2) — PRODUCED (DOS-1.1, 2026-08-13) ───────
  - dataset_id: reference.security_master
    layer: L2
    status: PRODUCED
    owner: macro-dashboard
    producer: scripts/build_security_master.py
    storage: data/reference/security_master.parquet
    format: parquet
    grain: [security_id]
    identity:
      id_column: security_id
      id_type: SEC
    temporal_profile: SNAPSHOT_SERIES
    timezone: UTC
    # ON_DEMAND, not `1d`: NOTHING schedules this producer. It is in no workflow, no
    # cron and no nightly step, and saying "daily" would be the same class of lie as a
    # PROPOSED row claiming a store — the next session joins on it and gets a frozen
    # snapshot with no signal that it is frozen (gate G1, one step downstream).
    # tests/test_dataos_security_master.py::
    # test_the_committed_artifact_is_not_stale_against_the_current_seeds is the
    # freshness detector instead: it rebuilds from the CURRENT seeds on top of the
    # committed artifact and reds when a seed change would add a security. Remedy is
    # one command: python3 scripts/build_security_master.py --report
    frequency: on_demand
    conflict_policy: DOMAIN_AUTHORITY
    quality_checks: [uniqueness, referential, completeness]
    version: "0.1.0"
    schema:
      security_id: {dtype: string, nullable: false, note: "SEC:<inception listing key>, minted once and stored"}
      issuer_id:
        dtype: string
        nullable: true
        note: >
          ISS:<inception listing key> of the security's CANONICAL MEMBER (V4-D2B1
          §2) — the economic issuer, which one or more securities may share
          (GOOG/GOOGL both -> ISS:US-XNAS-GOOG). Existing minted values are RETAINED
          under mint-once (Sol: "previous issuer values are not erased");
          repointed ONLY via an issuer_migrations.parquet receipt row. NULL only for
          a post-era row with no CIK evidence — never a fresh per-listing mint (the
          abolished fallback). See issuer_state for the evidentiary status.
      issuer_state:
        dtype: string
        nullable: false
        note: >
          Closed enum (V4-D2B1 §3): RESOLVED (CIK evidence backs issuer_id; only
          these rows are lawful for issuer-level aggregation) | NO_ISSUER_EVIDENCE
          (issuer_id may be a retained legacy mint, or NULL for an evidence-less new
          row — both aggregation-forbidden) | AMBIGUOUS (current symbol maps to >1
          CIK; reserved, fail-closed) | EVIDENCE_CONFLICT (later evidence disagrees
          with a committed assignment; recorded, never auto-executed — except a
          NULL-issuer allowlist refusal whose CIK is later ratified, re-examined
          all-or-nothing per CIK, D2B1 AMENDMENT §7) |
          DEFERRED_IDENTITY_EXCEPTION (named in _receipt.json identity_exceptions —
          GOLD today; B never mints a row — excluded from grouping entirely).
      issuer_cik:
        dtype: string
        nullable: true
        note: "Zero-padded 10-digit SEC registrant CIK backing issuer_id when issuer_state=RESOLVED."
      issuer_evidence_snapshot:
        dtype: date
        nullable: true
        note: "data/symbol_directory/cik_map/*.parquet observation date backing the RESOLVED link."
      listing_key: {dtype: string, nullable: false, note: "<CC>-<MIC>-<CODE>[.N] — inception code, never today's symbol"}
      country: {dtype: string, nullable: false}
      mic: {dtype: string, nullable: false}
      inception_code: {dtype: string, nullable: false}
      effective_at: {dtype: "datetime64[ns]", nullable: false}
      ingested_at: {dtype: "datetime64[ns]", nullable: false}
      security_state:
        dtype: string
        nullable: true
        note: >
          Closed enum (V4-D2B1-R1 §3.1): null = active | SUPERSEDED_DUPLICATE_MINT
          (a security minted as an independent row for a rename's NEW symbol BEFORE
          this builder modelled the rename, corrected onto superseded_by — never
          deleted, H9). A superseded row is excluded from issuer re-examination,
          issuer aggregation, and every consumer join index (see
          reference.security_migrations, lib.dataos.identity.IssuerMaster).
      superseded_by:
        dtype: string
        nullable: true
        note: "security_id this row was corrected onto; null unless security_state=SUPERSEDED_DUPLICATE_MINT."
    notes: >
      lib/dataos/identity.py is the ALLOCATOR (mint-once, a pure derivation); this
      dataset is the AUTHORITY (the stored value). Re-running the producer NEVER
      re-mints an existing security_id — it joins a committed row by listing_key and
      keeps every stored column, so a later correction to inception facts appends an
      ALIAS instead (§D2). Seeded from data/breadth/constituents.parquet,
      data/baskets/membership.json and config/delisted_symbols.yml; the VENUE comes from
      the newest data/symbol_directory/snapshots/*.parquet (exit ledger first for a
      delisted name — the directory is a CURRENT listing set and cannot carry a finished
      tape). Coverage is REPORTED, not asserted, and named in data/reference/_receipt.json.
      effective_at is NOT a
      listing date — no in-repo US listing-date source exists (§4) and back-dating one
      from a store's earliest bar would be fabrication, so it carries the earliest DATED
      OBSERVATION in the committed seeds instead.
      ISSUER AXIS (V4-D2B1, 2026-08-19): the era-inside-the-builder correction
      `issuer_semantic_correction_v1` groups securities by identical SEC registrant CIK
      (evidence: data/symbol_directory/cik_map/*.parquet, joined on the security's
      CURRENT symbol, dot->dash normalized — NEVER a historical/dated alias symbol,
      two-clock safe) and repoints issuer_id to the group's canonical member (spec §2
      tie-break). security_id/listing_key are byte-identical before/after; only
      issuer_id may change, and only via a data/reference/issuer_migrations.parquet
      receipt row. See data/reference/issuer_master.parquet for the issuer-level
      rollup and lib/dataos/identity.IssuerMaster for the canonical reader.
      LIVE-REFRESH SEAM (spec §7): one non-fatal `daily.yml` collect-job step now runs
      `python3 scripts/build_security_master.py --nightly` — fail-closed (refuses on a
      missing/unreadable identity input, byte-stable no-op when nothing advanced,
      generated_at only re-stamped when inputs genuinely changed). The freshness TEST
      (test_the_committed_artifact_is_not_stale_against_the_current_seeds) remains the
      backstop for anyone who forgets to run the seam.
      DISPLAY TIER for signal/ranking/trade; PROMOTED to canonical exact-identity
      AUTHORITY for CURRENT issuer/security/listing identity (Sol's D2A ruling,
      research/prophet_v4/d2/D2A_FROZEN_CONTRACT_2026-08-18.md) — see _receipt.json's
      decomposed `authority` block. Historical issuer lineage is explicitly
      UNAVAILABLE: CIK evidence is a current-registrant observation only (no `asof`
      parameter anywhere on the issuer reader).
      SECURITY AXIS (V4-D2B1-R1, 2026-08-20): security_state/superseded_by are a
      SEPARATE closed-enum era from the issuer axis above — a CORRECTION (never a
      deletion, H9) for a security minted as an independent row for a rename's NEW
      symbol before this builder modelled the rename (the VMRK/EQR duplicate mint).
      See data/reference/security_migrations.parquet for the durable receipt and
      lib.dataos.identity.IssuerMaster.security_state_of/superseded_by_of for the
      canonical reader. The general pending-transition fence (§5) that prevents a
      RECURRENCE of this class lives in the receipt's `pending_transition_refusals`
      and `listing_continuity` blocks, not in this schema.
    # ── R00 consumer declarations (D00.D6 consumer B, 2026-10-13) ─────────────
    basis: not_applicable              # no schema column carries a price basis
    rights:                            # separately stated; never inferred (K01.02)
      purchase_access: unverified
      internal_computation: unverified
      redistribution: not_granted
    code_consumers:                    # DataWorkspace canonical read (D00.D6 consumer B)
      - lib/dataos/web_workspace.py
      - lib/dataos/web_api.py
      - lib/dataos/web_readers.py

  - dataset_id: reference.vendor_aliases
    layer: L2
    status: PRODUCED
    owner: macro-dashboard
    producer: scripts/build_security_master.py
    storage: data/reference/vendor_aliases.parquet
    format: parquet
    grain: [alias_kind, vendor, vendor_symbol, valid_from]
    identity:
      id_column: security_id
      id_type: SEC_or_IDX
    temporal_profile: SNAPSHOT_SERIES
    timezone: UTC
    frequency: on_demand   # same producer, same reason — see reference.security_master
    conflict_policy: DOMAIN_AUTHORITY
    quality_checks: [uniqueness, referential, temporal_integrity]
    version: "0.2.0"
    inputs: [reference.security_master]
    schema:
      vendor: {dtype: string, nullable: false}
      vendor_symbol: {dtype: string, nullable: false}
      security_id: {dtype: string, nullable: false}
      valid_from: {dtype: date, nullable: true, note: "inclusive; null = open bound"}
      valid_to:
        dtype: date
        nullable: true
        note: >
          EXCLUSIVE — the first day the row no longer holds; null = open bound. An
          inclusive end makes the changeover day ambiguous, and 2026-01-14 is exactly
          the day the MMC/MRSH answer has to be unambiguous.
      ingested_at: {dtype: "datetime64[ns]", nullable: false}
      known_at: {dtype: string, nullable: true, note: "aware UTC evidence observation; required for polygon and occ_root, not consumer read availability"}
      evidence_sha256: {dtype: string, nullable: true, note: "retained decoded source evidence digest; required for polygon and occ_root"}
      binding_sha256: {dtype: string, nullable: true, note: "semantic alias tuple seal; consistency, not source authenticity"}
      alias_kind: {dtype: string, nullable: true, enum: [occ_root], note: "null preserves ordinary bidirectional aliases; occ_root is a forward-only typed-underlying relation"}
    notes: >
      For alias_kind=occ_root the existing security_id column holds an exact SEC or IDX
      target; a prefix is syntax, never a canonical record or permission grant.
      This relation requires an event date, aware known_at, retained source digest,
      and a kind-separated binding seal. The dedicated lookup verifies exact retained
      evidence bytes by decision cutoff. Distinct roots may share one underlying;
      overlapping targets for one vendor/root refuse. Ordinary lookup excludes these
      rows. Existing null alias_kind rows retain their bidirectional uniqueness.
      Ingestion must establish source-specific root semantics and bind an existing
      canonical security or index record before publishing any root row. This schema
      does not create an index registry or admit a source by ticker equality.
      The explicit thetadata/SPY profile combines captured Cboe product/reference,
      Theta v3 symbol-contract and SEC/listing evidence with an existing active
      SEC:US-ARCX-SPY record. New intake covers only its observed UTC date, retains
      both capture clocks and canonical target fields, and refuses later replay.
      Ordinary refresh preserves the historical window. This is source-specific
      inference, not a live Theta response, verified Matrix session or rights grant;
      see docs/dataos/direct-registrant-intake.md. Ordinary us_equity still excludes
      ARCX; the Options consumer validates the typed canonical target separately.
      The additional `polygon` historical-naming namespace is a bounded prospective
      reference observation, with valid_from on the actual requested date and exclusive
      valid_to. Both canonical lookup directions require an explicit aware decision_at;
      known_at gates evidence observation, never publication or Radar file-read custody.
      Candidate use additionally requires its existing input-bundle native snapshot read
      receipt by cutoff. Missing clocks or conflicting observations refuse; this is not
      bitemporal revision selection. Digests establish consistency, not authenticity.
      Existing namespaces retain their original semantics and null additive fields.
      Supersedes lib/ticker_aliases.py — 53 lines, 2 entries, Yahoo-only and TIMELESS,
      which is why it can say "MMC means MRSH" but not "MMC meant MMC before
      2026-01-14". Its own docstring records the 7-month silent production loss the
      time-scoped table exists to prevent: data/baskets/ohlcv/MMC.parquet never existed,
      the `insurance` basket rendered 18/19 members and `us_sector_financials` 75/76.
      PRODUCED as of 2026-08-13, and it now answers DIFFERENTLY either side of both
      dated renames: yahoo/MMC before 2026-01-14 and yahoo/MRSH from it, yahoo+ledger+
      membership SATS before 2026-06-24 and ECHO from it — one security_id on each side
      (SEC:US-XNYS-MMC, SEC:US-XNAS-SATS).
      FIVE vendor SPACES in TWO FAMILIES, and reading one family as the other is the
      MMC outage in a new costume (adversarial review 2026-08-13), so the names say
      which clock they run on. HISTORICAL NAMING — "what did this space call it ON that
      day", DATED across a rename: `yahoo` (what the price vendor called it), `membership`
      (this repo's own key) and `ledger` (the signal-archive key space). CURRENT CATALOG
      — "what string do I use TODAY, for a bar of ANY date", ONE OPEN-BOUNDED row at
      today's symbol: `yahoo_fetch` (reproduces lib.ticker_aliases.fetch_symbol — Yahoo
      migrated Marsh's WHOLE history onto MRSH, so a backfill of 2020 requests MRSH, not
      the MMC the historical space correctly reports) and `store` (reproduces
      lib.ticker_aliases.store_key — data/stocks/ECHO.parquet holds EchoStar back to
      2008 and data/baskets/ohlcv/MMC.parquet is the file that exists). `supersedes:`
      below is the CURRENT-CATALOG family only; the historical rows are not, and must
      never be used as, a fetch-symbol or store-key resolver.
      The membership space does NOT generalise from MMC: it moves when the repo's own
      key moves. breadth.ticker_fixups pins MRSH back to MMC (Marsh's repo key did NOT
      move, so that row is open), while quality.ticker_key_migrations ratifies
      SATS->ECHO (EchoStar's DID, so that pair is dated). Leaving membership open at
      today's ECHO re-labelled EchoStar's whole repo-side past — the timeless-map defect
      this dataset exists to end, and it shipped here until 2026-08-13.
      Fiserv is the undated case and stays open-bounded on its historical rows: the
      vendor LAGS that rename and no in-repo source dates it, so an open bound is the
      honest absence of a claim.
      lib/dataos/identity.VendorAliasTable is the only reader, and the producer
      round-trips every row through it before writing, so an ambiguous table fails at
      write time rather than in a consumer — which is also why a current-catalog space
      carries one row per security and not two: the reader refuses rows that overlap on
      (vendor, security_id), and "what do I call it today" has exactly one answer.
      DISPLAY TIER: nothing reads it as authority yet; lib/ticker_aliases.py remains the
      live seam until spec §11.4.
    supersedes: lib/ticker_aliases.py   # the `yahoo_fetch`/`store` rows only — see notes
    # ── R00 consumer declarations (D00.D6 consumer B, 2026-10-13) ─────────────
    basis: not_applicable              # no schema column carries a price basis
    rights:                            # separately stated; never inferred (K01.02)
      purchase_access: unverified
      internal_computation: unverified
      redistribution: not_granted
    code_consumers:                    # DataWorkspace canonical read (D00.D6 consumer B)
      - lib/dataos/web_workspace.py
      - lib/dataos/web_api.py
      - lib/dataos/web_readers.py

