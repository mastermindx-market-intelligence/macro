schema: fundamental_forensics.metric_formulas/v1
formula_pack_id: fundamental_forensics_core_gaap_formulas
formula_pack_version: 1.1.0
available_at: "2026-08-02T00:00:00Z"
content_sha256: 2d9994bf8365a95b370e46ea93b7568bb77309720c463bf56678d18bd84e203b

formulas:
  - metric_id: gross_margin
    rule: {rule_id: formula.gross_margin/v1, version: 1.0.0, available_at: "2026-08-02T00:00:00Z", confidence: C}
    expression: gross_profit / revenue
    dependencies: [gross_profit, revenue]
    output_unit: ratio
    dependency_period_alignment: same_period
    not_presented_policy:
      rule: {rule_id: formula_policy.gross_margin/v1, version: 1.0.0, available_at: "2026-10-21T00:00:00Z", confidence: C}
      mode: not_applicable
      qualified_operand: withhold
      reason: >-
        A ratio with a not-presented operand has no defined value, so it is not
        applicable rather than absent. A qualified operand keeps the ratio absent.
  - metric_id: working_capital
    rule: {rule_id: formula.working_capital/v1, version: 1.0.0, available_at: "2026-08-02T00:00:00Z", confidence: C}
    expression: current_assets - current_liabilities
    dependencies: [current_assets, current_liabilities]
    output_unit: USD
    dependency_period_alignment: same_period
  - metric_id: total_debt
    rule: {rule_id: formula.total_debt/v1, version: 1.0.0, available_at: "2026-08-02T00:00:00Z", confidence: C}
    expression: short_term_debt + long_term_debt_current + long_term_debt
    dependencies: [short_term_debt, long_term_debt_current, long_term_debt]
    output_unit: USD
    dependency_period_alignment: same_period
    not_presented_policy:
      rule: {rule_id: formula_policy.total_debt/v1, version: 1.0.0, available_at: "2026-10-21T00:00:00Z", confidence: C}
      mode: qualified_sum
      eligible_operands: [short_term_debt, long_term_debt_current, long_term_debt]
      all_not_presented: not_applicable
      qualified_operand: withhold
      reason: >-
        Total debt is a signed sum of debt operands. An operand that the filing's own
        calculation linkbase shows is not presented under its governed parent is left
        out of the sum and printed as a qualifier; it is never materialized as zero.
        When every operand is not presented, total debt is not applicable.
  - metric_id: current_ratio
    rule: {rule_id: formula.current_ratio/v1, version: 1.0.0, available_at: "2026-08-02T00:00:00Z", confidence: C}
    expression: current_assets / current_liabilities
    dependencies: [current_assets, current_liabilities]
    output_unit: ratio
    dependency_period_alignment: same_period
  - metric_id: cash_to_total_debt
    rule: {rule_id: formula.cash_to_total_debt/v1, version: 1.0.0, available_at: "2026-08-02T00:00:00Z", confidence: C}
    expression: cash_and_cash_equivalents / total_debt
    dependencies: [cash_and_cash_equivalents, total_debt]
    output_unit: ratio
    dependency_period_alignment: same_period
    not_presented_policy:
      rule: {rule_id: formula_policy.cash_to_total_debt/v1, version: 1.0.0, available_at: "2026-10-21T00:00:00Z", confidence: C}
      mode: not_applicable
      qualified_operand: inherit
      reason: >-
        The ratio reads total debt as its denominator. A qualified total debt feeds
        the ratio and its qualifier is inherited; a not-presented operand makes the
        ratio not applicable.
  - metric_id: net_debt
    rule: {rule_id: formula.net_debt/v1, version: 1.0.0, available_at: "2026-08-02T00:00:00Z", confidence: C}
    expression: total_debt - cash_and_cash_equivalents
    dependencies: [total_debt, cash_and_cash_equivalents]
    output_unit: USD
    dependency_period_alignment: same_period
    not_presented_policy:
      rule: {rule_id: formula_policy.net_debt/v1, version: 1.0.0, available_at: "2026-10-21T00:00:00Z", confidence: C}
      mode: not_applicable
      qualified_operand: inherit
      reason: >-
        Net debt reads total debt. A qualified total debt feeds net debt and its
        qualifier is inherited; a total debt that is not applicable because no debt
        operand is presented makes net debt not applicable.
  - metric_id: free_cash_flow
    rule: {rule_id: formula.free_cash_flow/v1, version: 1.0.0, available_at: "2026-08-02T00:00:00Z", confidence: C}
    expression: net_cash_from_operating_activities - capital_expenditures
    dependencies: [net_cash_from_operating_activities, capital_expenditures]
    output_unit: USD
    dependency_period_alignment: same_period
    not_presented_policy:
      rule: {rule_id: formula_policy.free_cash_flow/v1, version: 1.0.0, available_at: "2026-10-21T00:00:00Z", confidence: C}
      mode: qualified_sum
      eligible_operands: [capital_expenditures]
      all_not_presented: not_applicable
      qualified_operand: withhold
      reason: >-
        When the filing's calculation linkbase shows no capital expenditures item
        under its governed parent, free cash flow is operating cash flow with the
        omitted operand printed as a qualifier. Operating cash flow is never omitted.
  - metric_id: debt_to_equity
    rule: {rule_id: formula.debt_to_equity/v1, version: 1.0.0, available_at: "2026-08-02T00:00:00Z", confidence: C}
    expression: total_debt / stockholders_equity
    dependencies: [total_debt, stockholders_equity]
    output_unit: ratio
    dependency_period_alignment: same_period
    not_presented_policy:
      rule: {rule_id: formula_policy.debt_to_equity/v1, version: 1.0.0, available_at: "2026-10-21T00:00:00Z", confidence: C}
      mode: not_applicable
      qualified_operand: inherit
      reason: >-
        The ratio reads total debt as its numerator. A qualified total debt feeds
        the ratio and its qualifier is inherited; a not-presented operand makes the
        ratio not applicable.
  - metric_id: receivables_to_revenue
    rule: {rule_id: formula.receivables_to_revenue/v1, version: 1.0.0, available_at: "2026-08-02T00:00:00Z", confidence: C}
    expression: accounts_receivable_net / revenue
    dependencies: [accounts_receivable_net, revenue]
    output_unit: ratio
    dependency_period_alignment: ending_instant_to_duration
    not_presented_policy:
      rule: {rule_id: formula_policy.receivables_to_revenue/v1, version: 1.0.0, available_at: "2026-10-21T00:00:00Z", confidence: C}
      mode: not_applicable
      qualified_operand: withhold
      reason: >-
        A ratio with a not-presented operand has no defined value, so it is not
        applicable rather than absent. A qualified operand keeps the ratio absent.
  - metric_id: inventory_to_revenue
    rule: {rule_id: formula.inventory_to_revenue/v1, version: 1.0.0, available_at: "2026-08-02T00:00:00Z", confidence: C}
    expression: inventory_net / revenue
    dependencies: [inventory_net, revenue]
    output_unit: ratio
    dependency_period_alignment: ending_instant_to_duration
    not_presented_policy:
      rule: {rule_id: formula_policy.inventory_to_revenue/v1, version: 1.0.0, available_at: "2026-10-21T00:00:00Z", confidence: C}
      mode: not_applicable
      qualified_operand: withhold
      reason: >-
        A ratio with a not-presented operand has no defined value, so it is not
        applicable rather than absent. A qualified operand keeps the ratio absent.
