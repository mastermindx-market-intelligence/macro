# Theme source-family rights registry (GMI W3A; masterplan G0.13).
#
# One row per source family that contributes local-theme nodes, memberships, or
# corroboration evidence to the theme graph. RIGHTS ARE STATED, NEVER ASSUMED:
# `unresolved` and `internal_only` both REFUSE public emission at the gate
# (engine/theme_graph/rights.py::assert_public_emission_allowed); `unresolved`
# additionally signals "operator decision pending" in program reports.
# The guard (scripts/check_theme_graph_contracts.py) fails closed on any store
# source family that has no row here.
#
# rights_class enum: internal_only | derived_display_ok | direct_display_ok | unresolved
# auth_class enum:   house | keyless_public | receipted_scrape | entitled | licensed
#
# Pre-existing OWNER surfaces (themes heatmap, subsector rotation, cn theme pages)
# predate GMI and are inventoried in research/theme_graph/W3A_SOURCE_RIGHTS_AND_PROCUREMENT.md;
# this registry governs GMI emissions only — it does not retro-gate owner products.

version: 1
updated: "2026-09-24"

families:
  mastermind_curated:
    rights_class: direct_display_ok
    auth_class: house
    source_route: "data/baskets/membership.json + regional membership documents (our own curation)"
    review: { date: "2026-08-14", by: "gmi-w3a", outcome: "house-owned content; no external rights" }
    notes: "The 49 US curated baskets + regional families. First-class alongside vendor families (directive §24)."

  finviz_themes:
    rights_class: unresolved
    auth_class: keyless_public
    source_route: "finviz.com/map?t=themes webpack data chunk (structure, manual receipted refresh) + /api/map_perf* (nightly perf)"
    review: { date: "2026-08-14", by: "gmi-w3a", outcome: "escalation prepared, not concluded — see rights note §1; treat as internal_only until the operator resolves the derived-display question (natural forcing point: W6)" }
    notes: "Vendor advertises export/API as Elite (paid); FAQ notes resale restrictions on raw historical data. No legal conclusion drawn here. GMI derivatives stay in data/theme_graph/ (internal plane)."

  ths_concepts:
    rights_class: unresolved
    auth_class: receipted_scrape
    source_route: "同花顺 concept boards via collectors/china_ths_concepts.py (complete-or-fail receipts, weekly cadence from 2026-08-15)"
    review: { date: "2026-08-14", by: "gmi-w3a", outcome: "same posture as finviz_themes — internal-only for NEW GMI emissions; existing cn owner surfaces grandfathered; bundle the display decision with the W6 escalation" }
    notes: "Concept names are zh source labels; zh-authored copy laws apply if ever displayed."

  sec_edgar:
    rights_class: direct_display_ok
    auth_class: keyless_public
    source_route: "SEC EDGAR Archives + submissions JSON (www.sec.gov) fetched under the SEC fair-access policy (declared User-Agent, <=10 req/s) by the Earnings Intelligence intake (scripts/refresh_event_workspaces.py) and Filing Forensics source sync"
    review: { date: "2026-09-24", by: "gmi-semiconductor-b", outcome: "Display basis (qualified 2026-09-24 after Consumer R11, #7870 issuecomment-5809660585): the SEC Website Dissemination policy (sec.gov/about/privacy-information) permits copying and further distribution of website information without SEC permission and asks for attribution; that policy, not 17 U.S.C. §105, is the basis. Issuer-authored filing text and exhibits are NOT federal-government works — §105 covers works of the United States Government only — so house display covers factual inputs, receipted short excerpts and original interpretation with SEC EDGAR attribution and a link to the filing. Whole expressive documents, third-party material attached to a filing, issuer logos/branding and redistribution as a dataset are NOT claimed (auth_class keyless_public keeps licensing_redistribution_ok false). Admitted at the Finance Intelligence registry request (#7870 issuecomment-5809192409); the Semiconductor B witnesses (TSMC 6-K, onsemi 8-K) cite the same family." }
    notes: "Family for evidence whose original source is an SEC filing. Issuer-authored exhibit text is filed into the public record and stays the issuer's expression; house display is receipted excerpt + attribution, never authorship or full-body reuse. A third-party document merely attached to a filing keeps its own family (unresolved until reviewed)."

  # Reserved families — rows uncommented only when an ingestion wave actually lands
  # (the corroboration evidence class ships empty in W3A; directive §29):
