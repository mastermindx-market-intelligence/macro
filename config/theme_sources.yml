  sec_edgar:
    rights_class: direct_display_ok
    auth_class: keyless_public
    source_route: "SEC EDGAR Archives + submissions JSON (www.sec.gov) fetched under the SEC fair-access policy (declared User-Agent, <=10 req/s) by the Earnings Intelligence intake (scripts/refresh_event_workspaces.py) and Filing Forensics source sync"
    review: { date: "2026-09-24", by: "gmi-semiconductor-b", outcome: "Display basis (qualified 2026-09-24 after Consumer R11, #7870 issuecomment-5809660585): the SEC Website Dissemination policy (sec.gov/about/privacy-information) permits copying and further distribution of website information without SEC permission and asks for attribution; that policy, not 17 U.S.C. §105, is the basis. Issuer-authored filing text and exhibits are NOT federal-government works — §105 covers works of the United States Government only — so house display covers factual inputs, receipted short excerpts and original interpretation with SEC EDGAR attribution and a link to the filing. Whole expressive documents, third-party material attached to a filing, issuer logos/branding and redistribution as a dataset are NOT claimed (auth_class keyless_public keeps licensing_redistribution_ok false). Admitted at the Finance Intelligence registry request (#7870 issuecomment-5809192409); the Semiconductor B witnesses (TSMC 6-K, onsemi 8-K) cite the same family." }
    notes: "Family for evidence whose original source is an SEC filing. Issuer-authored exhibit text is filed into the public record and stays the issuer's expression; house display is receipted excerpt + attribution, never authorship or full-body reuse. A third-party document merely attached to a filing keeps its own family (unresolved until reviewed)."


