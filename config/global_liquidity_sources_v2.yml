# Global liquidity source qualification matrix — v2 (T03, lane B1, 2026-10-13).
#
# Measured-truth document: every coverage number below was measured by the seat
# (probe `git show <sha>:<path>` read into pandas) at measured_at_sha below; dates
# and row counts are copied exactly, nothing is extrapolated. It CITES the data,
# never copies data values or history. Where a fact is unknown it says `unknown`.
#
# LAW (binding on every consumer of this file):
#   C04: economic period, publication (release), first-system-known (evidence
#        available), vintage, correction and decision clocks are distinct and
#        never substituted.
#   C05: central_bank_assets, reserves, broad_money, private_credit,
#        funding_price and market_liquidity are DIFFERENT concepts; never summed,
#        averaged or substituted across concepts.
#   C06: `credit_impulse_global` stays NULL with status
#        `insufficient_comparable_pit_coverage` — no in-repo BIS GLI /
#        external-credit store (S27); China TSF is a flow aggregate in CNY with
#        conservative availability; US C&I is a bank-loan stock with
#        first-print-only vintages; their definitions, units, sectors and clocks
#        are not comparable, so no global scalar is computable.
#        `broad_money_global` is null for the same class of reason: only US M2
#        (M2SL) is level-available; China M2 is yoy-only; EZ/JP/KR/GB M2 are absent.
#   FORBIDDEN POOL: china_tsf, us_ci_loans, bis_gli_external_credit may never be
#        pooled/summed/averaged into one credit measure (see `pooling` below).
#
# Display tier: validated: false. Claim level: source_qualification_display_tier.

schema_version: 2
namespace: global_liquidity_sources_v2
# none: config/global_liquidity_transmission_v1.yml is untouched; this is a new namespace.
supersedes: none
measured_at_sha: f2a21e8d7f28
validated: false
claim_level: source_qualification_display_tier
concepts:
  - central_bank_assets
  - reserves
  - broad_money
  - private_credit
  - funding_price
  - market_liquidity
uses:
  - display
  - reconstructed_research
  - vintage_qualified_research
  - prospective_eligibility
verdict_values: [eligible, conditional, excluded]

pooling:
  forbidden_pools:
    - id: global_private_credit
      members: [china_tsf, us_ci_loans, bis_gli_external_credit]
      reason: >-
        C06/forbidden pool: China TSF is a flow aggregate in CNY with conservative
        availability, US C&I loans are a bank-loan stock in USD with first-print-only
        vintages, and BIS GLI external credit is absent (S27); their definitions,
        units, sectors and clocks are not comparable, so pooling, summing or
        averaging them into one credit measure is forbidden.

global_scalars:
  credit_impulse_global:
    value: null
    status: insufficient_comparable_pit_coverage
    reason: >-
      No in-repo BIS GLI / external-credit store (S27); China TSF is a flow aggregate
      in CNY with conservative availability; US C&I is a bank-loan stock with
      first-print-only vintages; their definitions, units, sectors and clocks are not
      comparable, so no global scalar is computable.
  broad_money_global:
    value: null
    status: insufficient_comparable_pit_coverage
    reason: >-
      Only US M2 (M2SL) is level-available; China M2 is yoy-only; EZ/JP/KR/GB M2 are
      absent, so no comparable level series exists across jurisdictions and no global
      broad-money scalar is computable.

