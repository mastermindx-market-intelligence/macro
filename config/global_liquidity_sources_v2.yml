    clocks:
      economic_period: "Wednesday balance-sheet level (weekly)"
      release: "H.4.1 publication Thursday ~16:30 ET (reference Wednesday + 1 business day)"
      first_system_known: "unknown per-row — collector fetch keeps no receipt; reconstruct as release + 1 business day"
    vintage:
      archive: none
      revision_risk: "low — rarely revised"
      correction_behaviour: "unknown — latest-only mirror; no in-repo archive to observe corrections"
    licence_class: public_us_government
    coverage: {start: "2002-12-18", end: "2026-10-07", rows: 1243, measured_at_sha: f2a21e8d7f28}
    repo_path: data/fred/WALCL.parquet
    column: fed_balance_sheet
    verdicts:
      display: {verdict: eligible, reason: "public weekly Fed balance-sheet level"}
      reconstructed_research:
        verdict: conditional
        reason: "release_lag_aligned (Wed + 1BD) with an explicitly stated non-revised assumption; no per-row first-known receipt"
      vintage_qualified_research:
        verdict: excluded
        reason: "no in-repo vintage archive — WALCL is absent from data/fred_vintage"
      prospective_eligibility:
        verdict: conditional
        reason: "forward-only once a receipt-stamped producer exists"
    exclusion_reason: null
    sources_cited: [S08, S11, S28, "https://fred.stlouisfed.org/series/WALCL"]

