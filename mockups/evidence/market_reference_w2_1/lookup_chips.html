<!DOCTYPE html>
<html lang="en" data-theme="dark" data-lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Look-up chips — A-MO-W2-1 evidence harness</title>
<!--
  Harness, not a product page. Mounts the exact Look-up row markup and the
  Look-up-row CSS from templates/dashboard.html.j2 so dark/light × EN/ZH ×
  1440/390 crops can be captured without re-baking site/macro.html (a
  render-lane artifact this packet does not own). Tokens come from the
  committed site/theme.css served beside this file at capture time.
-->
<link rel="stylesheet" href="theme.css">
<style>
:root { --mx5-radius-pill: 999px; }
body { margin: 0; min-height: 100vh; padding: 32px 24px; }
/* Exact selectors from templates/dashboard.html.j2 (Look-up row + host chip). */
body.page-macro.mx4-grid .mx5-deep-chips{display:flex;flex-wrap:wrap;gap:8px 6px;align-items:center;
  padding-top:12px;border-top:1px solid rgba(255,255,255,.05);}
[data-theme="light"] body.page-macro.mx4-grid .mx5-deep-chips{border-top-color:rgba(0,0,0,.05);}
body.page-macro.mx4-grid .mx5-deep-chips-lbl{
  font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
  color:var(--ink-3,rgba(255,255,255,.34));margin-right:2px;}
body.page-macro.mx4-grid .mx5-deep-chip{
  display:inline-flex;align-items:center;gap:6px;
  padding:5px 11px;border-radius:var(--mx5-radius-pill);
  background:transparent;border:1px solid transparent;
  font-size:11.5px;font-weight:600;color:var(--ink-3,rgba(255,255,255,.45));
  text-decoration:none;
  transition:color .15s,border-color .15s,background .15s;
}
body.page-macro.mx4-grid .mx5-deep-chip:hover{
  color:var(--ink-1,rgba(255,255,255,.92));
  border-color:rgba(255,255,255,.14);background:rgba(255,255,255,.06);
}
[data-theme="light"] body.page-macro.mx4-grid .mx5-deep-chip:hover{
  border-color:rgba(0,0,0,.1);background:rgba(0,0,0,.04);}
body.page-macro.mx4-grid .mx5-deep-chips--ref{padding-top:8px;border-top:0;}
body.page-macro.mx4-grid .mx5-ref-hash{font-weight:600;margin-right:1px;}
body.page-macro.mx4-grid .mx5-ref-hash{opacity:.55;}
[data-theme="light"] body.page-macro.mx4-grid .mx5-ref-hash{opacity:1;font-weight:700;
  color:var(--ink-3,rgba(0,0,0,.42));}
body.page-macro.mx4-grid .mx5-ref-chip:hover .mx5-ref-hash{opacity:1;}
</style>
</head>
<body class="page-macro mx4-grid">
  <div class="mx5-deep-chips mx5-deep-chips--ref">
    <span class="mx5-deep-chips-lbl"><span class="l-en">Look up</span><span class="l-zh">查询</span></span>
    <a class="mx5-deep-chip mx5-ref-chip" href="reference.html#market-state-score"><span class="mx5-ref-hash" aria-hidden="true">#</span><span class="l-en">Market State Score</span><span class="l-zh">市场状态分</span></a>
    <a class="mx5-deep-chip mx5-ref-chip" href="reference.html#regime-quadrant"><span class="mx5-ref-hash" aria-hidden="true">#</span><span class="l-en">Regime Quadrant</span><span class="l-zh">状态象限</span></a>
    <a class="mx5-deep-chip mx5-ref-chip" href="reference.html#transition-state"><span class="mx5-ref-hash" aria-hidden="true">#</span><span class="l-en">Transition State</span><span class="l-zh">转换状态</span></a>
    <a class="mx5-deep-chip mx5-ref-chip" href="reference.html#risk-radar"><span class="mx5-ref-hash" aria-hidden="true">#</span><span class="l-en">Risk Radar</span><span class="l-zh">风险雷达</span></a>
    <a class="mx5-deep-chip mx5-ref-chip" href="reference.html#evidence-matrix"><span class="mx5-ref-hash" aria-hidden="true">#</span><span class="l-en">Evidence Matrix</span><span class="l-zh">证据矩阵</span></a>
    <a class="mx5-deep-chip mx5-ref-chip" href="reference.html#sector-heat"><span class="mx5-ref-hash" aria-hidden="true">#</span><span class="l-en">Sector Heat</span><span class="l-zh">板块热力</span></a>
  </div>
</body>
</html>
