# Cross-page identical chipmat / disclosure Trace PNG bytes are permitted only
# when cropDomSha256, theme, locale, and width match AND the pair is listed here
# with a reason.
# business_activity and financial_conditions share the same suite-nav chip strip
# markup in ZH (identical rail inner HTML after current-marker stripping).
# financial_conditions and monetary_policy share the How-sure-we-are Trace
# details chrome (identical confidence-basis + Trace control).
pairs:
