<!DOCTYPE html>
<html lang="en" data-theme="dark" data-lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Also watching — dropped (fixture)</title>
<link rel="stylesheet" href="theme.css">
<style>
body{ background:var(--bg); color:var(--text); font:14px/1.6 -apple-system,"Segoe UI",Roboto,Helvetica,sans-serif; margin:0; padding:18px; }
.l-zh{ display:none; } html[data-lang="zh"] .l-en{ display:none; } html[data-lang="zh"] .l-zh{ display:inline; }
.nx-sec-hd{ display:flex; align-items:center; gap:8px; margin:0 0 12px; font-size:15px; font-weight:800; letter-spacing:-.01em; }
.nx-sec-hd::before{ content:""; width:3px; height:16px; border-radius:2px; background:var(--link); }
.nx-rel-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:14px; }
.nx-rel{ padding:13px 14px; border-radius:12px; background:var(--nx-card,#1a1d24); border:1px solid var(--nx-hair,var(--line)); }
.nx-rel-name{ font-size:13px; font-weight:700; }
.nx-meta{ margin-top:7px; font-size:11.5px; color:var(--muted); display:flex; flex-wrap:wrap; gap:7px; align-items:center; }
.nx-meta .sep{ color:var(--line); }
.nx-tk{ font-family:var(--num,ui-monospace,monospace); font-size:10.5px; font-weight:700; color:var(--muted); border:1px solid var(--line); padding:0 5px; border-radius:3px; }
#nxConsequence{ margin-top:26px; }
#nxConsequence .nx-rel{ box-shadow: var(--card-shadow), inset 0 0 0 1px color-mix(in srgb, var(--line) 55%, transparent); }
html[data-theme="light"] #nxConsequence .nx-rel{ background: var(--panel); box-shadow: var(--card-shadow), 0 8px 24px color-mix(in srgb, var(--text) 6%, transparent); }
</style>
</head>
<body>
<section class="nx-consequence" id="nxConsequence" aria-label="Also watching dropped fixture">
  <h2 class="nx-sec-hd"><span class="l-en">Also watching — dropped</span><span class="l-zh">同时关注——已剔除</span></h2>
  <div class="nx-rel-grid">
    <div class="nx-rel">
      <div class="nx-rel-top"><span class="nx-rel-name"><span class="l-en">Research note on NVDA</span><span class="l-zh">关于NVDA的研究纪要</span></span></div>
      <div class="nx-meta">
        <span class="num"><span class="l-en">1 Sep 2026</span><span class="l-zh">2026年9月1日</span></span><span class="sep">·</span>
        <span><span class="l-en">Named</span><span class="l-zh">点名</span></span>
        <a class="nx-tk" href="stock.html#NVDA">NVDA</a>
      </div>
      <div class="nx-meta">
        <span><span class="l-en">Also-watching list not available yet</span><span class="l-zh">同时关注列表暂不可用</span></span>
        <span class="sep">·</span>
        <span><span class="l-en">too many weak matches were dropped</span><span class="l-zh">弱关联过多已全部剔除</span>
          <span class="num">(12)</span></span>
      </div>
    </div>
  </div>
</section>
<script src="theme.js"></script>
</body>
</html>
