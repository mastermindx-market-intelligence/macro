radient><linearGradient id="mbSheen_2671722352bb" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox"><stop offset="0" stop-color="#ffffff" stop-opacity=".34"/><stop offset=".55" stop-color="#ffffff" stop-opacity="0"/></linearGradient><radialGradient id="mbGlow_2671722352bb" cx=".5" cy=".4" r=".65" gradientUnits="objectBoundingBox"><stop offset="0" stop-color="#ffffff" stop-opacity=".22"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient><linearGradient id="mbInk_2671722352bb" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dbe7ff"/></linearGradient></defs><rect width="1080" height="1350" fill="#0E1420"/><rect x="0" y="0" width="1080" height="112.0" fill="#0A1020" opacity="0.92"/><rect x="72.00" y="26.04" width="59.92" height="59.92" rx="15.73" fill="url(#mbTile_2671722352)"/><rect x="72.00" y="26.04" width="59.92" height="59.92" rx="15.73" fill="url(#mbGlow_2671722352)"/><rect x="72.00" y="26.04" width="59.92" height="59.92" rx="15.73" fill="url(#mbSheen_2671722352)"/><path d="M88.48,66.64 L88.48,46.41 L98.96,57.65 L109.45,43.42 L109.45,66.64" fill="none" stroke="#15205a" stroke-opacity=".30" stroke-width="4.94" stroke-linecap="round" stroke-linejoin="round"/><path d="M88.48,64.99 L88.48,44.77 L98.96,56.00 L109.45,41.77 L109.45,64.99" fill="none" stroke="url(#mbInk_2671722352)" stroke-width="4.94" stroke-linecap="round" stroke-linejoin="round"/><text x="147.9" y="68.1" fill="#ffffff" font-size="33.6" font-weight="900" font-family="sans-serif" letter-spacing="2.4">MASTERMIND</text><text x="1008.0" y="63.7" fill="#6b7a99" font-size="21.3" font-weight="400" font-family="sans-serif" text-anchor="end" letter-spacing="4.0">FOMC DESK</text><rect x="0" y="112.0" width="1080" height="7.0" fill="#F5A623"/><rect x="72.0" y="146.4" width="24.0" height="24.0" rx="4.0" fill="#F5A623"/><text x="112.0" y="167.0" fill="#F5A623" font-size="30.0" font-weight="900" font-family="sans-serif" letter-spacing="6.0">FOMC STATEMENT</text><circle cx="552.6" cy="157.4" r="4.0" fill="#6b7a99"/><text x="570.6" y="167.0" fill="#6b7a99" font-size="25.0" font-weight="700" font-family="sans-serif" letter-spacing="4.0">OCTOBER 28, 2026</text><text x="72.0" y="252.1" fill="#ffffff" font-size="52.0" font-weight="900" font-family="sans-serif">Fed held the federal funds target</text><text x="72.0" y="307.2" fill="#ffffff" font-size="52.0" font-weight="900" font-family="sans-serif">range at 3-3/4 to 4 percent</text><rect x="72.0" y="333.2" width="240.5" height="58.0" rx="29.0" fill="none" stroke="#F5A623" stroke-width="3.0"/><text x="98.0" y="371.5" fill="#F5A623" font-size="27.0" font-weight="900" font-family="sans-serif" letter-spacing="4.0">VOTE 10-2</text><text x="336.5" y="358.8" fill="#6b7a99" font-size="26.0" font-weight="600" font-family="sans-serif">Cook, Hammack wanted to raise by 1/4 point</text><text x="72.0" y="465.0" fill="#C8D4EA" font-size="28.0" font-weight="400" font-family="sans-serif">The Committee held the target range at 3-3/4 to 4 percent, ending a</text><text x="72.0" y="504.8" fill="#C8D4EA" font-size="28.0" font-weight="400" font-family="sans-serif">run that included a 1/4 point increase in September. The vote was</text><text x="72.0" y="544.5" fill="#C8D4EA" font-size="28.0" font-weight="400" font-family="sans-serif">10-2, not 12-0.</text><text x="72.0" y="602.8" fill="#C8D4EA" font-size="28.0" font-weight="400" font-family="sans-serif">Two members dissented. Lisa D. Cook and Beth M. Hammack</text><text x="72.0" y="642.5" fill="#C8D4EA" font-size="28.0" font-weight="400" font-family="sans-serif">preferred to raise the target range by 1/4 percentage point at this</text><text x="72.0" y="682.3" fill="#C8D4EA" font-size="28.0" font-weight="400" font-family="sans-serif">meeting. The dissent runs toward tighter policy, not looser.</text><text x="72.0" y="740.5" fill="#C8D4EA" font-size="28.0" font-weight="400" font-family="sans-serif">The inflation sentence was rewritten. September said the action</text><text x="72.0" y="780.3" fill="#C8D4EA" font-size="28.0" font-weight="400" font-family="sans-serif">would support a timelier return to 2 percent. It now says more</text><text x="72.0" y="820.0" fill="#C8D4EA" font-size="28.0" font-weight="400" font-family="sans-serif">information will help the Committee determine the stance appropriate</text><text x="72.0" y="859.8" fill="#C8D4EA" font-size="28.0" font-weight="400" font-family="sans-serif">to ensure a timely return of inflation to 2 percent.</text><rect x="72.0" y="928.0" width="936.0" height="2.0" fill="#232A3D"/><text x="72.0" y="966.0" fill="#F5A623" font-size="26.0" font-weight="900" font-family="sans-serif" letter-spacing="5.0">WHAT CHANGED</text><text x="1008.0" y="966.0" fill="#6b7a99" font-size="24.0" font-weight="600" font-family="sans-serif" text-anchor="end">vs September 16, 2026 · 6 sentences unchanged</text><text x="72.0" y="1043.2" fill="#6b7a99" font-size="30.0" font-weight="700" font-family="sans-serif">~</text><text x="98.0" y="1043.2" fill="#E23B3B" font-size="30.0" font-weight="700" font-family="sans-serif">raise · by 1/4 percentage point to</text><rect x="98.0" y="1034.2" width="480.2" height="2.2" fill="#E23B3B" opacity="0.85"/><text x="578.2" y="1043.2" fill="#6b7a99" font-size="30.0" font-weight="400" font-family="sans-serif">  →  </text><text x="630.6" y="1043.2" fill="#4CAF50" font-size="30.0" font-weight="700" font-family="sans-serif">maintain · at</text><text x="72.0" y="1086.4" fill="#6b7a99" font-size="30.0" font-weight="700" font-family="sans-serif">~</text><text x="98.0" y="1086.4" fill="#E23B3B" font-size="30.0" font-weight="700" font-family="sans-serif">12-0</text><rect x="98.0" y="1077.4" width="71.8" height="2.2" fill="#E23B3B" opacity="0.85"/><text x="169.8" y="1086.4" fill="#6b7a99" font-size="30.0" font-weight="400" font-family="sans-serif">  →  </text><text x="222.2" y="1086.4" fill="#4CAF50" font-size="30.0" font-weight="700" font-family="sans-serif">10-2</text><text x="72.0" y="1129.6" fill="#6b7a99" font-size="30.0" font-weight="700" font-family="sans-serif">~</text><text x="98.0" y="1129.6" fill="#E23B3B" font-size="30.0" font-weight="700" font-family="sans-serif">Today&#39;s policy action will support a timelier</text><rect x="98.0" y="1120.6" width="646.6" height="2.2" fill="#E23B3B" opacity="0.85"/><text x="98.0" y="1172.8" fill="#4CAF50" font-size="30.0" font-weight="700" font-family="sans-serif">The accumulation of more information will help the…</text><text x="72.0" y="1216.0" fill="#6b7a99" font-size="30.0" font-weight="700" font-family="sans-serif">~</text><text x="98.0" y="1216.0" fill="#E23B3B" font-size="30.0" font-weight="700" font-family="sans-serif">solid</text><rect x="98.0" y="1207.0" width="72.5" height="2.2" fill="#E23B3B" opacity="0.85"/><text x="170.5" y="1216.0" fill="#6b7a99" font-size="30.0" font-weight="400" font-family="sans-serif">  →  </text><text x="222.8" y="1216.0" fill="#4CAF50" font-size="30.0" font-weight="700" font-family="sans-serif">strong</text><rect x="0" y="1266" width="1080" height="84" fill="#0A1020" opacity="0.94"/><rect x="0" y="1266" width="1080" height="2.74" fill="url(#bb_laser_2671722352)"/><rect x="25.57" y="1291.57" width="32.87" height="32.87" rx="8.63" fill="url(#mbTile_2671722352bb)"/><rect x="25.57" y="1291.57" width="32.87" height="32.87" rx="8.63" fill="url(#mbGlow_2671722352bb)"/><rect x="25.57" y="1291.57" width="32.87" height="32.87" rx="8.63" fill="url(#mbSheen_2671722352bb)"/><path d="M34.60,1313.83 L34.60,1302.74 L40.36,1308.90 L46.11,1301.10 L46.11,1313.83" fill="none" stroke="#15205a" stroke-opacity=".30" stroke-width="2.71" stroke-linecap="round" stroke-linejoin="round"/><path d="M34.60,1312.93 L34.60,1301.84 L40.36,1308.00 L46.11,1300.19 L46.11,1312.93" fill="none" stroke="url(#mbInk_2671722352bb)" stroke-width="2.71" stroke-linecap="round" stroke-linejoin="round"/><text x="74.9" y="1317.1" fill="