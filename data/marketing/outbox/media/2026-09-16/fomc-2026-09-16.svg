<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><defs><linearGradient id="mbTile_331491214" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox"><stop offset="0" stop-color="#5b9dff"/><stop offset=".42" stop-color="#3b82f6"/><stop offset=".74" stop-color="#6366f1"/><stop offset="1" stop-color="#7c5cff"/></linearGradient><linearGradient id="mbSheen_331491214" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox"><stop offset="0" stop-color="#ffffff" stop-opacity=".34"/><stop offset=".55" stop-color="#ffffff" stop-opacity="0"/></linearGradient><radialGradient id="mbGlow_331491214" cx=".5" cy=".4" r=".65" gradientUnits="objectBoundingBox"><stop offset="0" stop-color="#ffffff" stop-opacity=".22"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient><linearGradient id="mbInk_331491214" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dbe7ff"/></linearGradient><linearGradient id="bb_laser_331491214" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5b9dff"/><stop offset="0.35" stop-color="#6366f1"/><stop offset="0.6" stop-color="#7c5cff"/><stop offset="0.92" stop-color="#7c5cff" stop-opacity="0"/></linearGradient><linearGradient id="bb_btn_331491214" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#7c5cff"/></linearGradient><linearGradient id="bb_btnsheen_331491214" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/><stop offset="0.55" stop-color="#ffffff" stop-opacity="0.02"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient><linearGradient id="mbTile_331491214bb" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox"><stop offset="0" stop-color="#5b9dff"/><stop offset=".42" stop-color="#3b82f6"/><stop offset=".74" stop-color="#6366f1"/><stop offset="1" stop-color="#7c5cff"/></linearGradient><linearGradient id="mbSheen_331491214bb" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox"><stop offset="0" stop-color="#ffffff" stop-opacity=".34"/><stop offset=".55" stop-color="#ffffff" stop-opacity="0"/></linearGradient><radialGradient id="mbGlow_331491214bb" cx=".5" cy=".4" r=".65" gradientUnits="objectBoundingBox"><stop offset="0" stop-color="#ffffff" stop-opacity=".22"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient><linearGradient id="mbInk_331491214bb" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dbe7ff"/></linearGradient></defs><rect width="1080" height="1350" fill="#0E1420"/><rect x="0" y="0" width="1080" height="112.0" fill="#0A1020" opacity="0.92"/><rect x="72.00" y="26.04" width="59.92" height="59.92" rx="15.73" fill="url(#mbTile_331491214)"/><rect x="72.00" y="26.04" width="59.92" height="59.92" rx="15.73" fill="url(#mbGlow_331491214)"/><rect x="72.00" y="26.04" width="59.92" height="59.92" rx="15.73" fill="url(#mbSheen_331491214)"/><path d="M88.48,66.64 L88.48,46.41 L98.96,57.65 L109.45,43.42 L109.45,66.64" fill="none" stroke="#15205a" stroke-opacity=".30" stroke-width="4.94" stroke-linecap="round" stroke-linejoin="round"/><path d="M88.48,64.99 L88.48,44.77 L98.96,56.00 L109.45,41.77 L109.45,64.99" fill="none" stroke="url(#mbInk_331491214)" stroke-width="4.94" stroke-linecap="round" stroke-linejoin="round"/><text x="147.9" y="68.1" fill="#ffffff" font-size="33.6" font-weight="900" font-family="sans-serif" letter-spacing="2.4">MASTERMIND</text><text x="1008.0" y="63.7" fill="#6b7a99" font-size="21.3" font-weight="400" font-family="sans-serif" text-anchor="end" letter-spacing="4.0">FOMC DESK</text><rect x="0" y="112.0" width="1080" height="7.0" fill="#F5A623"/><rect x="72.0" y="146.4" width="24.0" height="24.0" rx="4.0" fill="#F5A623"/><text x="112.0" y="167.0" fill="#F5A623" font-size="30.0" font-weight="900" font-family="sans-serif" letter-spacing="6.0">FOMC STATEMENT</text><circle cx="552.6" cy="157.4" r="4.0" fill="#6b7a99"/><text x="570.6" y="167.0" fill="#6b7a99" font-size="25.0" font-weight="700" font-family="sans-serif" letter-spacing="4.0">SEPTEMBER 16, 2026</text><text x="72.0" y="252.1" fill="#ffffff" font-size="52.0" font-weight="900" font-family="sans-serif">Fed raised the federal funds target</text><text x="72.0" y="307.2" fill="#ffffff" font-size="52.0" font-weight="900" font-family="sans-serif">range to 3-3/4 to 4 percent</text><rect x="72.0" y="333.2" width="462.1" height="58.0" rx="29.0" fill="none" stroke="#6b7a99" stroke-width="3.0"/><text x="98.0" y="371.5" fill="#6b7a99" font-size="27.0" font-weight="900" font-family="sans-serif" letter-spacing="4.0">VOTE 12-0 UNANIMOUS</text><text x="72.0" y="465.0" fill="#C8D4EA" font-size="28.0" font-weight="400" font-family="sans-serif">The Fed raised the target range to 3-3/4 to 4 percent, a 1/4</text><text x="72.0" y="504.8" fill="#C8D4EA" font-size="28.0" font-weight="400" font-family="sans-serif">percentage point increase. The vote was 12 to 0, unanimous. The prior</text><text x="72.0" y="544.5" fill="#C8D4EA" font-size="28.0" font-weight="400" font-family="sans-serif">statement held the range at 3-1/2 to 3-3/4 and carried a 9 to 3 vote.</text><text x="72.0" y="602.8" fill="#C8D4EA" font-size="28.0" font-weight="400" font-family="sans-serif">Two sentences were removed and one reworded. The prior statement</text><text x="72.0" y="642.5" fill="#C8D4EA" font-size="28.0" font-weight="400" font-family="sans-serif">said the Committee decided to maintain the range. It now says raise.</text><text x="72.0" y="682.3" fill="#C8D4EA" font-size="28.0" font-weight="400" font-family="sans-serif">The prior statement noted three voters who preferred to raise. That</text><text x="72.0" y="722.0" fill="#C8D4EA" font-size="28.0" font-weight="400" font-family="sans-serif">dissent is gone.</text><rect x="72.0" y="884.8" width="936.0" height="2.0" fill="#232A3D"/><text x="72.0" y="922.8" fill="#F5A623" font-size="26.0" font-weight="900" font-family="sans-serif" letter-spacing="5.0">WHAT CHANGED</text><text x="1008.0" y="922.8" fill="#6b7a99" font-size="24.0" font-weight="600" font-family="sans-serif" text-anchor="end">vs July 29, 2026 · 3 sentences unchanged</text><text x="72.0" y="1000.0" fill="#6b7a99" font-size="30.0" font-weight="700" font-family="sans-serif">~</text><text x="98.0" y="1000.0" fill="#E23B3B" font-size="30.0" font-weight="700" font-family="sans-serif">maintain · at 3-1/2</text><rect x="98.0" y="991.0" width="280.1" height="2.2" fill="#E23B3B" opacity="0.85"/><text x="378.1" y="1000.0" fill="#6b7a99" font-size="30.0" font-weight="400" font-family="sans-serif">  →  </text><text x="430.5" y="1000.0" fill="#4CAF50" font-size="30.0" font-weight="700" font-family="sans-serif">raise · by 1/4 percentage point · to 4</text><text x="72.0" y="1043.2" fill="#6b7a99" font-size="30.0" font-weight="700" font-family="sans-serif">~</text><text x="98.0" y="1043.2" fill="#E23B3B" font-size="30.0" font-weight="700" font-family="sans-serif">9-3</text><rect x="98.0" y="1034.2" width="62.3" height="2.2" fill="#E23B3B" opacity="0.85"/><text x="160.3" y="1043.2" fill="#6b7a99" font-size="30.0" font-weight="400" font-family="sans-serif">  →  </text><text x="212.6" y="1043.2" fill="#4CAF50" font-size="30.0" font-weight="700" font-family="sans-serif">12-0</text><text x="72.0" y="1086.4" fill="#4CAF50" font-size="30.0" font-weight="900" font-family="sans-serif">+</text><text x="98.0" y="1086.4" fill="#4CAF50" font-size="30.0" font-weight="600" font-family="sans-serif">Today&#39;s policy action will support a timelier return to the</text><text x="98.0" y="1129.6" fill="#4CAF50" font-size="30.0" font-weight="600" font-family="sans-serif">Committee&#39;s 2 percent goal.</text><text x="72.0" y="1172.8" fill="#4CAF50" font-size="30.0" font-weight="900" font-family="sans-serif">+</text><text x="98.0" y="1172.8" fill="#4CAF50" font-size="30.0" font-weight="600" font-family="sans-serif">While uncertainty remains elevated owing, in part, to</text><text x="98.0" y="1216.0" fill="#4CAF50" font-size="30.0" font-weight="600" font-family="sans-serif">geopolitical developments, domestic spending has been…</text><rect x="0" y="1266" width="1080" height="84" fill="#0A1020" opacity="0.94"/><rect x="0" y="1266" width="1080" height="2.74" fill="url(#bb_laser_331491214)"/><rect x="25.57" y="1291.57" width="32.87" height="32.87" rx="8.63" fill="url(#mbTile_331491214bb)"/><rect x="25.57" y="1291.57" width="32.87" height="32.87" rx="8.63" fill="url(#mbGlow_331491214bb)"/><rect x="25.57" y="1291.57" width="32.87" height="32.87" rx="8.63" fill="url(#mbSheen_331491214bb)"/><path d="M34.60,1313.83 L34.60,1302.74 L40.36,1308.90 L46.11,1301.10 L46.11,1313.83" fill="none" stroke="#15205a" stroke-opacity=".30" stroke-width="2.71" stroke-linecap="round" stroke-linejoin="round"/><path d="M34.60,1312.93 L34.60,1301.84 L40.36,1308.00 L46.11,1300.19 L46.11,1312.93" fill="none" stroke="url(#mbInk_331491214bb)" stroke-width="2.71" stroke-linecap="round" stroke-linejoin="round"/><text x="74.9" y="1317.1" fill="#ffffff" font-size="27.4" font-weight="800" font-family="sans-serif" letter-spacing="0.3">mastermind-x.com</text><text x="1054.4" y="1313.5" fill="#3a4466" font-size="16.4" text-anchor="end" font-family="sans-serif">© 2026 Mastermind · Federal Reserve statement</text></svg>