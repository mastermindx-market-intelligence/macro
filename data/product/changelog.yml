schema: mastermind.product_changelog.v1
note_en: "Work that only changed how the site is built is not listed here."
note_zh: "仅改变站点构建方式、你看不到的改动不会列在这里。"
entries:
  - id: brain-explain-touch
    date: 2026-09-19
    pr: 7373
    en: "Brain: you can now reach the control that explains what you are looking at by touch."
    zh: "大脑页：解释当前内容的控件现在可以用触控点到。"
  - id: nav-keyboard-press
    date: 2026-09-19
    pr: 7360
    en: "Navigation: keyboard and press targets are easier to hit."
    zh: "导航：键盘和按压目标更容易点到。"
  - id: china-gold-shanghai-basis
    date: 2026-09-19
    pr: 7342
    en: "Commodities: China gold now shows a Shanghai-close basis when that series is in use."
    zh: "大宗商品：中国黄金在使用该序列时，会显示上海收盘的基差。"
  - id: credit-window-not-evaluable
    date: 2026-09-19
    pr: 7128
    en: "The new-issue page now says when the high-yield or investment-grade window cannot be judged."
    zh: "新股发行页现在会说明高收益或投资级窗口何时无法判断。"
  - id: home-onboarding-chinese-headers
    date: 2026-09-18
    pr: 7051
    en: "Home and onboarding: category headers now have Chinese."
    zh: "首页和引导页：分类标题现在有中文。"
  - id: plans-essential-allowance
    date: 2026-09-18
    pr: 7049
    en: "Plans: Essential lists the same Deep Opus allowance in English and in Chinese."
    zh: "方案页：标准版在中英文里列出的 Deep Opus 额度一致。"
  - id: forex-hero-stance
    date: 2026-09-18
    pr: 7042
    en: "Forex: the opening stance now follows the dollar, and the horizon labels match."
    zh: "外汇页：开篇立场现在跟美元方向一致，期限标签也已对齐。"
  - id: alert-delivery-prefs
    date: 2026-09-18
    pr: 6907
    en: "Account: choose email alerts, categories, timezone and quiet hours."
    zh: "账户页：可以选择邮件预警、类别、时区和免打扰时段。"
  - id: macro-house-chinese
    date: 2026-09-17
    pr: 7037
    en: "Macro context and signals pages now use house Chinese instead of leftover English labels."
    zh: "宏观背景和信号页面现在用本站中文，而不再残留英文标签。"
  - id: prereg-hub-measurement
    date: 2026-09-17
    pr: 6898
    en: "Intelligence hub and Measurement now mark which items were registered before the result was known."
    zh: "情报中心和测量页现在会标明哪些项目是在结果出来之前登记的。"
  - id: theme-rank-momentum-color
    date: 2026-09-16
    pr: 7228
    en: "Theme rank momentum on the home page is now colored by whether the rank rose or fell."
    zh: "首页上主题排名的动量颜色现在按排名上升还是下降来区分。"
  - id: market-state-settled
    date: 2026-09-16
    pr: 7184
    en: "Market State on the home page now follows the settled score."
    zh: "首页上的市场状态现在跟已确定的分数走。"
  - id: confluence-lens-explain
    date: 2026-09-16
    pr: 7052
    en: "The confluence screener now explains, in place, what each reading is tracking."
    zh: "汇合筛选器现在会在原地说明每种读法在跟踪什么。"
  - id: research-vault-desk-type
    date: 2026-09-16
    pr: 7045
    en: "Research vault: a desk is labeled as a desk, not as a rating."
    zh: "研究库：台室类型会标成台室，而不再标成评级。"
  - id: cycle-unavailable-truth
    date: 2026-09-15
    pr: 7061
    en: "Cycle now says when a reading is not available, instead of inventing a figure."
    zh: "周期页面在没有读数时会如实说明，而不再编造数字。"
  - id: policy-watch-date-snapshot
    date: 2026-09-13
    pr: 7109
    en: "Policy Watch now stamps the date of the analysis it is showing, so you know how current it is."
    zh: "政策观察现在会标注当前展示的分析日期，让你知道这条信息有多新。"
  - id: hawk-ease-split-label
    date: 2026-09-13
    pr: 7086
    en: "When policy is split, the label now says easing is underway while the stance stays hawkish."
    zh: "当政策立场分裂时，标签会说明正在放松，同时立场仍偏鹰派。"
  - id: valuation-your-assumptions
    date: 2026-09-13
    pr: 7004
    en: "Stock pages: set your own growth, margin and multiple, and see what the company might be worth."
    zh: "个股页面：你可以自己设定增长、利润率和倍数，看看这家公司可能值多少。"
  - id: portfolio-badge-refresh
    date: 2026-09-13
    pr: 6526
    en: "The Portfolio badge now updates after the watchlist is reread."
    zh: "自选股重新读取后，投资组合上的标记会跟着更新。"
  - id: zh-card-states
    date: 2026-09-12
    pr: 7083
    en: "Chinese readers: the status lines on stock pages now read as natural Chinese instead of raw system words."
    zh: "中文用户：个股页面上的状态文字改用自然的中文表述，不再是生硬的系统词。"
  - id: suite-contradiction-labels
    date: 2026-09-12
    pr: 7032
    en: "Macro suite pages now name every kind of mixed signal in reviewed plain words."
    zh: "宏观套件页面现在会用已审定的平实措辞，标明每一种信号不一致的情况。"
  - id: policy-watch-official-updates
    date: 2026-09-12
    pr: 7017
    en: "Policy Watch shows its official updates and calendar in a recovered state after a data outage."
    zh: "政策观察在数据中断后恢复，现在可以正常展示官方更新和日历信息。"
  - id: theme-reading-order
    date: 2026-09-12
    pr: 7010
    en: "Theme Tracker: the order to read your themes, oldest evidence first."
    zh: "主题追踪现在会按各主题记录在案的证据日期，告诉你应该先看哪一个。"
  - id: issuer-cockpit
    date: 2026-09-12
    pr: 7007
    en: "Stock pages now summarise a company's current state in plain words for every covered issuer."
    zh: "个股页面现在用平实的语言说明这家公司目前的状态。"
  - id: policy-calendar
    date: 2026-09-12
    pr: 7006
    en: "Capital markets: a dated policy calendar, set against the six windows we watch for new deals."
    zh: "资本市场：新增带日期的政策日历，把政策事件对应到我们关注的六个发行窗口上。"
  - id: glossary
    date: 2026-09-12
    pr: 6909
    en: "New public glossary explains the terms we use, in plain language."
    zh: "新增公开术语表，用通俗的语言解释我们用到的各种术语。"
  - id: valuation-scenarios
    date: 2026-09-12
    pr: 6905
    en: "Stock pages: see what a company might be worth under different assumptions, from its reported figures."
    zh: "个股页面：基于公司已公布的财务数据，看看在不同假设下它可能值多少。"
  - id: china-risk-radar-recovery
    date: 2026-09-11
    pr: 7068
    en: "China Risk Radar no longer shows a recovery message when no recovery data is available."
    zh: "中国风险雷达在没有恢复数据时，不再显示恢复说明。"
  - id: alerts-en-sentences
    date: 2026-09-11
    pr: 7046
    en: "Alerts: English sentences are no longer cut off, and the risk caveat is back."
    zh: "预警页面：英文句子不再被截断，风险提示也已恢复。"
  - id: policy-overdue-calls
    date: 2026-09-11
    pr: 7016
    en: "Policy Watch no longer treats overdue items as if they had already been called."
    zh: "政策观察不再把逾期事项当成已经作过判断。"
  - id: curve-hero
    date: 2026-09-11
    pr: 7008
    en: "Rates: the Treasury curve page opens with today's curve shape against the prior close and the prior month."
    zh: "利率页面：国债收益率曲线页开篇即显示今天的曲线形态，并与上一交易日收盘和上月作对比。"
  - id: second-issuer
    date: 2026-09-11
    pr: 6920
    en: "Stock pages: a second company, Microsoft, is now covered end to end."
    zh: "个股页面：新增第二家公司微软，已完整覆盖。"
  - id: workspace-prior-publication
    date: 2026-09-10
    pr: 6984
    en: "Macro workspaces now compare today with the last published reading, not the last rebuild."
    zh: "宏观工作区现在把今天和上次发布的读数对比，而不是和上次重建对比。"
  - id: credit-windows
    date: 2026-09-10
    pr: 6904
    en: "The new-issue page now also reads whether the window is open for high-yield and investment-grade bond deals."
    zh: "新股发行页面现在也会判断高收益债和投资级债券的发行窗口是否打开。"
  - id: event-impact
    date: 2026-09-10
    pr: 6896
    en: "News events now show which assets they touch, and how."
    zh: "新闻事件现在会说明它影响到哪些资产，以及影响的方式。"
  - id: research-implication-cards
    date: 2026-09-10
    pr: 6830
    en: "Research now shows on the Measurement page what each signal is tracking."
    zh: "测量页现在会说明每个信号在跟踪什么。"
  - id: freshness-chips-language-invariant
    date: 2026-09-09
    pr: 6987
    en: "Freshness and source marks on market pages no longer flip colour between English and Chinese."
    zh: "市场页面上的新鲜度和来源标记在英文和中文之间不再出现颜色反转。"
  - id: help-answers-support
    date: 2026-09-09
    pr: 6959
    en: "The help page answers common questions, lists what changed, and routes support requests by plan."
    zh: "帮助页面现在会直接回答常见问题、列出更新记录，并按你的方案把客服请求送到对应入口。"
  - id: second-country-desk
    date: 2026-09-09
    pr: 6928
    en: "Policy Watch now follows politics in a second country, the United Kingdom, alongside the United States."
    zh: "政策观察新增第二个国家：在原有的美国之外，现在也会跟踪英国的政治动向。"
  - id: sanctions-map
    date: 2026-09-09
    pr: 6899
    en: "A new sanctions map shows which countries current United States sanctions point at, and where our coverage is still silent."
    zh: "新增制裁地图：在世界地图上标出当前美国制裁所指向的国家，也标明我们尚未覆盖的地区。"
  - id: options-glance-lede
    date: 2026-09-08
    pr: 6932
    en: "The options glance page now leads with a plain-word summary of what the market is doing."
    zh: "期权一览页面现在用简明的语言总结市场状况，引导阅读。"
  - id: commodity-coverage
    date: 2026-09-08
    pr: 6926
    en: "Commodities now show a coverage table of the markets we follow, and the capital-markets page carries a short note on where policy stands."
    zh: "大宗商品页面新增覆盖表，列出我们已覆盖和尚未覆盖的市场；资本市场页面也会附上当前政策立场的简短说明。"
  - id: policy-lifecycle
    date: 2026-09-08
    pr: 6900
    en: "Policy Watch shows where each policy stands, from proposal to in force."
    zh: "政策观察现在会说明每项政策所处的阶段，从提出一直到正式生效。"
  - id: macro-monetary-hub
    date: 2026-09-08
    pr: 6873
    en: "The Macro & Monetary suite hub now opens the fourteen macro workspaces, with Liquidity Regime first."
    zh: "宏观与货币套件主页现在可以进入全部十四个宏观工作区，流动性状态排在最前。"
  - id: suite-neutral-hollow-labels
    date: 2026-09-06
    pr: 6890
    en: "Macro suite pages now use the reviewed words for empty and mixed-signal states."
    zh: "宏观套件页面现在用已审定的措辞来描述空状态和信号不一致的状态。"
  - id: help-page
    date: 2026-09-05
    pr: 6828
    en: "Added this help page: one place for answers, links and support."
    zh: "新增本帮助页面：解答、链接和客服入口都在这里。"
  - id: nightly-macro
    date: 2026-09-04
    pr: 6849
    en: "The twelve macro workspaces now rebuild every night with the rest of the site."
    zh: "十二个宏观工作区现在与全站一起每晚重建。"
  - id: consumer-debt
    date: 2026-09-04
    pr: 6848
    en: "Added Consumer & Payments and National Debt workspaces — twelve of twelve now live."
    zh: "新增“消费与支付”和“国家债务”工作区——十二个已全部上线。"
  - id: capital-housing
    date: 2026-09-04
    pr: 6847
    en: "Added Capital Structure and Housing & Real Estate workspaces."
    zh: "新增“资本结构”和“住房与房地产”工作区。"
  - id: liquidity-banks
    date: 2026-09-04
    pr: 6846
    en: "Added the Liquidity & Central Banks workspace."
    zh: "新增“流动性与央行”工作区。"
  - id: cycle-six
    date: 2026-09-04
    pr: 6845
    en: "Added six cycle workspaces covering growth, inflation and credit."
    zh: "新增六个周期工作区，覆盖增长、通胀与信用。"
  - id: macro-suite
    date: 2026-09-04
    pr: 6836
    en: "Opened the macro suite with its first workspace, Liquidity Regime."
    zh: "宏观套件上线，首个工作区为“流动性状态”。"
