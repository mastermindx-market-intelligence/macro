[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "marketdesk-paper-extractor"
version = "0.1.0"
description = "Deterministic Playwright pipeline that extracts, downloads, parses, and archives MarketDesk research PDFs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "chriswong" }]
dependencies = [
    "playwright>=1.45",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "boto3>=1.34",
    "tenacity>=8.3",
]

[project.optional-dependencies]
# Secondary/fallback upload target.
dropbox = ["dropbox>=11.36"]
# PDF -> Markdown parsers are heavy ML stacks; install only the one you want.
marker = ["marker-pdf>=1.0"]
mineru = ["magic-pdf>=0.7"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
marketdesk = "marketdesk_extractor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
