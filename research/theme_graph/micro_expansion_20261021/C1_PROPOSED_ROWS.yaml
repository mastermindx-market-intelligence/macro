    note: Groups consumable feedstock (masks, photoresist, specialty gases, CMP consumables, large wafers). No existing materials rows exist under ai_semiconductors; complements equipment rows in semicap_equipment.
    value_chain_position: upstream
  - id: theme:memory_product_engineering
    name_en: Memory Product Engineering
    name_zh: 存储产品与工程
    asserted_on: '2026-10-21'
