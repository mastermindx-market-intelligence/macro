  - id: theme:electrification_end_uses
    name_en: End-Use Electrification
    name_zh: 终端电气化
    asserted_on: '2026-10-21'
    nominated_from: research:research/theme_graph/micro_expansion_20261021/C1_MICRO_RESEARCH.md
    note: Groups demand-side electrification (EV charging, rail traction, industrial heat, buildings/heat pumps). No existing grid_electrification row covers end-use conversion.
