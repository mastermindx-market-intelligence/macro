hierarchy:
  sub_themes:
  - id: theme:ai_semiconductor_design_chain
    name_en: AI Semiconductor Design Chain
    name_zh: AI芯片设计链
    asserted_on: '2026-10-21'
    nominated_from: research:research/theme_graph/micro_expansion_20261021/C1_MICRO_RESEARCH.md
    note: 'Groups the enabler layer that makes AI chip design itself an industry: EDA tooling, IP licensing, chiplet architecture. Distinct from design-product rows gpu_merchant_accelerators/custom_asic_silicon.'
    value_chain_position: enabler
  - id: theme:advanced_packaging_integration
    name_en: Advanced Packaging & Integration
    name_zh: 先进封装与集成
    asserted_on: '2026-10-21'
    nominated_from: research:research/theme_graph/micro_expansion_20261021/C1_MICRO_RESEARCH.md
    note: Groups back-end integration positions for AI logic (2.5D/3D assembly, substrates, CPO, OSAT, photonics). Differs from hbm_packaging, which frames the HBM memory-stack segment.
    value_chain_position: midstream
  - id: theme:ai_semiconductor_materials
    name_en: Semiconductor Process Materials
    name_zh: 半导体工艺材料
    asserted_on: '2026-10-21'
