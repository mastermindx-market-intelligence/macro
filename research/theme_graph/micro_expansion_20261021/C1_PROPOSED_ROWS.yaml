  - id: theme:transmission_equipment
    name_en: Transmission Systems & Equipment
    name_zh: 输变电系统与设备
    asserted_on: '2026-10-21'
    nominated_from: research:research/theme_graph/micro_expansion_20261021/C1_MICRO_RESEARCH.md
    note: Groups bulk-power system positions (UHV, flexible HVDC, protection, FACTS, EPC). Distinct from the equipment-class rows hv_transformers_switchgear and transmission_hvdc_cabling.
