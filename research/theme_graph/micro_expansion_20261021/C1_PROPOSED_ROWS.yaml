    note: Groups productization/enabler rows (modules, SSD controllers, interface chips, embedded, distribution, memory IP). Distinct from fabrication rows and from the conventional_dram/nand product segments.
    value_chain_position: downstream
  - id: theme:semi_back_end_equipment
    name_en: Semiconductor Back-End Equipment
    name_zh: 后道封测设备
    asserted_on: '2026-10-21'
    nominated_from: research:research/theme_graph/micro_expansion_20261021/C1_MICRO_RESEARCH.md
    note: Groups toolmaking for assembly/packaging and test (ATE). Distinct from front-end tool rows (lithography_tools, etch_deposition_equipment) and from wafer_fab_subsystems component supply.
    value_chain_position: midstream
  - id: theme:semicap_support_chain
    name_en: Semiconductor Equipment Support Chain
    name_zh: 设备支持链
    asserted_on: '2026-10-21'
    nominated_from: research:research/theme_graph/micro_expansion_20261021/C1_MICRO_RESEARCH.md
