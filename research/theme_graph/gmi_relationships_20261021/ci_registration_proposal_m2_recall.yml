#   research/theme_graph/gmi_relationships_20261021/m2_inputs/*.json (4),
#   research/theme_graph/gmi_relationships_20261021/m2_recall/recall_corpus_v1.json,
#   research/theme_graph/coverage_20261019/UNIVERSE_MANIFEST.json,
#   data/company_intelligence/relationships/*.json (2),
#   tests/conftest.py, tests/test_relationship_*.py (all seven suites).
