#   engine/__init__.py, engine/company_intelligence/__init__.py,
#   engine/company_intelligence/contracts.py, engine/company_intelligence/health.py,
#   engine/company_intelligence/views.py,
#   engine/company_intelligence/relationships/{__init__,clock,package_v2,replay,
#     edgar,harvest,resolve,judge,precision,recall}.py,
#   lib/__init__.py, lib/dataos/{__init__,identity,nulls,price,quality,registry,
#     temporal}.py,
#   scripts/__init__.py, scripts/build_relationship_observations.py,
#   scripts/relationship_m2_{harvest,judge,precision,recall}.py,
#   research/theme_graph/gmi_relationships_20261021/extraction/swks_aapl_m1.jsonl,
