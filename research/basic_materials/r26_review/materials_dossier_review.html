function journeyCountLabel(locale,visible,total){return locale==='zh'?`${visible} / ${total} 个案例模板`:`${visible} of ${total} journey templates`}
// Pure copy/hash helpers; no I/O, persistence, identity resolution or access authority.
function taskForHash(hash){
  return ['#understand','#compare','#verify'].includes(hash)?hash.slice(1):'understand';
}
function announcementForView(locale,task,reviewState,familyIndex,selectedId){
  const language=locale==='zh'?'zh':'en', w=words[language];
  if(reviewState==='denied')return w.deniedTitle+'. '+w.notLive;
  if(reviewState==='error')return w.errorTitle+'. '+w.notLive;
  if(!['study','disconnected'].includes(reviewState))return w.stateDisconnected+'. '+w.notLive;
  const view=taskForHash('#'+task);
  const parts=[w[view],w[reviewState==='study'?'stateStudy':'stateDisconnected']];
  if(view==='understand'){
    const index=Number.isInteger(familyIndex)&&familyIndex>=0&&familyIndex<10?familyIndex:-1;
    const visible=cases.filter(c=>index<0||c.family===index);
    parts.push(journeyCountLabel(language,visible.length,cases.length));
    if(!visible.length)parts.push(w.emptyFamily);
    else{
      const active=visible.find(c=>c.id===selectedId)||visible[0];
      parts.push(w.selectedLabel+': '+active.company);
    }
  }else if(view==='compare')parts.push(journeyCountLabel(language,cases.length,cases.length));
  else parts.push(w.evidenceIntro);
  return parts.join('. ');
}
let lang='en',theme='light',tab='understand',state='study',family=-1,selected='nutrien',lastTrigger=null;
const $=id=>document.getElementById(id); const t=k=>words[lang][k];
function node(tag,cls,text){const x=document.createElement(tag);if(cls)x.className=cls;if(text!==undefined)x.textContent=text;return x}
function button(text,cls,fn){const b=node('button',cls,text);b.type='button';b.addEventListener('click',fn);return b}
function notice(){const disconnected=state==='disconnected';const n=node('div','state-notice');const c=node('div');c.append(node('strong','',t(disconnected?'disconnectedTitle':'studyTitle')),node('p','',t(disconnected?'disconnectedDesc':'studyDesc')));n.append(c,node('span','status-chip',t(disconnected?'unboundTag':'studyTag')));return n}
function changeTab(value,focus=false){
  if(taskForHash('#'+value)!==value)return;
  if($('detail').open)closeDetail();
  if(value!==tab)history.pushState(null,'','#'+value);
  tab=value;render();if(focus)$('tab-'+value).focus();
}
function applyTaskHash(){
  if(location.hash==='#main')return;
  const previousTab=tab;tab=taskForHash(location.hash);
  if(tab===previousTab)return;
  if($('detail').open)closeDetail();
  render();$('tab-'+tab).focus();
}

const cov=node('section','coverage');const ch=node('div','section-top');ch.append(node('h2','',t('coverage')));cov.append(ch);const fl=node('div','family-list');const labels=[t('all'),...words[lang].familyNames];labels.forEach((l,i)=>{const b=button(l,'family',()=>{family=i-1;render();$('family-'+(i-1)).focus()});b.id='family-'+(i-1);b.setAttribute('aria-pressed',String(family===i-1));fl.append(b)});cov.append(fl,node('p','coverage-note',t('familyNote')));panel.append(cov);const next=node('section','next-note');next.append(node('h2','',t('next')),node('p','',t('nextText')));panel.append(next)}
function renderCompare(panel){

  const top=node('div','section-top');
  const title=node('h2','',t('noScore')); title.id='comparison-heading';
  top.append(title); panel.append(top,node('p','muted',t('compareIntro')));

  rows.style.marginTop='20px'; rows.setAttribute('role','region');
  rows.setAttribute('aria-labelledby','comparison-heading'); rows.tabIndex=0;
  const table=node('table','comparison-table');
  table.append(node('caption','sr-only',t('compareIntro')));
  const head=node('thead'), headRow=node('tr');
  for(const key of ['company','question','avoid']){
    const heading=node('th','',t(key)); heading.setAttribute('scope','col');
    headRow.append(heading);
  }
  head.append(headRow); table.append(head);
  const body=node('tbody');
  for(const c of cases){

  table.append(body); rows.append(table);

function renderVerify(panel){panel.append(notice());const top=node('div','section-top');top.append(node('h2','',t('evidenceTitle')));panel.append(top,node('p','muted',t('evidenceIntro')));const list=node('div','evidence-list');list.style.marginTop='20px';for(const name of ['source','calculation','rights']){const r=node('section','evidence-row');const c=node('div');c.append(node('h3','',t(name+'Title')),node('p','',t(name+'Desc')));r.append(c,node('span','status-chip',t('status')));list.append(r)}panel.append(list)}
function render(){document.documentElement.lang=lang==='zh'?'zh-CN':'en';document.documentElement.dataset.theme=theme;document.title=(lang==='zh'?'基础材料':'Basic Materials')+' — '+t('study');document.querySelectorAll('[data-i18n]').forEach(n=>{n.textContent=t(n.dataset.i18n)});document.querySelectorAll('[data-i18n-aria]').forEach(n=>{n.setAttribute('aria-label',t(n.dataset.i18nAria))});$('theme').textContent=t(theme==='light'?'dark':'light');$('theme').setAttribute('aria-label',lang==='en'?'Use '+(theme==='light'?'dark':'light')+' theme':(theme==='light'?'使用深色主题':'使用浅色主题'));$('lang').textContent=lang==='en'?'中文':'English';$('lang').setAttribute('aria-label',lang==='en'?'Switch to Chinese':'切换到英文');$('state-select').value=state;$('state-select').setAttribute('aria-label',t('reviewState'));
