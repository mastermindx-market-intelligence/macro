<svg role="img" aria-labelledby="net-title net-desc" width="300" height="92" viewBox="0 0 300 92" xmlns="http://www.w3.org/2000/svg"><title id="net-title">Controlled net high–low example: minus 20 percent</title><desc id="net-desc">Ten highs minus thirty lows, divided by the source denominator value one hundred. The denominator universe is unverified.</desc><line x1="24" y1="34" x2="276" y2="34" stroke="#3A4150" stroke-width="4" stroke-linecap="round"/><line x1="150" y1="17" x2="150" y2="55" stroke="#8B93A1" stroke-width="1"/><line x1="87" y1="34" x2="150" y2="34" stroke="#5B9BF0" stroke-width="4"/><circle cx="87" cy="34" r="6" fill="#5B9BF0"/><text x="24" y="78" fill="#8B93A1" font-size="12" font-family="Inter">−40%</text><text x="150" y="78" text-anchor="middle" fill="#8B93A1" font-size="12" font-family="Inter">0</text><text x="276" y="78" text-anchor="end" fill="#8B93A1" font-size="12" font-family="Inter">+40%</text></svg>
