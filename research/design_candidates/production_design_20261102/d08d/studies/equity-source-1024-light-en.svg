<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1360" viewBox="0 0 1024 1360"><defs><pattern id="gap" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 8 L8 0" stroke="#5f6368" stroke-width="1" opacity=".5"/></pattern></defs><rect x="0" y="0" width="1024" height="1360" rx="0" fill="#f6f6f3"/><text x="32" y="48" fill="#1a1c20" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="600" text-anchor="start">Exact source · selected IEX observation</text><text x="32" y="78" fill="#51555b" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" text-anchor="start">Illustrative identity specimen · these example identifiers are not a market receipt</text><rect x="32" y="106" width="960" height="960" rx="12" fill="#ffffff" stroke="#cbccc7"/><text x="56" y="140" fill="#5f6368" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="400" text-anchor="start">Instrument / venue / units</text><text x="56" y="166" fill="#1a1c20" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="500" text-anchor="start">NVDA · IEX · shares · priceInt scale 10000</text><text x="56" y="210" fill="#5f6368" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="400" text-anchor="start">Selected artifact ordinal</text><text x="56" y="236" fill="#1a1c20" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="500" text-anchor="start">137 of 480 retained samples · source-native fields cross-checked</text><text x="56" y="280" fill="#5f6368" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="400" text-anchor="start">Market timestamp (decimal nanoseconds)</text><text x="56" y="306" fill="#1a1c20" font-family="DejaVu Sans Mono, sans-serif" font-size="13" font-weight="500" text-anchor="start">1791812700123456789</text><text x="56" y="350" fill="#5f6368" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="400" text-anchor="start">Archive acquired / available time (decimal nanoseconds)</text><text x="56" y="376" fill="#1a1c20" font-family="DejaVu Sans Mono, sans-serif" font-size="13" font-weight="500" text-anchor="start">1791879120000000000</text><text x="56" y="420" fill="#5f6368" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="400" text-anchor="start">Native source session</text><text x="56" y="446" fill="#1a1c20" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="500" text-anchor="start">20261012.8004.00000001.0000002a</text><text x="56" y="490" fill="#5f6368" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="400" text-anchor="start">Native source sequence</text><text x="56" y="516" fill="#1a1c20" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="500" text-anchor="start">982341</text><text x="56" y="560" fill="#5f6368" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="400" text-anchor="start">Artifact SHA-256 · illustrative example only</text><text x="56" y="586" fill="#1a1c20" font-family="DejaVu Sans Mono, sans-serif" font-size="13" font-weight="500" text-anchor="start">0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef</text><text x="56" y="630" fill="#5f6368" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="400" text-anchor="start">Underlying archive source SHA-256 · different identity</text><text x="56" y="656" fill="#1a1c20" font-family="DejaVu Sans Mono, sans-serif" font-size="13" font-weight="500" text-anchor="start">fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210</text><text x="56" y="700" fill="#5f6368" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="400" text-anchor="start">Capture and book limits</text><text x="56" y="726" fill="#1a1c20" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="500" text-anchor="start">Partial capture · 32 retained levels/side · earlier snapshots omitted</text><text x="56" y="770" fill="#5f6368" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="400" text-anchor="start">Correction qualification</text><text x="56" y="796" fill="#1a1c20" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="500" text-anchor="start">Observed trade breaks applied through this sequence; complete correction history unknown</text><text x="56" y="845" fill="#51555b" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" text-anchor="start">A later archive acquisition does not establish what was known at market time. Artifact identity, native</text><text x="56" y="867" fill="#51555b" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" text-anchor="start">session/sequence and ordinal travel together; timestamp alone is not an exact reconstruction key.</text><text x="56" y="929" fill="#1a1c20" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="500" text-anchor="start">Observed-break example: 100 captured shares removed from the selected-prefix execution total.</text><text x="56" y="957" fill="#5f6368" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="400" text-anchor="start">An unmatched break remains a qualification; it does not invent a missing execution or zero book.</text><rect x="56" y="1000" width="440" height="44" rx="8" fill="#1a1c20"/><text x="276.0" y="1027.0" fill="#f6f6f3" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Back to observation evidence</text><rect x="512" y="1000" width="456" height="44" rx="8" fill="#f0f0ed" stroke="#85877f"/><text x="740.0" y="1027.0" fill="#1a1c20" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Return to NVDA chart · 5 min</text><rect x="0" y="1130" width="1024" height="230" rx="0" fill="#f0f0ed"/><line x1="0" y1="1130" x2="1024" y2="1130" stroke="#cbccc7" stroke-width="1"/><text x="20" y="1158" fill="#1a1c20" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="700" text-anchor="start">D08D · ILLUSTRATIVE DESIGN STUDY</text><text x="20" y="1178" fill="#5f6368" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="400" text-anchor="start">No market-data or production-proof claim.</text><text x="20.0" y="1208" fill="#1a1c20" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="600" text-anchor="start">01  Identity</text><text x="20.0" y="1230" fill="#51555b" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="400" text-anchor="start">Full example digests remain visible. A</text><text x="20.0" y="1248" fill="#51555b" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="400" text-anchor="start">production view must display the actual</text><text x="20.0" y="1266" fill="#51555b" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="400" text-anchor="start">admitted response identity and served time.</text><text x="345.3333333333333" y="1208" fill="#1a1c20" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="600" text-anchor="start">02  No invented certainty</text><text x="345.3333333333333" y="1230" fill="#51555b" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="400" text-anchor="start">Complete correction coverage is unknown</text><text x="345.3333333333333" y="1248" fill="#51555b" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="400" text-anchor="start">unless the existing source explicitly</text><text x="345.3333333333333" y="1266" fill="#51555b" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="400" text-anchor="start">proves it.</text><text x="670.6666666666666" y="1208" fill="#1a1c20" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="600" text-anchor="start">03  Exact reconstruction</text><text x="670.6666666666666" y="1230" fill="#51555b" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="400" text-anchor="start">Changed artifact or missing native</text><text x="670.6666666666666" y="1248" fill="#51555b" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="400" text-anchor="start">cross-check gives an honest unavailable</text><text x="670.6666666666666" y="1266" fill="#51555b" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="400" text-anchor="start">state; never silently remap to a nearby</text><text x="670.6666666666666" y="1284" fill="#51555b" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="400" text-anchor="start">sample.</text></svg>