 font-weight="400" text-anchor="start">This is a tall content capture, not an assertion</text><text x="20" y="1344" fill="#b8b8b8" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="400" text-anchor="start">that 1,060 CSS px fit an 844px viewport.</text></svg>