<text x="40" y="815" class="h">Annotations and exact continuation</text>
<text x="40" y="848" class="b">N01 / N04 · Source session and event clock remain visible. “Retained” is not “live.”</text>
<text x="40" y="879" class="b">N05 / N06 · Full expiry, strike and right survive on phone. Aggregate grain remains attached to premium.</text>
<text x="40" y="910" class="b">N08 / N20 · Inspect and Filter are separate. Updates do not replace the focused observation.</text>
<text x="40" y="941" class="b">N17 / N21 · Missing or ambiguous identity yields labeled underlying context or source evidence, not a fabricated contract.</text>
<text x="40" y="972" class="b">N22 / N24 · A later book or corrected source is separate evidence. No automatic promotion to event-time knowledge.</text>
<text x="40" y="1003" class="b">N26 / N27 · Back restores exact context. An expired row returns to the scan heading with an explicit absence notice.</text>
<rect x="40" y="1040" width="1610" height="147" rx="8" class="frame"/>
<text x="64" y="1074" class="h">Receiving investigation / return states</text>
<text x="64" y="1105" class="b">Accepted: exact contract + separately dated book → inspect source → Back to Tape.</text>
<text x="64" y="1133" class="b">Root-only: “A unique contract was not supplied” → choose an actual book row independently; preserve the origin.</text>
<text x="64" y="1161" class="b">Aged out: “Original observation is outside this window” → original filters retained, heading focused; no nearest-row substitute.</text>
<text x="40" y="1221" class="s">Supporting interaction diagram. Final typography, tokens, global shell and editable Paper qualification are not represented by this study.</text>
