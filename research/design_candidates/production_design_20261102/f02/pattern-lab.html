function transition(state, event) {

}
function render() {
  chartObserver?.disconnect();if($('#evidence-dialog').open)$('#evidence-dialog').close();evidenceRow=null;evidenceMode=null;evidenceSnapshot=null;evidenceTrigger=null;evidenceScroll=null;
  sync();$('#app').innerHTML=shell()+(cfg.consumer==='editorial'?article():analytical());observeChart();
}
function renderSaveOnly() {
  sync();const old=$('.save-area');if(!old)return;
  const restore=old.contains(document.activeElement),action=document.activeElement?.dataset.action;
  old.outerHTML=saveArea();
  if(restore) {
    const area=$('.save-area'),same=[...area.querySelectorAll('[data-action]')].find(x=>x.dataset.action===action&&!x.disabled);
    const target=same||area.querySelector('[role=status]');target.tabIndex=target===same?0:-1;target.focus({preventScroll:true});
  }
}
function announce(s){$('#announcement').textContent=s;}
function selectTab(value) {
  activeTab=value;document.querySelectorAll('[data-tab]').forEach(el=>{const selected=el.dataset.tab===activeTab;el.setAttribute('aria-selected',selected);el.tabIndex=selected?0:-1;});
  $('#panel-comparison').hidden=activeTab!=='comparison';$('#panel-values').hidden=activeTab!=='values';
}
function updateComparison() {
  const region=$('#panel-comparison .table-wrap');const {scrollLeft:left,scrollTop:top}=region;
  region.innerHTML=comparison();region.scrollLeft=left;region.scrollTop=top;markSelected();
}
function metrics(){let m=cfg.consumer==='macro'?[[t('Example universe · above 50D','示例总体 · 高于50日均线'),'66.7','%',`${sign(1.13,' pp')} ${t('vs prior session','较上一交易日')}`,t('Universe share · separate from sector subset','总体比例 · 与行业子集独立')],[t('Sectors with data','已有数据的行业'),'9','/ 10',t('1 unavailable','1个不可用'),t('Missing does not mean zero','缺失不等于零')],[t('Unchanged example','持平示例'),'0.0','pp',t('Health care · no change','医疗保健 · 无变化'),t('A reported zero, not a placeholder','已报告的零值，非占位符')]]:cfg.consumer==='company'?[[t('Revenue · FY 2026','营业收入 · 2026财年'),'48.00','USD bn',`<span class="up">+33.3%</span> ${t('vs FY 2025','较2025财年')}`,t('Statement currency: USD','报表币种：USD')],[t('Operating margin','营业利润率'),'24.5','%',`<span class="up">+1.2 pp</span> ${t('vs FY 2025','较2025财年')}`,t('No currency conversion','未进行币种转换')],[t('Diluted EPS','稀释每股收益'),'—','USD / share',t('Not available','不可用'),t('Current filing field is missing','当前报告缺少该字段')]]:[[t('Observed premium','已观测权利金'),'4.54','USD m',t('12 example prints','12笔示例成交'),t('Fixture window · not a market total','示例窗口 · 非市场总量')],[t('Estimated buy side','估计为买方成交'),String(optionRows.filter(r=>r.side==='Buy').length),'/ 12',t('Example classification','示例分类'),t('Classification is not intent','分类不等于交易意图')],[t('Unknown moneyness','未知价内外状态'),'1','/ 12',t('Shown without inference','保留未知，不推断'),t('No underlying snapshot','缺少标的快照')]];return `<div class="summary-strip">${m.map(x=>`<div class="metric"><div class="metric-label">${x[0]}</div><div class="metric-value number">${x[1]} <span class="metric-unit">${x[2]}</span></div><div class="metric-change">${x[3]}</div><div class="metric-note">${x[4]}</div></div>`).join('')}</div>`}
function specimens(){return `<details class="specimens" lang="${cfg.language==='zh'?'zh-Hans':'en'}"><summary>${t('Component specimens · semantics, controls and recovery','组件示例 · 语义、控件和恢复')}</summary><div class="specimen-grid"><section class="sample"><h3>${t('Direction, zero, unknown','方向、零与未知')}</h3><div class="sample-row">${sign(1.13,' pp')}${sign(-.8,' pp')}<span class="number">0.00 pp</span><span>— ${t('Unknown','未知')}</span></div><p>${t('The sign and unit carry meaning even without color.','即使没有颜色，正负号和单位仍表达含义。')}</p></section><section class="sample"><h3>${t('Trade side and exposure','交易方向与风险敞口')}</h3><div class="sample-row"><span class="buy">≈ ${t('Buy','买方')}</span><span class="sell">≈ ${t('Sell','卖方')}</span><span>${t('Positive exposure','正敞口')} +1.2</span><span class="chip">${t('Accepted','已接受')}</span></div><p>${t('These meanings do not change when language or market colors change.','这些含义不随语言或市场颜色设置而改变。')}</p></section><section class="sample"><h3>${t('Control emphasis','控件层级')}</h3><div class="sample-row"><button class="primary" data-evidence="${canInspectObservations()?'overview:'+cfg.consumer:'coverage:'+cfg.consumer}">${t('Inspect source','查看来源')}</button><button data-action="retry">${t('Refresh example','刷新示例')}</button><button disabled>${t('Saving…','正在保存…')}</button></div><p>${t('One primary action; disabled is accompanied by an explicit state.','一个主要操作；禁用状态需有明确说明。')}</p></section><section class="sample"><h3>${t('Persistent caveat','持续显示的限制说明')}</h3><p>${t('Partial coverage · 7 of 8 observations. A missing session stays missing. Evidence remains reachable.','覆盖不完整 · 8次观测中7次可用。缺失交易日保持缺失。仍可查看证据。')}</p><button class="text" data-evidence="coverage:${cfg.consumer}">${icon} ${t('Coverage and source','覆盖范围与来源')}</button></section></div></details>`}
function article(){const t=(a,b)=>a;return `<main id="main" tabindex="-1" lang="en"><div class="eyebrow">${t('FROM THE DESK / READING PATTERN','研究札记 / 阅读模式')}</div><header class="article-head" style="margin-top:12px"><h1>${t('Why equal gains and losses do not cancel','为什么相等的涨幅与跌幅无法抵消')}</h1><p class="deck">${t('A compact example of compound growth, with the assumptions visible and the calculation open to inspection.','用一个简明例子说明复合增长，明确假设，并提供可查看的计算过程。')}</p><div class="receipt"><span>${t('Published','发布')} <time datetime="2026-07-20">2026-07-20</time></span><span>${t('Example updated','示例更新')} <time datetime="2026-10-30">2026-10-30</time></span><span>${t('Illustrative article specimen','文章示例')}</span></div></header>${notice()}<div class="article-layout"><nav class="toc" aria-label="${t('On this page','本页目录')}"><strong>${t('ON THIS PAGE','本页目录')}</strong><a href="#arithmetic">${t('Follow the calculation','跟随计算过程')}</a><a href="#difference">${t('Compare the averages','比较平均值')}</a><a href="#limits">${t('Where the example stops','示例的适用范围')}</a><a href="#next">${t('Explore the assumptions','探索假设')}</a></nav><article class="prose"><p class="lede">${t('A gain of 50% followed by a loss of 50% leaves less than you started with. The second return acts on a different base.','先上涨50%，再下跌50%，最终资产将低于初始值。第二次收益率作用于不同的基数。')}</p><h2 id="arithmetic">${t('Follow the calculation','跟随计算过程')}</h2><p>${t('Start with USD 10,000. The first period raises the balance to USD 15,000. Losing half of that balance in the next period leaves USD 7,500. There are no deposits, withdrawals, fees or taxes in this example.','初始资产为10,000美元。第一期后升至15,000美元。第二期损失其中的一半，剩余7,500美元。本例不包含存款、提款、费用或税款。')}</p><div class="table-wrap" tabindex="0" role="region" aria-label="${t('Compound growth calculation','复合增长计算')}"><table class="table-data"><caption>${t('Illustrative calculation · currency USD','示例计算 · 币种USD')}</caption><thead><tr><th scope="col">${t('Period','期间')}</th><th scope="col" class="numeric">${t('Return','收益率')}</th><th scope="col" class="numeric">${t('Balance · USD','余额 · USD')}</th></tr></thead><tbody><tr><th scope="row">${t('Start','期初')}</th><td class="numeric">${t('Not applicable','不适用')}</td><td class="numeric">10,000</td></tr><tr><th scope="row">${t('Year 1','第1年')}</th><td class="numeric up">+50%</td><td class="numeric">15,000</td></tr><tr><th scope="row">${t('Year 2','第2年')}</th><td class="numeric down">−50%</td><td class="numeric">7,500</td></tr></tbody></table></div><button class="text" data-evidence="article">${icon} ${t('Inspect the calculation','查看计算依据')}</button><h2 id="difference">${t('Compare the averages','比较平均值')}</h2><p>${t('The arithmetic average is 0%. The total return is −25%, and the annualized compound return is about −13.4%. These numbers answer different questions; they should not share an unlabeled metric tile.','算术平均收益率为0%。总收益率为−25%，年化复合收益率约为−13.4%。这些数值回答不同的问题，不应放进未标注含义的同一种指标卡片。')}</p><p class="formula">Total return = (7,500 / 10,000) − 1 = −25%.<br>CAGR = (7,500 / 10,000)<sup>1/2</sup> − 1 ≈ −13.4% per year.</p><div class="callout"><strong>${t('State the period and the unit','明确期间与单位')}</strong><p>${t('Total return: −25% over two years. CAGR: −13.4% per year. A change between two percentage readings is expressed in percentage points.','两年总收益率：−25%。年复合增长率：每年−13.4%。两次百分比读数之差以百分点表示。')}</p></div><h2 id="limits">${t('Where the example stops','示例的适用范围')}</h2><p>${t('Reordering the same returns does not change the final balance when no cash enters or leaves. Contributions and withdrawals change that relationship. A fixed-rate calculator describes its assumptions; it does not predict future returns.','没有资金流入或流出时，调整同一组收益率的顺序不会改变最终余额。存款和提款会改变这一关系。固定收益率计算器只描述其假设，并不预测未来收益。')}</p><h2 id="next">${t('Explore the assumptions','探索假设')}</h2><p>${t('Use the existing tools to examine an annualized return or a contribution schedule. Keep the period, currency and cash-flow assumptions in view.','使用现有工具研究年化收益或定期投入计划，并持续关注期间、币种和现金流假设。')}</p><div class="related"><a href="https://www.mastermind-x.com/tools/calculators/cagr.html" target="_blank" rel="noopener">${t('CAGR calculator','年复合增长率计算器')} ↗</a><a href="https://www.mastermind-x.com/tools/calculators/compounding.html" target="_blank" rel="noopener">${t('Compounding calculator','复利计算器')} ↗</a><a href="https://www.mastermind-x.com/blog/index.html" target="_blank" rel="noopener">${t('Back to the desk','返回研究札记')} ↗</a></div></article></div>${specimens()}<p class="footer-note">${t('Illustrative editorial pattern. Original English article body and bilingual chrome remain the content contract. This is an illustrative reading-pattern composition.','文章模式示例。实际内容生产仍由现有负责人负责。本实验中的中英文用于展示组件适应能力；文章正文翻译需由编辑负责人作出内容决策。')}</p></main>`}

// Event bindings intentionally separated from pure model/evidence functions for bounded source checks.
document.querySelectorAll('.lab select').forEach(el=>el.addEventListener('change',()=>{
  if(el.id==='access'){apply({type:'ACCESS_CHANGE',access:el.value});saveGeneration++;}
  else cfg[el.id]=el.value;
  if(el.id==='consumer'){saveGeneration++;cfg.write='idle';activeTab='comparison';filterText='';sorted=false;}
  if(el.id==='write')saveGeneration++;
  render();announce(t('Reference state updated.','参考状态已更新。'));
}));
document.addEventListener('click',e=>{
  const ev=e.target.closest('[data-evidence]');if(ev){openEvidence(ev.dataset.evidence,ev);return;}
  const tab=e.target.closest('[data-tab]');if(tab){selectTab(tab.dataset.tab);return;}
  const action=e.target.closest('[data-action]')?.dataset.action;
  if(action==='close-evidence')closeEvidence();
  if(action==='chart-values'){selectTab('values');$('#tab-values').focus();$('#tab-values').scrollIntoView({block:'nearest'});}
  if(action==='sort'){sorted=!sorted;updateComparison();$('[data-action=sort]')?.focus();announce(sorted?t('Rows sorted by numeric value; unknowns last.','已按数值排序；未知值置后。'):t('Original row order restored.','已恢复原始行顺序。'));}
  if(action==='filter'||action==='clear'){filterText=action==='clear'?'':$('#symbol-filter').value.trim();$('#symbol-filter').value=filterText;updateComparison();announce(t('Example filter applied.','已应用示例筛选。'));}
  if(action==='retry'){filterText='';apply({type:'READ_RESPONSE',availability:'loaded'});render();$('#main').focus();announce(t('Example response restored. Source age, coverage and saved state are unchanged.','示例响应已恢复。来源时效、覆盖及保存状态未改变。'));}
  if(action==='save'){
    const before=cfg.write;apply({type:'SAVE_START'});if(cfg.write!=='pending'||before==='pending')return;
    const ticket=++saveGeneration,consumerAtSend=cfg.consumer;renderSaveOnly();announce(t('Saving your view.','正在保存视图。'));
    setTimeout(()=>{if(ticket===saveGeneration&&cfg.consumer===consumerAtSend&&cfg.write==='pending'){const returnFocus=$('.save-area')?.contains(document.activeElement);apply({type:'SAVE_RESULT',outcome:cfg.access==='member'?'saved':'uncertain'});renderSaveOnly();if(returnFocus)$('[data-action=save]:not(:disabled)')?.focus({preventScroll:true});announce(cfg.write==='saved'?t('Your view is saved.','视图已保存。'):t('The save result is still unknown.','保存结果仍未知。'));}},600);
  }
  if(action==='check-save'){apply({type:'SAVE_CHECK',outcome:'saved'});renderSaveOnly();$('[data-action=save]')?.focus();announce(cfg.write==='saved'?t('Your view is saved. No second save was sent.','视图已保存。未再次发送保存。'):t('The save result is still unknown.','保存结果仍未知。'));}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&evidenceRow){e.preventDefault();closeEvidence();return;}
  const tab=e.target.closest('[role=tab]');if(tab&&['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();const tabs=[...document.querySelectorAll('[role=tab]')];const n=e.key==='Home'?0:e.key==='End'?tabs.length-1:(tabs.indexOf(tab)+(e.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;tabs.forEach((x,i)=>x.tabIndex=i===n?0:-1);tabs[n].focus();}
  if(e.target.id==='symbol-filter'&&e.key==='Enter')$('[data-action=filter]').click();
});
$('#evidence-dialog').addEventListener('cancel',e=>{e.preventDefault();closeEvidence();});
window.addEventListener('resize',()=>{if(evidenceRow){const next=window.innerWidth>=1280&&$('#docked-evidence')?'docked':'overlay';if(next!==evidenceMode)showEvidenceMode();}refreshChartGeometry();});
render();
</script>
