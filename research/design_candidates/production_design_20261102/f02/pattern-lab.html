function emptyState(){const s=cfg.scenario;if(!['loading','empty','unavailable','firstuse'].includes(s))return null;const d={loading:[t('Loading observations','正在加载观测数据'),t('Values will appear when the source responds. No result count is available yet.','来源响应后将显示数值。当前尚无结果数量。'),null],empty:[t('No observations match this view','没有符合此视图的观测数据'),t('The request completed with 0 matching records. Clear the example filter to continue.','请求已完成，匹配记录为0。清除示例筛选以继续。'),t('Clear filter','清除筛选')],unavailable:[t('This source is not supported for this listing','此挂牌标识尚不支持该来源'),t('No value has been inferred. Source metadata explains the coverage boundary.','未推断任何数值。来源元数据说明了覆盖范围。'),t('View coverage','查看覆盖范围')],firstuse:[t('Choose a starting view','选择起始视图'),t('Open the example dataset to compare observations and inspect their evidence.','打开示例数据集，比较观测值并查看其证据。'),t('Open example','打开示例')]}[s];return `<section class="state-body" ${s==='loading'?'aria-busy="true"':''}><h2>${d[0]}</h2><p role="status">${d[1]}</p>${s==='loading'?'<div aria-hidden="true"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>':`<button ${s==='unavailable'?'data-evidence="coverage"':'data-action="retry"'}>${d[2]}</button>`}</section>`}
function saveArea(){let d={pending:t('Saving… This request is pending.','正在保存… 请求待处理。'),saved:t('Saved · example readback confirmed.','已保存 · 已确认示例回读。'),failed:t('Save failed. Your last saved view is unchanged. Retry when ready.','保存失败。上次保存的视图未改变。可准备好后重试。'),uncertain:t('Save outcome unknown. Check the existing request before retrying.','保存结果未知。重试前请检查现有请求。'),guest:t('Sign in to save.','登录后可保存。'),denied:t('Saving requires an eligible plan.','保存需要符合条件的订阅。'),expired:t('Sign in again before saving.','请重新登录后再保存。')}[cfg.scenario]||t('Local simulation only. No account or server write.','仅本地模拟。不会写入账户或服务器。');return `<div class="save-area"><button data-action="save" ${['pending','guest','denied','expired','uncertain'].includes(cfg.scenario)?'disabled':''}>${cfg.scenario==='failed'?t('Retry save','重试保存'):t('Save example view','保存示例视图')}</button>${cfg.scenario==='uncertain'?`<button data-action="check-save">${t('Check request status','检查请求状态')}</button>`:''}<span role="status">${d}</span></div>`}
function specimens(){return `<details class="specimens"><summary>${t('Component specimens · semantics, controls and recovery','组件示例 · 语义、控件和恢复')}</summary><div class="specimen-grid"><section class="sample"><h3>${t('Direction, zero, unknown','方向、零与未知')}</h3><div class="sample-row">${sign(1.13,' pp')}${sign(-.8,' pp')}<span class="number">0.00 pp</span><span>— ${t('Unknown','未知')}</span></div><p>${t('The sign and unit carry meaning even without color.','即使没有颜色，正负号和单位仍表达含义。')}</p></section><section class="sample"><h3>${t('Trade side and exposure','交易方向与风险敞口')}</h3><div class="sample-row"><span class="buy">≈ ${t('Buy','买方')}</span><span class="sell">≈ ${t('Sell','卖方')}</span><span>${t('Positive exposure','正敞口')} +1.2</span><span class="chip">${t('Accepted','已接受')}</span></div><p>${t('These meanings do not change when language or market colors change.','这些含义不随语言或市场颜色设置而改变。')}</p></section><section class="sample"><h3>${t('Control emphasis','控件层级')}</h3><div class="sample-row"><button class="primary" data-evidence="control">${t('Inspect source','查看来源')}</button><button data-action="retry">${t('Refresh example','刷新示例')}</button><button disabled>${t('Saving…','正在保存…')}</button></div><p>${t('One primary action; disabled is accompanied by an explicit state.','一个主要操作；禁用状态需有明确说明。')}</p></section><section class="sample"><h3>${t('Persistent caveat','持续显示的限制说明')}</h3><p>${t('Partial coverage · 7 of 8 observations. A missing session stays missing. Evidence remains reachable.','覆盖不完整 · 8次观测中7次可用。缺失交易日保持缺失。仍可查看证据。')}</p><button class="text" data-evidence="coverage">${icon} ${t('Coverage and source','覆盖范围与来源')}</button></section></div></details>`}
function analytical(){const h=heading();return `<main id="main" tabindex="-1"><div class="page-head"><div><div class="eyebrow">${h[0]}</div><h1>${h[1]}</h1><p class="deck">${h[2]}</p><div class="receipt"><span><strong>${t('Source','来源')}</strong> <time datetime="2026-10-30T20:00:00Z">${fixtureDate()}</time></span><span><strong>${t('Status','状态')}</strong> ${cfg.consumer==='options'?t('Connected · Market closed · Last session','已连接 · 市场已收盘 · 上一交易日'):t('Illustrative settled observation','示例已结算观测')}</span></div></div><button class="page-action" data-evidence="overview">${icon} ${t('Source details','来源详情')}</button></div><div class="work-grid" id="work-grid"><div class="primary-object">${notice()}${emptyState()??(metrics()+chart()+tableArea())}${saveArea()}${specimens()}</div><aside id="docked-evidence" class="inspector" aria-labelledby="dock-title" hidden></aside></div><p class="footer-note">${t('Shared-pattern candidate. Numbers, identities and save responses are illustrative. This specimen does not replace any domain workspace, real saved object, chart engine or source entitlement.','共享模式候选方案。数值、标识和保存响应均为示例。本示例不替代领域工作区、真实保存对象、图表引擎或来源权限。')}</p></main>`}
function article(){const t=(a,b)=>a;return `<main id="main" tabindex="-1"><div class="eyebrow">${t('FROM THE DESK / READING PATTERN','研究札记 / 阅读模式')}</div><header class="article-head" style="margin-top:12px"><h1>${t('Why equal gains and losses do not cancel','为什么相等的涨幅与跌幅无法抵消')}</h1><p class="deck">${t('A compact example of compound growth, with the assumptions visible and the calculation open to inspection.','用一个简明例子说明复合增长，明确假设，并提供可查看的计算过程。')}</p><div class="receipt"><span>${t('Published','发布')} <time datetime="2026-07-20">2026-07-20</time></span><span>${t('Example updated','示例更新')} <time datetime="2026-10-30">2026-10-30</time></span><span>${t('Illustrative article specimen','文章示例')}</span></div></header>${notice()}<div class="article-layout"><nav class="toc" aria-label="${t('On this page','本页目录')}"><strong>${t('ON THIS PAGE','本页目录')}</strong><a href="#arithmetic">${t('Follow the calculation','跟随计算过程')}</a><a href="#difference">${t('Compare the averages','比较平均值')}</a><a href="#limits">${t('Where the example stops','示例的适用范围')}</a><a href="#next">${t('Explore the assumptions','探索假设')}</a></nav><article class="prose"><p class="lede">${t('A gain of 50% followed by a loss of 50% leaves less than you started with. The second return acts on a different base.','先上涨50%，再下跌50%，最终资产将低于初始值。第二次收益率作用于不同的基数。')}</p><h2 id="arithmetic">${t('Follow the calculation','跟随计算过程')}</h2><p>${t('Start with USD 10,000. The first period raises the balance to USD 15,000. Losing half of that balance in the next period leaves USD 7,500. There are no deposits, withdrawals, fees or taxes in this example.','初始资产为10,000美元。第一期后升至15,000美元。第二期损失其中的一半，剩余7,500美元。本例不包含存款、提款、费用或税款。')}</p><div class="table-wrap" tabindex="0" role="region" aria-label="${t('Compound growth calculation','复合增长计算')}"><table class="table-data"><caption>${t('Illustrative calculation · currency USD','示例计算 · 币种USD')}</caption><thead><tr><th scope="col">${t('Period','期间')}</th><th scope="col" class="numeric">${t('Return','收益率')}</th><th scope="col" class="numeric">${t('Balance · USD','余额 · USD')}</th></tr></thead><tbody><tr><th scope="row">${t('Start','期初')}</th><td class="numeric">${t('Not applicable','不适用')}</td><td class="numeric">10,000</td></tr><tr><th scope="row">${t('Year 1','第1年')}</th><td class="numeric up">+50%</td><td class="numeric">15,000</td></tr><tr><th scope="row">${t('Year 2','第2年')}</th><td class="numeric down">−50%</td><td class="numeric">7,500</td></tr></tbody></table></div><button class="text" data-evidence="article">${icon} ${t('Inspect the calculation','查看计算依据')}</button><h2 id="difference">${t('Compare the averages','比较平均值')}</h2><p>${t('The arithmetic average is 0%. The total return is −25%, and the annualized compound return is about −13.4%. These numbers answer different questions; they should not share an unlabeled metric tile.','算术平均收益率为0%。总收益率为−25%，年化复合收益率约为−13.4%。这些数值回答不同的问题，不应放进未标注含义的同一种指标卡片。')}</p><div class="callout"><strong>${t('State the period and the unit','明确期间与单位')}</strong><p>${t('Total return: −25% over two years. CAGR: −13.4% per year. A change between two percentage readings is expressed in percentage points.','两年总收益率：−25%。年复合增长率：每年−13.4%。两次百分比读数之差以百分点表示。')}</p></div><h2 id="limits">${t('Where the example stops','示例的适用范围')}</h2><p>${t('Reordering the same returns does not change the final balance when no cash enters or leaves. Contributions and withdrawals change that relationship. A fixed-rate calculator describes its assumptions; it does not predict future returns.','没有资金流入或流出时，调整同一组收益率的顺序不会改变最终余额。存款和提款会改变这一关系。固定收益率计算器只描述其假设，并不预测未来收益。')}</p><h2 id="next">${t('Explore the assumptions','探索假设')}</h2><p>${t('Use the existing tools to examine an annualized return or a contribution schedule. Keep the period, currency and cash-flow assumptions in view.','使用现有工具研究年化收益或定期投入计划，并持续关注期间、币种和现金流假设。')}</p><div class="related"><a href="https://www.mastermind-x.com/tools/calculators/cagr.html" target="_blank" rel="noopener">${t('CAGR calculator','年复合增长率计算器')} ↗</a><a href="https://www.mastermind-x.com/tools/calculators/compounding.html" target="_blank" rel="noopener">${t('Compounding calculator','复利计算器')} ↗</a><a href="https://www.mastermind-x.com/blog/index.html" target="_blank" rel="noopener">${t('Back to the desk','返回研究札记')} ↗</a></div></article></div>${specimens()}<p class="footer-note">${t('Illustrative editorial pattern. Original English article body and bilingual chrome remain the content contract. This is an illustrative reading-pattern composition.','文章模式示例。实际内容生产仍由现有负责人负责。本实验中的中英文用于展示组件适应能力；文章正文翻译需由编辑负责人作出内容决策。')}</p></main>`}
function evidenceContent(key,titleId){let title=t('Observation and source','观测值与来源'),values='',period=t('Session 2026-10-30 · settled at 20:00 UTC','2026-10-30交易日 · 20:00 UTC结算'),unit=t('Field-specific; see the row labels','按字段定义，见行标签'),meaning=t('This is an illustrative fixture, not a live producer response.','此处为示例数据，并非实时生产者响应。');if(key.startsWith('macro-')){const r=macroRows[+key.split('-')[1]];title=t(r[0],r[1]);values=`${t('Above 50D','高于50日均线')}: ${r[2]===null?t('Unknown; source unavailable','未知；来源不可用'):r[2]+'%'}<br>${t('Change','变动')}: ${r[3]===null?'—':r[3]+' pp'}<br>${t('Coverage','覆盖')}: ${r[4]}`;unit=t('Percentage; difference in percentage points','百分比；差值以百分点表示')}else if(key.startsWith('company-')){const r=companyRows[+key.split('-')[1]];title=t(r[0],r[1]);period='FY 2024 / FY 2025 / FY 2026';values=`FY 2024: ${r[2]}<br>FY 2025: ${r[3]}<br>FY 2026: ${r[4]??t('Missing','缺失')}<br>${t('Change','变动')}: ${r[5]??'—'}`;unit=r[6];meaning=t('Statement currency is USD. Fiscal years are separate from calendar years. The example does not imply comparability for earlier definitions.','报表币种为USD。财年与自然年各自独立。本示例不暗示早期定义具有可比性。')}else if(key.startsWith('options-')){const r=optionRows[+key.split('-')[1]];title=`${r.symbol} · ${r.expiry} · ${r.strike} ${r.kind}`;period=`2026-10-30 ${r.time} America/New_York`;values=`${t('Time','时间')}: ${r.time} ET<br>${t('Est. side','估计方向')}: ${r.side}<br>${t('Premium','权利金')}: USD ${r.premium.toLocaleString('en-US')}<br>${t('Contracts','合约数')}: ${r.contracts}<br>DTE: ${r.dte}<br>${t('Moneyness','价内外')}: ${r.money??t('Unknown','未知')}<br>${t('Flags','标记')}: ${r.flags}`;unit=t('Premium USD; contract quantity; calendar DTE','权利金USD；合约数量；自然日DTE');meaning=t('Side is estimated from execution context. It does not identify opening/closing intent, a directional forecast or signed exposure.','成交方向按环境估计。它不代表开平仓意图、走势预测或带符号敞口。')}else if(key==='article'){title=t('Compound-growth example','复合增长示例');values='USD 10,000 × 1.50 × 0.50 = USD 7,500<br>(7,500 / 10,000) − 1 = −25%<br>(7,500 / 10,000)^(1/2) − 1 ≈ −13.4%';unit=t('USD balance; percent return; two annual periods','美元余额；百分比收益率；两个年度期间');meaning=t('No cash flows, fees or taxes. This is arithmetic, not a forecast.','不含现金流、费用或税款。此处为算术计算，并非预测。')}else if(key==='coverage'){title=t('Coverage boundary','覆盖边界');values=t('The fixture includes explicit missing observations and reported zeros. No imputation is performed.','本示例包含明确缺失的观测值和已报告零值。未进行填补。')}else if(key.startsWith('chart-')){const idx=+key.split('-')[1];const points=cfg.consumer==='macro'?[['2026-10-21','61.80%'],['2026-10-22','62.40%'],['2026-10-23',t('Missing','缺失')],['2026-10-26','63.90%'],['2026-10-27','63.30%'],['2026-10-28','64.60%'],['2026-10-29','65.57%'],['2026-10-30','66.70%']]:cfg.consumer==='company'?[['FY 2022','USD 12.00 bn'],['FY 2023','USD 16.00 bn'],['FY 2024','USD 24.00 bn'],['FY 2025','USD 36.00 bn'],['FY 2026','USD 48.00 bn']]:[['Expiry 2026-11-20','USD 2.857 m'],['Expiry 2026-12-18','USD 1.687 m']];const point=points[idx];title=t('Chart observation','图表观测');period=point[0];values=`${point[0]}: ${point[1]}`}return `<div class="inspector-head"><h2 id="${titleId}">${t('Evidence','证据')}</h2><button data-action="close-evidence" aria-label="${t('Close evidence','关闭证据')}">×</button></div><div class="inspector-content"><div class="eyebrow">${t('ILLUSTRATIVE SOURCE','示例来源')}</div><h3 style="margin-top:8px">${title}</h3>${values?`<div class="evidence-values number">${values}</div>`:''}<dl><dt>${t('Source identity','来源标识')}</dt><dd>f02.fixture.v1 / ${esc(key)}</dd><dt>${t('Observed period','观测期间')}</dt><dd>${key==='article'?t('Two annual periods; no cash flows','两个年度期间；无现金流'):period}</dd><dt>${t('Publication','发布时间')}</dt><dd>${key==='article'?'2026-07-20': '2026-10-30 · 20:02 UTC'}</dd><dt>${key==='article'?t('Article example updated','文章示例更新'):t('Retrieved','获取时间')}</dt><dd>${key==='article'?'2026-10-30':'2026-10-30 · 20:03 UTC'}</dd><dt>${t('Units and currency','单位与币种')}</dt><dd>${unit}</dd></dl><blockquote>${meaning}</blockquote><p>${key==='article'?t('Publication and update dates describe the article, not a market observation.','发布和更新日期描述文章，并非市场观测时间。'):t('Source clocks, transport status and market session status remain separate. A successful refresh is not evidence that a source is current.','来源时钟、传输状态和交易时段状态各自独立。刷新成功并不能证明来源数据是最新的。')}</p><button data-action="close-evidence">${t('Return to comparison','返回对比')}</button></div>`}
function closeEvidence(){const dlg=$('#evidence-dialog');if(dlg.open)dlg.close();const dock=$('#docked-evidence');if(dock)dock.hidden=true;$('#work-grid')?.classList.remove('has-inspector');evidenceRow=null;evidenceMode=null;if(evidenceTrigger?.isConnected)evidenceTrigger.focus();else{const fallback=$('#table-hint')||$('#main');if(fallback){fallback.tabIndex=-1;fallback.focus();announce(t('The original row changed. Returned to the comparison.','原始行已改变。已返回对比区域。'));}}}
function openEvidence(key,trigger){evidenceRow=key;evidenceTrigger=trigger||document.activeElement;const dock=$('#docked-evidence'),wide=window.innerWidth>=1280&&dock;const dlg=$('#evidence-dialog');if(wide){if(dlg.open)dlg.close();dock.innerHTML=evidenceContent(key,'dock-title');dock.hidden=false;$('#work-grid').classList.add('has-inspector');evidenceMode='docked';dock.querySelector('button').focus()}else{if(dock)dock.hidden=true;$('#work-grid')?.classList.remove('has-inspector');dlg.innerHTML=evidenceContent(key,'dialog-title');if(!dlg.open)dlg.showModal();evidenceMode='overlay';dlg.querySelector('button').focus()}}
function sync(){if(cfg.consumer==='editorial')cfg.scenario='loaded';$('#scenario').disabled=cfg.consumer==='editorial';$('#scenario').title=cfg.consumer==='editorial'?'Static article: account, save and live-data scenarios are not applicable.':'';document.documentElement.dataset.theme=cfg.theme;document.documentElement.dataset.density=cfg.density;document.documentElement.dataset.convention=cfg.convention;document.documentElement.lang=cfg.language==='zh'?'zh-Hans':'en';for(const k of Object.keys(cfg)){const id=k==='language'?'language':k;if($('#'+id))$('#'+id).value=cfg[k]}const p=new URLSearchParams({consumer:cfg.consumer,theme:cfg.theme,lang:cfg.language,density:cfg.density,state:cfg.scenario,convention:cfg.convention});if(/^https?:$/.test(location.protocol))history.replaceState(null,'',location.pathname+'?'+p.toString()+location.hash)}
function render(){if($('#evidence-dialog').open)$('#evidence-dialog').close();evidenceRow=null;evidenceMode=null;sync();$('#app').innerHTML=shell()+(cfg.consumer==='editorial'?article():analytical())}
function announce(s){$('#announcement').textContent=s}
document.querySelectorAll('.lab select').forEach(el=>{el.addEventListener('change',()=>{cfg[el.id]=el.value;if(el.id==='consumer'||el.id==='scenario'){saveGeneration++;if(el.id==='consumer')cfg.scenario='loaded';}activeTab='comparison';filterText='';sorted=false;render();announce(t('Specimen updated','示例已更新'))})});
document.addEventListener('click',e=>{const ev=e.target.closest('[data-evidence]');if(ev){openEvidence(ev.dataset.evidence,ev);return}const tab=e.target.closest('[data-tab]');if(tab){activeTab=tab.dataset.tab;document.querySelectorAll('[data-tab]').forEach(el=>{const sel=el.dataset.tab===activeTab;el.setAttribute('aria-selected',sel);el.tabIndex=sel?0:-1});$('#panel-comparison').hidden=activeTab!=='comparison';$('#panel-values').hidden=activeTab!=='values';return}const a=e.target.closest('[data-action]')?.dataset.action;if(a==='close-evidence')closeEvidence();if(a==='chart-values'){$('#tab-values').click();$('#tab-values').focus();$('#tab-values').scrollIntoView({block:'nearest'})}if(a==='sort'){sorted=!sorted;const region=$('#panel-comparison .table-wrap');region.innerHTML=comparison();region.querySelector('[data-action=sort]')?.focus();announce(t('Rows sorted by numeric value; unknowns last.','已按数值排序；未知值置后。'))}if(a==='filter'||a==='clear'){filterText=a==='clear'?'':$('#symbol-filter').value.trim();$('#symbol-filter').value=filterText;$('#panel-comparison .table-wrap').innerHTML=comparison();announce(t('Example filter applied.','已应用示例筛选。'))}if(a==='retry'){cfg.scenario='loaded';render();$('#main').focus();announce(t('Example refreshed. No saved state changed.','示例已刷新。已保存状态未改变。'))}if(a==='save'){const ticket=++saveGeneration,consumerAtSend=cfg.consumer;cfg.scenario='pending';render();announce(t('Saving example.','正在保存示例。'));setTimeout(()=>{if(ticket===saveGeneration&&cfg.consumer===consumerAtSend&&cfg.scenario==='pending'){cfg.scenario='saved';render();$('[data-action=save]')?.focus();announce(t('Saved. Example readback confirmed.','已保存。已确认示例回读。'))}},600)}if(a==='check-save'){cfg.scenario='saved';render();$('[data-action=save]')?.focus();announce(t('Existing request confirmed; no duplicate was sent.','已确认现有请求；未重复发送。'))}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&evidenceRow){e.preventDefault();closeEvidence();return}const tab=e.target.closest('[role=tab]');if(tab&&['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();const tabs=[...document.querySelectorAll('[role=tab]')];const n=e.key==='Home'?0:e.key==='End'?tabs.length-1:(tabs.indexOf(tab)+(e.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;tabs.forEach((x,i)=>x.tabIndex=i===n?0:-1);tabs[n].focus()}if(e.target.id==='symbol-filter'&&e.key==='Enter')$('[data-action=filter]').click()});
$('#evidence-dialog').addEventListener('cancel',e=>{e.preventDefault();closeEvidence()});window.addEventListener('resize',()=>{if(evidenceRow){const next=window.innerWidth>=1280&&$('#docked-evidence')?'docked':'overlay';if(next!==evidenceMode)openEvidence(evidenceRow,evidenceTrigger)}});render();
</script>
