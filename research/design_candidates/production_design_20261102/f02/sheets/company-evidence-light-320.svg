<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1420" viewBox="0 0 320 1420" role="img" aria-labelledby="title desc" lang="en"><title id="title">320px evidence overlay · static composition</title><desc id="desc">Original static vector design composition. Illustrative data. Not a browser screenshot, editable Paper reference, accessibility test, or approved reference.</desc><rect x="0" y="0" width="320" height="1420" rx="0" fill="#f6f6f3"/><rect x="0" y="0" width="320" height="30" rx="0" fill="#f0f0ed"/><text x="16" y="20" fill="#5f6368" font-size="9" font-weight="400" text-anchor="start" font-family="Noto Sans, DejaVu Sans, Arial, sans-serif">F02 / 320 / STATIC / NOT PAPER</text><rect x="0" y="30" width="320" height="56" rx="0" fill="#fff"/><text x="16" y="65" fill="#1a1c20" font-size="17" font-weight="650" text-anchor="start" font-family="Noto Sans, DejaVu Sans, Arial, sans-serif">Evidence</text><rect x="260" y="36" width="44" height="44" rx="7" fill="#fff" stroke="#85877f" stroke-width="1"/><rect x="257" y="33" width="50" height="50" rx="10" fill="none" stroke="#245c91" stroke-width="2"/><text x="282" y="64" fill="#1a1c20" font-size="22" font-weight="400" text-anchor="middle" font-family="Noto Sans, DejaVu Sans, Arial, sans-serif">×</text><line x1="0" y1="86" x2="320" y2="86" stroke="#cbccc7" stroke-width="1"/><text x="20" y="121" fill="#66543b" font-size="10" font-weight="650" text-anchor="start" font-family="Noto Sans, DejaVu Sans, Arial, sans-serif">ILLUSTRATIVE SOURCE</text><text x="20" y="156" fill="#1a1c20" font-size="23" font-weight="650" text-anchor="start" font-family="Noto Sans, DejaVu Sans, Arial, sans-serif">Operating margin</text><text x="20" y="188" fill="#51555b" font-size="12" font-weight="400" text-anchor="start" font-family="Noto Sans, DejaVu Sans, Arial, sans-serif">EXM · Example Industries</text><text x="20" y="220" fill="#51555b" font-size="13" font-weight="400" text-anchor="start" font-family="Noto Sans, DejaVu Sans, Arial, sans-serif">FY 2024</text><text x="300" y="220" fill="#1a1c20" font-size="17" font-weight="400" text-anchor="end" font-family="Noto Sans, DejaVu Sans, Arial, sans-serif">20.0%</text><text x="20" y="262" fill="#51555b" font-size="13" font-weight="400" text-anchor="start" font-family="Noto Sans, DejaVu Sans, Arial, sans-serif">FY 2025</text><text x="300" y="262" fill="#1a1c20" font-size="17" font-weight="400" text-anchor="end" font-family="Noto Sans, DejaVu Sans, Arial, sans-serif">23.3%</text><text x="20" y="304" fill="#51555b" font-size="13" font-weight="400" text-anchor="start" font-family="Noto Sans, DejaVu Sans, Arial, sans-serif">FY 2026</text><text x="300" y="304" fill="#1a1c20" font-size="17" font-weight="400" text-anchor="end" font-family="Noto Sans, DejaVu Sans, Arial, sans-serif">24.5%</text><text x="20" y="346" fill="#51555b" font-size="13" font-weight="400" text-anchor="start" font-family="Noto Sans, DejaVu Sans, Arial, sans-serif">FY26 − FY25</text><text x="300" y="346" fill="#256341" font-size="17" font-weight="400" text-anchor="end" font-family="Noto Sans, DejaVu Sans, Arial, sans-serif">+1.2 pp</text><line x1="20" y1="377" x2="300" y2="377" stroke="#cbccc7" stroke-width="1"/><text x="20" y="411" fill="#5f6368" font-size="11" font-weight="400" text-anchor="start" font-family="Noto Sans, DejaVu Sans, Arial, sans-serif">Source identity</text><text x="20" y="436" fill="#1a1c20" font-size="13" font-weight="400" text-anchor="start" font-family="Noto Sans, DejaVu Sans, Arial, sans-serif">f02.fixture.v1 / company-3</text><text x="20" y="483" fill="#5f6368" font-size="11" font-weight="400" text-anchor="start" font-family="Noto Sans, DejaVu Sans, Arial, sans-serif">Observed basis</text><text x="20" y="508" fill="#1a1c20" font-size="13" font-weight="400" text-anchor="start" font-family="Noto Sans, DejaVu Sans, Arial, sans-serif">Fiscal years 2024, 2025, 2026</text><text x="20" y="555" fill="#5f6368" font-size="11" font-weight="400" text-anchor="start" font-family="Noto Sans, DejaVu Sans, Arial, sans-serif">Publication clock</text><text x="20" y="580" fill="#1a1c20" font-size="13" font-weight="400" text-anchor="start" font-family="Noto Sans, DejaVu Sans, Arial, sans-serif">Illustrative filing record</text><text x="20" y="627" fill="#5f6368" font-size="11" font-weight="400" text-anchor="start" font-family="Noto Sans, DejaVu Sans, Arial, sans-serif">Retrieved</text><text x="20" y="652" fill="#1a1c20" font-size="13" font-weight="400" text-anchor="start" font-family="Noto Sans, DejaVu Sans, Arial, sans-serif">2026-10-30 · 20:03 UTC</text><text x="20" y="699" fill="#5f6368" font-size="11" font-weight="400" text-anchor="start" font-family="Noto Sans, DejaVu Sans, Arial, sans-serif">Unit</text><text x="20" y="724" fill="#1a1c20" font-size="13" font-weight="400" text-anchor="start" font-family="Noto Sans, DejaVu Sans, Arial, sans-serif">Percent; delta in percentage points</text><text x="20" y="771" fill="#5f6368" font-size="11" font-weight="400" text-anchor="start" font-family="Noto Sans, DejaVu Sans, Arial, sans-serif">Currency</text><text x="20" y="796" fill="#1a1c20" font-size="13" font-weight="400" text-anchor="start" font-family="Noto Sans, DejaVu Sans, Arial, sans-serif">Not applicable to this ratio</text><rect x="20" y="886" width="280" height="130" rx="8" fill="#f0f0ed"/><text x="36" y="912" fill="#51555b" font-size="13" font-weight="400" text-anchor="start" font-family="Noto Sans, DejaVu Sans, Arial, sans-serif">Fiscal years are not calendar years.</text><text x="36" y="934" fill="#51555b" font-size="13" font-weight="400" text-anchor="start" font-family="Noto Sans, DejaVu Sans, Arial, sans-serif">Earlier definitions remain</text><text x="36" y="956" fill="#51555b" font-size="13" font-weight="400" text-anchor="start" font-family="Noto Sans, DejaVu Sans, Arial, sans-serif">non-comparable where the source says</text><text x="36" y="978" fill="#51555b" font-size="13" font-weight="400" text-anchor="start" font-family="Noto Sans, DejaVu Sans, Arial, sans-serif">so.</text><text x="20" y="1053" fill="#51555b" font-size="13" font-weight="400" text-anchor="start" font-family="Noto Sans, DejaVu Sans, Arial, sans-serif">Publication, retrieval and observation are</text><text x="20" y="1075" fill="#51555b" font-size="13" font-weight="400" text-anchor="start" font-family="Noto Sans, DejaVu Sans, Arial, sans-serif">separate clocks. A fresh fetch does not make</text><text x="20" y="1097" fill="#51555b" font-size="13" font-weight="400" text-anchor="start" font-family="Noto Sans, DejaVu Sans, Arial, sans-serif">an old filing current.</text><rect x="20" y="1171" width="280" height="44" rx="7" fill="#fff" stroke="#85877f" stroke-width="1"/><text x="160" y="1199" fill="#1a1c20" font-size="13" font-weight="400" text-anchor="middle" font-family="Noto Sans, DejaVu Sans, Arial, sans-serif">Return to comparison</text><line x1="20" y1="1250" x2="300" y2="1250" stroke="#cbccc7" stroke-width="1"/><text x="20" y="1280" fill="#5f6368" font-size="11" font-weight="400" text-anchor="start" font-family="Noto Sans, DejaVu Sans, Arial, sans-serif">Static overlay composition. Close and Escape return</text><text x="20" y="1300" fill="#5f6368" font-size="11" font-weight="400" text-anchor="start" font-family="Noto Sans, DejaVu Sans, Arial, sans-serif">focus to the source trigger. Underlying scroll and the</text><text x="20" y="1320" fill="#5f6368" font-size="11" font-weight="400" text-anchor="start" font-family="Noto Sans, DejaVu Sans, Arial, sans-serif">complete row are retained by contract.</text></svg>