ext><text x="20" y="493" fill="#1a1c20" font-size="13" font-weight="400" text-anchor="start" font-family="Noto Sans, DejaVu Sans, Arial, sans-serif">EXM / operating-margin</text><text x="20" y="540" fill="#5f6368" font-size="11" font-weight="400" text-anchor="start" font-family="Noto Sans, DejaVu Sans, Arial, sans-serif">Observed basis</text><text x="20" y="565" fill="#1a1c20" font-size="13" font-weight="400" text-anchor="start" font-family="Noto Sans, DejaVu Sans, Arial, sans-serif">Fiscal years 2022–2026</text><text x="20" y="612" fill="#5f6368" font-size="11" font-weight="400" text-anchor="start" font-family="Noto Sans, DejaVu Sans, Arial, sans-serif">Publication</text><text x="20" y="637" fill="#1a1c20" font-size="13" font-weight="400" text-anchor="start" font-family="Noto Sans, DejaVu Sans, Arial, sans-serif">2026-10-30 · 20:02 UTC</text><text x="20" y="684" fill="#5f6368" font-size="11" font-weight="400" text-anchor="start" font-family="Noto Sans, DejaVu Sans, Arial, sans-serif">Retrieved</text><text x="20" y="709" fill="#1a1c20" font-size="13" font-weight="400" text-anchor="start" font-family="Noto Sans, DejaVu Sans, Arial, sans-serif">2026-10-30 · 20:03 UTC</text><text x="20" y="756" fill="#5f6368" font-size="11" font-weight="400" text-anchor="start" font-family="Noto Sans, DejaVu Sans, Arial, sans-serif">Unit</text><text x="20" y="781" fill="#1a1c20" font-size="13" font-weight="400" text-anchor="start" font-family="Noto Sans, DejaVu Sans, Arial, sans-serif">Percent; change in percentage points</text><text x="20" y="828" fill="#5f6368" font-size="11" font-weight="400" text-anchor="start" font-family="Noto Sans, DejaVu Sans, Arial, sans-serif">Currency</text><text x="20" y="853" fill="#1a1c20" font-size="13" font-weight="400" text-anchor="start" font-family="Noto Sans, DejaVu Sans, Arial, sans-serif">Not applicable to this ratio</text><rect x="20" y="929" width="280" height="120" rx="8" fill="#f0f0ed"/><text x="36" y="956" fill="#51555b" font-size="13" font-weight="400" text-anchor="start" font-family="Noto Sans, DejaVu Sans, Arial, sans-serif">Fiscal years are not calendar</text><text x="36" y="978" fill="#51555b" font-size="13" font-weight="400" text-anchor="start" font-family="Noto Sans, DejaVu Sans, Arial, sans-serif">observations. This row retains all five</text><text x="36" y="1000" fill="#51555b" font-size="13" font-weight="400" text-anchor="start" font-family="Noto Sans, DejaVu Sans, Arial, sans-serif">displayed periods and its explicit</text><text x="36" y="1022" fill="#51555b" font-size="13" font-weight="400" text-anchor="start" font-family="Noto Sans, DejaVu Sans, Arial, sans-serif">percentage-point change.</text><text x="20" y="1082" fill="#51555b" font-size="13" font-weight="400" text-anchor="start" font-family="Noto Sans, DejaVu Sans, Arial, sans-serif">The source may publish or be retrieved later</text><text x="20" y="1104" fill="#51555b" font-size="13" font-weight="400" text-anchor="start" font-family="Noto Sans, DejaVu Sans, Arial, sans-serif">than its observation period. Those clocks</text><text x="20" y="1126" fill="#51555b" font-size="13" font-weight="400" text-anchor="start" font-family="Noto Sans, DejaVu Sans, Arial, sans-serif">remain separate.</text><rect x="20" y="1190" width="280" height="44" rx="7" fill="#fff" stroke="#85877f" stroke-width="1"/><text x="160" y="1218" fill="#1a1c20" font-size="13" font-weight="400" text-anchor="middle" font-family="Noto Sans, DejaVu Sans, Arial, sans-serif">Return to comparison</text><line x1="20" y1="1270" x2="300" y2="1270" stroke="#cbccc7" stroke-width="1"/><text x="20" y="1299" fill="#5f6368" font-size="11" font-weight="400" text-anchor="start" font-family="Noto Sans, DejaVu Sans, Arial, sans-serif">Static overlay. Close and Escape return to the retained</text><text x="20" y="1319" fill="#5f6368" font-size="11" font-weight="400" text-anchor="start" font-family="Noto Sans, DejaVu Sans, Arial, sans-serif">row identity, including after sort or filter rerender.