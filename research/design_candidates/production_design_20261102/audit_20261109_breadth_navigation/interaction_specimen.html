dialog.scrollTop=0;var focus=$(focusId||"dialog-title");if(focus)focus.focus({preventScroll:true});
}
function open(target,trigger){returnFocus=trigger;overviewScroll=window.scrollY;stack=[];view=target;dialog.showModal();render()}
function go(next,from){stack.push({view:view,focus:from,scroll:dialog.scrollTop});view=next;render()}
function back(){if(!stack.length){dialog.close();return}var previous=stack.pop();view=previous.view;render(previous.focus);dialog.scrollTop=previous.scroll}
$("inspect").addEventListener("click",function(){open("chooser",this)});
$("help").addEventListener("click",function(){open("help",this)});
$("back").addEventListener("click",back);$("close").addEventListener("click",function(){dialog.close()});
