  function conditionFixture(key) {
    const match=()=>L.makeObservation({yield:state.rule.confirm-.01,peers:Array(12).fill(state.rule.peerMean+1)});
    let o=key==='current'?L.makeObservation():match(), original=null, review=null;
    if(key==='issuer')o=L.makeObservation({yield:5.07,peers:Array(12).fill(0)});
    if(key==='stale')o.funding.quality='stale';
    if(key==='missing')o.peers[4].value=null;
    if(key==='invalidator'){o.peers[4].value=null;o.yield.value=state.rule.invalidate+.01;}
    if(key==='fifth')o.sessionNo=5;
    if(key==='expiry'){o=L.makeObservation();o.sessionNo=5;o.peers[4].value=null;}
    if(key==='late')o.peers[4].releasedAt='2026-10-20T10:00:00Z';
    if(key==='reversal'){
      original=L.evaluateFixture(o,null,state.rule);
      const next=L.makeObservation({sessionNo:2,yield:state.rule.invalidate+.01,cutoff:'2026-10-20T21:00:00Z'});
      review=L.laterReview(original,next);o=next;
    }
    if(key==='correction'){
      o=L.makeObservation({yield:state.rule.confirm-.001,peers:Array(12).fill(state.rule.peerMean+.1)});
      original=L.evaluateFixture(o,null,state.rule);
      const corrected=L.clone(o);corrected.peers.forEach(p=>p.value=state.rule.peerMean-.1);
      review=L.correctionReview(original,corrected);
    }
    return {observation:o,event:original||L.evaluateFixture(o,null,state.rule),review};
  }

    if(action==='apply-flows'){applied(initialItems()[1]);return;}
    if(action==='apply-cash'){const p=L.cashProjection({draw:$('#cash-draw')?.value||state.cash.draw,delayReceipt:$('#cash-receipt')?.value==='delayed'});applied({key:'cash-scenario',kind:'cash',borrower:p.borrower,title:'Parent A cash timing',source:'I05 · Synthetic cash schedule',period:'16 Oct 2026 to 15 Jan 2027',payload:p});return;}
    if(action==='apply-hedge'){const cost=number('hedge-cost');if(!L.finite(cost))return;applied({key:'hedge-assumption',kind:'assumption',title:'JPY buyer hedge assumption',source:'I06 · Rolling 3M hedge',period:'Current annualized assumption',summary:cost+'% annualized cost · future roll costs open',payload:{cost}},'hedge');return;}
    if(action==='apply-explanation'){const k=data.mechanism||state.inspectMechanism||state.mechanism,m=mechanisms[k];applied({key:'explanation',kind:'hypothesis',title:m.title,source:'I03 · Mechanism evidence',origin:m.origin,period:state.context.cutoff,relationship:m.reading,payload:{mechanism:k,nextCheck:m.check}});return;}
    if(action==='apply-check'){applied({key:'next-check',kind:'check',title:data.title,source:'I10 · Research check',period:data.period,summary:data.check,payload:{check:data.check,schedule:data.period}});return;}
    if(action==='inspect-item'){const item=state.items.find(x=>x.key===data.key);if(item)show(item.key==='price-conditions'?'rule':item.key==='buyer-flow'?'flows':item.key==='curve-shape'?'shape':item.key==='hedge-assumption'?'hedge':item.key==='explanation'?'evidence':'calendar',item.payload||{});return;}
    if(action==='remove-item'){removeItem(data.key);return;}
    if(action==='undo'){undo();return;}
    if(action==='preview-path'){show('paths',{path:data.path});return;}
    if(action==='use-path'||action==='stress-path'){state.path=action==='stress-path'?'stress':data.path||state.previewPath||state.path;syncAppliedInputs();closeDialog(true);goto('scenario');toast('Outlook and next check updated. Existing evidence is retained.');return;}
    if(action==='inspect-mechanism'){show('evidence',{mechanism:data.mechanism});return;}
    if(action==='select-mechanism'){state.mechanism=data.mechanism;render();return;}
    if(action==='apply-context'){const horizon=$('#context-horizon').value;remember({context:L.clone(state.context)});state.context.horizon=horizon;state.items=state.items.map(x=>({...x,needsReview:!!x.horizon&&x.horizon!==horizon}));clearToolDraft('context');syncAppliedInputs();closeDialog(true);goto('scenario');toast('Context updated; incompatible additions require review.');return;}
    if(action==='demo-save'){performDemoSave();return;}
    if(action==='recover-receipt'){const op=state.pendingOperation;if(op){state.saveMode='success';commitDemoQuestion(op);show('save',{receipt:true});}return;}
    if(action==='open-demo-question'){goto('saved');return;}
    if(action==='retry-exact-read'){if(state.demoRecord){state.demoRecord.readStatus='available';show('save',{receipt:true});}else toast('The exact complete-case revision is unavailable in this reference. No fallback was used.');return;}
    if(action==='apply-review'){state.saveMode=$('#review-save-mode').value;if($('#review-prepared').value==='additions'){remember();state.context.horizon='1–5 sessions';state.items=initialItems();syncAppliedInputs();render();}closeDialog(true);toast('Review fixture settings applied.');return;}
    if(action==='reset-filters'){delete state.modalDrafts.filters;show('filters');return;}
    if(action==='apply-filters'){state.episodeFilters={mechanism:$('#filter-mechanism').value,coverage:$('#filter-coverage').value,contrary:$('#filter-contrary').checked};closeDialog(true);goto('replay');return;}
    if(action==='record-replay'){const hypothesis=$('#replay-hypothesis').value.trim(),counter=$('#replay-counter').value.trim();if(!hypothesis||!counter){toast('Record the hypothesis and what could change it.');return;}state.replayRecord=L.freezeReplay({hypothesis,counter,path:state.path,rule:L.clone(state.rule)},'Synthetic decision cutoff D');state.replayStep=1;render();toast('Decision frozen. One later synthetic observation is now visible.');return;}
    if(action==='advance-replay'){if(!L.revealReplay(state.replayRecord).allowed){toast('Record the decision first.');return;}state.replayStep=Math.min(5,state.replayStep+1);render();return;}
    if(action==='reveal-outcome'){if(!L.revealReplay(state.replayRecord).allowed){show('outcome');return;}state.replayRevealed=true;state.replayStep=5;if(state.route==='replay')render();show('outcome');return;}
    if(action==='forex-scope'){show('unsupported',{title:'Forex is a separate workspace',detail:'The Forex design is being developed in its own session. This reference keeps the cross-asset case intact when moving between the in-scope Bonds and Transmission views.'});return;}
    show('unsupported',{title:data.label||'Connected capability required'});
  }
  $('#dialog-close').addEventListener('click',()=>closeDialog());
  $('#tool-dialog').addEventListener('cancel',e=>{e.preventDefault();closeDialog();});
  $('#tool-dialog').addEventListener('keydown',e=>{
    if(e.key!=='Tab')return;
    const dialog=$('#tool-dialog'),focusable=[...dialog.querySelectorAll('button:not(:disabled),[href],input:not(:disabled),select:not(:disabled),textarea:not(:disabled),summary,[tabindex]:not([tabindex="-1"])')].filter(x=>x.getClientRects().length&&getComputedStyle(x).visibility!=='hidden');
    const first=focusable[0],last=focusable.at(-1),current=document.activeElement;
    if((!e.shiftKey&&current===last)||(e.shiftKey&&current===first)||!dialog.contains(current)){e.preventDefault();(e.shiftKey?last:first)?.focus();}
  });
  $('#draft-button').addEventListener('click',()=>show('draft'));
  $('#review-states').addEventListener('click',()=>show('review'));
  $('#theme').addEventListener('click',()=>{const dark=document.documentElement.dataset.theme!=='dark';document.documentElement.dataset.theme=dark?'dark':'light';$('#theme').textContent=dark?'Light':'Dark';});
  const navClose=document.createElement('button');navClose.className='button mobile-only';navClose.textContent='Close navigation';navClose.id='close-nav';$('.sidebar').prepend(navClose);
  function closeNav(){$('.sidebar').classList.remove('open');$('#mobile-nav').setAttribute('aria-expanded','false');$('#mobile-nav').focus();}
  $('#mobile-nav').addEventListener('click',()=>{const open=!$('.sidebar').classList.contains('open');$('.sidebar').classList.toggle('open',open);$('#mobile-nav').setAttribute('aria-expanded',String(open));if(open)$('#close-nav').focus();});
  navClose.addEventListener('click',closeNav);
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('#tooltip').hidden=true;if(!state.dialog&&$('.sidebar').classList.contains('open'))closeNav();}});
  window.addEventListener('hashchange',()=>{const r=location.hash.slice(1);if(labels[r]&&r!==state.route)goto(r);});
  window.MMXReference=Object.freeze({getState:()=>L.clone({...state,toolVisits:[...state.toolVisits]}),routes:Object.keys(labels),coreTools:L.clone(coreTools)});
  const first=location.hash.slice(1);state.route=labels[first]?first:'bonds';render();
})();
</script></body></html>
