<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow"><title>BioCatalyst · Decision Desk · Contract replay</title>
  <style>/* THEME_TOKENS */</style>
  <style>
    body { margin:0; background:var(--bg); color:var(--text); font-family:var(--font-ui); }
    .replay-bar { display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; padding:12px 24px; background:var(--panel); border-bottom:1px solid var(--line); font-size:12px; }
    .replay-bar p { margin:0; max-width:760px; color:var(--muted); }
    .replay-bar strong { color:var(--text); }
    .replay-controls { display:flex; gap:8px; flex-wrap:wrap; }
    .replay-controls select { border:1px solid var(--line); border-radius:6px; background:var(--panel2); color:var(--text); padding:8px; min-height:40px; }
    @media(max-width:700px) { .replay-bar {padding:10px 16px; gap:6px;} .replay-controls select {font-size:11px; min-height:36px; padding:5px;} }
  </style>
  <style>/* COMPONENT_CSS */</style>
</head>
<body>
  <aside class="replay-bar" aria-label="Preview controls">
    <p><strong>Contract replay</strong> · Synthetic owner cut, evaluated 1 Aug 2026. This preview has no live feed or monitoring.</p>
    <div class="replay-controls">
      <select id="previewTheme" aria-label="Preview theme"><option value="dark">Dark</option><option value="light">Light</option></select>
      <select id="previewLanguage" aria-label="Preview language"><option value="en">English</option><option value="zh">中文</option></select>
      <select id="previewScenario" aria-label="Preview state"><option value="captured">Captured API response</option><option value="conflict">Simulated timing conflict</option><option value="withdrawn">Simulated withdrawal</option><option value="unavailable">Simulated unavailable API</option></select>
    </div>
  </aside>
  <main id="desk"></main>
  <script>/* COMPONENT_JS */</script>
  <script type="application/json" id="capturedFixtures">/* FIXTURES */</script>
  <script>
  'use strict';
  const data=JSON.parse(document.getElementById('capturedFixtures').textContent);
  const clone=x=>JSON.parse(JSON.stringify(x));
  const params=new URLSearchParams(location.search), language=params.get('lang')==='zh'?'zh':'en';
  document.documentElement.dataset.theme=params.get('theme')==='light'?'light':'dark';
  document.documentElement.dataset.lang=language;
  document.documentElement.lang=language==='zh'?'zh-CN':'en';
  document.getElementById('previewTheme').value=document.documentElement.dataset.theme;
  document.getElementById('previewLanguage').value=language;
  let account='synthetic-preview-account', mode='captured', forcePage=null, forceDetail=null;
  const harness={data, setPage:p=>{forcePage=p;},setDetail:d=>{forceDetail=d;},setContext:k=>{account=k;}};
  function responseFor(q) {
    if(mode==='unavailable') throw Object.assign(new Error('simulated unavailable'),{status:503});
    if(forcePage) return clone(forcePage);
    const p=clone(data['page-'+q.view+'-'+(q.horizon_days===null?'None':q.horizon_days)+'.json']);
    if(!p) throw new Error('No captured response for query');
    if(mode!=='captured' && p.rows.length) {
      p.generation_id='simulated-'+mode;
      if(mode==='conflict') {
        p.rows[0].timing.state='conflicted'; p.rows[0].research_priority.lane='RECONCILE';
        p.rows[0].research_priority.primary_reason='TIMING_CONFLICT'; p.rows[0].research_priority.gap_reasons=['TIMING_CONFLICT'];
      } else p.rows[0].occurrence='withdrawn';
    }
    return p;
  }
  const desk=BioCatalystDecisionDesk.createDecisionDesk({root:document.getElementById('desk'),locale:language,
    getContextKey:()=>account,
    loadPage:async({query})=>responseFor(query),
    loadDetail:async()=>{
      if(forceDetail) return clone(forceDetail);
      const d=clone(data['company-detail.json']);
      if(mode!=='captured') {const p=responseFor(desk.getState().query);d.generation_id=p.generation_id;d.event=p.rows[0];}
      return d;
    },
    onCaseChange:selection=>{
      const h=new URLSearchParams();
      if(selection){h.set('event',selection.event_fact_ref);if(selection.issuer_id)h.set('issuer',selection.issuer_id);h.set('tab',selection.tab);}
      history.replaceState(null,'',location.pathname+location.search+(h.size?'#'+h:''));
    }
  });
  window.reviewHarness=Object.assign(harness,{desk});
  document.getElementById('previewTheme').addEventListener('change',e=>{document.documentElement.dataset.theme=e.target.value;});
  document.getElementById('previewLanguage').addEventListener('change',e=>{const u=new URL(location);u.searchParams.set('lang',e.target.value);u.searchParams.set('theme',document.documentElement.dataset.theme);location.href=u;});
  document.getElementById('previewScenario').addEventListener('change',e=>{mode=e.target.value;forcePage=null;forceDetail=null;desk.refresh();});
  function openRoute(){const h=new URLSearchParams(location.hash.slice(1));if(h.has('event'))desk.openCase({event_fact_ref:h.get('event'),issuer_id:h.get('issuer'),tab:h.get('tab')||'setup'});else desk.close();}
  window.addEventListener('hashchange',openRoute);
  desk.refresh().then(openRoute);
  </script>
</body>
</html>
