    reason: >-
      Giving country interpretation priority and placing supporting tools behind a disclosure is a defensible hierarchy choice, which the rationale openly acknowledges.
      That choice does not require clipping the tools entry in the English mobile navigation: the finding concerns discovery of the retained tools, rather than their reduced prominence or the additional disclosure action.
  - id: VTC-002
    disposition: upheld
    severity: major
    reason: >-
      The rationale does not establish an alternative readily visible assistant entry or explain how footer-only placement preserves access during research reading.
      A restrained research surface can accommodate a compact assistant entry without restoring a large overlay, so the observed discoverability loss remains a mitigable defect.
  - id: VTC-003
    disposition: upheld
    severity: major
    reason: >-
      The rationale explicitly limits market-state labels to observed equity windows and distinguishes their clock from economic projections, which supports the need to make that scope visible in the country summary.
      Describing the state as an equity observation in the rationale does not resolve the unlabeled colored status beside the economic thesis and GDP forecast in the inspected artifact.
