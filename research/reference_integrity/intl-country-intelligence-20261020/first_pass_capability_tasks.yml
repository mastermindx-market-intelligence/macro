primary_country_tasks:
  -
    id: "country.current-state"
    user_job: "Understand a selected country's present economic, policy and market situation."
    importance: "core"
    task: "Choose a country, read its assessment, identify the principal current conditions, and locate the information date and research source."
    production_locations:
      - "Macro → economic evidence"
      - "#intl-cross-country"
      - "International menu → existing country dashboards"
    proposal_locations:
      - "#imc-countries"
      - "#imc-country-<CC>"
    proposal_source: "templates/intl_country_cockpit.html.j2:39"
  -
    id: "country.published-path"
    user_job: "Understand the published economic path for a country."
    importance: "core"
    task: "Locate the country's published growth and inflation path, distinguish observed and projected periods, and identify provider, release date, units and horizon."
    production_locations:
      - "Macro → GDP/CPI observations"
      - "#intl-growth-inflation"
      - "International menu → existing country dashboards"
    proposal_locations:
      - "#imc-outlook-<CC>"
    proposal_source: "templates/intl_country_cockpit.html.j2:52"
  -
    id: "country.policy-decision"
    user_job: "Understand a policy decision and its economic or market relevance."
    importance: "core"
    task: "Locate the national policy decision, its effective or announcement status, rationale and dated primary evidence; inspect any monthly cross-check qualification separately."
    production_locations:
      - "Macro → Realized policy"
      - "#intl-central-banks"
      - "#intl-rates-curves"
    proposal_locations:
      - "#imc-policy-<CC>"
    proposal_source: "templates/intl_country_cockpit.html.j2:99"
  -
    id: "country.fiscal-external"
    user_job: "Understand a country's fiscal and external position."
    importance: "core"
    task: "Locate available current-account, budget or debt observations/projections; identify their units, periods and interpretation."
    production_locations:
      - "Risk → Fast pressure. Slow resilience."
      - "#intl-structural-fragility"
      - "#intl-cross-country"
    proposal_locations:
      - "#imc-balances-<CC>"
    proposal_source: "templates/intl_country_cockpit.html.j2:121"
  -
    id: "country.market-observations"
    user_job: "Understand the market observations accompanying a country assessment."
    importance: "core"
    task: "Read the country index and currency observations, identify dates and return intervals, and locate the interpretation connecting them to country conditions."
    production_locations:
      - "Overview → return components"
      - "market inspector"
      - "#lb-board"
    proposal_locations:
      - "#imc-country-<CC> → Market conditions"
    proposal_source: "templates/intl_country_cockpit.html.j2:141"
  -
    id: "country.conditional-paths"
    user_job: "Identify developments that could change the country's economic or market path."
    importance: "core"
    task: "Find the described stronger and weaker paths, the conditions attached to each and the source boundary for the interpretation."
    production_locations:
      - "World market lenses"
      - "International menu → existing country dashboards"
    proposal_locations:
      - "#imc-country-<CC> → What changes the view"
    proposal_source: "templates/intl_country_cockpit.html.j2:169"
  -
    id: "country.source-trace"
    user_job: "Trace a country claim to evidence and distinguish observation, projection and interpretation."
    importance: "core"
    task: "Open a country's evidence disclosure; trace an observation, a policy claim and a projected series to their dated sources and inspect another published view where supplied."
    production_locations:
      - "market inspector → Evidence ledger"
      - "Macro evidence details"
      - "legacy research source disclosures"
    proposal_locations:
      - "#imc-country-<CC> → Sources, dates & interpretation"
    proposal_source: "templates/intl_country_cockpit.html.j2:178"
  -
    id: "country.global-connections"
    user_job: "Understand connections between countries and the global economy."
    importance: "core"
    task: "Read the world brief and a demand, price or financing channel, then follow any available country link to its assessment and supporting research."
    production_locations:
      - "rendered global-regime fragment"
      - "#intl-contagion"
      - "#intl-cross-market-correlation"
    proposal_locations:
      - "#imc-world"
      - "#imc-connections"
    proposal_source: "templates/intl_country_cockpit.html.j2:207"
  -
    id: "country.navigation-context"
    user_job: "Move among country assessments and revisit the same country."
    importance: "core"
    task: "Use country links and disclosure summaries, open a country URL directly, and navigate Back/Forward while observing the selected country and reading location."
    production_locations:
      - "International menu → existing country dashboards"
      - "workspace URL context"
    proposal_locations:
      - "#imc-country-JP"
      - "#imc-country-KR"
      - "#imc-country-TW"
      - "#imc-country-IN"
      - "#imc-country-AU"
      - "#imc-country-GB"
      - "#imc-country-EZ"
    proposal_source: "templates/intl_country_cockpit.html.j2:34"
  -
    id: "country.evidence-state"
    user_job: "Recognize the scope and age of available country evidence."
    importance: "core"
    task: "Inspect any provided partial, dated, unavailable or review-needed evidence state and identify which claim, metric or decision remains available."
    production_locations:
      - "Overview unavailable rows"
      - "Macro evidence status"
      - "Risk evidence status"
      - "History unavailable qualifications"
    proposal_locations:
      - "#imc-country-<CC> → country status, policy status and evidence disclosure"
    proposal_source: "templates/intl_country_cockpit.html.j2:99"
