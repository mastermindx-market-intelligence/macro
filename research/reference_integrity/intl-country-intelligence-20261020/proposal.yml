    dashboards. Actual anonymous baseline has failed workspace resources and its data qualifications remain as captured.'
  proposal: 'Source destinations: #imc-countries; #imc-country-<CC>. templates/intl_country_cockpit.html.j2'
  verdict: BETTER
  notes: Comparative assessment based on direct artifacts and source. No timed user study or investment performance claim.
    Existing unavailable qualified FX and legacy observations are not converted to current evidence.
