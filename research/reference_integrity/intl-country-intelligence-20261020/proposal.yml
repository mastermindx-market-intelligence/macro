authority_delta:
- id: auth.official-outlook
  production_claim: Mostly current/recomputed macro and market observations.
  proposal_claim: An official provider projects country and world growth/inflation over stated periods.
  direction: stronger
  warranted: true
  evidence: config/intl_country_baseline.json archived release records; lib/intl_country_inputs.py admission and
    custody; templates/intl_country_cockpit.html.j2 period labels and history/projection separation.
- id: auth.country-thesis
  production_claim: Fragmented regime labels and observations.
  proposal_claim: A short interpretation joins a national primary-source assessment with separately dated market
    observations.
  direction: stronger
  warranted: true
  evidence: Country thesis source and date are visible; country policy narrative retains national decision and independent
    monthly policy cross-check. Source/interpretation disclosures are in the frozen rendered artifact.
- id: auth.conditional-watch
  production_claim: Risk/regime observations and manually entered scenario arithmetic.
  proposal_claim: Named conditions could strengthen or weaken the economic path; channels are not causal estimates.
  direction: stronger
  warranted: true
  evidence: What changes the view uses conditional language; Global connections says Channels to examine, not causal
    estimates. No probability, expected return or recommendation is produced.
- id: auth.market-freshness
  production_claim: Qualified workspace observations or unavailable states.
  proposal_claim: Market-state description uses dated equity windows; FX requires source-qualified observations
    and otherwise shows unavailable.
  direction: equal
  warranted: true
  evidence: Actual production-input render has Observation unavailable for unqualified copied FX. Copy receipts
    explicitly do not acquire source evidence; producer acquisition and served acceptance remain release obligations.
- id: auth.legacy
  production_claim: Existing tools and composites retain their own source qualifications.
  proposal_claim: The same tool claims behind a disclosure.
  direction: equal
  warranted: true
  evidence: Retained workspace template/controller source identities; complete build and task receipt, with unavailable
    macro/history/chart states kept explicit.
information_economics:
  words_per_card:
    production: No comparable primary country-assessment card exists in captured production. The actual broken-resource
      desktop page exposes13,888 whitespace-separated visible tokens over many panels; this is not a normal functioning
      before-card measure.
    proposal: Default desktop page exposes782 English whitespace-separated visible tokens including shared chrome,
      one expanded country, six collapsed country rows and connection cards. Chinese whitespace counts are not comparable
      word measures. Complete browser receipt supplies exact states.
  findings:
  - One expanded country provides a consistent sequence from thesis to path, policy, balances, market conditions
    and evidence.
  - Older aggregate boards and research panels require the Data & tools disclosure; this raises browsing effort
    for a user starting with those panels.
  - The default is still a substantive long assessment on mobile. Collapsed country rows and charts compress navigation
    and published paths; no claim of universally faster task completion is made.
  - The production before image has failed resource delivery. Do not advertise a percentage compression gain as
    an apples-to-apples comparison with a functioning old workspace.
  preserved:
  - Existing charts, source tables, calculators and evidence ledgers remain in their source hierarchy under the
    outer disclosure.
  - Published history and projection use distinct line treatments and a visible legend.
  - Country summaries expose thesis, growth path and market state before expansion.
