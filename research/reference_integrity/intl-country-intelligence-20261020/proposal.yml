additions:
- id: country.analysis
  description: Seven country assessments join current observations, policy decisions, fiscal/external context and
    market interpretation.
- id: country.official-projections
  description: Published historical points and official growth/inflation projections have distinct chart treatments,
    period conventions and source dates.
- id: country.conditional-paths
  description: Stronger/weaker paths describe conditions to examine; they are not predicted asset-return scenarios.
- id: country.global-connections
  description: Demand, energy-price and financing channels link to relevant country assessments; no measured causal
    coefficient is claimed.
