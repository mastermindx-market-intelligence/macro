    condition: Verify the loaded mmb-launch control remains inside the toolbar slot after the assistant has opened and closed with the actual shared visual stylesheet.
    evidence: Dock2 reserved-space checks measure mmb-boot; close/focus checks record focus returning to mmb-launch without recording its post-close geometry.
    implication: A post-close screenshot and slot measurement would directly settle this remaining placement question.

  - id: FINAL-IMMUTABLE-BINDING
    condition: Bind the final visual decision to the repaired source, final HTML hash, and frozen evidence commit.
    implication: This provisional receipt does not approve the announced replacement source or carry approval forward to unexamined captures.

