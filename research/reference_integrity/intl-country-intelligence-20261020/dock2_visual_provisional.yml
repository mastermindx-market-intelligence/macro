    condition: Inspect the repaired Japan desktop ZH-dark same-document landing and its exact source/HTML binding.
    evidence: toolbar_dock2_landings.json records the Japan section top at -1647.984375px with the toolbar bottom at 54px; the corresponding actual image shows the end of Japan followed by Taiwan rather than Japan's heading.
    implication: This known landing failure remains open for final acceptance despite the satisfactory toolbar placement.

