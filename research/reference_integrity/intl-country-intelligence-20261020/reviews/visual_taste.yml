  findings:
  - id: VTC-001
    severity: major
    finding: In the English 390px and 320px entry views, the Data & tools navigation item is respectively reduced to
      a sliver or entirely off-screen, while its alternative appears near the end of the report, making the preserved
      Compare, Macro, Risk, History and Library views unnecessarily difficult to discover (after_full/viewport-mobile-en-light.png,
      after_full/viewport-narrow-en-light.png, after_full/8269cad1004b37dd.png; templates/intl_country_cockpit.css:204).
  - id: VTC-002
    severity: major
    finding: Ask Mastermind loses the persistent visible entry present in the captured production view and appears only
      at the end of the proposed page, removing immediate access to the assistant while reading country research even
      though its underlying control remains present (before/viewport-desktop-en-light.png, before/viewport-mobile-en-light.png,
      after_full/6e6f66d8f4dd124b.png, after_full/8269cad1004b37dd.png; templates/intl_country_cockpit.css:244).
  - id: VTC-003
    severity: major
    finding: Country summaries place an unlabeled colored Under pressure or Uptrend status beside the economic thesis
      and GDP forecasts, while the explicit Equity trend label appears inside the expanded Market conditions section,
      leaving the compact country overview ambiguous about whether the status describes equities or the wider economy
      (after_full/viewport-desktop-en-light.png, after_full/6e6f66d8f4dd124b.png; templates/intl_country_cockpit.html.j2:44
      and :144).
