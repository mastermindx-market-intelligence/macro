information_economics:
  words_per_card:
    production: Stored body/table/rationale length depends on actual report; no single
      invented average.
    proposal: Same stored body/table/rationale, plus repeated section/outline labels.
      Reading measure is narrower, so page is taller.
  findings:
  - Shorter prose lines trade vertical length for reading measure. Tables retain columns/rows
    and may need horizontal scrolling on phone.
  - Repeated AI analysis/original-language UI and outline labels are real extra words;
    critics judge whether they earn space.
  - Method text moves behind one disclosure. Model relevance moves to rail on desktop
    and precedes reading on phone.
  preserved:
  - Full paragraph arguments and evidence rows remain; no chart-to-prose substitution.
  - Existing Treasury chart/numeric units and dated context remain.
