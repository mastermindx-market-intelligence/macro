    outside it; missing-body sentence contradicts surviving summary/assessment.
  verdict: WORSE
  notes: PRC-001/002 and VTC-001 upheld after rationale; new differentiated hierarchy
    introduces a material authorship ambiguity. Authority upholds revision, not approval.
