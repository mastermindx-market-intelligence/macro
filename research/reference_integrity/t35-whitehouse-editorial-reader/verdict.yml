packet:
  materially_improved: Bounded desktop prose, native per-report outline, calm neutral
    surfaces, deliberate white-paper/light vs graphite/dark materials, larger source
    targets and distinct publication/read/banner/model clocks. AI relevance explicitly
    is not a probability. Source/crops support those strengths within represented
    cells.
  materially_worsened: Selective lower-body AI attribution leaves the generated headline/summary
    in a more authoritative unlabeled position. The missing-body sentence says an
    AI read is absent while summary/assessment survive, then asks for an unavailable
    source. Narrower evidence tables show a minor ticker/direction wrap; mobile supporting
    blocks delay argument.
  disappeared: No report, original paragraph, source URL, evidence row or canonical
    report ID is intentionally removed. Full77 anchor/order/source facts are retained
    but do not certify full77 visual/content parity. Always-visible full method prose
    is relocated to one native disclosure; that extra action is explicit.
  behavior_harder: Source-vs-AI distinction is harder at the dominant title/summary;
    unavailable-analysis/source guidance cannot be followed in supplied missing state.
    Full method explanation takes an extra disclosure. Table tails indicate some slower
    ticker scanning; full table comparison is UNKNOWN.
  stronger_claims: No new market or trading authority is authorized. The hierarchy
    nevertheless gives unlabeled generated headline/summary more apparent editorial
    authority relative to explicitly labeled lower body. This is a perceived-authority
    risk requiring attribution, not scientific evidence that stored claims changed.
  intent_vs_convenience: Reading measure, normal-flow outline, thematic material and
    restrained frames follow the dated editorial user job. Preserving source/body
    fields and avoiding guessed language/URLs follows actual contracts. Broad unavailable-copy
    is a design-specification error, not a necessary data constraint; keeping it for
    implementation convenience is rejected.
  production_preferable_for: The original compact table view is preferable for some
    ticker comparison, based on the represented tails. Original title/body lacks a
    newly selective AI boundary, although baseline attribution was also inadequate.
    The new reader is stronger for sustained argument reading. Neither baseline nor
    proposal proves current served/embedded behavior.
  strongest_argument_against: The user job is specifically to distinguish interpretation
    from original evidence. Two independent critics found point-of-use authorship
    ambiguity; the product critic additionally found contradictory missing-state guidance
    and maintained BLOCK after seeing the exact rationale. Approving unchanged bytes
    to clearL8 would turn known meaning defects into design law.
