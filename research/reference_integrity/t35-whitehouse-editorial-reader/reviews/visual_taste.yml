limits:
- Before comparison exists only for 1440 dark EN and 390 light ZH. I make no before/after
  improvement claim for the missing baseline axes.
- After evidence represents controlled report subsets and selected states. It does
  not establish full 77-report visual parity or scanning performance through the complete
  retained population.
- After source crops expose only the tail of a ticker table. They do not show a complete
  after sector table or complete after ticker table, particularly on mobile. Source
  inspection establishes structure, not satisfactory rendered table density or column
  behavior.
- No browser, network, served runtime, entitlement, embedded-shell handshake, keyboard
  sequence, fragment reload or Back interaction was exercised. The visible focus/target
  treatment and source code support limited presentation observations only.
- No contrast ratios were measured. Contrast observations are visual judgments from
  the supplied images, not accessibility certification.
- The Treasury agency-attribution correction belongs to T34. I do not credit that
  independent correction as a T35 design improvement.
