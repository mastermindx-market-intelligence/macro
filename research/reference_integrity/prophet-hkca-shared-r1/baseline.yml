user_job: >
  Scan the complete entitled current HK or Canada owner-visible roster, understand timing and
  evidence, and see what changed without mistaking research, history, or absence for live authority.
core_interactions:
  - Inspect current cards and owner-native states.
  - Switch language and theme without changing meaning.
  - Use stage, search, Grid/Table, and access controls where exposed.
  - Open evidence and record details without granting them entry authority.
  - Continue using server-owned first-frame content when optional enhancement fails.

information_hierarchy:
  - Market and scan-session state.
  - Current opportunity cards and timing.
  - Stage/watch shelves and optional context.
  - Evidence, record, and historical detail.

design_lineage:
  rulings:
    - ref: "CHAIRMAN_NO_SUDDEN_DESERT_CONTINUITY_AMENDMENT_V1"
      evidence: "macro#6817 issuecomment-5549201543"
      implication: "Top is a subset; All preserves the complete current owner-visible roster; absence is not an exit."
    - ref: "D_SHARED_PRODUCT_DESIGN_AND_UI V2"
      evidence: "conversation attachment / planning batch prophet-hkca-recovery-fanout-20260919-sol-001"
      implication: "One paired HK/Canada design, explicit field authority, states, EN/ZH, dark/light, 1440/390 plus targeted 320."
    - ref: "WS:PROPHET-HK-CA-REVAMP"
      evidence: "agentos/workstreams/WS-PROPHET-HK-CA-REVAMP.md"
      implication: "Preserve Canada Branch-B screen semantics, era fences, shadow authority, and HK publication boundaries."
    - ref: "User-First Design Doctrine"
      evidence: "docs/DESIGN_DOCTRINE.md"
      implication: "The glance tier states the signal, meaning, and permitted action in plain words."
  rejected_variants:
    - "A positional first-five or live-only subset labelled as the whole board."
    - "Historical absence rendered as a precise exit reason or current action card."
    - "Canada screen rows promoted to validated official picks."
    - "A new candidate store, lifecycle service, or page-local component/token system."
    - "A chat-only image or unreviewed file key used as implementation authority."
  comments:
    - path: "mockups/evidence/prophet-p0b-zero-fouc/manifest.json"
      note: "The before matrix is a reproducible fixture and explicitly not production proof."
    - path: "agentos/discoveries/DSC-PROPHET-BOARD-TENURE-COVERAGE-FLOOR.md"
      note: "Visible shelves are not fully represented in graded ledgers; absence cannot establish continuous tenure or exact exit."
    - path: "research/PROPHET_HK_CANADA_SHARED_PRODUCT_DESIGN_CONTRACT_2026_09_20.md"
      note: "The paired contract separates current action, research attention, recent change, and record authority."
    - path: "github:macro#7163 issuecomment-5749594572"
      note: "ANONYMOUS_DEPLOYED HK evidence: owner proof declares 32 board + 8 watch = 40 unique current names; source=all Grid shows the shelves, but Table exposes only stocktable-data rows 2150.HK, 0241.HK, and 3888.HK. Returning to Grid restores the prior grid state. Live HTML was byte-identical to protected main at the observation; probe receipt SHA-256 prefix 747a698a, suffix b361."

capabilities:
  - id: authority.market_native_current
    user_job: Read each market's current owner-native state without borrowing authority from another market or history.
    evidence: "templates/hk.html.j2; templates/canada.html.j2; WS-PROPHET-HK-CA-REVAMP"
    importance: core
  - id: authority.canada_screen
    user_job: Understand that Canada is a Branch-B screen rather than validated official picks.
    evidence: "scripts/build_canada_library.py output contract; WS-PROPHET-HK-CA-REVAMP"
    importance: core
  - id: roster.actionable_current
    user_job: Find the current names the owner presents as actionable or nearest to action.
    evidence: "P0B rendered fixture current card populations"
    importance: core
  - id: roster.stage_shelves
    user_job: Find watch, setting-up, ran, or blocked names instead of interpreting their absence as disappearance.
    evidence: "templates/hk.html.j2; templates/canada.html.j2; September 5 continuity amendment"
    importance: core
  - id: card.identity_state_timing
    user_job: See listing identity, owner state, current timing, next trigger, and current price or honest unavailability together.
    evidence: "templates/_prophet_card.html.j2 and market-native renderers"
    importance: core
  - id: card.reason_evidence
    user_job: Understand why a name is present and reach supporting evidence without mistaking evidence for authority.
    evidence: "P0B card and LENS evidence contracts"
    importance: core
  - id: controls.identity_preserving_views
    user_job: Search, filter, and switch views without silently changing identity or order.
    evidence: "HK anonymous deployed probe: source=all Grid represents 40 current identities, while Table exposes only 3 stocktable rows; github:macro#7163 issuecomment-5749594572"
    importance: core
  - id: continuity.record_separation
    user_job: Inspect track record and historical context separately from current action authority.
    evidence: "existing board ledgers, track record sections, and history-coverage finding"
    importance: core
  - id: access.entitlement_boundary
    user_job: Receive only the current roster and details permitted by the user's access tier.
    evidence: "existing anonymous/free/paid publication and premium payload boundaries"
    importance: core
  - id: resilience.first_frame
    user_job: Retain useful server-owned content when JavaScript, optional data, or enhancement fails.
    evidence: "merged P0B first-frame ownership and degraded-state browser fixtures"
    importance: core
  - id: parity.theme_locale_responsive
    user_job: Use equivalent meaning in dark or light, EN or ZH, desktop or mobile without clipping or horizontal page overflow.
    evidence: "P0B 16-cell fixture matrix"
    importance: core
  - id: freshness.session_asof
    user_job: Know the scan session, data state, and one applicable as-of without duplicated timestamps.
    evidence: "existing DTP/session stamps and market headers"
    importance: supporting
  - id: research.optional_context
    user_job: Use optional research and sector context without allowing it to redefine the current roster or entry permission.
    evidence: "market-native research links and September 5 continuity amendment"
    importance: supporting
  - id: plans.real_only
    user_job: Enter a separate plan workflow only when a verified market plan owner and real plan identity exist.
    evidence: "Candidates are not Plans contract; no assumed HK/CA Plans backend"
    importance: supporting
