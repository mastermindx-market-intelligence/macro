dispositions:
- id: global.regime-verdict
  disposition: IMPROVE
  target: Preserved upstream overview plus Act 1 Global Call
  rationale: Keeps the canonical overview and gives the international engine-owned 66/100 verdict a bounded first answer.
- id: global.us-world-rotation
  disposition: IMPROVE
  target: Act 1 US-versus-world beam and Act 3 separate RRG scatter plus reference table
  rationale: Retains leadership versus the US without fusing RRG vocabulary into turn state.
- id: market.turn-state
  disposition: IMPROVE
  target: Act 2 ten-market turn cards with metrics, pullback-risk state, driver, evidence receipt, plus Act 3 current order
  rationale: Every published state remains visible with its accepted stance; no market is suppressed.
- id: market.performance-usd
  disposition: IMPROVE
  target: Act 2 seven-market cards with 1M/3M/6M/12M/YTD controls, fixed 84-session price paths, local return, FX contribution, and USD return
  rationale: Preserves currency-aware comparison while making the selected return horizon explicit and separate from the fixed price path.
- id: market.macro-comparison
  disposition: RETAIN
  target: Act 5 seven-economy comparison table plus country inspector tabs
- id: rates.curve-desk
  disposition: RETAIN
  target: Act 6 eight-market rates and curve desk with long-yield drift, carry versus the US, a typed Taiwan null, and a real bonds.html destination
- id: risk.contagion
  disposition: IMPROVE
  target: Act 4 International Risk Desk plus contagion board with connectedness, named transmitters, US receiving share, funding state, and non-causal disclosure
  rationale: Makes transmission readable while preserving the explicit no-causation boundary.
- id: policy.central-banks
  disposition: RETAIN
  target: Act 6 seven-bank table with realized stance, honest balance-sheet nulls, and meetings
- id: risk.credit-bonds
  disposition: RETAIN
  target: Act 6 credit and bond stress table with magnitudes, 20-day direction, inversion count, and history start
- id: fx.dollar-drivers
  disposition: IMPROVE
  target: Act 4 Dollar Drivers card plus forex.html escape
  rationale: Restores the accepted rate-driven read and its window/confirmation receipts without inventing a new score.
- id: risk.fragility-map
  disposition: IMPROVE
  target: Act 4 seven-economy structural fragility ledger plus the US anchor
  rationale: Accounts for every declared economy plus the US anchor and retains valued breaches, thresholds, source, cadence, base-rate, and honest-null law.
- id: risk.pressure-flow
  disposition: RETAIN
  target: Act 4 complete ten-row production pressure population with source-backed magnitude plus at least three named contributors and shares per market
- id: reference.regime-correlation-ranks
  disposition: RETAIN
  target: Act 3 RRG scatter plus table and Act 6 growth-inflation map, pairwise correlation heatmap, and comparable league table
- id: action.sector-rotation
  disposition: RELOCATE
  destination: Act 6 preservation card plus intl_stocks.html, sector_central.html, and cycle destinations
  reachability: The populated 3-month regional sector board remains on intl_stocks.html; the overview links to it without duplicating or reinterpreting rows.
- id: action.prophet-stocks
  disposition: RELOCATE
  destination: Act 6 preserved-route contract plus intl_stocks.html
  reachability: The stock route is linked directly and has an eight-cell desktop/mobile × theme × locale preservation matrix.
- id: shell.theme-language-responsive
  disposition: IMPROVE
  target: Visible canonical shell representation, dark/light art directions, native EN/ZH, exact 390px recomposition, and
    organ-local degraded states
  rationale: Preserves product navigation and state controls while eliminating whole-page failure takeovers.
additions:
- A full ten-market turn-state coverage ledger next to the seven-market performance population.
- Organ-local loading, empty, stale, and error presentations that preserve unrelated intelligence.
- A seven-economy comparison table plus accessible inspector tabs, without replacing dedicated country routes.
- A visible non-regression contract and browser evidence matrix for the shared intl_stocks.html mode.
user_tasks:
- id: task.read-global-call
  task: Decide whether the international tape is constructive, mixed, or risk-off and understand the receipts behind the call.
  critical: true
  production: The upstream overview and international compass both exist but sit inside a long equal-weight dashboard.
  proposal: The upstream overview is preserved and Act 1 gives the international 66/100 verdict, coverage receipt, drags,
    US-versus-world beam, and vitals.
  verdict: BETTER
  notes: No authority change; hierarchy and duplicate-reading cost improve.
- id: task.find-leadership
  task: Identify leaders, weakening markets, and changed states across useful horizons without losing FX context.
  critical: true
  production: Turn tiles, a USD leaderboard, horizon controls, sparklines, and RRG answer the job in separate panels.
  proposal: Act 2 keeps every return horizon, decomposition, fixed 84-session price path, ten-market state, and stance; Act 3 keeps rotation rank and
    RRG separate.
  verdict: BETTER
  notes: The proposal preserves every return horizon and labels the fixed price path as horizon-independent.
- id: task-diagnose-risk
  task: Distinguish local stress, global transmission, dollar pressure, and structural fragility.
  critical: true
  production: Four panels expose contagion, pressure flow, dollar, and fragility with technical receipts.
  proposal: Act 4 composes the same capabilities, full populations, a restored Dollar Drivers card, and non-causal/slow-versus-fast
    disclosures.
  verdict: BETTER
  notes: The result is more coherent without making a stronger claim.
- id: task-investigate-country
  task: Compare all seven economies and inspect one country without losing the common scale.
  critical: true
  production: A dense comparison table supports cross-country scanning; country routes provide depth.
  proposal: Act 5 preserves the complete comparison table, adds accessible same-page tabs, and keeps real rates/FX destinations.
  verdict: BETTER
  notes: Comparison remains first; tabs add depth rather than replace population coverage.
- id: task-use-deep-desks
  task: Reach central banks, credit, curves, correlation, sector intelligence, and international stock candidates.
  critical: true
  production: Each capability is a first-level panel or linked route.
  proposal: Act 6 retains compact inspectable desks with real routes; populated regional sector rotation remains on the preserved stock route and the stock mode is
    separately proven.
  verdict: EQUIVALENT
  notes: The jobs remain reachable while the L1 hierarchy is reduced.
- id: task-survive-degradation
  task: Continue using healthy international intelligence when one producer is loading, empty, stale, or in error.
  critical: true
  production: Engines fail open independently, but page-level designed-state evidence is inconsistent.
  proposal: Only the affected Global Pulse organ changes state; rotation, transmission, comparison, and deep desks remain
    visible.
  verdict: BETTER
  notes: Browser evidence covers all four states in both themes.
authority_delta:
- id: auth.global-verdict
  production_claim: Engine-owned world risk appetite label, score, coverage, drags, and descriptive thesis.
  proposal_claim: The same 66/100 verdict and receipts in a clearer hierarchy.
  direction: equal
  warranted: true
  evidence: mockups/refs/institutionalize/intl/reference-r3.html#global-call; scripts/build_intl.py:181-386
- id: auth.rotation
  production_claim: Rotation rank is a display-tier result derived by the accepted engine.
  proposal_claim: Engine rotation rank is shown as a result; partial formula inputs are deliberately not presented as an explanation.
  direction: equal
  warranted: true
  evidence: mockups/refs/institutionalize/intl/reference-r3.html#rotation-turns; engine/intl_rotation.py
- id: auth.transmission
  production_claim: Connectedness, receiving share, and pressure links are transmission reads, not causal shares.
  proposal_claim: The same read is labelled non-causal; source-backed pressure magnitude and contributor shares are retained, and no unsourced decorative magnitude is introduced.
  direction: equal
  warranted: true
  evidence: mockups/refs/institutionalize/intl/reference-r3.html#transmission-fragility
- id: auth.posture
  production_claim: Market-state engines publish plain-language stance fields without position sizing.
  proposal_claim: Accepted stance remains on the market and turn surfaces that already own it; Act 6 does not mint or redundantly project another posture layer, and nothing originates, sizes, or upgrades a trade.
  direction: equal
  warranted: true
  evidence: mockups/refs/institutionalize/intl/reference-r3.html#deep-desks
- id: auth.fragility
  production_claim: Structural flags disclose thresholds, annual source/cadence, and a high false-positive base rate.
  proposal_claim: The same thresholds and caveats are kept while every declared economy plus the US anchor is accounted for with valued breaches.
  direction: equal
  warranted: true
  evidence: mockups/refs/institutionalize/intl/reference-r3.html#transmission-fragility
information_economics:
  words_per_card:
    production: Baseline harness measured 1,923 visible English words across 27 panels and 20 sections.
    proposal: Six operating acts with short visible meanings; technical mechanics stay in local receipts, tables, or real
      deep routes.
  findings:
  - The proposal reduces the first-level hierarchy without deleting a baseline capability.
  - Fixed 84-session price paths remain visual and explicitly horizon-independent; RRG remains a distinct relative-leadership scatter plus reference table.
  - Full populations are printed for turn states, economies, pressure flow, fragility including the US anchor, and central banks.
  - Organ-local degraded states prevent one failed producer from blanking unrelated intelligence.
  - The exact international stock route remains outside the redesign and is browser-proven in eight cells.
  preserved:
  - Engine-owned 66/100 verdict, coverage receipt, drags, US-versus-world read, and four vitals.
  - Five return horizons, local/FX/USD decomposition, fixed 84-session price paths, rotation result, RRG, and dated events.
  - Contagion, Dollar Drivers, structural fragility, pressure flow, macro comparison, and deep desks.
  - Dark/light, EN/ZH, desktop/mobile, keyboard tabs, and real destination links.
