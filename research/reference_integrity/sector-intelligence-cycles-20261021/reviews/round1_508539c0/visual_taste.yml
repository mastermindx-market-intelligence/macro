  - 'Global chrome identity and reach: the MASTERMINDX wordmark, flags, Other Assets, settings, the Ask Mastermind
    copilot, and Terminal on mobile.'
  - Plain Tier-1 wording ('20d vs market') vs '21-session relative wealth versus SPY'.
