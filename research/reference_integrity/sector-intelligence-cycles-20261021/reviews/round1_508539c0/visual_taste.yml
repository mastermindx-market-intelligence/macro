  findings:
  - id: VTC-001
    severity: blocker
    finding: 'The Brief has turned from a dashboard into a report. Production''s main object is the Act-Now board:
      36 sectors and themes grouped into five graded lanes, each row with a score and its 20d move vs the market,
      plus a 7-item Bottoming Watch, all readable in one viewport. Boards 12, 22 and 13 replace it with a two-line
      headline, one unlabeled line chart and three GICS sectors. They show no themes and no stance chip on any of
      the three rows, and the only call is ''Entry posture: Check entry signals'', which is not one of the six doctrine
      stances (DESIGN_DOCTRINE.md:40-46 Law 1; COMPONENTS.md:113-124 ''never invent a stance outside the six'').
      No board anywhere draws the lane board (baseline.yml:99 and :109 name the Act-Now board as the Brief''s main
      object; SC-001..SC-007 are core rows). The Bottoming Watch survives only as three plain rows under Watches,
      mixed in with the user''s own saved items (09, 10).'
    boards:
    - 12-brief-desktop-light-en.png
    - 22-brief-desktop-dark-en.png
    - 13-brief-mobile-dark-zh.png
    - 09-watches-desktop-light-en.png
    - 10-watches-mobile-dark-zh.png
    - prod-desktop-dark-en-central.png
    - prod-desktop-light-en-central.png
    - prod-mobile-dark-zh-central.png
  - id: VTC-002
    severity: blocker
    finding: 'The boards draw at least five different global headers, and none of them is the canonical product
      nav (MASTERMINDX wordmark, country flags with menus, Other Assets, settings gear, Terminal, Ask Mastermind).
      (a) 01, 02, 16 use a local bar ''Mastermind · Brief Sectors Cycles Research Watches'' with search, EN/中文 and
      a Dark toggle. (b) 09 uses ''Mastermind · Brief Explore Dossier Research Watches Cycles · Signed in as you''.
      (c) 12, 18, 22 use ''Mastermind'' with flagless countries, ''Search markets'' and Terminal. (d) 14 uses an
      uppercase ''MASTERMIND'' variant. (e) Every mobile board uses ''≡ Mastermind 🔍 EN 中文'' with Terminal and settings
      removed. View names and order also disagree between boards: ''Sectors'' vs ''Explore''+''Dossier''; Cycles
      sits 3rd or 6th; Watches is 关注 on 17 but 观察 on 13. As law this licenses a third header family, which the navigation
      law forbids (CLAUDE.md ''Navigation source-of-truth''; baseline.yml:108 ''canonical nav family only''). baseline.yml:136
      already rejected an R2 board for exactly this kind of non-canonical navigation.'
    boards:
    - 01-cycles-desktop-dark-en.png
    - 02-cycles-desktop-light-zh.png
    - 16-dossier-desktop-dark-en.png
    - 09-watches-desktop-light-en.png
    - 12-brief-desktop-light-en.png
    - 14-explore-rotation-desktop-light-en.png
    - 18-research-desktop-light-en.png
    - 22-brief-desktop-dark-en.png
    - 03-cycles-mobile-dark-en.png
    - 04-cycles-mobile-light-zh.png
    - 10-watches-mobile-dark-zh.png
    - 13-brief-mobile-dark-zh.png
    - 15-explore-rotation-mobile-dark-zh.png
    - 17-dossier-mobile-light-zh.png
    - 19-research-mobile-dark-zh.png
  - id: VTC-003
    severity: blocker
    finding: 'Dark/light and EN/ZH coverage is too incomplete to adopt this as law, and the artifact''s own coverage
      table (board 20) shows it. Only Cycles has all four theme×device cells. Never drawn: Explore desktop dark
      (no dark rotation map at desktop), Dossier desktop light and mobile dark, Research desktop dark, and mobile
      light for Brief, Explore, Research and Watches. ZH desktop exists only for Cycles (02), so the wide CJK tables
      in Dossier Companies, the Explore list and Watches are never shown, and the components board 00 is EN only.
      Dark and light cannot each be judged as a design for five of the six views.'
    boards:
    - 20-state-matrix-desktop-light-en.png
    - 00-components-desktop-both-en.png
    - 14-explore-rotation-desktop-light-en.png
    - 16-dossier-desktop-dark-en.png
    - 18-research-desktop-light-en.png
  - id: VTC-004
    severity: major
    finding: 'The glance tier now carries internal vocabulary that production avoided. Examples: ''21-session relative
      wealth'', ''63-session relative wealth'', ''Native 63 and 21 sessions'', ''Source rank 1/2/3'', ''Illustrative
      native binding'', ''owner reconstruction, not an as-known trading signal'', ''Source-owned entry and action
      signals''. Production says plainly ''+5.6% 20d vs market''. The Brief headline is 6 words and its subtitle
      24 words, against the Tier-1 budget of 4 and 14 (DESIGN_DOCTRINE.md:23; Law 2 internal-vocabulary ban, :50-56).'
    boards:
    - 12-brief-desktop-light-en.png
    - 22-brief-desktop-dark-en.png
    - 14-explore-rotation-desktop-light-en.png
    - 13-brief-mobile-dark-zh.png
  - id: VTC-005
    severity: major
    finding: 'The product''s personality has been flattened into a generic white-and-graphite SaaS template. Gone:
      the regime headline with its inked keyword (''Leadership steady'' / 领涨格局 稳定), the ''This week''s handoff''
      losing-the-lead / taking-the-lead module, and the aurora material. copy_deck.md:26 still carries handoff_label,
      yet no board draws the handoff. The new ''Group strength. A separate stock decision.'' panel adds prose but
      no signal.'
    boards:
    - 12-brief-desktop-light-en.png
    - 22-brief-desktop-dark-en.png
    - prod-desktop-dark-en-central.png
    - prod-desktop-light-zh-central.png
  - id: VTC-006
    severity: minor
    finding: The dark Brief (22) is board 12 recolored. Apart from the 9/11 note, everything sits on one graphite
      plane, with no card depth or surface hierarchy. That falls short of board 00's own 'graphite depth' dark direction,
      which board 01 does achieve.
    boards:
    - 22-brief-desktop-dark-en.png
    - 00-components-desktop-both-en.png
    - 01-cycles-desktop-dark-en.png
  - id: VTC-007
    severity: minor
    finding: The example data contradicts itself across the journey. Technology is 'Late up for 14 months' in 12
      and 14 but 'Early up, 9 weeks' in 01. Energy is Late up with cycle position +0.66 in 01, but Early up in 08's
      high-density table and −0.42 in 08's Clocks-disagree card. Utilities is the family leader in 01 but unranked
      in 14. Snapshot dates mix 23 Sep, 17 Oct and 20 Oct. Someone following Brief → Cycles sees a sector change
      phase between screens.
    boards:
    - 01-cycles-desktop-dark-en.png
    - 08-cycles-edge-cases-desktop-light-en.png
    - 12-brief-desktop-light-en.png
    - 14-explore-rotation-desktop-light-en.png
  - id: VTC-008
    severity: minor
