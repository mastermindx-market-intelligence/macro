second_pass:
  amended_at: '2026-10-21T09:32:12Z'
  rationale_received: true
  amendments:
  - finding: VTC-001
    action: upheld
    note: 'proposal.yml:168-191 marks SC-001..SC-008 RETAIN, with ''no dedicated R3 board: the production view markup
      is carried unchanged inside the shell''s Explore workflow''. task.brief at :678 records ''degraded cluster
      undrawn''. So the author keeps the lane board but never draws it, and the target names both the Brief and
      Explore as its home. Boards 12, 13 and 22 remain the only drawn Brief and show a different main object, so
      the blocker stands until the lane board and Bottoming Watch are drawn on the Brief in both themes.'
  - finding: VTC-002
    action: upheld
    note: 'Every pass-1 fact stands: five header variants are drawn and none is the product family. The board chrome
      also contradicts the proposal''s own ''canonical nav family only'' line (proposal.yml:770). The claim that
      the PR #9917 implementation uses _site_nav is an implementation fact; this review judges the board set as
      reference law. baseline.yml:136 rejected R2 board 6LQ6-0 for the same defect, so consistency keeps this a
      blocker. It is cheap to cure: re-export the boards with canonical chrome, or mark the chrome as non-normative
      inside the reference.'
  - finding: VTC-003
    action: upheld
    note: 'The rationale confirms the gaps: board 20 is described as ''36 drawn, 18 gap, 6 not-on-page'' (proposal.yml:671).
      Board 22 fills only Brief desktop dark, which pass 1 had already excluded from the gap list. No rationale
      supplies the missing dark/light or ZH desktop cells.'
  - finding: VTC-004
    action: upheld
    note: The rationale does not address the Tier-1 glance vocabulary or the headline and subtitle budgets. words_per_card
      is admitted as unmeasured (proposal.yml:760-762), which is consistent with the finding, not a rebuttal.
  - finding: VTC-005
    action: upheld
    note: If the production markup is carried over unchanged, the regime headline and handoff may survive somewhere
      in the build. But they are absent from every drawn board and from the Brief, which is where the identity lived.
      The finding concerns the drawn reference, so it stands as major.
  - finding: VTC-006
    action: upheld
    note: Board 22 is a seat export added after ORCH-PAPER's PLATFORM_FAILURE (proposal.yml:166). That explains
      its origin but not its flat single-plane dark composition.
  - finding: VTC-007
    action: upheld
    note: The rationale does not address the cross-board fixture contradictions. Declaring the Prophet labels on
      16-17 as placeholders (proposal.yml:757) does not cover the phase, oscillator and date conflicts on boards
      01, 08, 12 and 14.
  - finding: VTC-008
    action: upheld
    note: 'The chronology confirms the finding: boards 20 and 21 were exported before board 22 was added and were
      not re-exported. The cause is explained, but the boards are still stale, so it remains minor.'
  - finding: VTC-009
    action: upheld
    note: The rationale says MODEL/PRIOR disclosure increases (proposal.yml:738). That makes the small size of those
      tags more important, not less.
  - finding: VTC-010
    action: upheld
    note: C14 'engine-owned EN/ZH read' (RELOCATE) explains why the card has its own language control. It does not
      resolve two competing language controls on one page, so it remains minor.
  - finding: VTC-011
    action: upheld
    note: The rationale does not address the chart's unnamed subject.
  - finding: VTC-012
    action: upheld
    note: The rationale does not address the clipped rails, the heavy light-theme track or the inconsistent primary
      button.
  verdict: BLOCK
