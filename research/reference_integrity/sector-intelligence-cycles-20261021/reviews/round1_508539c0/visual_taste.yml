      series.
    boards:
    - 12-brief-desktop-light-en.png
    - 13-brief-mobile-dark-zh.png
    - 22-brief-desktop-dark-en.png
  - id: VTC-012
    severity: minor
    finding: 'Polish issues: (1) On mobile, the Explore lens rail (主题 cut off, 15) and the Dossier tab rail (跟踪
      cut off, 17) clip at the edge with no overflow cue. (2) In light theme the Timing range track renders near-black
      and heavy (02, 04), and board 17''s black 重试 button departs from the blue primary used everywhere else.'
    boards:
    - 15-explore-rotation-mobile-dark-zh.png
    - 17-dossier-mobile-light-zh.png
    - 02-cycles-desktop-light-zh.png
  strengths:
  - 'Cycles (01–05) is far better than production. All eight production cycles captures show only an empty ''Loading
    the cycle map…'' shell. Both production mobile cycles captures overflow horizontally and have a sheet covering
    the chart. The proposal delivers a complete, dense desk: a stance plus ''clocks disagree'' hero, a four-stat
    strip, a price-over-cycle chart with confirmed-turn triangles and a PRIOR-led leg-end window, a leadership table,
    a leg strip and a per-cell MODEL/PRIOR timing table. This is real visual compression.'
  - It removes the colored top-edge accents that production still has on the lane cards and the Bottoming Watch
    (prod-desktop-*-central). Containers use even neutral borders everywhere, and focus outlines are complete (16
    Micron row, 17, 18 textarea, 05 Done).
  - Production's Bottoming Watch chip pile (three uppercase chips per row) becomes one plain sentence per row (09,
    10), which scans faster.
  - Degradation is designed honestly. The state cards in 06, 07 and 11 spell out what still works, what the user
    can do and how each state is announced. Edge cases (08) count an overdue projection instead of quietly sliding
    it, and show short history as missing rather than zero.
  - The ZH red-up / green-down convention is applied consistently to direction deltas, while stance and status ink
    do not flip (02, 04, 10, 15, 17).
  - The Explore rotation map and the accessible list share one selection, and the dot positions match the list values
    (14). The Dossier facts strip and the 'keep these questions separate' panel with the Prophet view column (16)
    are a clear improvement.
  - Mobile is list-first, with half and full sheets, focus return and a docked landscape scrub readout (05), and
    it clearly beats production mobile.
  - Board 00 defines dark and light as two separate art directions with the same component vocabulary.
  production_preferable_for:
  - 'The cross-sector glance on the Brief: 36 sectors and themes in five graded lanes, each with a score and its
