  text: 'board 41 shows the chip 英文界面截图 beside 生产截图 and 深色主题截图 on the face. boards_manifest.yml row 41 states_shown and the proposal.yml screenshots entry 41 both declare the production crop''s locale as EN, with the theme as dark. (Reviewer A condition 3, verbatim.)'
