  note: 'Minor DEFECT of the record (Reviewer B, upheld and reworded after the rationale; class DEFECT under SIC-ADJ-05 — a false claim in the record): The label appears at design_refs/sector-paper-20261021/cycles_repair/README.md:136, cycles_repair/capture.log:57 (wave-7 header comment) and proposal.yml:1329 (coverage_matrix.wave7_summary), all at 213a91b9. It also appears at proposal.yml:2231 (round-7 mandate comment, re-freeze commit 4356fa60) and in the 213a91b9 commit message. On board 31 the box (16, 82, 374, 116) is the site-nav search input row and the hero title sits at about y 167-190. Board 39 shares the geometry. The face is unaffected, and the cause (rasterization nondeterminism, no EN string change) remains credible. Cure: Correct the four tracked copies to name the region as the global header search-field row (the site-nav search input), keeping the box x 16-374 / y 82-116 at 390 px. The wave-8 commit message records that the 213a91b9 message carries the wrong label. No PNG, deck, builder, CSS or test changes. Cure SIC-V8-VT1 (reworded in pass 2; clause (d) read under SIC-ADJ-06(b)). The seat verified the geometry before accepting it: on board 31 the search field''s placeholder row sits at y 82-115 and the hero title at y 167-190; the recomputed diff against the 78c14f7d bytes is 761 (31) / 752 (39) pixels, max channel delta 1, bounding box (16, 82, 374, 116) on both.'
- finding: PRC-053
  resolution: upheld_revise
  note: 'Minor DEFECT of the record (Reviewer A, upheld after the rationale; class DEFECT under SIC-ADJ-05): The whole-word rule''s documentation is false. _present docstring :155-157 says ''norm keeps an identifier as one word''; :297-299 says ''an identifier substring never satisfies it''; header :9-11 says the same. norm (:140) maps ''_'' and ''.'' to spaces, so snake_case and dotted identifiers split into words whose parts DO satisfy the check. The C02 row itself passes only this way: in window :495-509, ''hit'' and ''rate'' occur only inside dir_hit_rate (:498), _DIR_HIT_RATE_DEFINITION (:506) and pos_rate (:496); the only prose line (:505) carries none of the caption''s fragments. The :155 falsifier also clears on stance_zh as well as nw.stance (:157). The rule rejects substrings of alphanumeric runs (window, stanceHTML, stances), not identifier substrings in general. Cure SIC-V8-C01 (reworded in pass 2 to bind the optional pin: one added test-only assertion with literals; production code, deck and PNGs byte-identical). The seat verified it by running norm: dir_hit_rate -> ''dir hit rate'', nw.stance_zh || nw.stance -> ''nw stance zh nw stance'', stanceHTML(nw) -> ''stancehtml nw''.'
- finding: PRC-055
  resolution: upheld_revise
  note: 'Minor DEFECT of the record filed from the rationale (Reviewer A pass 2, source: rationale; class DEFECT under SIC-ADJ-05): The wave-7 C05 qualifier carries a wrong line citation at the frozen bytes. At 213a91b9:proposal.yml:2190 it reads '':2066 — the round-5 PRC-037 residual, :2061 before the round-7 header lines — reads :1059-1063 from wave 7''. At 213a91b9 the residual is at :2067; :2066 holds a different line. The seat discloses this (re-freeze body 4356fa60; HEAD proposal.yml:2253) and corrected the qualifier at the re-freeze 4356fa60. That correction is after frozen_sha, so it is not part of the approved bytes (SIC-ADJ-04). The corrected HEAD :2190 qualifier SHA-qualifies every line it names (:2056 at 78c14f7d, :2061 at the round-6 re-freeze, :2066 at 90e9682d, :2067 at 213a91b9), so the form is robust. One more detail in the HEAD record: :2253 calls :2190 ''the only other 1060-1063 string'', but :2252 and :2253 themselves contain it (mandate rows quoting the finding). Cure SIC-V8-C03: the wave-8 frozen sha carries the SHA-qualified :2190 form that landed at 4356fa60 (every line number paired with the sha at which it holds; no edit to that note in wave 8), and wave 8 corrects the :2253 proof so it no longer calls :2190 ''the only other 1060-1063 string'' (it is the only hit outside the mandate rows that quote the finding as filed). The wave-8 edits insert nothing above :2067 or :2190, so both positions hold at the wave-8 commit.'
adjudications:
- id: SIC-ADJ-05
  text: 'Termination of the confirmatory loop (authority, 2026-11-02). SIC-ADJ-04 still binds: approval attaches to the bytes the receipts judged, so the round-7 cures land in wave 7 and round 8 re-reads them. Round 8 is the last confirmatory round of this reference unless it finds a DEFECT — a false claim, a wrong citation, a regression on a re-rendered board, a breach of doctrine or of a scientific fence, or a condition not landed as described — in which case REVISE repeats as before. A round-8 note that both critics hold non-binding (polish, wording, advisory hygiene) does not reopen a wave: the authority records it as an implementation-bound condition in approval.yml (the entry-radar-w8 precedent), the approval verdict is APPROVE_WITH_CONDITIONS, and the condition is verified at the production proof (P19-P23) against the built surfaces before acceptance. The rule weakens neither critic''s verdict: an item a critic holds binding is filed as a condition or a BLOCK and the authority cannot reclassify it; the scientific fences (hazard qualified, PRIOR cells, inert sizing, lead-lag STOP) are outside any round''s reach; and no approval receipt is written without the real dual review of the bytes it names.'
- id: SIC-ADJ-06
  text: 'Round-8 application of SIC-ADJ-05 and lane reconciliation (authority, 2026-11-02). (a) Round 8 found three DEFECTs of the record — VTC-048 (a wrong region label in four tracked copies and the immutable wave-7 commit message), PRC-053 (three false docstrings about the deck test''s normalizer) and PRC-055 (a '':2066'' pointer in the :2190 qualifier at the frozen bytes, corrected only at the re-freeze 4356fa60, and a ''the only other'' overstatement at :2253) — so the verdict is REVISE and wave 8 is record/docstring-only: no PNG, boards_manifest.yml, copy_deck.json, build_cycles.py, cycles.css, cycles.html, engine or template byte changes; the one code diff is the SIC-V8-C01 test-only assertion with literals. The frozen PNG set is byte-identical to 213a91b9 and round 9 does not re-review the faces. (b) SIC-V8-VT1 clause (d) (''names no PNG, copy_deck.json, build_cycles.py, cycles.css, cycles.html or test file'') and SIC-V8-C01 (''the only code change is one added test assertion'') are reconciled, not overridden: Reviewer B wrote clause (d) when the seat''s rationale described the other lane''s correction as text-only, before Reviewer A bound the pin in its pass 2. The wave-8 diff names tests/test_sector_paper_copy_deck.py for the product_regression lane only, and that file''s diff is docstrings plus the one literal assertion; clause (d) binds the visual lane''s set — PNG, copy_deck.json, build_cycles.py, cycles.css, cycles.html — which stays unchanged. Round 9 states this reconciliation to both critics in the commission. (c) VTC-049 and PRC-054 are NON-BINDING NOTES both critics hold implementation-bound after the rationale: they are not wave conditions and do not reopen the specimen; they are filed under implementation_bound_notes below in the critics'' pass-2 checkable text (Reviewer B''s recommended VTC-049 text; Reviewer A''s SIC-V8-C02) and become conditions of the approval receipt (approval.yml) verified on the production proof captures (P19-P23) before acceptance. (d) Round 9 is confirmatory and bounded: each critic verifies its own lane''s wave-8 condition (SIC-V8-VT1; SIC-V8-C01 and C03) and the seat-bound SIC-V8-C04 from the diff and the PNG sha256 set, not from the seat''s statement; the quarantine, identities (-r9) and two-pass shape are unchanged. SIC-ADJ-05''s rule repeats unchanged: a round-9 DEFECT revises again; a round-9 note both critics hold non-binding becomes an approval condition rather than another wave.'
