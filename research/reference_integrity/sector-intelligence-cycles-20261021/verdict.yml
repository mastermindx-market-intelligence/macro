  note: 'Upheld after rationale as the blocking major. Same cure as VTC-029 (SIC-ADJ-02 / SIC-V4-C01) plus: each deck stance_* source line must contain the exact string (copy_deck.json:239 cites stage_analysis.html.j2:1497, whose string is ''观察 —— 别追'', not ''观察，别追''); a test pins copy_deck stance_* == DOCTRINE_STANCES and the citation contents; the EN split (''Watch — don''t chase'' vs ''Watch, don''t chase'') closes on the doctrine form docs/DESIGN_DOCTRINE.md:44. The production variants outside this reference (rotation_events.js:200, _ignition_radar_card.html.j2:170, _mag7_tape_strip.html.j2:227) are recorded as declared production drift, not changed by the reference.'
