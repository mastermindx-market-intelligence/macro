  stronger_claims: 'boards_manifest Cycles rows carry one shared wave-4 states_shown bullet: EN rows claim ZH vocabulary, every row lists 做好准备/暂时观望 though Cycles draws only Watch/Protect, rows 32/33/38 cite the allowlist entry as GLP- (VTC-040; PRC-045 / SIC-V5-C04); board 41 (ZH) shows an EN-interface production crop and declares only the theme while manifest row 41 claims ZH deck copy end-to-end (VTC-039, PRC-043); proposal.yml screenshots rows 39/40 carry pre-wave-4 png_px (390x4863, 1440x3348 against the captured 390x5154, 1440x3427) and the board-39 note still names the round-3 single Clocks-disagree state (VTC-042); the HOLD sentence at engine :159-164 / cycles_ia.md:157 / COMPONENTS.md:141 omits the Peak extended-uptrend HOLD override at engine :1060-1063 and the wave-4 PRC-037 proof overclaims it (PRC-037 residual); zh-latin=0 is claimed without stating that <code> tokens are exempt (VTC-035, PRC-045). Seat-disclosed while writing this packet: proposal.yml proposed_artifact.frozen_sha (:21) still reads 1ad748c8 while manifest.yml reads 66829d17 — the 66829d17 re-freeze updated the header comments and the manifest but not this field; the checker''s stale-review-receipt rule exposed it against the round-5 receipts and the round-5 ledger commit corrects it (SIC-V5-C13).'
  intent_vs_convenience: 'Product intent: one engine-owned EN/ZH doctrine vocabulary drawn identically; every clock on a face consistent with the chip or labeled with its own name; records that say only what the boards draw. Convenience, now bound: a three-line drift inventory in place of a census; a probe exemption that is used but not stated; a shared manifest bullet; record rows not refreshed after a re-capture; a re-freeze that moved one sha field and not the other.'
