packet:
  materially_improved: 'At 213a91b9 every round-7 condition holds on the faces and in the records: the two drawn ZH Clocks patterns and their undrawn sibling take the 显示 construction so each Clocks block on 34/35/41 speaks one predicate (VTC-047 / SIC-V7-C04), stance_label cites the line that carries the L(...) pair with stanceHTML opening at templates/sector_cycles.js:158 (PRC-050 / C01), grader_caption cites engine/sector_central_grader.py:498-506 (PRC-051 / C02), the deck test''s EN half matches whole words of the normalized window with two falsifiers and the :155-row deviation stated (C03 outcome (i)), the round-5 residual cites :1059-1063 and the one remaining 1060-1063 quote is SHA-qualified (PRC-052 / C05), and the re-render discipline is proven byte-wise: seven PNG byte changes, 28/29/40 and the 32 other PNGs byte-identical, 31/39 re-encoded at the same png_px with a measured one-channel delta confined to one box (C06). Both critics read the ten re-rendered boards and find no layout regression.'
  materially_worsened: 'Nothing drawn at 213a91b9 is worse than 78c14f7d for either reader: the EN faces are unchanged and the ZH faces carry the wave-7 lines. The records carry three defects of their own: the wave-7 record labels the 31/39 pixel-diff box ''the hero-title band'' in four tracked copies and the immutable wave-7 commit message while the box is the global header search-field row (VTC-048); three docstrings in tests/test_sector_paper_copy_deck.py (:9-11, :155-157, :297-299) claim norm keeps an identifier as one word and an identifier substring never satisfies the check, while norm splits on ''_'' and ''.'' so the C02 grader row clears the EN half through hit and rate inside dir_hit_rate (PRC-053); and at the frozen bytes the :2190 SHA qualifier points at :2066 for the residual that sits at :2067, corrected only at the re-freeze 4356fa60, after frozen_sha (PRC-055). A false claim in a record is a defect under SIC-ADJ-05 even when the face is right.'
  disappeared: 'Unchanged from 78c14f7d: the round-1 disappearances remain deferred and declared; the chart instrument has its labeled home on the composite desks (boards 40/41).'
  behavior_harder: 'Reviewer B: nothing binding. Advisory, implementation-bound: the longer ZH ladder line breaks inside the compound 来源抽屉 on boards 34/35 (…引擎说明见来源 / 抽屉) and 41 (…引擎说明见来 / 源抽屉), which a reader parses as two words (VTC-049); the specimen stays as drawn and production keeps the drawer pointer on one line at 1440 and 390. Reviewer A: the EN whole-word check still accepts 3+ letter function words such as ''not'' as a hit (PRC-054), so a wrong citation one line outside a fixture window could pass; implementation-bound as a stated stopword rule with a falsifier.'
  stronger_claims: 'The wave-7 record claims the 31/39 one-channel delta sits in ''the hero-title band''; the measured box (16, 82, 374, 116) at 390 px is the site-nav search input row and the hero title sits at about y 167-190 (VTC-048; the seat re-measured: 761 / 752 pixels, max channel delta 1, bounding box identical on both boards). The test docstrings claim norm keeps an identifier as one word and that an identifier substring never satisfies the check; norm maps every run outside [0-9a-z一-鿿] to a space, so dir_hit_rate normalizes to ''dir hit rate'' and nw.stance_zh || nw.stance to ''nw stance zh nw stance'' (PRC-053; the seat ran norm). The frozen :2190 qualifier claims the residual sits at :2066; it sits at :2067 (PRC-055), and the HEAD :2253 proof claims :2190 is ''the only other 1060-1063 string'' while :2252-2253 themselves quote the range. Each is corrected in wave 8 as record or docstring text; no face, deck or engine claim changes.'
  intent_vs_convenience: 'Product intent: a record whose every region label, line pointer and docstring is true of the bytes it describes, so a later reader of the receipts and the RIG ledger can re-derive each claim from the tree. Convenience would approve with conditions now, since the faces and the engine pass and every finding is minor and record-only; the authority declines it because SIC-ADJ-05 was written to bind the authority as well as the critics — a round-8 DEFECT revises, and a receipt that approves bytes whose record misnames the one measured pixel-diff region and whose test docstrings state a false rule would have to be read with an erratum forever. Wave 8 therefore changes only record and docstring text plus one literal test assertion, the frozen PNG set stays byte-identical, and round 9 is a bounded record check rather than a fresh visual review.'
  production_preferable_for: 'The chart instrument''s live interaction remains production-only; the composite desks are labeled captures. Production''s ZH stance strings on the rotation, ignition, tape and dossier surfaces remain a declared production fork (COMPONENTS.md:148-151), not a reference defect. The two implementation-bound notes (VTC-049 line-breaking, PRC-054 stopword rule) are verified on the production proof captures (P19-P23), not on the specimen.'
  strongest_argument_against: 'Both critics pass with conditions; the three defects are a mislabeled region in a record, three false docstrings and a line pointer that the re-freeze already corrected, none of which touches a face, a deck string, a PNG or the engine, so an APPROVE_WITH_CONDITIONS at 213a91b9 with the record corrections as conditions would be defensible and would end the loop one round sooner. The authority still revises: SIC-ADJ-05 names a false claim in the record as a defect and the authority does not read its own rule down when the defect is its own; the wave-8 diff is small enough that round 9 costs two bounded read-only passes; and PRC-055 shows the specific hazard of approving at a sha whose record was corrected only after it — the corrected :2190 form is not part of the 213a91b9 bytes, so an approval there would bind to a record the receipts did not judge.'
