  materially_worsened: 'Nothing drawn at 204500aa is worse than 66829d17 for either reader. The records carry three defects of their own: the drift list claims a ZH-only line as a census subset (PRC-046), the HOLD-sentence proofs overclaim what the test asserts and cite :1060-1063 past the :1059 predicate (PRC-047), and the deck''s clock_read source cites lines that carry neither of its strings while the citation test passes on a nearby EN word (PRC-048/049).'
  disappeared: 'Unchanged from 66829d17: the round-1 disappearances remain deferred and declared; the chart instrument has its labeled home on the composite desks (boards 40/41).'
  behavior_harder: 'Reviewer B: nothing binding. Advisory: the ZH clock lines read as stiff X为Y constructions (VTC-043); an XLC card leaves about 280 px of empty height under the desktop 3-up grid (VTC-044, empty-band half after rationale); the methods-card parity chip stretches full width (VTC-045); the word Clocks names both the per-card clock set and the page-level data-session chips (VTC-046).'
  stronger_claims: 'COMPONENTS.md:139 (a subset read from that output) and proposal.yml:2127 claim the eight-line drift list came from the stated census while _mag7_tape_strip.html.j2:227 cannot match it; proposal.yml:2051 and :2133 claim the HOLD test asserts the named cells while it compares a hand-written set; the deck''s clock_read row cites sector_cycles.js:165-166 for strings it does not carry.'
  intent_vs_convenience: 'Product intent: records that say exactly what was measured, a test that fails if the HOLD sentence drifts, and a deck whose every ZH string names its production line or declares itself new. Convenience would approve now with conditions and cure the records in the merge; the authority declines it because approving receipts for bytes that then change is the RIG §3 failure the checker names (stale-review-receipt).'
  production_preferable_for: 'The chart instrument''s live interaction remains production-only; the composite desks are labeled captures. Production''s ZH stance strings on the rotation, ignition, tape and dossier surfaces remain a declared production fork (COMPONENTS.md:148-151), not a reference defect.'
