  behavior_harder: 'Reviewer B: nothing binding. Advisory: one Clocks block phrases the same phase clock two ways — the drawn ladder line (阶段时钟为回落中 · 时序阶梯为上涨趋势——引擎说明见来源抽屉) and read line (周期读数为筑底中 · 阶段时钟为回落中) keep 为 beside the rhythm and hazard lines that say 阶段时钟显示回落中 (VTC-047; boards 34/35, XLF and XLC blocks).'
  stronger_claims: 'The falsifier docstring at tests/test_sector_paper_copy_deck.py:293 claims the :155 row''s EN is near the cited line; it clears the any-fragment check only on an identifier substring (PRC-050). copy_deck.json:272 claims engine/sector_central_grader.py:332 carries dir_hit_rate; it carries the frozen_df window predicate (PRC-051). proposal.yml:2061 places the Peak extended-uptrend override at engine/cycle_ontology.py:1060-1063 with no SHA qualifier, omitting the :1059 condition line (PRC-052).'
  intent_vs_convenience: 'Product intent: a deck citation test whose EN half states its contract and whose falsifier premise is true, deck sources that name the line that carries the string, and one ZH verb construction per Clocks block. Convenience would approve now with conditions and cure the records in the merge; the authority declines it again because approving receipts for bytes that then change is the RIG §3 failure the checker names (stale-review-receipt), and the adopted 显示 construction changes face bytes on the ZH Cycles boards.'
  production_preferable_for: 'The chart instrument''s live interaction remains production-only; the composite desks are labeled captures. Production''s ZH stance strings on the rotation, ignition, tape and dossier surfaces remain a declared production fork (COMPONENTS.md:148-151), not a reference defect.'
