adjudications:
- id: SIC-ADJ-03
  text: 'zh-latin probe scope (VTC-035a/b + PRC-045 / SIC-V5-C04; authority, 2026-11-02). The two critics'' cures are reconciled as one rule: zh_latin_grep.py skips a provenance drawer (<details>) wholesale, so identifiers inside a drawer — in <code> or not — never count; outside a drawer nothing is skipped by tag except nav, script, style, svg, title, head, hidden elements and l-en spans, so a <code> identifier on a face counts as Latin and fails the probe. Every zh-latin=0 claim (the docstring, each capture.log probe line, the boards_manifest rows, the C05 wording) states exactly that scope and lists the allow-file tokens it exempted; the ALLOW regex is unchanged. Identifiers a face must reference (now.phase, phase_v2, dataset keys, the render sha, the capture tool) live in the drawer and the face names the clocks in plain ZH.'
