packet:
  materially_improved: Cycles (boards 01-05) is drawn end to end where production serves an empty 'Loading the cycle
    map…' shell in all eight captures and overflows on mobile. One shell with Brief / Explore / Watches workspaces
    and the Cycles fold (SIC-MAP) replaces two unrelated pages. Containers use even neutral borders with no colored
    edge accents (production still has them on the lane cards and the Bottoming Watch). Degraded, stale, denied
    and error states are designed and announced (boards 06, 07, 11; edge cases 08). ZH red-up / green-down is applied
    to direction deltas only. The rotation map and its accessible list share one selection (14). Mobile is list-first
    with sheets, focus return and a docked scrub readout (05). Board 00 defines dark and light as two art directions
    over one component vocabulary.
  materially_worsened: 'The Brief, the product''s primary surface, turned from a dashboard into a report: boards
    12, 22 and 13 replace the Act-Now lane board (36 sectors and themes in five graded lanes with score and 20d
    vs market) and the 7-item Bottoming Watch with a two-line headline, one unlabeled chart and three GICS sectors
    without stance chips (VTC-001). Five different non-canonical headers are drawn and none is the product nav family,
    which is a third header family against the navigation source-of-truth law and the proposal''s own ''canonical
    nav family only'' line (VTC-002). The glance tier carries internal vocabulary (''21-session relative wealth'',
    ''Source rank 1/2/3'') that production avoided (VTC-004). The regime headline with its inked keyword and the
    weekly handoff, the page''s identity, are gone (VTC-005).'
  disappeared: 'The Act-Now lane board as a drawn object; the Bottoming Watch as a distinct object (it survives
    only as three plain rows mixed into the user''s own saved items on boards 09/10); themes on the first screen;
    a doctrine stance chip per Brief row (the only call drawn, ''Entry posture: Check entry signals'', is outside
    the six stances); the regime headline keyword and the ''This week''s handoff'' pair; the canonical global chrome
    (wordmark, flags, Other Assets, settings, Ask Mastermind, Terminal on mobile) on every board.'
  behavior_harder: Reading all 36 sectors and themes by lane in one viewport now needs a trip into Explore; telling
    a system-generated bottoming candidate from a self-saved symbol needs a second read; reading the Brief chart
    needs inference of whose relative wealth it plots (VTC-011); telling MODEL from PRIOR on the Cycles hazard cells
    is the smallest text on the board (VTC-009); two language controls on one page (VTC-010).
  stronger_claims: 'The boards imply full theme × device × locale coverage through the shell while board 20 itself
    records ''36 drawn, 18 gap, 6 not-on-page'' and board 22 fills only Brief desktop dark (VTC-003); board 21 claims
    ''22 boards in this set'' (VTC-008). ''Entry posture: Check entry signals'' is a call the doctrine does not
    define. No stronger quantitative or predictive claim is made: hazards stay MODEL/PRIOR-tagged, sizing stays
    inert, no lead-lag claim appears.'
  intent_vs_convenience: 'Product intent: the three-workspace IA, the Cycles fold, the state matrix, the stance-chip
    and MODEL/PRIOR vocabularies, the ZH direction convention, list-first mobile. Convenience: the undrawn lane
    board (SC-001..SC-008 marked RETAIN with ''no dedicated R3 board'' because the Paper file hit its size limit
    and writes froze); the non-canonical headers (each board author drew a header rather than binding the shared
    family); the 18 undrawn coverage cells and the 8 deleted duplicate boards (Paper capacity); the internal metric
    names on the glance tier (copied from engine field names rather than the copy deck).'
  production_preferable_for: 'The cross-sector glance (36 rows in five lanes with score and 20d vs market, plus
    the Bottoming Watch, in one viewport); the regime headline and weekly leadership handoff as the page''s identity;
    themes on the first screen; global chrome identity and reach as judged on the drawn boards; plain Tier-1 wording
    (''20d vs market''). ''None'' is not arguable at this frozen_sha: on SC-001..SC-007 production draws what the
    reference only claims to carry.'
  strongest_argument_against: 'The reference does not draw the product''s main object on its primary surface. Approving
    it would make the canonical reference less complete than the production it replaces on the core rows SC-001..SC-007,
    and would legitimize a third header family that the navigation law forbids. With Paper writes frozen at the
    file-size limit, the repair has not been drawn anywhere yet, so there is nothing to approve with conditions:
    the honest verdict is REVISE.'
