conditions:
- id: SIC-V6-C01
  text: 'in components/COMPONENTS.md''s Production drift record, templates/_mag7_tape_strip.html.j2:227 carries a marker. The marker says the line is a ZH-only rendering outside the stated census under the record''s own scope rule, confirmed by direct read, and declared in round 4 (PRC-036). The ''subset read from that output'' claim names only the seven same-line entries. The proposal.yml revision_mandate_round5 PRC-042 proof states the same split. The census command, the count (298) and the commits are unchanged. (Reviewer A condition 1, verbatim.)'
- id: SIC-V6-C02
  text: 'the HOLD sentence cites engine/cycle_ontology.py:1059-1063 identically in the engine comment, cycles_ia.md:157 and components/COMPONENTS.md:163. test_hold_sentence_is_identical_and_true asserts the fragment ''trend_up and phase == "Peak"'' within the cited range. It also asserts that the whitespace-folded sentence contains ''every RALLY ON row'', ''Recovery × TOP WATCH'' and ''BOTTOM WATCH / TURN SIGNALED / FRESH BUY''. The hand-written expected HOLD set stays as the independent second check. The proposal.yml PRC-037 proofs (revision_mandate_round5 and the round-4 bracketed annotation) cite :1059-1063 and describe only what that test asserts. (Reviewer A condition 2, verbatim.)'
- id: SIC-V6-C03
  text: 'copy_deck.json cycles.clock_read''s source begins with a file:line citation (templates/sector_cycles.js:164-165) that carries ''cycle read'', so is_note() does not skip the row. The same source then declares the ZH 周期读数 NEW, with its SIC-V3 provenance. No face string changes. (Reviewer A condition 3, verbatim.)'
- id: SIC-V6-C04
  text: 'test_cited_sources_carry_a_fragment fails any cited (non-note) row whose ZH has no fragment in the cited window, unless the row''s source explicitly declares the ZH NEW or gives the ZH a separate file:line that carries it. The test passes on the full deck after that rule is applied. (Reviewer A condition 4, verbatim.)'
- id: SIC-V6-C05
  text: 'copy_deck.json cycles.hazard_mismatch_pattern (:177) and cycles.rhythm_mismatch_pattern (:178) ZH take a verb or colon construction in place of {a_name}为{leg} / {a_name}为下一拐点{turn} (e.g. 风险时钟：向上段，趋向顶部 · 阶段时钟显示回落中，下一拐点为底部; 节律时钟显示下一拐点为顶部 · …); EN patterns unchanged; the ZH boards show the new lines. (Authority-adopted from Reviewer B advisory VTC-043, which the critic holds non-binding; bound here so round 7 verifies it.)'
