  text: 'Exactly one of the following holds in tests/test_sector_paper_copy_deck.py at the wave-7 tree, and the wave-7 proof says which. (i) EN fragments match whole words (word-boundary regex or token equality) in row_gaps/test_cited_sources_carry_a_fragment; every deck row passes after the C02 cure; and the falsifier asserts the :155-misattributed stance_label row fails the EN half as well as the ZH half. (ii) Substring matching is kept; the docstring of test_cited_sources_carry_a_fragment states that EN matching is substring-based and that an identifier substring (example: ''stance'' in stanceHTML) can satisfy it; and the falsifier docstring states it discriminates on the ZH half only. (Reviewer A condition 3, verbatim; the deck path is design_refs/sector-paper-20261021/copy_deck.json. Authority election, 2026-11-02: outcome (i), whole-word EN matching — the seat''s read-only survey at 78c14f7d finds every cited deck row still carries a whole-word EN hit after the C02 cure and that the rule also catches the PRC-051 shape (at the :332 citation only the substring win inside window matched). The same survey finds that the :155-misattributed stance_label row still passes the EN half under whole-word matching, because templates/sector_cycles.js:157 carries stance as a whole token (nw.stance); if the wave-7 implementation confirms this, clause (i)''s EN-half assertion cannot be made true on that row, so wave 7 keeps the :155 row as the ZH-half falsifier with a docstring that says exactly why its EN half passes, and adds a second falsifier on a row that fails the EN half under whole-word matching (grader_caption cited at engine/sector_central_grader.py:332, the PRC-051 shape); the wave-7 proof states this deviation from clause (i)''s row choice and round 8 judges it. If the implementation finds otherwise, the :155 row carries the EN-half assertion as clause (i) says.)'
