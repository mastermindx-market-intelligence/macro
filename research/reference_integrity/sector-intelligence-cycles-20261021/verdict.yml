  text: 'In the verdict-9/approval commit, ledger-only: correct proposal.yml:2283 in place from ''2260'' to ''2259'', and append at EOF a revision_mandate_round9 PRC-056 row recording proposal.yml at 2259 lines at 4356fa60 and 4161d404 and 2295 at 2c55ac13 (+36 at EOF). The row names commits 4161d404 and 2c55ac13 as carrying the false figure 2260 in immutable messages, and states that nothing was inserted above :2067 or :2190 (every hunk of git diff 4356fa60 4161d404 -- proposal.yml is equal-count). No PNG, design_refs, test, engine or template byte changes; frozen_sha stays 4161d404. Verified at P19-P23 by readback: git show <sha>:proposal.yml | wc -l prints 2259 at 4356fa60 and 4161d404 and 2295 at 2c55ac13; git grep -n ''2260'' on the ledger at the approval commit outside reviews/** prints only the 1440x2260 pixel-height lines (:306, :311, :1329, :2232) and the round-9 row''s own quotation.'
- id: SIC-V8-C02
  text: 'At the production proof (implementation-bound in approval.yml), the deck EN check names its form: either (a) a stopword list stated in the test is excluded from EN fragments, or (b) each cited row needs at least one whole-word hit outside that stated list. A falsifier asserts that a row whose only whole-word EN hit is a listed stopword fails: grader_caption cited at engine/sector_central_grader.py:331, window :328-334, where only ''not'' (:328) matches. Every cited deck row still passes. (Reviewer A condition 2, pass 2 verbatim; class NON-BINDING NOTE. Finding: fragments (:164-171) via en_words (:143-144) keeps 3+ letter function words (not, all, the, over, and), so the EN any-fragment check can pass on a stopword. Fixture 1 is one line from that: citing :331 (window :328-334) would add ''if col not in'' (:328), and ''not'' would clear the stale grader row. Carried to approval.yml as an implementation-bound condition under SIC-ADJ-05 / SIC-ADJ-06(c); wave 8 does not touch fragments / en_words.)'
- id: SIC-V8-VT2
  text: 'On every ZH Cycles surface that renders cycles.ladder_state_pattern (each sector card''s Clocks block), the drawer pointer — 来源抽屉, or 抽屉 if the production copy source adopts the shorter tail 引擎说明见抽屉 — never breaks across lines at viewport widths 1440 and 390; verified on the production proof captures (P19-P23) before acceptance. (Reviewer B''s recommended text, pass 2 verbatim; outcome text, not mechanism — the implementer chooses a no-break span, keep-all on the pointer, or the shorter tail. Finding: Boards 34/35 (XLF Clocks, …引擎说明见来源 / 抽屉) and board 41 (desk XLF, …引擎说明见来 / 源抽屉). The seat confirms both breaks. Carried to approval.yml as an implementation-bound condition under SIC-ADJ-05 / SIC-ADJ-06(c); the specimen is not re-rendered.)'
- id: SIC-APR-01
  text: 'Re-carried predecessor obligation R3C-HEATMAP-LEGIBILITY (continuity.yml row re-dispositioned SUPERSEDED by this receipt — not extinguished; RIG §13.1; SIC-ADJ-07(d)). Binding at P19-P23 on the built surface before acceptance: the composited-background contrast determination of the heatmap colour-field glyphs on the LIVE built surface (P19/P20 browser proof, both themes, 1440 and 390, measured on the painted substrate — never a flat-surface substitute); UNMEASURED stays UNMEASURED until that determination exists, and failure blocks release. Carried obligation, verbatim from continuity.yml: CARRIED_BLOCK: the heatmap legibility condition needs a composited-background contrast determination on the LIVE candidate (P19/P20 browser proof); the R3 boards 14-15 redraw the map with a list alternative but a design export cannot discharge a rendered-contrast condition. No D/I/P lane resolved it.'
- id: SIC-APR-02
  text: 'Re-carried predecessor obligation R3C-AUTH-PREMIUM (continuity.yml row re-dispositioned SUPERSEDED by this receipt — not extinguished; RIG §13.1; SIC-ADJ-07(d)). Binding at P19-P23 on the built surface before acceptance: real auth settlement on the served surface at P19-P21 — free / essential / pro hydrate, /premiumdata/sector_central.json authorization, successful hydrate, preview preservation for the ungated state, and the 401 / 403 / offline / malformed paths, each observed in the browser; the 2026-10-21 anonymous-shell captures (401 on every data asset) do not discharge it. Carried obligation, verbatim from continuity.yml: CARRIED_BLOCK: auth/premium settlement (free / essential / pro hydrate, /premiumdata 401/403/offline) is a P19-P21 live-surface proof; the 2026-10-21 captures are anonymous shells that returned 401 on every data asset, which demonstrates the gate exists but not its settled behaviour. Boards 11 and 20 draw the no-access cells only.'
- id: SIC-APR-03
  text: 'Re-carried predecessor obligation R3C-TIME-MACHINE (continuity.yml row re-dispositioned SUPERSEDED by this receipt — not extinguished; RIG §13.1; SIC-ADJ-07(d)). Binding at P19-P23 on the built surface before acceptance: live Time Machine end to end on the served Dossier Record / Time Machine / Methods home (rows R3A-35/58/89): manifest, episode feed, per-period and per-year chunks, and the empty, missing and failure paths, as the P15 history-depth proof; recorded-not-executed evidence is not production proof. Carried obligation, verbatim from continuity.yml: CARRIED_BLOCK: the live Time Machine condition belongs to the Dossier Record / Time Machine / Methods home (rows R3A-35/58/89) which has no dedicated R3 board (sic-p-rev major) and no production capture beyond the shell; discharge requires the P15 history depth proof on the served surface.'
- id: SIC-APR-04
  text: 'Re-carried predecessor obligation R3C-VALIDATED-21D (continuity.yml row re-dispositioned SUPERSEDED by this receipt — not extinguished; RIG §13.1; SIC-ADJ-07(d)). Binding at P19-P23 on the built surface before acceptance: the released build (P21) renders the 21d window without the customer word ''validated'' in the forward-track-record wording on the served EN and ZH surfaces, while preserving the narrower disclosure ''Context only · evidence proven at 5d · never sizes decisions'', its native ZH twin and the visual separation from explicitly labelled 21d figures. Carried obligation, verbatim from continuity.yml: CARRIED_BLOCK: the banned word is absent from all 22 R3 boards (ORCH-PAPER copy sweep: 0 occurrences) and B13 reframes the grader denominator, but the condition binds the SERVED surface wording; it is discharged only when the released build (P21) renders the 21d window without that word. Not resolved by a design file.'
- id: SIC-APR-05
  text: 'Re-carried predecessor obligation R3C-NO-UNSUPPORTED-INVENTION (continuity.yml row re-dispositioned SUPERSEDED by this receipt — not extinguished; RIG §13.1; SIC-ADJ-07(d)). Binding at P19-P23 on the built surface before acceptance: re-judgment at P19 against the build: no invented signal, sizing, correction marker, local rank / state / score, or Baskets thin/gateable disclosure (SC-066 / SC-092 stay BLOCKED_DATA; the Prophet placeholder labels of boards 16-17 remain declared placeholders in the build or are bound to real producer contracts; PARITY_FAILS stays disclosed, not repaired). Carried obligation, verbatim from continuity.yml: CARRIED_BLOCK: no board invents a signal, sizing, correction marker or Baskets disclosure (SC-066 / SC-092 stay BLOCKED_DATA; Prophet labels on boards 16-17 are declared placeholders; PARITY_FAILS is disclosed, not repaired). The condition is re-judged by the two independent reviewers against the frozen artifact and again at P19 against the build.'
