  text: 'the stance-chip drift paragraph in components/COMPONENTS.md (currently :128-136) contains no count word (''three'') and no completeness claim. It states the exact census command, its matched line count and the commit SHA it was run at, and the count reproduces at that SHA. It calls the census a candidate census that only matches same-line EN/ZH pairs. It lists, by file:line with the ZH string, at least: rotation_events.js:200, _ignition_radar_card.html.j2:170, _mag7_tape_strip.html.j2:227, market_structure.html.j2:563, _prophet_receipts.html.j2:137, china_altdata.html.j2:227 and dashboard.html.j2:7852. It states that 观望 renders the Watch stance on live production surfaces, so 观望 meaning Watch and Stand aside is a production fork owned by those surfaces and outside this reference. No production template is changed. (Reviewer A condition 1, verbatim.)'
- id: SIC-V5-C02
  text: 'the HOLD sentence names the Peak extended-uptrend override (trend_up × Peak × ladder in BOTTOM WATCH / TURN SIGNALED / FRESH BUY, note_key extended_uptrend, engine/cycle_ontology.py:1060-1063) alongside every RALLY ON row and Recovery × TOP WATCH. The sentence is identical in the engine comment (currently :159-164), cycles_ia.md:157 and components/COMPONENTS.md:141. The proposal.yml PRC-037 proof cites those lines and no longer claims more than they say. (Reviewer A condition 2, verbatim.)'
