  text: 'every zh-latin=0 claim (the zh_latin_grep.py docstring, each capture.log probe line, the boards_manifest rows and the C05 wording) states the skipped tags, including <code>, and lists the exempted tokens. The board 41 face caption names both clocks in plain ZH, with now.phase and phase_v2 only in <code> inside the drawer. boards_manifest.yml rows 32 and 33 describe the allowlist entry as GLP-1, not GLP-. The ALLOW regex at zh_latin_grep.py:16 is unchanged. (Reviewer A condition 4, verbatim.)'
