  text: 'the page-level data-session family moves to data vocabulary bound in copy_deck.json: the events/fragmentation chips name their data (Events data · aligned / 事件数据 · 一致 and the fragmentation equivalent), cycles.aligned_qualifier (:249) becomes Data sessions aligned on the history day {d}; not current under this banner / 数据交易日在历史日 {d} 一致；在此横幅下并非当前, and the boards_manifest tag rotation clocks aligned (fresh) becomes rotation data aligned (fresh); no clock / 时钟 / 对齐 term survives in that family; the per-card Clocks block keeps its name; nothing user-facing is typed in build_cycles.py. (Authority-adopted from Reviewer B advisory VTC-046, which the critic holds non-binding; bound here so round 7 verifies it.)'
