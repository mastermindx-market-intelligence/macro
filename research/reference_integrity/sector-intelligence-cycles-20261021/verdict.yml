  note: 'Upheld as a blocker (both passes). Cure adjudicated in SIC-ADJ-02 and bound as SIC-V4-C01: the engine DOCTRINE_STANCES zh strings become the production strings, the deck equals the engine, no doctrine ZH equals any STANCES[*].zh and the Watch string contains no 观望; boards 30/34/35/36 and 38 re-rendered. Reconciled with PRC-036.'
