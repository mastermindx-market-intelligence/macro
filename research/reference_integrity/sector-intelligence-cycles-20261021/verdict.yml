adjudications:
- id: SIC-ADJ-02
  text: 'ZH doctrine vocabulary (VTC-029 + PRC-036; authority, 2026-11-02). The six doctrine stances are one EN/ZH set owned by engine DOCTRINE_STANCES and drawn identically on every face (Cycles chips, Brief lanes, any future surface). ZH values are the production strings: get_ready 做好准备 (templates/china_altdata.html.j2:227; portfolio.js:1241; watchlist_risk.js:494), watch 观察 —— 别追 (templates/stage_analysis.html.j2:1497), protect 保护利润 (stage_analysis.html.j2:1499), aside 暂时观望 (stage_analysis.html.j2:1500; _market_regime_strip.html.j2:8; _unified_dashboard_hero.html.j2:137), ignore 忽略 (options.html.j2:3630); act 行动 stays declared NEW because production has no Act string. EN values are the doctrine line docs/DESIGN_DOCTRINE.md:44 verbatim (Watch — don''t chase, with the apostrophe as the doctrine prints it; production :1497 uses the typographic apostrophe and is declared a variant). Rules: no doctrine ZH string equals any STANCES[*].zh (WAIT 观望, GET READY 准备, AVOID 回避, TRIM 减仓, …), the Watch string contains no 观望, and 暂时观望 is admitted because it is the production Stand-aside string and differs from the engine WAIT word, which remains drawer-only under its ''Resolved stance · engine'' label. copy_deck stance_* rows equal DOCTRINE_STANCES and every source line contains the exact string (test tests/test_sector_paper_copy_deck.py). The production variants that differ from the doctrine (rotation_events.js:200, _ignition_radar_card.html.j2:170, _mag7_tape_strip.html.j2:227) are outside this reference and recorded as declared production drift for the P14-P18 port, not changed here.'
- id: SIC-ADJ-01a
  text: 'Addendum to SIC-ADJ-01 (PRC-037; authority, 2026-11-02; no reversal). The non-divergent Recovery/Expansion/Peak × RALLY ON cells (cycle_ontology.py:245-247) resolve to HOLD and knowingly carry the doctrine stance Watch — don''t chase in warn ink. Rationale: the doctrine has no ''hold'' word; HOLD means keep what you own and issue no fresh entry; for a reader without a position the honest doctrine stance is don''t chase, for a holder it is watch; an ok-ink stance (Act / Get ready) would invite an entry the engine does not issue, and a muted one would deny a position the engine keeps. The warn ink is therefore the intended rendering, not a tone contradiction; the module assertion and test :991 record it as admissible. The SIC-ADJ-01 premise that cited :188 and :972 is corrected to the actual cells (:252 and :1035-1041 are the commented don''t-chase cells; :245-247 are the clean-rally cells).'
