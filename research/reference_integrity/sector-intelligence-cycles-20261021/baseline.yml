user_job: >
  A US-equity investor running one sector investigation on one desk: open the Brief, read which
  sectors and themes deserve attention now and why, move to the rotation map or ranked list, open
  a sector Dossier, read its cycle phase / position / measured phase age / rhythm and the qualified
  hazard context, inspect dated members and reach a stock, Prophet or the Screener with the dated
  ETF context, save the investigation or write a grounded Research note through the existing
  owners, and return to where the investigation started -- with every number, state, clock,
  session, universe, route and access boundary faithful to the canonical producers, and with
  historical qualified hazards, PRIOR cells, inert sizing and the lead-lag STOP preserved as
  disclosed context, never as sizing or execution authority.

core_interactions:
  - "Brief (Overview): scan the Act-Now lanes and Bottoming Watch, open a real row, reach the grader / track record with its honest denominator (Neutral rows counted, hit rate is not a win rate)"
  - "Rotation (Map / list): read quadrant placement for the dated session the producer actually stamped, select a group, use the list alternative, reach the Dossier"
  - "Dossier (sectors/<TICKER>.html): read phase / position / measured phase age / rhythm, the hazard parity disclosure, dated membership (membership-effective vs observation date), relations"
  - "Cycles: read the cycle chart and table across sectors, open Cycle DNA, compare rhythm (descriptive) against MODEL / PRIOR cells, see stale / other-generation / partial / corrected / abstained / error / empty states as the producer reports them"
  - "Stock / Prophet / Screener: leave to us_stocks.html with the dated ETF context visible and no auto-applied filter; the loaded population is stated honestly"
  - "Research + Watches: write a grounded note with read-back of subject / question / snapshot / observation date / evidence mode / origin (composer never auto-saves; unsaved text survives a language switch); save a sector investigation through the existing watch/save owner with account isolation (symbol saves are not condition alerts)"
  - "Return: restore the origin view, selection and scroll position after every excursion; language and theme switches preserve state"

information_hierarchy:
  - "which workflow answers the current question (Brief / Rotation / Dossier / Cycles / Research / Watches -- six workflows, one shell, canonical nav family only)"
  - "the one dominant object per workflow (Act-Now board / rotation map or list / Dossier facts strip / Cycles chart+table / composer / saved list)"
  - "source-status framing beside it: as-of session + clock, generation compatibility, coverage, MODEL vs PRIOR vs descriptive-rhythm semantics, correction state only where the producer emits one"
  - "a clear deeper path (members, stock, Prophet/Screener, Time Machine, track record) and an always-visible return path"

