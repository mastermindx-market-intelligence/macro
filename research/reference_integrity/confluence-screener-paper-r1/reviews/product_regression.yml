        The corrected 'Preserved truth contract' (REVEAL_REFERENCE.md lines 42-54) still lists per-combo occurrence/last-seen but never the page-level as-of or provenance line, and ledger.occurrence_freshness RETAIN is scoped to the per-rank receipt, so nothing carries production's 'SETUP TAPE · 2026-09-21' hero eyebrow or 'Data as of 2026-09-21 · large-cap US universe · updated daily.' (template lines 226, 441). The footer slot in all eight cells instead holds process text ending 'RIG approval and browser proof still required' (proposal/light-en-desktop.jpg y≈986); REVEAL_REFERENCE.md line 84's disclaimer that these files do not approve anything explains why that sentence exists but not why it occupies the customer-facing provenance slot of a reference implementers will build from.
    - finding: PRC-013
