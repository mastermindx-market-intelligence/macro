second_pass:
  amended_at: "2026-09-25T12:32:48.108Z"
  amendments:
    - finding: PRC-001
      action: downgraded
      severity_after: major
      note: >-
        Two real constraints move this. REVEAL_DECISION.md §5 makes the literal question 'Which names line up across the signal stack today?' now-protected structural law and §4 item 1 defines the composition as a 'question/answer header'; the question is also verbatim baseline.yml:26-29 user_job, so the headline change is lawful and I do not judge that law wrong. REVEAL_PROPOSAL.yml hero.current_answer RETAIN adds a constraint I could not see — 'runtime count remains data-bound, never hardcoded by the reference' — so 'Active setups · runtime count' is a deliberate non-invented slot, not a deletion. Upheld at major on the residue the rationale does not reach: the law requires an answer as well as a question, and in all eight cells the answer slot renders at grey secondary-chip weight against production's 32px hero (`.hero-state`, template line 75), so task.scan_now's EQUIVALENT grade overstates a hierarchy change the pixels show as a demotion.
    - finding: PRC-002
      action: downgraded
      severity_after: major
      note: >-
        REVEAL_DECISION.md §4 item 3 authorizes 'ranked evidence rows/cards' and item 5 makes the entitlement transformation a first-class composition element, so grouping ranks 2-3 at the paid boundary is lawful structure, and auth.rank ('presentation filters may not rerank') is warranted — order and rank authority genuinely survive. REVEAL_PROPOSAL.yml information_economics also supplies a principled reason for the density asymmetry: 'Paid rows remain more information-dense ... because public evidence may not disappear merely because ticker identities are gated.' But the disposition's own words are 'Ranked result cards #1..#3', which the frozen pixels contradict (#1 is a card, #2/#3 are table rows in a separate dashed container, proposal/dark-en-desktop.jpg y≈640-750), and routing density to the taste critic does not dispose of it: scanning the ranked three is baseline core_interaction 1, so like-for-like comparability is a product-regression question, upheld at major.
    - finding: PRC-003
      action: downgraded
      severity_after: major
      note: >-
        The corrected rationale carries the datum and the pixels confirm it: ledger.validation_pair IMPROVE states 'compact mobile receipts wrap rather than drop either era', and both eras plus sample basis are in fact present on every rank and viewport ('recent runtime · runtime mo/fires · older runtime · runtime mo/fires' in proposal/dark-en-mobile.jpg and light-en-mobile.jpg; '近期 runtime ... 较早 runtime' in the ZH mobile cells), so my pass-1 characterisation of a dropped era is corrected to a demoted era and the blocker does not stand. Upheld at major because baseline ledger.validation_pair is about comparison, not presence — 'instead of seeing one flattering rate' — and a 20px green mono recent hero against a 9px grey older token inside a wrapped run is not a comparable pair; task.compare_evidence EQUIVALENT is therefore unwarranted on the strength of presence alone, and this is not purely a taste question the packet can route away.
    - finding: PRC-004
      action: downgraded
      severity_after: major
      note: >-
        REVEAL_PROPOSAL.yml honesty.guidance IMPROVE describes exactly the observed pattern with a real justification — 'Moves the warning earlier while keeping the full production guidance visibly reachable' — and both halves check out in the pixels: the hero carries 'Evidence is not a trade instruction' / '证据用于筛选与研究，不自动成为交易指令' earlier than production's footer block, and proposal/honesty-open-dark-en.jpg preserves all five production explanations intact. REVEAL_DECISION.md §4 item 7 requires a 'methodology/honesty disclosure' without mandating an always-open one. Upheld at major only for the interaction regression itself: production prints all five bullets unavoidably in every cell including 390px (template lines 403-417), and 'visibly reachable' behind 'Open guidance ›' is not visible, with the compact summary reduced to the off-doctrine 'Leads ≠ proof' glyph run on the plain-language glance tier.
    - finding: PRC-005
      action: downgraded
      severity_after: major
      note: >-
        REVEAL_REFERENCE.md line 28 and auth.market_values supply a legitimate constraint — the fixture uses runtime/DEMO placeholders 'rather than inventing market facts' — so the absence of real tickers is correct practice, not dishonesty. But the corrected packet's own words defeat its EQUIVALENT grade: task.use_free_match says rank 1 'reserves actual links for implementation', which concedes the reference does not specify the screener's only free click-through, while access.rank1_free_tickers RETAIN simultaneously claims a 'Matching now row with public ticker links' that proposal/dark-en-desktop.jpg y≈581 does not show — one static 'DEMO representative only' chip, and a bare 'DEMO' on mobile. Downgraded from blocker because the slot and its label exist and proposal/entitled-hydration-dark-en.jpg demonstrates the multi-chip pattern ('DEMO', 'DEMO-2'), giving implementers a workaround the rank-1 row itself never provides.
    - finding: PRC-006
      action: upheld
      severity_after: major
      note: >-
        Unmoved, and the corrected packet weakens rather than strengthens its own position: authority_delta auth.trade still asserts direction 'equal', warranted true, but its evidence pointer is now 'proposal/honesty-open-dark-en.jpg' — an EN-only specimen — so the ZH trade-disclaimer gap is entirely unevidenced, while task.mobile_bilingual EQUIVALENT claims the ZH cells preserve 'the same evidence/state grammar'. The pixels show no 仅供参考，非投资建议 in any ZH cell (proposal/dark-zh-desktop.jpg, light-zh-desktop.jpg, dark-zh-mobile.jpg) against EN's 'Context, not investment advice', and production emits the l-zh disclaimer unconditionally (template line 442). REVEAL_DECISION.md §3 and §5 require preserving locale truth, so the protected law reinforces this finding instead of resolving it.
    - finding: PRC-007
      action: upheld
      severity_after: major
      note: >-
        REVEAL_PROPOSAL.yml add.state_contract now asserts flatly that 'Focus/focus-visible, hover, expanded/open and disabled treatments are represented' and REVEAL_REFERENCE.md line 74 repeats it for 'the primary matrix'; the frozen pixels show those claims hold only for the EN half — ZH desktop carries four state tiles with no 禁用/DISABLED and three filter chips with no 重置/Reset (proposal/light-zh-desktop.jpg y≈305 and y≈757 against proposal/light-en-desktop.jpg y≈392 and y≈870). An assertion of parity that the frozen bytes contradict does not move a finding, and the four labels for one control (All · focused / All · focus-visible / 全部 · 焦点 / 全部 · 键盘焦点) still show eight cells that are not one governed composition.
    - finding: PRC-008
      action: downgraded
      severity_after: minor
      note: >-
        The protection resolves the scope-creep charge and I judge the law sound, not wrong: REVEAL_DECISION.md §4 item 2 makes 'filter controls that change the candidate view without changing evidence truth' part of the protected ranked_screener identity and §5 lists filter states as MUST-preserve, while add.presentation_filters bounds them correctly ('may not change deterministic rank, producer eligibility, or access truth ... RIG may reject this addition without affecting the rest of the reference') — a deliberate refusal to mint a second authority. state.global_zero RETAIN keeps filter-empty 'a distinct state' and the pixels honour it ('never imply zero signals globally' / '不等于全局为零'). Residual minor only: filtering a set the builder hard-caps at three rows (build_confluence_screener.py:118) returns little to the user while its main observable effect is manufacturing a second, visually similar empty state.
    - finding: PRC-009
      action: upheld
      severity_after: major
      note: >-
        The TF half is withdrawn on genuine constraint: REVEAL_DECISION.md §5 and §7 require the reference to prove three-leg tolerance 'without minting a special third-leg semantic' and REVEAL_REFERENCE.md lines 28/49 define TF as a neutral layout-capacity label, which is the correct answer to that law and which I could not have known. The flattening half is upheld at major against direct contradiction: ledger.signal_legs RETAIN claims leg rows 'stay explicit on every rank and locale' and task.read_signal_stack grades EQUIVALENT because 'Every refreshed rank exposes D/W runtime-leg capacity', yet on 2 of 3 ranks in all eight cells the legs are inline prose inside the wrapping meta run ('D · runtime leg · W · runtime leg · TF · runtime leg', proposal/dark-en-desktop.jpg rows #2/#3) rather than the enumerable `.leg` rows of template lines 302-317.
    - finding: PRC-010
