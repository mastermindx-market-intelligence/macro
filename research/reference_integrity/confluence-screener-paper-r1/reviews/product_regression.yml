      severity_after: minor
      note: >-
        The corrected rationale identifies a real improvement I under-credited: access.rank23_no_leak IMPROVE makes the server boundary legible 'without fake blurred or placeholder ticker names', and the pixels carry an explicit count-only statement — 'Combo identity, legs + validation stay public · only matching ticker identities unlock' / '组合身份、信号腿和验证结果保持公开。仅当前匹配股票身份需解锁' — plus 'Tickers locked'. task.respect_paid_boundary BETTER is warranted on the evidence. Residual minor: that explanation now appears once per group rather than once per row, so a user landing on row #3 alone sees only 'runtime matches' and 'Unlock tickers →' where production gave each gated row its own reasoned lock panel.
    - finding: PRC-014
      action: upheld
      severity_after: major
      note: >-
        The rationale reassigns the proof burden without discharging it: parity.mobile_no_horizontal_scroll RETAIN and REVEAL_REFERENCE.md line 76 both defer no-horizontal-overflow to separate browser proof, which is a fair boundary but means the reference cannot be credited with that capability at all. Nothing in the corrected packet addresses the design question — 60-75 character real combo labels ('Weekly reclaims 100-day line + weekly RSI stack curls up + RSI-21 washed out', production/dark-en-desktop.png rank 02), unbounded active_tickers, and variable leg_indices depth (build_confluence_screener.py:126-137) against a single-row composition whose every placeholder is the 25-character 'runtime combination label' — and information_economics now openly concedes 'paid rows become visibly denser', which raises rather than answers the overflow question.
    - finding: PRC-015
      action: downgraded
      severity_after: minor
      note: >-
        The corrected reachability clause is a binding constraint that the pixels satisfy: ledger.wins_per_10 RELOCATE requires it 'Visible in the refreshed evidence receipt on rank 1 and ranks 2–3 across desktop and mobile ... without moving it behind entitlement', and 'wins/10 runtime' is present on all three ranks in all eight cells. baseline.yml marks this capability supporting rather than core, so an authorised relocation that preserves the datum and keeps it public is legitimate; only the pre-attentive segmented-bar form (`.w10`, template lines 33-37) is lost, which is polish.
    - finding: PRC-016
      action: upheld
      severity_after: minor
      note: >-
        ledger.random_baseline_consistency RETAIN claims the edge and cross-era evidence 'remain public evidence on every rank', which the pixels support as tokens ('Δrandom runtime pp · cross-era runtime'), but the finding is about the branches that are never drawn. The three governed specimens (REVEAL_REFERENCE.md lines 32-38) cover global zero, entitled hydration and open honesty only, so the two negative states the template renders — 'older years didn't back it up' and 'Hasn't beaten random entry in the recent half' (template lines 343-357) — still have no specified appearance anywhere in the candidate.
    - finding: PRC-017
      action: upheld
      severity_after: minor
      note: >-
        The corrected access.entitled_hydration RETAIN is scoped narrowly to identities — the specimen 'keeps public evidence fixed and reveals only DEMO ticker identities after the protected-payload boundary' — and cta.paid_continuation RETAIN covers only the rest-state CTA, so neither disposition claims or carries the post-hydration transform of that CTA ('Paid view unlocked' / 'All matching stocks available to your plan are visible above.' / 'Open Mastermind →', template lines 552-573), nor the hydrated-but-empty fallback (lines 542-547). Both remain unrepresented in proposal/entitled-hydration-dark-en.jpg.
    - finding: PRC-018
      action: upheld
      severity_after: minor
      note: >-
        ledger.occurrence_freshness RETAIN asserts the context 'remains in the evidence receipt on every rank', and the tokens are indeed present ('seen runtime · ~runtime/yr · last runtime'), so nothing is deleted. Upheld at minor because the finding was about placement, which the rationale confirms rather than rebuts: production gives each card a labelled line directly under the title ('Seen 1254 times since 1965 · about 20.4 a year · last 2026-09-18', template lines 279-284), the candidate puts the same three facts eighth in a grey middot run, and per-row history depth and recency stop being scannable.
    - finding: PRC-019
      action: upheld
      severity_after: minor
      note: >-
        auth.market_values ('weaker', warranted) correctly explains why no literal 245 is printed, and I accept that constraint, but it does not explain the loss of the binding site: proposal/honesty-open-dark-en.jpg rewrites the bullet to 'The universe is large, established US companies that made it' with no slot at all, while its own footnote says 'runtime universe count and market values bind in implementation'. Production carries the number twice (template lines 408, 422), so the survivorship denominator has nowhere to land at runtime under this reference.
    - finding: PRC-020
      action: downgraded
      severity_after: minor
      note: >-
        The site-nav component is withdrawn: baseline.yml declares shared_surfaces: [] and REVEAL_REFERENCE.md scopes the artifact to eight single-route Paper artboards, so omitting global chrome is a legitimate scoping choice I over-read in pass 1. Upheld on the narrow residue that no corrected document addresses and the pixels still show — the 'MASTERMIN DX' wordmark mis-set in all eight cells, and the ZH cells offering a lone '中文' chip with no visible route back to EN where the EN cells offer the 'EN / 中文' pair, which is a locale-parity defect in the candidate's own replacement chrome.
    - finding: PRC-021
      action: upheld
      severity_after: minor
      note: >-
        The protection resolves the scope-creep half and I judge the law defensible rather than wrong: REVEAL_DECISION.md §4 item 6 and §5 make loading/empty/stale/error/disabled mandatory ranked_screener composition, and §3's requirement to preserve 'null, stale' truth is coherent here because the daily artifact can go stale and the protected fetch can fail — my pass-1 claim that a static page 'cannot enter' these states was too narrow. Upheld at minor on the placement residue only: unlike the three properly separated governed specimens, these tiles are rendered inside the product page body in all eight primary cells, so the reference ships a spec gallery inside the composition an implementer will build.
    - finding: PRC-022
      action: downgraded
      severity_after: minor
      note: >-
        The runtime/DEMO/TF half is withdrawn — REVEAL_REFERENCE.md line 28 establishes these as a deliberate anti-invention discipline and REVEAL_DECISION.md §5 forbids inventing unsupported semantics, which is correct practice. Upheld on the half no corrected document covers: the ZH rank-1 title reads '代表性信号组合 · 悬停状态' ('hover state') in both ZH desktop cells, putting an interaction-state annotation in a customer-facing title slot, and the established ZH product term 共振 that production uses in hero, lock and empty copy (template lines 214, 233, 388, 431) is silently replaced by 对齐 across all four ZH cells.
  verdict: BLOCK
