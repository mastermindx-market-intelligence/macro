      severity_after: major
      note: >-
        Nothing in the corrected rationale carries this capability. ledger.validation_sample_basis RETAIN covers month/fire denominators only, which the pixels do show; the finding is about the tier that qualifies the numbers — eligibility gates (template lines 230-231), the Wilson-lower-bound ranking method (275-276), the 21-trading-day win definition (290) and the 'percentage points of win rate, not return' caveat (328-329). REVEAL_DECISION.md §4 item 7 requires a 'methodology/honesty disclosure', and neither the primary matrix nor proposal/honesty-open-dark-en.jpg contains any of that methodology, while the hover/focus representation REVEAL_REFERENCE.md line 74 claims is spent on the filter chips ('Daily + weekly · hover', 'All · focused'). The reference therefore migrates the decision-grade numbers while leaving their qualifications behind.
    - finding: PRC-011
      action: downgraded
      severity_after: minor
      note: >-
        I over-read the badge and the corrected law settles it: REVEAL_DECISION.md §5 uses 'rank 2–3 public count/evidence' as its own term for the public-versus-protected split, so 'Ranks 2–3 · public evidence' means 'this part is public', not 'this is adjudicated proof', and §4's 'the rank itself is ordinal evidence organization, not lifecycle state' plus auth.rank's warranted 'equal' grade dispose of the inflation charge for the ordering. Residual minor: the restyled #1/#2/#3 ordinals arrive without production's cautious ranking qualifier ('a line-up with fewer months behind it is pushed down, not up', template line 273), which is the PRC-010 loss surfacing as tone rather than an independent overclaim.
