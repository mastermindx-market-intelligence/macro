      severity_after: minor
      note: >-
        Rescued by a real constraint the corrected rationale supplies. access.rank1_free_tickers RETAIN now states 'DEMO-only labels are used in the design fixture' and task.use_free_match explains the fixture 'reserves actual links for implementation' with the note 'No live market identity is invented in Paper', which is coherent, matches REVEAL_DECISION.md §5's requirement for 'a representative entitled/unlocked transition using non-live placeholders in design evidence', and is consistent with REVEAL_REFERENCE.md:11 leaving the existing `.tkr` component in authoritative repository source. I withdraw the implication that identities were wrongly withheld. Small residue: chip structure and link affordance are not market facts, so the two-tier mono-ticker-plus-name treatment and link styling (template:129-133,367-371) could have been shown with DEMO content and are not, leaving the page's one free payoff unspecified in the reference — a minor repair, not a design failure.
    - finding: VTC-014
      action: downgraded
      severity_after: minor
      note: >-
        The dominant clause is withdrawn on protected law. REVEAL_DECISION.md §4.2 makes 'filter controls that change the candidate view without changing evidence truth' part of the protected ranked_screener composition, §6 narrowly supersedes the archetype reading baseline.yml relied on, and add.presentation_filters bounds them tightly ('may not change deterministic rank, producer eligibility, or access truth. RIG may reject this addition without affecting the rest of the reference') — so the command-center objection is wrong and I withdraw it without reservation. The freshness half is also largely carried elsewhere: ledger.occurrence_freshness RETAIN places 'occurrence/history/frequency and last-seen context' in the evidence receipt on every rank, and 'last runtime' is present there. Residue is the hero dateline alone: the eyebrow drops 'SETUP TAPE · 2026-09-21' (template:226) for the category label 'SIGNAL STACK · DISCOVERY' (light-en-desktop.jpg x≈58-238 y≈134), leaving a daily product's hero with no as-of anchor — polish, since the fact itself survives in the receipt.
    - finding: VTC-015
      action: upheld
      severity_after: major
      note: >-
        Explicitly reserved to me and therefore unrebutted. information_economics findings[2] states that typography and compression scannability is the Visual/Taste critic's call rather than an author-side claim, and REVEAL_REFERENCE.md:76 defers only browser/runtime proof of overflow and interaction behaviour — legibility of frozen pixels is measurable from the frozen pixels and is not covered by that deferral. Production's prose floor is `.lc-since` 11.5px with `.chip` 12px and `.honesty li` 13px (template:101,126,152), while the proposal sets sample basis, era comparison and state-card bodies at roughly 10px muted gray in both themes (dark-en-desktop.jpg rank-3 meta x≈262-770 y≈718-740; state cards y≈870-945). My pass-1 wording declined to assert a ratio and required measurement; that requirement remains unmet in either direction and the corrected packet supplies nothing toward it, which matters because this is the type carrying the evidence the whole board exists to convey.
    - finding: VTC-016
      action: downgraded
      severity_after: minor
      note: >-
        Mitigated by a revealed authority boundary. REVEAL_REFERENCE.md:11 states 'Repository product law remains authoritative. Paper is a governed editable projection and generated JSX is implementation input only', and REVEAL_DECISION.md §8 confirms the ruling creates no component or token authority and §5 calls the composition one 'of existing primitives' — so the violet in the artboard is not token-binding and should not reach the shipped palette. The observation stands as drawn (primary CTA and every Unlock button in violet at light-en-desktop.jpg x≈586-702 y≈790-818 and x≈1292-1390 y≈678-698 alongside blue chips and bars, against production's single `--fill-info` accent at template:143-144), but with token authority explicitly withheld this is projection polish rather than a brand decision.
    - finding: VTC-017
      action: upheld
      severity_after: major
      note: >-
        One clause resolved, two unrebutted. The sha discrepancy I raised is withdrawn as resolved: REVEAL_PROVENANCE.txt now binds RATIONALE_BRANCH_HEAD=28c8c71afefb603095fd59ef7bb20d4d323f931c and FROZEN_ARTIFACT_COMMIT=78745328c878a80bcedcb2b114620ce5832f4ab9 matching REVEAL_PROPOSAL.yml:5, which I verified rather than accepted — that was a packaging defect in the review bundle, not a defect in the artifact, and it should not count against the proposal. I also verified and withdraw nothing against REVEAL_REFERENCE.md:65-66, since the mobile Loading+Empty second tile row and the corrected 'EN · Light' label are both genuinely present. What survives is unaddressed by the corrected packet: EN desktop ships five state tiles while ZH desktop ships four with DISABLED absent (light-zh-desktop.jpg y≈730-785), directly against REVEAL_REFERENCE.md:74 and add.state_contract's claim that disabled treatment is represented in the primary matrix; and hero body copy differs between viewports (light-en-desktop.jpg y≈256-278 versus light-en-mobile.jpg y≈215-240). A reference intended as canonical law must be internally consistent cell to cell.
    - finding: VTC-018
      action: upheld
      severity_after: minor
      note: >-
        Unaddressed by every corrected file. honesty.guidance requires only that a governed open specimen preserve all five production explanations, which it does, and says nothing about their treatment. The polish observation is unchanged: boxing each of the five bullets in its own bordered card (honesty-open-dark-en.jpg y≈143-470) spends five borders and ~60px of chrome to fragment one coherent stance into five separate warnings, where production's single `.honesty` panel with amber square markers (template:149-153) reads tighter and more assured — a small loss of composure on the one panel where composure is the message.
    - finding: VTC-019
      action: upheld
      severity_after: minor
      note: >-
        Telescope clause withdrawn; leg-dot clause upheld. state.global_zero RETAIN establishes the global-zero specimen as governed and my own pass-1 strengths already judged its restraint an improvement over production's emoji treatment, so faulting the missing 🔭 was inconsistent of me and I withdraw it without reservation. The `.leg-txt::before` green status dot with its soft ring (template:116) remains absent from every proposal leg row (light-en-desktop.jpg y≈515-540), with ledger.signal_legs RETAIN addressing leg depth and the neutral TF placeholder but nothing about leg treatment, leaving the stack flatter and less alive than the shipped version.
  verdict: BLOCK
