<script>
'use strict';
const data=JSON.parse(document.getElementById('session').textContent);
const $=id=>document.getElementById(id);
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const finite=Number.isFinite;
const share=v=>finite(v)&&v>=0&&v<=1;
const credible=r=>share(r.participation)&&r.participation>0;
const current=r=>r.session_status==='current'&&r.asof===data.date;
const kinds={heavy_into_strength:'up',heavy_into_weakness:'down',heavy_price_flat:'flat'};
const unusual=data.rows.filter(r=>current(r)&&credible(r)&&r.participation>=.4&&finite(r.participation_z)&&r.participation_z>=1.5&&finite(r.price_change_pct)&&kinds[r.pattern]);
const byTicker=new Map(data.rows.map(r=>[r.ticker,r]));
const state={lang:'en',tab:'session',scope:'unusual',group:'all',search:'',sort:'desk',page:0,ticker:unusual[0]?.ticker||null};
const t=(en,zh)=>state.lang==='zh'?zh:en;
const formatPct=v=>share(v)?(v*100).toFixed(1)+'%':'—';
const signed=(v,unit='')=>finite(v)?(v>0?'+':'')+v.toFixed(1)+unit:'—';
const txt=(id,val)=>$(id).textContent=val;
function groupName(g){return ({up:t('Rising','上涨'),down:t('Falling','下跌'),flat:t('Flat','横盘'),all:t('All','全部')})[g]}
const symbol=g=>({up:'↗',down:'↘',flat:'→'})[g]||'';
const nKind=k=>unusual.filter(r=>kinds[r.pattern]===k).length;
function tabs(){
 const tabs=[['session',t('Session desk','交易日研究台')],['venues',t('Venue activity','场所分布')],['method',t('Method','方法')]];
 $('tabs').innerHTML=tabs.map(([id,label])=>'<button type="button" data-tab="'+id+'" '+(state.tab===id?'aria-current="page"':'')+'>'+label+'</button>').join('');
}
function header(){
 document.documentElement.lang=state.lang;
 txt('branddesk',t('RESEARCH DESK','研究工作台'));txt('deskcode',t('US EQUITIES  /  EOD','美国股票  /  日终'));txt('eyebrow',t('Market structure   /   US equities','市场结构   /   美国股票'));
 txt('title',t('Dark Pool','暗池研究'));txt('dek',t('See where off-exchange activity departed from a stock’s own history.','查看哪些股票的场外成交偏离了自身历史常态。'));
 txt('findStock',t('Find a stock ↓','查找个股 ↓'));txt('dateLabel',t('Settled session','已结算交易日'));txt('asof',data.date);txt('lang',t('中文','EN'));
 txt('theme',document.documentElement.dataset.theme==='dark'?t('Light','浅色'):t('Dark','深色'));txt('skip',t('Skip to research desk','跳至研究台'));
 txt('foot',t('Design preview · October 29 settled snapshot · FINRA facility and venue reports, consolidated volume and closing prices.','设计预览 · 10月29日已结算快照 · FINRA 设施和场所报告、综合成交量及收盘价。'));txt('source',t('Original published desk ↗','原始研究台 ↗'));
 tabs();
}
function meter(parts){return '<div class="meter" aria-hidden="true">'+parts.map(([n,c])=>'<i style="flex:'+Math.max(0,n)+';background:var(--'+c+')"></i>').join('')+'</div>'}
function stat(k,v,note,bar){return '<div class="stat"><div class="statline"><span class="statval">'+v+'</span><span class="kicker">'+k+'</span></div>'+bar+'<div class="sub">'+note+'</div></div>'}
function stats(){
 return '<div class="stats">'+stat(t('Dollar share','成交额占比'),data.gauge.toFixed(1)+'<small>%</small>',t('Of covered dollar volume traded off-exchange','覆盖范围内场外成交额占比'),meter([[data.gauge,'gold'],[100-data.gauge,'soft']]))+
 stat(t('Unusual activity','异常活动'),unusual.length,t(nKind('up')+' rising · '+nKind('down')+' falling · '+nKind('flat')+' flat',nKind('up')+' 上涨 · '+nKind('down')+' 下跌 · '+nKind('flat')+' 横盘'),meter([[nKind('up'),'sage'],[nKind('down'),'rose'],[nKind('flat'),'gold']]))+
 stat(t('Coverage','覆盖'),data.current+'<small> / '+data.total+'</small>',t('Current names · '+data.stale+' older · '+data.missing+' missing','当前股票 · '+data.stale+' 条历史 · '+data.missing+' 只缺失'),meter([[data.current,'steel'],[data.stale,'quiet'],[data.missing,'soft']]))+'</div>';
}
function session(){
 $('content').innerHTML=stats()+'<div class="workspace"><section class="panel"><div class="phead"><div><div class="stamptext">'+t('01  /  Cross-section','01  /  横截面')+'</div><h2>'+t('Participation map','参与度分布图')+'</h2><p class="sub">'+t('Each dot is an unusual stock. Select one to inspect its evidence.','每个点代表一只异常股票。选择数据点查看详情。')+'</p></div><span class="tag">'+t('Daily','每日')+'</span></div><div id="map" class="chartarea"></div><div class="legend">'+['up','down','flat'].map(g=>'<span class="legenditem"><i class="dot '+g+'"></i>'+groupName(g)+'</span>').join('')+'</div></section><aside class="panel inspector" id="inspector" tabindex="-1"></aside></div>'+
 '<section class="panel board" id="board"><div class="phead"><div><div class="stamptext">'+t('02  /  Stock explorer','02  /  个股筛选')+'</div><h2>'+t('Session ledger','交易日明细')+'</h2></div><button class="csv" id="csv">'+t('Export CSV','导出 CSV')+'</button></div><div class="ctrl"><div class="filters" id="scopes"></div><label class="search"><span class="sr">'+t('Find a ticker in this scope','在当前范围内查找代码')+'</span><input type="search" id="query" autocomplete="off" placeholder="'+t('Find a ticker…','查找代码…')+'" value="'+esc(state.search)+'"></label></div><div class="deskmeta"><span id="count" role="status"></span><label>'+t('Order ','排序 ')+'<select id="order" class="sort"></select></label></div><div id="list"></div></section>';
 $('order').innerHTML=[['desk',t('Desk rank','研究排序')],['share',t('Off-exchange share','场外占比')],['move',t('Price change','价格变动')],['ticker',t('Ticker A–Z','代码 A–Z')]].map(([k,v])=>'<option value="'+k+'">'+v+'</option>').join('');$('order').value=state.sort;
 drawMap();detail();renderList();
}
function drawMap(){
 const pts=unusual.filter(r=>share(r.participation_norm));if(!pts.length){$('map').textContent=t('No comparable observations.','无可比较观测值。');return}
 const compact=matchMedia('(max-width:670px)').matches;
 const W=compact?345:690,H=compact?190:207,L=compact?30:47,R=compact?14:22,T=29,B=41,w=W-L-R,h=H-T-B;
 const dx=r=>(r.participation-r.participation_norm)*100,dy=r=>r.price_change_pct;
 const xLo=Math.min(0,Math.floor(Math.min(...pts.map(dx))/5)*5),xHi=Math.max(5,Math.ceil(Math.max(...pts.map(dx))/5)*5);
 const yLo=Math.min(-5,Math.floor(Math.min(...pts.map(dy))/10)*10),yHi=Math.max(5,Math.ceil(Math.max(...pts.map(dy))/10)*10);
 const x=v=>L+(v-xLo)*w/(xHi-xLo),y=v=>T+(yHi-v)*h/(yHi-yLo);
 let svg='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="group" aria-label="'+t('Unusual stocks, price change against share difference','异常股价格变动与场外份额差异')+'"><text x="'+L+'" y="13">'+t('Price change · past week (%)','近一周涨跌幅 (%)')+'</text>';
 for(let i=xLo;i<=xHi;i+=5)svg+='<path class="grid" d="M'+x(i)+' '+T+'v'+h+'"/><text x="'+x(i)+'" y="'+(H-25)+'" text-anchor="middle">'+(i>0?'+':'')+i+'</text>';
 for(let i=yLo;i<=yHi;i+=10)svg+='<path class="'+(i===0?'zero':'grid')+'" d="M'+L+' '+y(i)+'h'+w+'"/><text x="'+(L-8)+'" y="'+(y(i)+4)+'" text-anchor="end">'+(i>0?'+':'')+i+'</text>';
 svg+='<text x="'+(L+w/2)+'" y="'+(H-5)+'" text-anchor="middle">'+t('Off-exchange share above own norm (pp)','场外占比相对自身常态（百分点）')+'</text>';
 const labelSet=new Set([state.ticker,pts.reduce((a,b)=>dy(a)>dy(b)?a:b).ticker,pts.reduce((a,b)=>dy(a)<dy(b)?a:b).ticker,pts.reduce((a,b)=>dx(a)>dx(b)?a:b).ticker]);
 const sorted=[...pts].sort((a,b)=>Number(a.ticker===state.ticker)-Number(b.ticker===state.ticker));
 for(const r of sorted){const px=x(dx(r)),py=y(dy(r)),g=kinds[r.pattern],sel=r.ticker===state.ticker,ink='var(--'+({up:'sage',down:'rose',flat:'gold'})[g]+')';
 const label=esc(r.ticker)+' · '+signed(dx(r),' pp')+' · '+signed(dy(r),'%');
 svg+='<g data-tk="'+esc(r.ticker)+'" role="button" tabindex="0" aria-label="'+label+'" aria-pressed="'+sel+'"><title>'+label+'</title><circle cx="'+px+'" cy="'+py+'" r="9" fill="transparent"/>'+(sel?'<circle cx="'+px+'" cy="'+py+'" r="9" fill="none" stroke="var(--text)" stroke-width="1.2"/>':'')+'<circle cx="'+px+'" cy="'+py+'" r="'+(sel?4.8:3.8)+'" fill="'+ink+'" stroke="var(--panel)" stroke-width="1"/>';
 if(labelSet.has(r.ticker)){const right=px>W-39;svg+='<text class="dotlabel" x="'+(px+(right?-9:9))+'" y="'+(py<T+9?py+14:py-7)+'" text-anchor="'+(right?'end':'start')+'">'+esc(r.ticker)+'</text>'}svg+='</g>'}
 $('map').innerHTML=svg+'</svg>';
}
function trend(r){
 const arr=r.spark20;if(!credible(r)||!Array.isArray(arr)||arr.filter(share).length<2)return '<span class="hint">'+t('Comparable history unavailable.','缺少可比历史。')+'</span>';
 const nums=arr.filter(share),lo=Math.min(...nums),hi=Math.max(...nums),xx=i=>7+i*286/Math.max(1,arr.length-1),yy=v=>hi===lo?24:40-(v-lo)*32/(hi-lo);let path='',prev=false;
 arr.forEach((v,i)=>{if(share(v)){path+=(prev?'L':'M')+xx(i).toFixed(1)+' '+yy(v).toFixed(1)+' ';prev=true}else prev=false});
 return '<svg role="img" aria-label="'+t('Participation history range ','历史场外占比范围 ')+formatPct(lo)+' – '+formatPct(hi)+'" viewBox="0 0 300 49" preserveAspectRatio="none"><path d="M6 43H294" stroke="var(--grid)"/><path d="'+path+'" fill="none" stroke="var(--gold)" stroke-width="2" vector-effect="non-scaling-stroke"/></svg><div class="reportline hint"><span>'+t('Range','范围')+' '+formatPct(lo)+'–'+formatPct(hi)+'</span><span>'+t('Latest →','最新 →')+'</span></div>';
}
function detail(){
 const r=byTicker.get(state.ticker);if(!r){$('inspector').innerHTML='<div class="empty">'+t('Select a stock to inspect its evidence.','选择股票查看证据。')+'</div>';return}
 const trusted=credible(r),ok=current(r),g=trusted&&unusual.includes(r)?kinds[r.pattern]:null;
 const older=ok?t('Settled','已结算'):t('Historical','历史');
 const pat=g?symbol(g)+' '+groupName(g):older;
 const returnLabel=lastStockSource?.isMap?t('Back to map','返回分布图'):t('Back to ledger','返回明细');
 const mixRows=[[t('Registered ATS','注册 ATS'),r.ats_frac],[t('Retail-facing firms','零售批发商及经纪商'),r.retail_frac],[t('Institutional desks','机构交易台'),r.frac_institutional_desk],[t('Unclassified','未归类'),r.frac_unclassified]];
 const mixDetail=r.asof<data.week?'<p>'+t('The venue report is newer than this historical observation.','此场所报告晚于该股票的历史观测日期。')+'</p>':'<p>'+t('Share of this stock’s reported off-exchange volume','占该股已报告场外成交股数的比例')+'</p>'+mixRows.map(([label,v])=>'<div class="reportline hint"><span>'+label+'</span><strong>'+formatPct(v)+'</strong></div>').join('')+'<p>'+t('Leading ATS','最大 ATS')+' · '+esc(r.top_ats_venue||'—')+'</p>';
 $('inspector').innerHTML='<div class="inspecthead"><span class="stamptext">'+t('Selected stock','选中个股')+'</span><button class="back" id="back">'+returnLabel+'</button><span class="tag">'+older+'</span></div><div class="inspecttitle"><strong class="ticker">'+esc(r.ticker)+'</strong><span class="'+(g||'hint')+'">'+pat+'</span></div><div class="inspectdate">'+esc(r.asof)+' · '+t('stock observation','个股观测')+'</div>'+
 '<div class="metricrow"><div><small>'+t('Off-exchange share','场外成交占比')+'</small><b>'+(trusted?formatPct(r.participation):'—')+'</b></div><div><small>'+t('Own norm','自身常态')+'</small><b>'+(trusted?formatPct(r.participation_norm):'—')+'</b></div></div>'+
 '<div class="trendwrap"><span class="kicker">'+t('Participation · last 20 observations','场外占比 · 最近20次观测')+'</span>'+trend(r)+'</div>'+
 '<p class="detail-line">'+(trusted?t('Week’s price move','近一周价格变动')+' <strong>'+signed(r.price_change_pct,'%')+'</strong> · '+t('Elevated streak','持续高于常态')+' <strong>'+(finite(r.streak)?r.streak:'—')+'</strong> '+t('sessions','个交易日'):t('Participation withheld because the denominator cannot support this value.','分母无法支持该占比，已隐藏相关指标。'))+'</p>'+
 '<details class="detail-exp"><summary>'+t('Weekly venue evidence','每周场所数据')+'</summary><p>'+t('Week of ','报告周 ')+esc(data.week)+' · '+t('5-week lag','滞后5周')+'</p>'+mixDetail+'</details>';
}
function filtered(){
 let arr=state.scope==='unusual'?unusual:state.scope==='older'?data.rows.filter(r=>!current(r)):state.scope==='current'?data.rows.filter(current):data.rows;
 if(state.scope==='unusual'&&state.group!=='all')arr=arr.filter(r=>kinds[r.pattern]===state.group);
 const q=state.search.trim().toUpperCase();arr=arr.filter(r=>!q||r.ticker.includes(q));
 if(state.sort==='ticker')arr.sort((a,b)=>a.ticker.localeCompare(b.ticker));
 else if(state.sort!=='desk'){let v=r=>state.sort==='share'?(credible(r)?r.participation:null):r.price_change_pct;arr.sort((a,b)=>(finite(v(b))?v(b):-Infinity)-(finite(v(a))?v(a):-Infinity)||a.ticker.localeCompare(b.ticker))}
 return arr;
}
function renderList(){
 const labels={unusual:t('Unusual','异常'),current:t('Current','当前'),older:t('Historical','历史'),all:t('All records','全部记录')};
 $('scopes').innerHTML=Object.entries(labels).map(([k,v])=>'<button class="filter" data-scope="'+k+'" aria-pressed="'+(state.scope===k)+'">'+v+'</button>').join('');
 const arr=filtered(),pages=Math.ceil(arr.length/8);state.page=Math.max(0,Math.min(state.page,pages-1));const page=arr.slice(state.page*8,state.page*8+8);
 txt('count',arr.length+' '+t('stocks','只股票')+' · '+(state.group!=='all'&&state.scope==='unusual'?groupName(state.group):labels[state.scope]));
 const gbar=state.scope==='unusual'?'<div class="filters" style="margin:0 16px 8px">'+['all','up','down','flat'].map(g=>'<button class="filter" data-group="'+g+'" aria-pressed="'+(state.group===g)+'">'+(g==='all'?'':symbol(g)+' ')+groupName(g)+'</button>').join('')+'</div>':'';
 if(!page.length){$('list').innerHTML=gbar+'<div class="empty">'+t('No stocks match these filters.','没有匹配的个股。')+' <button class="pg" id="clear">'+t('Reset filters','重置筛选')+'</button></div>';return}
 const table='<table class="rows"><thead><tr>'+[[t('Stock','股票'),''],[t('Off-exch.','场外占比'),''],[t('Own norm','自身常态'),'optional'],[t('vs norm','偏离常态'),''],[t('Price · 1W','一周涨跌'),''],[t('Streak','持续天数'),'optional'],[t('Observation','观测日'),'optional']].map(([h,c])=>'<th scope="col" class="'+c+'">'+h+'</th>').join('')+'</tr></thead><tbody>'+page.map(r=>{let ok=credible(r),delta=ok&&share(r.participation_norm)?(r.participation-r.participation_norm)*100:null;return '<tr class="'+(r.ticker===state.ticker?'selected':'')+'"><td><button type="button" data-tk="'+esc(r.ticker)+'" aria-pressed="'+(r.ticker===state.ticker)+'">'+esc(r.ticker)+'</button>'+(!current(r)?'<small>'+esc(r.asof)+'</small>':'')+'</td><td>'+(ok?formatPct(r.participation):'—')+'</td><td class="optional">'+(ok?formatPct(r.participation_norm):'—')+'</td><td>'+signed(delta,' pp')+'</td><td>'+signed(r.price_change_pct,'%')+'</td><td class="optional">'+(ok&&finite(r.streak)?r.streak:'—')+'</td><td class="optional">'+esc(r.asof)+'</td></tr>'}).join('')+'</tbody></table>';
 $('list').innerHTML=gbar+'<div class="tabwrap">'+table+'</div><div class="pager"><span>'+(state.page*8+1)+'–'+(state.page*8+page.length)+' / '+arr.length+'</span><div class="inline"><button class="pg" data-page="-1" '+(!state.page?'disabled':'')+' aria-label="'+t('Previous page','上一页')+'">←</button><button class="pg" data-page="1" '+(state.page>=pages-1?'disabled':'')+' aria-label="'+t('Next page','下一页')+'">→</button></div></div>';
}
function venues(){
 const vmax=Math.max(...data.venues.map(v=>v.share),1);
 $('content').innerHTML='<div class="vgrid"><section class="panel"><div class="phead"><div><div class="stamptext">'+t('Weekly report  /  FINRA','周度报告  /  FINRA')+'</div><h2>'+t('Where ATS volume traded','ATS 成交分布')+'</h2><p class="sub">'+t('Share of reported ATS volume by venue.','各场所占已报告 ATS 成交量的比例。')+'</p></div><span class="tag">'+esc(data.week)+'</span></div><div class="vbody"><div class="reportline kicker"><span>'+t('Venue','场所')+'</span><span>'+t('Share  /  Δ week (pp)','占比  /  周变化（百分点）')+'</span></div>'+data.venues.map(v=>'<div class="venuerow"><div><b>'+esc(v.mpid)+'</b><small class="stack hint">'+esc(v.name.replace(v.mpid+' ',''))+'</small></div><div class="vbar"><i style="width:'+v.share/vmax*100+'%"></i></div><strong>'+v.share.toFixed(1)+'%</strong><span class="mini">'+esc(v.delta||'—')+'</span></div>').join('')+'</div></section><aside class="panel method"><div class="stamptext">'+t('Reading the report','解读报告')+'</div><h2>'+t('Two reporting clocks','两种报告周期')+'</h2><h3>'+t('Daily participation','每日场外参与度')+'</h3><p>'+esc(data.date)+' · '+t('Facility-reported share volume compared with same-day consolidated volume.','设施报告成交股数与同日综合成交股数的比值。')+'</p><h3>'+t('Weekly venues','每周场所')+'</h3><p>'+esc(data.week)+' · '+t('This report week begins five weeks before the desk session. The bars compare registered ATS venues. Internalized non-ATS flow has a different denominator.','此报告周距研究日约五周。横条比较注册 ATS 场所；非 ATS 内部化成交使用不同分母。')+'</p></aside></div>';
}
function method(){
 $('content').innerHTML='<div class="vgrid"><section class="panel method"><div class="stamptext">'+t('Research notes','研究说明')+'</div><h2>'+t('How to read the desk','如何阅读研究台')+'</h2><h3>'+t('Look for a departure from the stock’s own history','关注相对个股自身历史的偏离')+'</h3><p>'+t('The unusual group uses the desk’s settled-session observations, an own-history score of at least 1.5, at least 40% off-exchange share, and a price observation. The map places each name by the difference from its normal share in percentage points and its price change over the past week.','异常组使用已结算交易日数据，要求自身历史异常分数至少1.5、场外占比至少40%且具备价格观测。图中横轴是场外占比相对常态的百分点差，纵轴为过去一周价格变化。')+'</p><h3>'+t('Know what the tape measures','了解数据的含义')+'</h3><p>'+t('Off-exchange activity includes registered pools and internalizers. The daily tape does not identify buyers, sellers or institutional intent. The headline share weights constituents by dollar volume. A stock’s individual share uses traded share volume.','场外活动涵盖注册暗池与内部化机构。每日数据无法识别买卖双方或机构意图。总体占比按成交金额加权，个股占比采用成交股数。')+'</p><h3>'+t('Coverage and quality','覆盖与质量')+'</h3><p>'+t('275 of 375 tracked names have a current observation. A further 97 have an older one, and 3 have no qualifying record. A dash means unavailable. An invalid participation ratio is withheld with all related comparisons and history.','375只跟踪股票中275只有当前观测，另97只仅有历史记录，3只无合格记录。破折号表示不可用。无效参与率及其相关比较与历史图均不予显示。')+'</p></section><section class="panel method"><div class="stamptext">'+t('Change log','变化记录')+'</div><h2>'+t('Since the prior session','较上一交易日')+'</h2><ul>'+data.changes.map(line=>'<li>'+esc(line[state.lang==='zh'?1:0])+'</li>').join('')+'</ul></section></div>';
}
const sizeChange=matchMedia('(max-width:670px)');
sizeChange.addEventListener('change',()=>{if(state.tab==='session' && $('map'))drawMap()});
function render(){header();if(state.tab==='session')session();else if(state.tab==='venues')venues();else method()}
let lastStockSource=null;
function selectStock(el){
 const isMap=Boolean(el.closest('#map'));state.ticker=el.dataset.tk;lastStockSource={isMap,ticker:state.ticker};detail();drawMap();renderList();txt('announce',state.ticker+' '+t('selected','已选中'));
 if(matchMedia('(max-width:670px)').matches)$('inspector').focus();
 else {const target=(isMap?$('map'):$('list')).querySelector('[data-tk="'+CSS.escape(state.ticker)+'"]');if(target)target.focus({preventScroll:true})}
}
function csv(){
 const arr=filtered();const matrix=[['ticker','observation','session_status','off_exchange_share_pct','own_norm_pct','price_change_1w_pct'],...arr.map(r=>[r.ticker,r.asof,r.session_status,credible(r)?(r.participation*100).toFixed(2):'',credible(r)&&share(r.participation_norm)?(r.participation_norm*100).toFixed(2):'',finite(r.price_change_pct)?r.price_change_pct:''])];
 const bytes=matrix.map(line=>line.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([bytes],{type:'text/csv;charset=utf-8'}));const link=document.createElement('a');link.href=url;link.download='dark-pool-'+data.date+'-'+state.scope+'.csv';link.click();setTimeout(()=>URL.revokeObjectURL(url),3000);
}
document.addEventListener('click',e=>{
 const el=e.target.closest('button,[data-tk]');if(!el)return;
 if(el.dataset.tab){state.tab=el.dataset.tab;render();$('tabs').querySelector('[aria-current]').focus({preventScroll:true});return}
 if(el.id==='findStock'){state.tab='session';state.scope='all';state.group='all';state.search='';state.page=0;render();$('query').focus();return}
 if(el.id==='theme'){document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';txt('theme',document.documentElement.dataset.theme==='dark'?t('Light','浅色'):t('Dark','深色'));return}
 if(el.id==='lang'){state.lang=state.lang==='en'?'zh':'en';render();$('lang').focus({preventScroll:true});return}
 if(el.dataset.tk){selectStock(el);return}
 if(el.dataset.scope){state.scope=el.dataset.scope;state.group='all';state.page=0;renderList();$('scopes').querySelector('[aria-pressed="true"]').focus({preventScroll:true});return}
 if(el.dataset.group){state.group=el.dataset.group;state.page=0;renderList();$('list').querySelector('[data-group="'+state.group+'"]').focus({preventScroll:true});return}
 if(el.dataset.page){state.page+=Number(el.dataset.page);renderList();const b=$('list').querySelector('[data-page="'+el.dataset.page+'"]:not(:disabled)')||$('list').querySelector('.pg:not(:disabled)');if(b)b.focus({preventScroll:true});return}
 if(el.id==='clear'){state.search='';state.scope='unusual';state.group='all';state.page=0;$('query').value='';renderList();$('query').focus();return}
 if(el.id==='back'){const b=lastStockSource?$(lastStockSource.isMap?'map':'list').querySelector('[data-tk="'+CSS.escape(lastStockSource.ticker)+'"]'):null;(b||$('query')).focus();return}
 if(el.id==='csv')csv();
});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('g[data-tk]')){e.preventDefault();selectStock(e.target)}});
document.addEventListener('input',e=>{if(e.target.id==='query'){state.search=e.target.value;state.page=0;renderList()}});
document.addEventListener('change',e=>{if(e.target.id==='order'){state.sort=e.target.value;state.page=0;renderList()}});
render();

</script></body></html>
