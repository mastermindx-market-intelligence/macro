# agentos/schema/workstream.schema.yml
# Machine mirror of research/MASTERMIND_AGENT_OS_STATE_SCHEMA.md §1.
# Enforced by scripts/agentos.py validate. Prose spec wins on conflict.
schema: agentos.workstream.v1
file: agentos/workstreams/WS-<KEY>.md
required:
  key:          {type: string, pattern: UPPER-KEBAB, note: must match filename WS-<key>.md}
  title:        {type: string}
  objective:    {type: string, note: "1-3 sentences; 'done' in observable terms"}
  status:       {enum: [proposed, active, blocked, awaiting_ci, awaiting_review, done, parked, killed]}
  program:      {type: string, note: key from config/mastermind_programs.yml (validated)}
  repos:        {type: list, items: {enum: [macro, terminal, mastermind]}}
  owner:        {type: string, note: accountable seat, not a session id}
  class:        {enum: [research, build, design, adjudication, mechanical]}
  blast_radius: {enum: [reversible, user_facing, irreversible]}
  ambiguity:    {enum: [specified, scoped, open]}
  waves:        {type: list, min: 1, items: wave}
  next_action:  {type: string, note: an action, never a goal}
derived:
  # NEVER authored. scripts/agentos.py status computes these from git log over the
  # record file. Hand-typing them made every session touching a record rewrite the same
  # line (the one verified concurrent-edit conflict site here), and made staleness
  # circular: the field asserting freshness was typed by the session claiming it.
  created:      {type: date, source: "git log --diff-filter=A --format=%as -- <path>"}
  updated:      {type: date, source: "git log -1 --format=%as -- <path>"}
optional:
  p0:           {type: string, note: id from Mastermind config/strategic_state.yml}
  owns_paths:   {type: list, items: glob}
  depends_on:   {type: list, items: "WS:<KEY>",
                 note: "cycles are a hard error; a BARE key is a hard error too - one
                        citation shape exists, and a bare key used to be dropped silently"}
  blocked_by:   {type: list, note: present iff status == blocked}
  decisions:    {type: list, items: "DEC:<KEY>"}
  discoveries:  {type: list, items: "DSC:<KEY>"}
  landmines:    {type: list}
  do_not_redo:  {type: list}
  artifacts:    {type: list, items: repo-relative-path}
  acceptance_contracts:
    type: list
    max: 16
    note: >
      Explicit mission-scoped knowledge declarations, never a global workstream ruler,
      grant or acceptance. No latest handoff or default mission is inferred.
    items:
      required_fields: [commission_id, commission_ref, continuity_ref, original_intent_ref,
                        proof_contract_ref, original_proof_contract_ref, current_intent_revision,
                        correction_state, correction_chain, criteria_objective, criteria_sources,
                        original_source_status, proof_obligations]
      optional_fields: [execution_commission_refs]
      commission_id: {type: string, unique: true, max: 128}
      source_reference: {closed_fields: [repository, commit, path, content_sha256],
                         note: "Immutable source identity, not an authority grant; no reference path is opened."}
      execution_commission_refs: {type: list, max: 16, default: [],
        note: "Explicit knowledge association only after actual fixed-path commission publication. Empty means EXECUTION_COMMISSION_NOT_ASSOCIATED. Runtime joins its own exact reference; this never admits work."}
      correction_state: {enum: [NO_CORRECTION_DECLARED_AT_THIS_REVISION,
                               CORRECTIONS_DECLARED_AT_THIS_REVISION, MISSING, UNRESOLVED]}
      correction_chain: {type: list, max: 16,
        note: "Initial no-correction declaration requires an explicit empty chain; missingness is never coerced to this state."}
      criteria_objective: {type: string, max_utf8_bytes: 4000,
        note: "Literal text for the existing Mastermind criterion parser. Agent OS does not parse the reserved suffix or derive criterion IDs."}
      criteria_sources: {type: list, min: 1, max: 6,
        closed_fields: [criterion_index, source_ref, locators],
        note: "Contiguous zero-based source positions, not independent acceptance IDs."}
      proof_obligations: {type: list, min: 1, max: 64,
        closed_fields: [source_ref, section, label, required_outcome],
        note: "All literal required source clauses survive; six criterion summaries, hashes or green CI cannot establish every individual obligation."}
      emitted_proof_obligation_digests: {type: list,
        note: "Compiler emits parallel exact-row SHA256 identities in source order; no independent criteria parser. Consumers recompute and require every individual disposition."}
  runtime_ref:  {type: object, fields: [service, deployed_sha, freshness_artifact]}
  claim:        {type: object, fields: [by, at, expires],
                 note: "ADVISORY ONLY - blocks nothing (I1). Unreadable by other sessions
                        until it merges, so it prevents DAY-scale collisions, not
                        same-hour ones; expires defaults to +12h (session scale)"}
  needs_ceo:    {type: object, fields: [question, options, recommendation, by_when]}
  wait:         {type: object, fields: [kind, review_after, condition],
                 kind: {enum: [natural_evidence, external_dependency, calendar_window,
                               external_action]},
                 review_after: {type: date, note: "date-only YYYY-MM-DD; the date a HUMAN
                                looks again, NOT a predicted resolution and NOT a timer"},
                 condition: {type: string, note: "non-empty opaque human context; never
                             parsed for authority, action or completion"},
                 note: "DECLARED INTENTIONAL INACTIVITY. Closed contract - unknown fields
                        are a hard error, so no author can mint a private reason. Reading
                        only (I1): schedules nothing, wakes nothing, gates nothing,
                        completes nothing. A past review_after stays schema-valid - it is
                        an overdue review, not an expiry. Absence is never inferred to
                        mean a workstream is unattended, and its presence is never
                        evidence that anyone is live. Also valid at wave scope."}
wave:
  required: {id: string, title: string, status: {enum: [todo, in_progress, awaiting_ci, done, dropped]}}
  optional: {pr: "int|list[int]", depends_on: list[wave-id], next_action: string,
             wait: "same closed {kind, review_after, condition} contract as the
                    workstream-scope field above, validated by the same rule"}
