name: factor-atlas-reference
# GitHub Actions owns the test execution; this is a focused, non-data job.
# No provider calls, source admission, publication, or production endpoints.
on:
  pull_request:
    paths:
      - "research/factor_atlas/**"
      - "engine/flow_signing.py" # quote-reference parity dependency
      - "engine/entry_radar/replay/terminal_minute_observations.py" # S2-P1 retained-minute reader contract
      - "research/licenses/MASSIVE_ENTITLEMENT_RECORD.md" # S2-P1 rights-reference dependency
      - "lib/dataos/tiingo_reader.py" # existing Tiingo L1 research reader schema
      - "lib/dataos/identity.py" # incumbent PIT alias clocks and binding contract
      - "scripts/build_security_master.py" # incumbent reference alias producer
      - "lib/dataos/tiingo_views.py" # source/volume/venue qualification
      - "collectors/tiingo_archive.py" # original archive context/receipt shape
      - "config/dataset_registry.yml" # Tiingo source family / rights contract
      - ".github/workflows/factor-atlas-reference.yml"

permissions:
  contents: read

concurrency:
  group: factor-atlas-reference-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-fixtures:
    name: Factor Atlas deterministic research fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned research test dependencies
        run: |
          python -m pip install -r research/factor_atlas/session2/requirements-research.txt
          python -m pip install "pandas>=2.3,<4"
      - name: Run all seventeen Factor Atlas research and scientific falsifier suites
        run: |
          PYTHONDONTWRITEBYTECODE=1 python -m pytest -c /dev/null -p no:cacheprovider -q \
            research/factor_atlas/session2/prototype/test_pressure.py \
            research/factor_atlas/session2/prototype/test_disclosed_profile.py \
            research/factor_atlas/session2/prototype/test_witnesses.py \
            research/factor_atlas/session2/prototype/test_window_pressure.py \
            research/factor_atlas/session2/prototype/test_window_pipeline.py \
            research/factor_atlas/session2/prototype/test_quote_reference.py \
            research/factor_atlas/session2/prototype/test_quote_calibration.py \
            research/factor_atlas/session2/prototype/test_source_preflight.py \
            research/factor_atlas/session2/prototype/test_quote_study.py \
            research/factor_atlas/session2/prototype/test_pressure_oos.py \
            research/factor_atlas/session2/prototype/test_intake_bridge.py \
            research/factor_atlas/session2/prototype/test_owner_reader_abi.py \
            research/factor_atlas/session2/prototype/test_cross_session_contract.py \
            research/factor_atlas/session2/prototype/test_tiingo_source_fitness.py \
            research/factor_atlas/session2/prototype/test_tiingo_pit_alias.py \
            research/factor_atlas/session2/prototype/test_tiingo_preflight_bridge.py \
            research/factor_atlas/session2/prototype/test_read_contract_schema.py
