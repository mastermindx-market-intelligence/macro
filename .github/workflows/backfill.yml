name: backfill
on:
  workflow_dispatch:
    inputs:
      only:
        description: "comma-separated adapter keys (empty = all)"
        required: false
        default: ""
      breadth_start:
        description: "exchange_breadth optional first date (YYYY-MM-DD)"
        required: false
        default: ""
      breadth_end:
        description: "exchange_breadth optional last completed date (YYYY-MM-DD)"
        required: false
        default: ""
      breadth_recent_sessions:
        description: "exchange_breadth recent seed size when start is omitted"
        required: false
        default: "270"
      breadth_max_sessions:
        description: "exchange_breadth bounded sessions per run"
        required: false
        default: "50"

permissions:
  contents: write

concurrency:
  # Serialized batch lane shared with weekly / special-sits-backfill (these are heavy,
  # rare, and need not run two-at-a-time). daily lives in its own "pipeline-daily" lane
  # now, so a long backfill no longer blocks the daily data refresh.
  group: pipeline-batch
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: [self-hosted, macstudio]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: python 3.12 (Homebrew venv - self-hosted runner)
        run: |
          VENV="$HOME/.cache/mm-venv-${RUNNER_NAME:-default}"
          [ -x "$VENV/bin/python" ] || /opt/homebrew/bin/python3.12 -m venv "$VENV"
          echo "$VENV/bin" >> "$GITHUB_PATH"
          "$VENV/bin/python" -m pip install --quiet --upgrade pip
      - run: pip install -r requirements.txt
      - name: guard China-gold proof to protected main
        run: |
          case ",${{ github.event.inputs.only }}," in
            *,gold_china_basis,*)
              if [ "$GITHUB_REF_NAME" != "main" ]; then
                echo "::error title=China gold backfill wrong ref::gold_china_basis may only run from main; got $GITHUB_REF_NAME"
                exit 1
              fi
              ;;
          esac
      - name: fetch archived OAS history (idempotent)
        if: github.event.inputs.only != 'gold_china_basis' && github.event.inputs.only != 'exchange_breadth'
        run: python -m scripts.fetch_archive
      - name: restore Massive R2 for exchange breadth
        if: ${{ github.event.inputs.only == 'exchange_breadth' }}
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python -m scripts.fetch_r2 --dirs massive_stock_day --workers 24
      - name: bounded exchange breadth history seed
        if: ${{ github.event.inputs.only == 'exchange_breadth' }}
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
          BREADTH_START: ${{ github.event.inputs.breadth_start }}
          BREADTH_END: ${{ github.event.inputs.breadth_end }}
          BREADTH_RECENT: ${{ github.event.inputs.breadth_recent_sessions }}
          BREADTH_MAX: ${{ github.event.inputs.breadth_max_sessions }}
        run: |
          set -euo pipefail
          args=(
            --recent-sessions "${BREADTH_RECENT:-270}"
            --max-sessions "${BREADTH_MAX:-50}"
            --resume
          )
          if [ -n "${BREADTH_START:-}" ]; then args+=(--start "$BREADTH_START"); fi
          if [ -n "${BREADTH_END:-}" ]; then args+=(--end "$BREADTH_END"); fi
          python -m scripts.backfill_exchange_breadth "${args[@]}"
      - name: audit exchange breadth generation
        if: ${{ github.event.inputs.only == 'exchange_breadth' }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          root = Path("data/exchange_breadth")
          required = {
              "universe_intervals.parquet",
              "source_splits.parquet",
              "nyse_operating.parquet",
              "nyse_all_issues.parquet",
              "_state.json",
              "_receipt.json",
              "_backfill_state.json",
          }
          missing = sorted(name for name in required if not (root / name).exists())
          if missing:
              raise SystemExit(f"missing exchange breadth artifacts: {missing}")
          state = json.loads((root / "_state.json").read_text())
          receipt = json.loads((root / "_receipt.json").read_text())
          checkpoint = json.loads((root / "_backfill_state.json").read_text())
          tip = state.get("last_observed_session")
          if not tip or receipt.get("accepted_session") != tip:
              raise SystemExit("receipt/state accepted-session mismatch")
          if tip not in set(checkpoint.get("completed_sessions") or []):
              raise SystemExit("backfill checkpoint does not include accepted tip")
          if receipt.get("authority") != "display_research_context_only":
              raise SystemExit("breadth authority changed")
          serialized = json.dumps(receipt)
          if "apiKey" in serialized or "POLYGON_API_KEY" in serialized:
              raise SystemExit("secret-bearing receipt")
          for name in ("nyse_operating.parquet", "nyse_all_issues.parquet"):
              frame = pd.read_parquet(root / name)
              if frame.empty or str(pd.Timestamp(frame.index.max()).date()) != tip:
                  raise SystemExit(f"{name} does not end at accepted tip {tip}")
          print(f"exchange breadth audit OK: accepted tip {tip}")
          PY
      - name: full-history collection
        if: ${{ github.event.inputs.only != 'exchange_breadth' }}
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
          # Reuse the same governed bindings as daily.yml so an explicit
          # workflow_dispatch only=gold_china_basis can prove/backfill the
          # China-gold source plane immediately after merge without a new lane.
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.only }}" ]; then
            python -m scripts.collect --full-history --only "${{ github.event.inputs.only }}"
          else
            python -m scripts.collect --full-history
          fi
      - name: commit
        run: |
          git config user.name "dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          # site/qledger: a --full-history collect runs the same grade_qledger step the
          # nightly does and rewrites the TRACKED site/qledger/track_record.json (#1139
          # un-ignored it), so it is staged here for the same reason daily.yml stages it.
          # Left unstaged it blocked the rebase with "cannot pull with rebase: You have
          # unstaged changes" and killed EVERY attempt — measured 2026-08-19 on runs
          # 32227070347 and 32227948390 (both only=symbol_directory): five identical
          # failures, one ::warning, a SUCCESS conclusion, and a 19-file/1127-insertion
          # commit stranded on the runner ("you are leaving 1 commit behind"). That is
          # the same sentinel staging-gap that lost daily's 07-03/07-04 collections.
          #
          # Staging is NOT the durable half — --autostash on the rebase below is. collect
          # also regenerates docs/CLAIM_ACCOUNTABILITY.md and docs/GRADING_CLOSURE.md,
          # which no lane publishes (the nightly stages neither, deliberately), and any
          # future grader writing outside data/+site/qledger/ would re-open the hole.
          if [ "${{ github.event.inputs.only }}" = "exchange_breadth" ]; then
            # The R2 restore is an input, not a publication effect. Fence this lane to
            # the accepted breadth generation and its resumability checkpoint only.
            git add data/exchange_breadth/
          else
            git add data/ site/qledger/
          fi
          if git diff --cached --quiet; then echo "no backfill changes to commit"; exit 0; fi
          git commit -m "data: backfill $(date -u +%F)"
          # best-effort push: daily now runs in its own lane and may push concurrently,
          # so retry rebase+push instead of a single fragile push that would error out
          # the moment it lost a race. Prefer our freshly-collected data on conflict.
          . "${GITHUB_WORKSPACE:-.}/scripts/ci/push_retry.sh"
          # macOS runners have no GNU timeout; bound the push like every other lane.
          PUSH_ALARM=420
          push_retry_init "backfill data"
          while push_attempt; do
            # Append-only base freshness (2026-08-18 lost update, DSC-OVERLAPPING-DAILY-
            # COLLECT-JOBS-LOSE-APPEND-ONLY-ROWS): a --full-history backfill is the
            # longest-running writer of data/government_revenue/, so origin/main has
            # almost always moved under it by the time it pushes, and `-X theirs` would
            # replace the nightly's appended evidence rows with this run's.
            git fetch origin main || true
            # Non-zero ONLY when the fence proved a loss and then could not withhold it.
            if ! push_append_only_fence origin/main; then push_backoff; continue; fi
            # push_autostash_ok is load-bearing, not decoration: `git pull --rebase
            # --autostash` EXITS 0 when the rebase succeeds but the autostash RE-APPLY
            # conflicts, leaving conflict markers in the tree (d29e4dd44d / #4167).
            if git pull --rebase --autostash -X theirs origin main && push_autostash_ok; then
              if push_do; then
                echo "pushed backfill on attempt $PUSH_ATTEMPT"
                push_won
                exit 0
              fi
            fi
            push_abort_rebase
            push_backoff
          done
          push_lost
          # RED, not a ::warning. Until 2026-08-19 this tail was a warning + exit 0, so a
          # backfill that published NOTHING concluded SUCCESS and the loss was invisible
          # to everything that reads the job conclusion. This is the last step of the only
          # job, so failing here suppresses no delivery tail.
          echo "::error title=backfill NOT pushed::$PUSH_ATTEMPT rebase/push attempts failed ($PUSH_STOP) — the backfill commit exists only on the runner and is discarded by the next clean checkout; re-run this workflow"
          exit 1
