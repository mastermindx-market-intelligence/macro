name: portfolio-decision-deadman

on:
  schedule:
    # US Brain fires 23:10 UTC Mon-Fri. Check after its 90-minute completion budget.
    - cron: "55 0 * * 2-6"
    # China/HK Brains fire 08:00/09:00 UTC Mon-Fri. Check after both budgets.
    - cron: "45 10 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-decision-deadman
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/__init__.py
            /scripts/check_portfolio_decision_deadman.py

      - name: collect sanitized authoritative state and evaluate due cycles
        env:
          SSH_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${SSH_KEY:-}" ] || {
            echo '{"schema":"mastermind.portfolio_decision_deadman.result.v1","status":"error","failures":["vps_deploy_key_unavailable"]}'
            exit 1
          }

          umask 077
          keyfile="$RUNNER_TEMP/vps_key"
          snapshot="$RUNNER_TEMP/portfolio-decision-snapshot.json"
          printf '%s\n' "$SSH_KEY" > "$keyfile"
          chmod 600 "$keyfile"
          trap 'rm -f "$keyfile" "$snapshot"' EXIT

          # One read-only SSH carrier. The streamed script issues GETs only and emits
          # a closed field allowlist; no holdings, prompts, provider errors, account
          # values, target weights, credentials, or fills cross the VPS boundary.
          ssh -i "$keyfile" \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=2 \
            -o StrictHostKeyChecking=accept-new \
            root@146.190.142.17 \
            '/opt/mastermind/.venv/bin/python - --collect' \
            < scripts/check_portfolio_decision_deadman.py \
            > "$snapshot"

          python scripts/check_portfolio_decision_deadman.py --file "$snapshot"
