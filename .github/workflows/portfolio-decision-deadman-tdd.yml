name: portfolio-decision-deadman-tdd

on:
  push:
    branches:
      - claude/portfolio-decision-deadman-20260912
    paths:
      - tests/test_portfolio_decision_deadman.py
      - scripts/portfolio_decision_deadman.py
      - .github/workflows/portfolio-decision-deadman.yml
      - .github/workflows/portfolio-decision-deadman-tdd.yml

permissions:
  contents: read

concurrency:
  group: portfolio-decision-deadman-tdd
  cancel-in-progress: false

jobs:
  focused-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pytest
      - run: python -m pytest -q tests/test_portfolio_decision_deadman.py
