name: filing-forensics-sec
# Filing Forensics SEC source lane — restore -> strict acquire -> projections ->
# incremental sync -> publish the disclosure-projection bundle the render reads.
#
# WHY THIS LANE EXISTS. Until 2026-08-08 this ran INSIDE daily.yml's engine job as
# "restore, acquire, project, and snapshot Filing Forensics SEC sources (hard gate)".
# That step grew 7.4m -> 11.4m -> 15.2m -> 23.3m -> 23.8m across the 08-05..08-08
# engine executions while SEC bytes stayed flat (127.96MB -> 127.93MB): the cost is
# the immutable source store, not the download. The store mints ~121-165 files/night
# on a FIXED 12-ticker universe (nightly-unique acquisition-run receipts, nightly-unique
# filing manifests, near-daily content-addressed submissions objects), restore does one
# sequential R2 GET per manifest entry, sync one conditional PUT + readback per file, and
# actions/checkout clean:true wipes the gitignored store every run (measured
# current_files: 0 every night) so it was always a COLD full restore. 561 -> 1883 restored
# files and 729 -> 2048 synced files in three days, all on the render's critical path.
# House law: heavy compute goes off the render path.
#
# ORDERING CONTRACT. Two invocations, same fixed order as before: restore + strict
# acquire first (refusing partial target coverage), then projections + sync with
# computed_at sampled only after every retained SEC receipt exists. The bundle is
# published after both, then read back byte-for-byte through the exact code path
# tomorrow's engine will run.
#
# FAILURE SEMANTICS. A red lane publishes nothing, so the R2 pointer stays at the last
# COMPLETE bundle and the engine renders stale-but-complete (its restore warns beyond
# 3 days and refuses beyond 21). That is strictly better blast radius than the old
# arrangement, where one partial SEC acquisition killed the entire nightly render.
on:
  schedule:
    # 02:30 UTC — after EDGAR's 22:00 ET / ~02:00 UTC same-day acceptance close, and
    # hours before daily.yml's engine job (which starts ~05:00-06:30 UTC after the
    # 22:30 UTC trigger + collect). The 02:30 -> 06:00Z gap carries essentially no
    # acceptances, so the bundle's as_of loses nothing against the old inline ~06:00Z one.
    - cron: "30 2 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  # Never cancel a mid-sync evidence writer. Immutable creates + CAS pointers make an
  # interruption safe to retry, but a half-written snapshot has no value — let writes
  # conclude and let the next scheduled run catch up.
  group: filing-forensics-sec
  cancel-in-progress: false

jobs:
  acquire_project_sync:
    runs-on: [self-hosted, macstudio-light]
    # Measured publish-step duration: 2,390 s on 2026-10-18 and 2,388 s on 2026-10-19,
    # and the 45-minute job timeout cancelled the 10-19 run after the publish succeeded.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: python 3.12 (Homebrew venv — self-hosted runner)
        run: |
          VENV="$HOME/.cache/mm-venv-${RUNNER_NAME:-default}"
          [ -x "$VENV/bin/python" ] || /opt/homebrew/bin/python3.12 -m venv "$VENV"
          echo "$VENV/bin" >> "$GITHUB_PATH"
          "$VENV/bin/python" -m pip install --quiet --upgrade pip
      # The projection builder imports scripts.build_fundamental_forensics._metadata,
      # so this lane needs the full stack, not the light research-ingest subset.
      - run: pip install -r requirements.txt
      - name: restore, acquire, project, and sync Filing Forensics SEC sources (hard gate)
        # Hard gate: a restore, strict-acquisition, projection, or source-sync failure
        # stops this lane before the bundle is published, so the engine keeps reading the
        # last COMPLETE bundle instead of a shallow or partial one.
        #
        # The first call is restore -> acquire and refuses partial target coverage. The
        # second is projection -> sync, with computed_at sampled only after source
        # retrieval so its explicit clock cannot precede a receipt. Neither call renders
        # the public shell nor publishes private browser state.
        env:
          R2_RESEARCH_ENDPOINT: ${{ secrets.R2_RESEARCH_ENDPOINT }}
          R2_RESEARCH_ACCESS_KEY_ID: ${{ secrets.R2_RESEARCH_ACCESS_KEY_ID }}
          R2_RESEARCH_SECRET_ACCESS_KEY: ${{ secrets.R2_RESEARCH_SECRET_ACCESS_KEY }}
          R2_RESEARCH_BUCKET: ${{ secrets.R2_RESEARCH_BUCKET }}
        run: |
          set -euo pipefail
          utc_now() { python -c 'from datetime import datetime, timezone; print(datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z"))'; }
          as_of="$(utc_now)"          # SEC acceptance-time cutoff, fixed before network I/O.
          recorded_at="$(utc_now)"    # explicit snapshot/receipt recording clock.

          # Warm store roots OUTSIDE the checkout. actions/checkout clean:true wipes the
          # gitignored source trees on every run (measured current_files: 0 nightly), which
          # forced a full cold restore of the whole growing store; a warm root reduces the
          # restore to local hash verification (--verify-local-restore).
          #
          # --reuse-local-archive extends that warm root to the ACQUIRE leg. The ~128MB of
          # 10-K/10-Q primary documents re-downloaded nightly is already retained here
          # (127.96MB -> 127.93MB across 08-05..08-08, zero new filings), so a sha256-verified
          # local hit reuses the ORIGINAL retrieval receipt instead of re-fetching identical
          # bytes — SEC fair-access courtesy, and no cache hit ever mints a fresh clock. A cold,
          # ambiguous, or unverifiable archive silently falls back to fetching; Submissions are
          # always fetched fresh, which is how a new filing is discovered.
          RAW="$HOME/.cache/mm-ffsec/raw"
          ARCHIVE="$HOME/.cache/mm-ffsec/archive"
          # The per-run observation log ("we looked, nothing changed") is a SIBLING of the
          # two synced trees, never a child: restore/sync carry exactly raw + archive, and
          # our cron history is not a replay input (R6 of the 2026-08-08 mint adjudication,
          # DNR:LAW-RUN-CLOCK-IN-CONTENT-IDENTITY). MUST be passed explicitly: the CLI's own
          # default is inside the checkout, which clean:true wipes every run, so an implicit
          # default would destroy the log nightly. The warm $HOME root is what makes it
          # survive. NOT replicated to R2 — SOURCE_KINDS stays (raw, archive); a durable
          # off-host copy would need its own prefix and publisher (deferred rider).
          OBS="$HOME/.cache/mm-ffsec/observations"
          mkdir -p "$RAW" "$ARCHIVE" "$OBS"

          python -m scripts.run_fundamental_forensics_wave2 \
            --targets-file config/fundamental_forensics/wave2_targets.v1.json \
            --raw-root "$RAW" --archive-root "$ARCHIVE" --observation-root "$OBS" \
            --restore --verify-local-restore --acquire --reuse-local-archive --require-complete-acquisition \
            --max-tickers 12 --as-of "$as_of" --recorded-at "$recorded_at" --computed-at "$recorded_at"

          computed_at="$(utc_now)"   # sampled after all retained SEC receipts exist.
          python -m scripts.run_fundamental_forensics_wave2 \
            --targets-file config/fundamental_forensics/wave2_targets.v1.json \
            --raw-root "$RAW" --archive-root "$ARCHIVE" --observation-root "$OBS" \
            --build-projections --sync --incremental-sync \
            --max-tickers 12 --as-of "$as_of" --recorded-at "$recorded_at" --computed-at "$computed_at"
      - name: publish disclosure-projection bundle (the engine's render input)
        # One immutable content-addressed object plus a CAS latest pointer. A missing or
        # invalid local projection refuses the whole publication — a partial bundle would
        # silently shrink the coverage the workbench attaches.
        env:
          R2_RESEARCH_ENDPOINT: ${{ secrets.R2_RESEARCH_ENDPOINT }}
          R2_RESEARCH_ACCESS_KEY_ID: ${{ secrets.R2_RESEARCH_ACCESS_KEY_ID }}
          R2_RESEARCH_SECRET_ACCESS_KEY: ${{ secrets.R2_RESEARCH_SECRET_ACCESS_KEY }}
          R2_RESEARCH_BUCKET: ${{ secrets.R2_RESEARCH_BUCKET }}
        run: |
          set -euo pipefail
          utc_now() { python -c 'from datetime import datetime, timezone; print(datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z"))'; }
          python -m scripts.fundamental_forensics_disclosure_bundle \
            --publish --targets-file config/fundamental_forensics/wave2_targets.v1.json \
            --published-at "$(utc_now)"
      - name: restore self-check (byte-verified roundtrip of the published bundle)
        # Proves the EXACT code path tonight's engine gate runs, against prod R2, in the
        # same run that published: restore into a scratch root and byte-compare every
        # ticker against the projection this lane just built. A green publish with an
        # unreadable bundle would otherwise only be discovered by a red nightly render.
        env:
          R2_RESEARCH_ENDPOINT: ${{ secrets.R2_RESEARCH_ENDPOINT }}
          R2_RESEARCH_ACCESS_KEY_ID: ${{ secrets.R2_RESEARCH_ACCESS_KEY_ID }}
          R2_RESEARCH_SECRET_ACCESS_KEY: ${{ secrets.R2_RESEARCH_SECRET_ACCESS_KEY }}
          R2_RESEARCH_BUCKET: ${{ secrets.R2_RESEARCH_BUCKET }}
        run: |
          set -euo pipefail
          utc_now() { python -c 'from datetime import datetime, timezone; print(datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z"))'; }
          SELFCHECK_ROOT="$RUNNER_TEMP/ffdisc-selfcheck-${GITHUB_RUN_ID}"
          mkdir -p "$SELFCHECK_ROOT"
          python -m scripts.fundamental_forensics_disclosure_bundle \
            --restore --targets-file config/fundamental_forensics/wave2_targets.v1.json \
            --root "$SELFCHECK_ROOT" --now "$(utc_now)"
          SELFCHECK_ROOT="$SELFCHECK_ROOT" python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import sys
          from pathlib import Path

          RELATIVE = Path("data/fundamental_forensics/private/disclosures")
          scratch = Path(os.environ["SELFCHECK_ROOT"]) / RELATIVE
          checkout = Path(".") / RELATIVE
          targets = json.loads(
              Path("config/fundamental_forensics/wave2_targets.v1.json").read_text(encoding="utf-8")
          )["targets"]

          failures: list[str] = []
          for entry in targets:
              name = f"{entry['ticker']}.json"
              restored = scratch / name
              original = checkout / name
              if not restored.is_file():
                  failures.append(f"{name}: absent from the restored bundle")
                  continue
              if not original.is_file():
                  failures.append(f"{name}: absent from the lane's own projection output")
                  continue
              if restored.read_bytes() != original.read_bytes():
                  failures.append(f"{name}: restored bytes differ from the published projection")
          if failures:
              print(
                  "::error title=filing-forensics-sec::published bundle failed its restore "
                  "self-check — " + "; ".join(failures),
                  flush=True,
              )
              sys.exit(1)
          print(f"restore self-check OK: {len(targets)} projections byte-identical", flush=True)
          PY
      - name: acquire contract-issuer filings (isolated, non-gating)
        # D13 isolation: the frozen coverage contract's issuers ride a SEPARATE
        # acquire, because one contract issuer's recent Submissions window
        # holds a single 10-K, so its bounded acquire is PARTIAL by
        # construction and the incumbent hard gate would refuse it nightly.
        # This step never touches the incumbent invocations above: same warm
        # RAW/ARCHIVE roots (so retention is identical — its own incremental
        # sync tonight, the incumbents' root-wide non-pruning sync on later
        # nights) but a SEPARATE observation root, so incumbent observation
        # bytes never move. continue-on-error keeps a contract crash or step
        # timeout from marking incumbents red; the job still ends non-zero via
        # the last "fail on contract-acquire crash" step, after every
        # incumbent step has completed. Non-gating: no
        # --require-complete-acquisition — a typed partial is reported as a
        # ::warning by contract-acquire-summary, never fatal. No --restore:
        # the incumbents' root-wide sync already carries these roots forward.
        # The cap is main's 12 for the acquire itself; 15 appears ONLY on the
        # targets derivation, which hard-fails if the union exceeds it.
        id: contract_acquire
        continue-on-error: true
        timeout-minutes: 15
        env:
          R2_RESEARCH_ENDPOINT: ${{ secrets.R2_RESEARCH_ENDPOINT }}
          R2_RESEARCH_ACCESS_KEY_ID: ${{ secrets.R2_RESEARCH_ACCESS_KEY_ID }}
          R2_RESEARCH_SECRET_ACCESS_KEY: ${{ secrets.R2_RESEARCH_SECRET_ACCESS_KEY }}
          R2_RESEARCH_BUCKET: ${{ secrets.R2_RESEARCH_BUCKET }}
        run: |
          set -euo pipefail
          utc_now() { python -c 'from datetime import datetime, timezone; print(datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z"))'; }
          as_of="$(utc_now)"        # sampled at THIS step's start: strictly later
          recorded_at="$(utc_now)"  # than the incumbent sync's snapshot clock, so
                                    # the contract sync's latest-pointer CAS cannot
                                    # be refused as a rewind.
          RAW="$HOME/.cache/mm-ffsec/raw"
          ARCHIVE="$HOME/.cache/mm-ffsec/archive"
          OBS_CONTRACT="$HOME/.cache/mm-ffsec/observations-contract"
          mkdir -p "$RAW" "$ARCHIVE" "$OBS_CONTRACT"

          CONTRACT_TARGETS="$(python -m scripts.publish_fif_production_datasets targets \
            --coverage-file config/fundamental_forensics/coverage/five_issuer_v1.json \
            --targets-file config/fundamental_forensics/wave2_targets.v1.json \
            --max-tickers 15)"

          python -m scripts.run_fundamental_forensics_wave2 \
            $CONTRACT_TARGETS \
            --raw-root "$RAW" --archive-root "$ARCHIVE" --observation-root "$OBS_CONTRACT" \
            --acquire --reuse-local-archive --sync --incremental-sync \
            --max-tickers 12 --as-of "$as_of" --recorded-at "$recorded_at" --computed-at "$recorded_at" \
            > "$RUNNER_TEMP/fif-contract-acquire-result-${GITHUB_RUN_ID}.json"

          python -m scripts.publish_fif_production_datasets contract-acquire-summary \
            --result "$RUNNER_TEMP/fif-contract-acquire-result-${GITHUB_RUN_ID}.json" \
            --report-path "$RUNNER_TEMP/fif-contract-acquire-summary-${GITHUB_RUN_ID}.json"

          # C0-c E1 (option (i), amendment (A) — the ADD case): acquire-contract
          # runs AFTER the D13 wave-2 invocation + summary inside this SAME
          # isolated step. The D13 invocation stays byte-identical above: its
          # stdout feeds contract-acquire-summary, which capture reads —
          # consumers beyond member capture — so E1 is ADDED, not a replacement.
          # It acquires every contract accession's primary + manifest keyed by
          # ACCESSION (the latest-2 selector never sees 8-Ks or page-window
          # rows), reusing retained manifests, verified pages, and prior
          # primary receipts first. Retention is the incumbents' own: pages via
          # the historical-shard fetch (publish_latest=false) into the warm RAW
          # root, manifests via retain_filing_manifest into the warm ARCHIVE
          # root — those bytes live in the warm local RAW/ARCHIVE roots, where
          # tonight's capture/publish read them (and the next night reuses
          # them with zero requests); they reach R2 only through the NEXT
          # night's incumbent root-wide non-pruning --sync, i.e. one night
          # later. A typed partial is a ::warning; a crash-class failure
          # (e.g. a retained page failing receipt verification) fails this
          # step AFTER the incumbents finished, exactly like the D13 crash
          # path.
          python -m scripts.publish_fif_production_datasets acquire-contract \
            --coverage-file config/fundamental_forensics/coverage/five_issuer_v1.json \
            --raw-root "$RAW" --archive-root "$ARCHIVE" \
            --recorded-at "$(utc_now)" \
            --min-interval-seconds 0.5 \
            --contract-acquire-summary "$RUNNER_TEMP/fif-contract-acquire-summary-${GITHUB_RUN_ID}.json" \
            --report-path "$RUNNER_TEMP/fif-contract-acquire-acquire-report-${GITHUB_RUN_ID}.json"
      - name: capture FIF filing packages (contract issuers)
        # D13 W3: capture/publish run only when the contract acquire state is
        # KNOWN (outcome success — partial included, since a typed partial is
        # the expected contract shape). A crashed or timed-out contract step
        # skips both; the job still ends red via the crash step below.
        # C0-b D1 member capture: for each contract accession whose primary this
        # lane retained, fetch the archive index + the five XBRL role members
        # under the ONE shared SecRequestPacer, mint the acceptance witness from
        # the retained Submissions bytes, and write the package subtree under a
        # NEW fif-packages/ prefix in the warm archive root. Hard gate: no
        # continue-on-error, the script exits non-zero on any failure.
        # No env block: capture touches only SEC (through the collector) and
        # the warm archive root — never the object store, so it gets no
        # credentials at all (D7).
        if: steps.contract_acquire.outcome == 'success'
        run: |
          set -euo pipefail
          utc_now() { python -c 'from datetime import datetime, timezone; print(datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z"))'; }
          RAW="$HOME/.cache/mm-ffsec/raw"
          ARCHIVE="$HOME/.cache/mm-ffsec/archive"
          CAPTURE_REPORT="$RUNNER_TEMP/fif-member-capture-report-${GITHUB_RUN_ID}.json"
          # D13 W3: the contract acquire summary (same run id) rides into the
          # capture report as its contract_acquire block; publish carries the
          # block onward through this same report path.
          CONTRACT_ACQUIRE_SUMMARY="$RUNNER_TEMP/fif-contract-acquire-summary-${GITHUB_RUN_ID}.json"
          python -m scripts.publish_fif_production_datasets capture-members \
            --coverage-file config/fundamental_forensics/coverage/five_issuer_v1.json \
            --raw-root "$RAW" --archive-root "$ARCHIVE" \
            --recorded-at "$(utc_now)" \
            --min-interval-seconds 0.5 \
            --contract-acquire-report "$CONTRACT_ACQUIRE_SUMMARY" \
            --report-path "$CAPTURE_REPORT"
      - name: publish FIF production datasets (hard gate)
        # D13 W3: same known-state gate as capture — never publish from a run
        # whose contract acquisition state is unknown.
        # C0-b publication: admit retained packages per contract issuer, compute
        # the CLOCK RULE admitted_at, mint lineage evidence through the S2-p
        # seam, publish one immutable generation per published issuer, and
        # verify latest.json NAMES every generation. Every other contract
        # issuer gets exactly one typed exclusion row — never silence. Hard
        # gate: a red publish stops the lane with rc != 0 and a line-start
        # ::error; the schedule stays the only proof path (no dispatch rerun).
        if: steps.contract_acquire.outcome == 'success'
        env:
          R2_RESEARCH_ENDPOINT: ${{ secrets.R2_RESEARCH_ENDPOINT }}
          R2_RESEARCH_ACCESS_KEY_ID: ${{ secrets.R2_RESEARCH_ACCESS_KEY_ID }}
          R2_RESEARCH_SECRET_ACCESS_KEY: ${{ secrets.R2_RESEARCH_SECRET_ACCESS_KEY }}
          R2_RESEARCH_BUCKET: ${{ secrets.R2_RESEARCH_BUCKET }}
        run: |
          set -euo pipefail
          utc_now() { python -c 'from datetime import datetime, timezone; print(datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z"))'; }
          RAW="$HOME/.cache/mm-ffsec/raw"
          ARCHIVE="$HOME/.cache/mm-ffsec/archive"
          REPORT="$RUNNER_TEMP/fif-production-publish-report-${GITHUB_RUN_ID}.json"
          # D6: the capture step's report (same RUNNER_TEMP path, same run id)
          # feeds publish so capture failures file as member_capture_failed:<code>.
          CAPTURE_REPORT="$RUNNER_TEMP/fif-member-capture-report-${GITHUB_RUN_ID}.json"
          python -m scripts.publish_fif_production_datasets publish \
            --coverage-file config/fundamental_forensics/coverage/five_issuer_v1.json \
            --raw-root "$RAW" --archive-root "$ARCHIVE" \
            --recorded-at "$(utc_now)" \
            --capture-report "$CAPTURE_REPORT" \
            --report-path "$REPORT"
          python -m scripts.publish_fif_production_datasets verify \
            --coverage-file config/fundamental_forensics/coverage/five_issuer_v1.json \
            --report-path "$REPORT"
      - name: upload FIF publication reports (always)
        # D5 / spec §4: the run report is 'stdout + workflow artifact'. A red
        # lane's reports are exactly the ones an operator needs, so the upload
        # runs on `if: always()` — after a failed capture/publish step, not
        # only after a green one. D13 W4: the contract acquire's result +
        # summary ride the same always-upload (a crashed contract step leaves
        # exactly the evidence an operator needs). Pinned to the same
        # upload-artifact sha the repo's other diagnostics captures use.
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fif-production-reports-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/fif-production-publish-report-${{ github.run_id }}.json
            ${{ runner.temp }}/fif-member-capture-report-${{ github.run_id }}.json
            ${{ runner.temp }}/fif-contract-acquire-result-${{ github.run_id }}.json
            ${{ runner.temp }}/fif-contract-acquire-summary-${{ github.run_id }}.json
            ${{ runner.temp }}/fif-contract-acquire-acquire-report-${{ github.run_id }}.json
      - name: fail on contract-acquire crash
        # D13 W5: with continue-on-error, a contract crash or step timeout is
        # outcome=failure while the job is still green — and by construction
        # every incumbent step above has already completed. Fail the JOB here:
        # a crash is never swallowed into a warning. A failed incumbent step
        # skips the contract step entirely (outcome=skipped), so this never
        # fires and the job is already red from the incumbent.
        if: always() && steps.contract_acquire.outcome == 'failure'
        run: |
          echo "::error title=fif-contract-acquire::contract acquire crashed or timed out; incumbent steps completed"
          exit 1
