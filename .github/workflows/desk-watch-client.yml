name: desk-watch-client

on:
  pull_request:
    paths:
      - "templates/desk_watch.js"
      - "site/desk_watch.js"
      - "tests/test_desk_watch_client.py"
      - "tests/conftest.py"
      - ".github/workflows/desk-watch-client.yml"

permissions:
  contents: read

jobs:
  desk-watch-client:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Immutable refs for the repository's existing checkout v4 / Python v5 / Node v4 actions.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
      - name: Install existing test dependency
        run: python -m pip install pytest==9.1.1
      - name: Verify Desk Watch client syntax and availability states
        run: |
          node --check templates/desk_watch.js
          python -m pytest tests/test_desk_watch_client.py -q
