name: ci-authority

# This workflow is designed to be selected by an organization required-workflow
# ruleset. pull_request_target loads this file from the trusted default branch;
# every checkout below pins the framework workflow definition and never
# materializes the candidate head. The controller posts the same stable check name directly to
# the exact, API-reverified PR head as diagnostic evidence only. That custom
# check must never be the sole required authority: the organization
# required-workflow rule remains mandatory.
#
# Base-specific exact-head contexts are complementary: `ci-authority/main` and
# `ci-authority/codex/merge-queue-pilot`. Each PR run fails the inactive context
# so an edited retarget cannot reuse a success earned against another base.
# Required-workflow event filters do not treat `edited` as a fresh authority
# run, so these contexts close that metadata-only retarget seam; they do not
# replace the mandatory organization required workflow.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
  merge_group:
    types: [checks_requested]

permissions: {}

concurrency:
  group: ci-authority-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.run_id }}
  # A later edited event is not a replacement for the required opened/synchronize
  # workflow. Preserve both executions and their real conclusions. Keeping only
  # one pending run also drops required events during a burst, so retain GitHub's
  # bounded queue (100 pending runs) while executing one run per group at a time.
  # Overflow remains a cancellation/refusal, never a synthetic success.
  cancel-in-progress: false
  queue: max

jobs:
  ci-authority:
    name: ci-authority
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      checks: write
      contents: read
      pull-requests: read
      actions: read
    steps:
      # Exact framework workflow definition; the native resolver separately
      # authenticates its required protected source ref/SHA before subject use.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 1
          sparse-checkout: scripts
          persist-credentials: false

      - name: publish exact-head trusted-base authority verdict
        if: ${{ github.event_name == 'pull_request_target' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 -I scripts/ci_authority.py --event "$GITHUB_EVENT_PATH"

      # The job itself is the stable check on GitHub's synthetic queue head. Its
      # executable comes from the exact framework workflow definition above.
      - name: validate authenticated native membership
        if: ${{ github.event_name == 'merge_group' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 -I scripts/ci_authority.py --native-membership --event "$GITHUB_EVENT_PATH" --output "$RUNNER_TEMP/native-group.json"
