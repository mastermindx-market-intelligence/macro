name: commodity-sentinel
on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 min (Actions cron is best-effort ~15-45 min)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: commodity-sentinel
  cancel-in-progress: false

jobs:
  shock:
    runs-on: [self-hosted, macstudio-light]   # light runner — 30-min shock watch must not queue behind the heavy pool
    timeout-minutes: 8
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: python 3.12 (Homebrew venv - self-hosted runner)
        run: |
          VENV="$HOME/.cache/mm-venv-${RUNNER_NAME:-default}"
          [ -x "$VENV/bin/python" ] || /opt/homebrew/bin/python3.12 -m venv "$VENV"
          echo "$VENV/bin" >> "$GITHUB_PATH"
          "$VENV/bin/python" -m pip install --quiet --upgrade pip
      - run: pip install -r requirements.txt
      - name: commodity shock sentinel (price-only, ~30 min cadence)
        id: sentinel
        run: |
          set +e
          python -m scripts.commodity_sentinel
          echo "rc=$?" >> "$GITHUB_OUTPUT"
          exit 0
      # Commit ONLY on a shock-state change (no heartbeat spam). The state is
      # recomputed deterministically from hourly bars each run; the sentinel
      # re-fetches recent bars live, so it never needs persisted state to know
      # the CURRENT state, only to detect a transition. Rebuild ONLY commodities.html
      # (+ data) — deliberately NOT build_vector/index.html: the rendered hub blob is
      # also written by vector-sentinel + daily, and committing it here would make
      # `git pull --rebase` conflict on the per-run timestamp line. The home hub feed
      # picks up the new alert on the next daily run; the commodities timeline updates now.
      - name: Stage commodity commit and publication intent
        id: native_publication_stage
        if: steps.sentinel.outputs.rc == '10'
        env:
          NATIVE_PUBLICATION_PUBLISHING_STEP: native_publication_stage
          NATIVE_PUBLICATION_TOKEN_ORIGIN: GITHUB_TOKEN
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Capture repository-owned execution bytes from the original protected
          # workflow SHA BEFORE rebase can replace files in the candidate tree.
          umask 077
          [[ "$GITHUB_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          native_code_root="${RUNNER_TEMP%/}/native-publication-code-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}"
          mkdir -m 700 -- "$native_code_root"
          mkdir -p -- "$native_code_root/scripts/ci"
          GIT_NO_REPLACE_OBJECTS=1 GIT_NO_LAZY_FETCH=1 git show \
            "$GITHUB_WORKFLOW_SHA:scripts/ci/native_publication_source.sh" \
            > "$native_code_root/scripts/ci/native_publication_source.sh"
          case "$(GIT_NO_REPLACE_OBJECTS=1 git ls-tree "$GITHUB_WORKFLOW_SHA" -- scripts/ci/native_publication_source.sh)" in
            100644*) : ;; *) exit 76 ;;
          esac
          . "$native_code_root/scripts/ci/native_publication_source.sh"
          native_publication_capture_source "$native_code_root" "$GITHUB_WORKFLOW_SHA"
          . "$native_code_root/scripts/ci/push_retry.sh"
          python -m scripts.build_commodities
          git config user.name "dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          # normalize the page this step stages (P0 2026-08-04, 9a997e9da3f): a lane
          # that commits site/ HTML without the shim/externalize/stamp chain publishes
          # a RAW page — inline <style>, no assets/css/<hash>.css ref, stale ?v= — and
          # holds it until the next full-tree render re-bakes commodities.html. Cheaper
          # to be correct at the source than to wait for someone else's heal. All three
          # passes are idempotent (~20s over the tree) and non-blocking: a shock alert
          # must still publish even if a sweep fails.
          python -m scripts.inject_data_base || echo "data-base shim inject skipped (additive)"
          python -m scripts.externalize_css || echo "::warning title=externalize::pre-commit css externalize FAILED — pages may ship un-externalized (9a997e9da3f)"
          python -m scripts.optimize_assets || echo "::warning title=stamp::asset optimize FAILED — ?v= stamps may be stale"
          # W6a SENTINEL STAGING LAW: commodity_shock reflex writes to data/reflexes/
          # when it fires. Stage alongside data/commodity so the firing record is
          # never left as unstaged tracked changes.
          git add data/commodity data/reflexes/ site/commodities.html
          # ...and the content-hashed assets the page now links: externalize_css rewrites
          # commodities.html to <link> site/assets/css/<hash>.css, so staging the page
          # without the asset ships a 404 stylesheet. --ignore-removal never stages a
          # DELETION — the orphan prune reasons only from pages it can see, and this lane
          # has no post-rebase normalize to re-mint an asset a sibling still links.
          # Separate lines: `git add a b` exits 128 when either pathspec matches nothing.
          git add --ignore-removal site/assets/css 2>/dev/null || true
          git add --ignore-removal site/assets/js 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "commodity: shock alert $(date -u +%FT%H:%MZ)"
          PUSH_MAX_ATTEMPTS=5
          push_retry_init "commodity shock state"
          while push_attempt; do
            # pre-sync collision sweep (render.yml / #2252): a mid-run commit on origin/main can
            # TRACK a path this job wrote as an UNTRACKED side-effect — the rebase checkout then
            # refuses ("untracked working tree files would be overwritten") and --autostash can't
            # clear it (it parks tracked modifications only), so every retry dies identically.
            # Everything this step publishes is already committed above, so a path untracked HERE
            # but tracked on origin/main is a throwaway local write — origin/main is authoritative.
            # Gitignored files and untracked paths origin/main doesn't track never enter the
            # intersection (runner-local stores and caches are untouched).
            git fetch origin main || true
            comm -12 <(git ls-files --others --exclude-standard | LC_ALL=C sort) \
                     <(git ls-tree -r --name-only origin/main | LC_ALL=C sort) \
              | while IFS= read -r f; do rm -f -- "$f" || true; done
            if git pull --rebase --autostash -X theirs origin main && push_autostash_ok; then
              if push_do; then
                echo "publication=published" >> "$GITHUB_OUTPUT"
                push_won
                exit 0
              elif push_native_pending; then
                # This step stages an intent. Ordinary push_do stayed nonzero;
                # the final read-only gate alone may report native publication.
                echo "publication=pending" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            push_abort_rebase
            push_backoff
          done
          push_lost
          exit 1

      - name: Retain original commodity publication origin
        id: native_publication_origin
        if: ${{ always() && steps.native_publication_stage.outcome == 'success' && steps.native_publication_stage.outputs.native_origin_path != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.native_publication_stage.outputs.native_origin_name }}
          path: ${{ steps.native_publication_stage.outputs.native_origin_path }}
          if-no-files-found: error
          retention-days: 7
          overwrite: false

      - name: Confirm original protected commodity publication
        id: native_publication
        if: ${{ always() && steps.native_publication_stage.outcome == 'success' && steps.native_publication_origin.outcome == 'success' && steps.native_publication_stage.outputs.native_origin_path != '' }}
        env:
          NATIVE_ORIGINAL_RECORD: ${{ steps.native_publication_stage.outputs.native_origin_path }}
          NATIVE_ORIGINAL_DEADLINE: ${{ steps.native_publication_stage.outputs.native_deadline }}
          NATIVE_ORIGINAL_CODE: ${{ steps.native_publication_stage.outputs.native_code_root }}
          NATIVE_PUBLICATION_TOKEN_ORIGIN: GITHUB_TOKEN
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PYTHONPATH="$NATIVE_ORIGINAL_CODE" python3 -P -m scripts.ci.native_queue_push settle --root "$GITHUB_WORKSPACE" \
            --record "$NATIVE_ORIGINAL_RECORD" --deadline "$NATIVE_ORIGINAL_DEADLINE" --write-output
