name: research-cross-session-prospective-us

on:
  push:
    branches:
      - sol/geopolitical-relief-event-study-20260924
    paths:
      - ".github/workflows/research-cross-session-prospective-us.yml"
      - "research/CROSS_SESSION_PROSPECTIVE_SOURCE_ADMISSIONS_2026-10-05.json"
      - "scripts/research/capture_cross_session_transfer.py"
      - "scripts/research/replay_event_microstructure.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-cross-session-prospective-us-${{ github.ref }}
  cancel-in-progress: false

jobs:
  measure-us-only:
    runs-on: [self-hosted, macstudio-light]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: python 3.12
        run: |
          VENV="$HOME/.cache/mm-venv-${RUNNER_NAME:-default}"
          [ -x "$VENV/bin/python" ] || /opt/homebrew/bin/python3.12 -m venv "$VENV"
          echo "$VENV/bin" >> "$GITHUB_PATH"
          "$VENV/bin/python" -m pip install --quiet --upgrade pip

      - name: install repository dependencies
        run: pip install -r requirements.txt

      - name: measure frozen U.S. event legs only
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.research import capture_cross_session_transfer as capture

          src = Path("research/CROSS_SESSION_PROSPECTIVE_SOURCE_ADMISSIONS_2026-10-05.json")
          doc = json.loads(src.read_text(encoding="utf-8"))

          rows = []
          for admission in doc["events"]:
              measured = capture.measure_us_response(admission)
              if measured.get("hk_outcome_state") != "NOT_READ_BY_THIS_HARNESS":
                  raise SystemExit("HK outcome firewall violated")
              rows.append(measured)

          out = {
              "schema": "research.cross_session_prospective_us_measurements.v1",
              "source_admission_sha256": __import__("hashlib").sha256(src.read_bytes()).hexdigest(),
              "github_sha": __import__("os").environ["GITHUB_SHA"],
              "hsi_outcomes_read": False,
              "vendor_bars_persisted": False,
              "measurements": rows,
          }
          target = Path("prospective-us-measurements.json")
          target.write_text(json.dumps(out, indent=2, sort_keys=True) + "\n", encoding="utf-8")

          summary = []
          for row in rows:
              summary.append({
                  "event_id": row["event_id"],
                  "session": row["session"],
                  "primary_v1_bps": row["primary_v1"]["return_bps"],
                  "challenger_v1_1_bps": row["challenger_v1_1"]["return_bps"],
                  "hk_outcome_state": row["hk_outcome_state"],
              })
          print(json.dumps(summary, indent=2))
          PY

      - name: upload U.S.-only research receipt
        uses: actions/upload-artifact@v4
        with:
          name: prospective-us-measurements
          path: prospective-us-measurements.json
          if-no-files-found: error
          retention-days: 14
