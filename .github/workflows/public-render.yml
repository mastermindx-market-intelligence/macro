name: public-render

# GitHub-hosted fast lane for data-free public surfaces. Direct template/site
# pairs already land together; this job renders the four Jinja public pages,
# refreshes immutable asset stamps, and pushes only the derived site/templates
# delta. It never waits for or occupies the self-hosted market renderer.
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - ".github/workflows/public-render.yml"
      - "config/plans.yml"
      # Build inputs to site/plans.html since the chat allowances stopped being
      # literals (lib/chat_allowance.py reads config/brain.yml — the same file
      # brain_gateway._get_allowance enforces). Without these two the page would
      # keep the old numbers after a reprice, silently.
      - "config/brain.yml"
      - "lib/chat_allowance.py"
      - "lib/glossary.py"
      - "lib/help_directory.py"
      - "scripts/build_public_pages.py"
      - "scripts/ci/public_render.sh"
      - "templates/*.html"
      - "templates/*.css"
      - "templates/*.js"
      - "templates/*.json"
      - "templates/*.txt"
      - "templates/*.svg"
      - "templates/_public_chrome_css.html.j2"
      - "templates/_public_chrome_js.html.j2"
      - "templates/_public_footer.html.j2"
      - "templates/_public_nav.html.j2"
      - "templates/glossary.html.j2"
      - "templates/help.html.j2"
      - "templates/plans.html.j2"
      - "templates/seo_base.html.j2"
      - "templates/support.html.j2"
      - "templates/unsubscribe.html.j2"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pipeline-public-render
  # Every run rebuilds from current main, so the newest push safely supersedes an
  # older public render instead of creating another serial traffic jam.
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    # The push loop has a 10-minute contention budget. Setup + the initial
    # deterministic sweep run before that budget starts, so 15 minutes could
    # terminate the job before its retry policy did. This is headroom, not an
    # expected runtime: the no-upstream fast path now pushes immediately.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          # Full history accounted for roughly seven minutes of the first
          # 13-minute proof run. Two commits are enough for the bot commit and
          # its rebase/push retry while keeping this lane inside merge cadence.
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install public-render dependencies
        run: python -m pip install --quiet jinja2 pyyaml rjsmin==1.2.5
      - name: Stage public surfaces and publication intent
        id: native_publication_stage
        env:
          NATIVE_PUBLICATION_PUBLISHING_STEP: native_publication_stage
          NATIVE_PUBLICATION_TOKEN_ORIGIN: GITHUB_TOKEN
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci/public_render.sh

      - name: Retain original public-render publication origin
        id: native_publication_origin
        if: ${{ always() && steps.native_publication_stage.outcome == 'success' && steps.native_publication_stage.outputs.native_origin_path != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.native_publication_stage.outputs.native_origin_name }}
          path: ${{ steps.native_publication_stage.outputs.native_origin_path }}
          if-no-files-found: error
          retention-days: 7
          overwrite: false

      - name: Confirm original protected public-render publication
        id: native_publication
        if: ${{ always() && steps.native_publication_stage.outcome == 'success' && steps.native_publication_origin.outcome == 'success' && steps.native_publication_stage.outputs.native_origin_path != '' }}
        env:
          NATIVE_ORIGINAL_RECORD: ${{ steps.native_publication_stage.outputs.native_origin_path }}
          NATIVE_ORIGINAL_DEADLINE: ${{ steps.native_publication_stage.outputs.native_deadline }}
          NATIVE_ORIGINAL_CODE: ${{ steps.native_publication_stage.outputs.native_code_root }}
          NATIVE_PUBLICATION_TOKEN_ORIGIN: GITHUB_TOKEN
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PYTHONPATH="$NATIVE_ORIGINAL_CODE" python3 -P -m scripts.ci.native_queue_push settle --root "$GITHUB_WORKSPACE" \
            --record "$NATIVE_ORIGINAL_RECORD" --deadline "$NATIVE_ORIGINAL_DEADLINE" --write-output
