name: research-ingest
# Hourly Research Vault ingestion (RV W1). Pulls new third-party research PDFs +
# JSON sidecars from the PRIVATE R2 inbox (research_inbox/), extracts body text
# (pdftotext), promotes each PDF into research_vault/, and publishes the public-safe
# catalog.json + FTS corpus.sqlite back to R2. A snapshot of catalog.json is
# committed to data/research_vault/catalog.json so the nightly render can SSR-bake
# without R2 at render time.
#
# WHY macstudio-light: needs poppler `pdftotext` (already used by
# collectors/hk_cbbc_sld.py) which lives on the self-hosted Macs, and this is a
# ~hourly light job that must not queue behind the heavy nightly pool.
#
# The `preflight` step below is the one FAIL-CLOSED gate in an otherwise
# never-raise lane, and it exists because a runner label is not a dependency
# guarantee: on 2026-07-30 ~13Z the macstudio-light label moved to a Mac with no
# poppler, so `pdftotext` was missing for two days. The pipeline degraded exactly
# as designed — empty body, honest `text_layer='unavailable'` — but it also wrote
# a RECEIPT for each of those 127 documents, and receipts make re-ingestion
# impossible by design. A tooling outage therefore became permanent damage to the
# published corpus. Failing before the ingest step keeps the documents in the
# inbox (no receipts, retried next hour) and turns the outage into a red lane
# instead of silently maimed documents. Rows already frozen by that window are
# healed by ingest._reextract_bodies, which re-runs pdftotext over the vault PDF.
#
# The pipeline is idempotent + never-raise-per-item: a re-run ingests 0, and one
# bad PDF/sidecar never aborts the batch (engine/research_vault/ingest.py).
#
# Source-content freshness (check_research_vault_source_freshness) fails the
# lane when the newest admitted report is outside its fixed weekday deadline.
# While MarketDesk is a known outage, set repo variable
# RESEARCH_VAULT_SOURCE_OUTAGE_ACK=true to let the typed guard soften only a
# PRODUCER_STALE verdict to a warning (avoids ~24 red runs/day of alarm fatigue).
# Integrity, configuration, clock, and transport failures remain red. Optionally set
# RESEARCH_VAULT_SOURCE_MAX_AGE_HOURS to temporarily widen the window instead.
# Clear both when the producer resumes.
on:
  workflow_dispatch:
    inputs:
      materialize_only:
        description: "Bounded immutable full-text derivatives only; no catalog/corpus/receipt publication"
        required: false
        default: false
        type: boolean
      qualify_discovery_only:
        description: "Read-only full-body resource check on this runner; no ingestion, generation or publication"
        required: false
        default: false
        type: boolean
      publish_forensics:
        description: "Build and publish the private Filing Forensics launch state"
        required: false
        default: false
        type: boolean
      bootstrap_forensics_sources:
        description: "ONE TIME ONLY: create the first private SEC-source snapshot without restore"
        required: false
        default: false
        type: boolean
      run_census:
        description: "Run the READ-ONLY Research Vault id-set census (catalog/PDF/corpus/receipts) after the ingest"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "0 * * * *"   # top of every hour — mirrors btc-live.yml

permissions:
  contents: write

concurrency:
  # Let the active publication writer settle; newer pending cycles may coalesce.
  group: research-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: [self-hosted, macstudio-light]   # light runner (needs poppler pdftotext)
    timeout-minutes: 15
    env:
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      # Research vault store — a PRIVATE bucket with an explicit credential
      # namespace. The engine intentionally does NOT inherit the shared R2_* values
      # above. Same-account credentials remain possible only when these dedicated
      # names are populated explicitly, and R2_RESEARCH_BUCKET must differ from
      # the configured shared/public R2_BUCKET.
      R2_RESEARCH_ENDPOINT: ${{ secrets.R2_RESEARCH_ENDPOINT }}
      R2_RESEARCH_ACCESS_KEY_ID: ${{ secrets.R2_RESEARCH_ACCESS_KEY_ID }}
      R2_RESEARCH_SECRET_ACCESS_KEY: ${{ secrets.R2_RESEARCH_SECRET_ACCESS_KEY }}
      R2_RESEARCH_BUCKET: ${{ secrets.R2_RESEARCH_BUCKET }}
      # Optional pinned-producer selector (RV). When the repo variable is set to
      # the 64-lowercase-hex SHA-256 of an installed release manifest, the ingest
      # step routes ONLY through that pinned offline producer; empty/absent keeps
      # the unchanged legacy mode. The admission step refuses any malformed value
      # before checkout/pip/ingest, and a pinned release can never be combined
      # with materialize_only.
    steps:
      - name: admit one explicit producer mode
        env:
          MATERIALIZE_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.materialize_only }}
          QUALIFICATION_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.qualify_discovery_only }}
          PUBLISH_FORENSICS: ${{ inputs.publish_forensics }}
          BOOTSTRAP_FORENSICS: ${{ inputs.bootstrap_forensics_sources }}
          PRODUCER_RELEASE: ${{ vars.RESEARCH_VAULT_PRODUCER_RELEASE }}
        run: |
          if [ "$QUALIFICATION_ONLY" = "true" ] && { [ "$MATERIALIZE_ONLY" = "true" ] || [ "$PUBLISH_FORENSICS" = "true" ] || [ "$BOOTSTRAP_FORENSICS" = "true" ] || [ "${{ inputs.run_census }}" = "true" ]; }; then
            echo "::error::qualify_discovery_only cannot be combined with publication, materialization or post-ingest census modes"
            exit 1
          fi
          if [ "$MATERIALIZE_ONLY" = "true" ] && { [ "$PUBLISH_FORENSICS" = "true" ] || [ "$BOOTSTRAP_FORENSICS" = "true" ]; }; then
            echo "::error::materialize_only cannot be combined with forensics publication or bootstrap"
            exit 1
          fi
          # Pinned-producer selector admission (RV). This is the first step, so a
          # malformed selector refuses BEFORE checkout/pip/ingest can touch any
          # store. The value is matched without eval/source: grep reads it on
          # stdin, so no expansion ever re-parses as shell.
          if [ -n "${PRODUCER_RELEASE:-}" ]; then
            if [ "${#PRODUCER_RELEASE}" -ne 64 ] || ! printf '%s' "$PRODUCER_RELEASE" | LC_ALL=C grep -Eq '^[0-9a-f]{64}$'; then
              echo "::error title=research-ingest::RESEARCH_VAULT_PRODUCER_RELEASE must be exactly 64 lowercase hex characters (the SHA-256 of the pinned release manifest) — refusing before checkout/ingest"
              exit 1
            fi
            if [ "$MATERIALIZE_ONLY" = "true" ]; then
              echo "::error title=research-ingest::RESEARCH_VAULT_PRODUCER_RELEASE (pinned producer) cannot be combined with materialize_only — refusing"
              exit 1
            fi
          fi
      - uses: actions/checkout@v4
        id: checkout
        with:
          fetch-depth: 1
      - name: python 3.12 (Homebrew venv — self-hosted runner)
        id: python_setup
        run: |
          VENV="$HOME/.cache/mm-venv-${RUNNER_NAME:-default}"
          [ -x "$VENV/bin/python" ] || /opt/homebrew/bin/python3.12 -m venv "$VENV"
          echo "$VENV/bin" >> "$GITHUB_PATH"
          "$VENV/bin/python" -m pip install --quiet --upgrade pip
      # boto3 (R2 client) + pyyaml are already in requirements; pdftotext is a
      # system binary (poppler), not a pip dep. No heavy pandas/scipy needed here.
      - run: pip install --quiet boto3 pyyaml requests
        id: pip_install
      - name: preflight — poppler pdftotext (HOST dependency)
        id: preflight
        run: |
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          if [ ! -x /opt/homebrew/bin/pdftotext ] && ! command -v pdftotext >/dev/null 2>&1; then
            echo "::error title=research-ingest::pdftotext (poppler) missing on runner ${RUNNER_NAME} — refusing to ingest bodyless (docs stay in the inbox and retry next hour). Fix: brew install poppler on this host. Precedent: 2026-07-30 the macstudio-light label moved to a poppler-less M1 and 127 docs ingested with empty bodies."
            exit 1
          fi
      - name: bootstrap Filing Forensics private state
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_forensics && !inputs.qualify_discovery_only }}
        # Manual launch/recovery hook. The normal refresh owner is daily.yml.
        # This deliberately runs the SEC source spine BEFORE the broad state build:
        # a fresh runner must restore its verified raw/archive snapshot, acquire its
        # bounded delta, emit local disclosure projections, and read-back-sync the
        # next snapshot before the compact entitled state may be published.
        #
        # `bootstrap_forensics_sources=true` is intentionally explicit and ONE TIME
        # ONLY: it creates the first source snapshot. On all later runs its false
        # default requires a verified restore; falling back after a restore failure
        # would let a shallow checkout replace durable disclosure evidence.
        #
        # The first call stops on partial SEC coverage. The second call obtains its
        # compute clock only after retrieval completes, so it can never claim to have
        # computed a projection before the source receipt it reads. Neither call
        # renders or publishes the browser state; that happens only after both pass.
        run: |
          set -euo pipefail
          pip install --quiet pandas pyarrow jinja2

          targets=(
            --target SMCI=0001375365
            --target NVDA=0001045810
            --target AAPL=0000320193
            --target MSFT=0000789019
            --target GOOGL=0001652044
            --target AMZN=0001018724
            --target META=0001326801
            --target TSLA=0001318605
            --target AVGO=0001730168
            --target PLTR=0001321655
            --target AMD=0000002488
            --target ORCL=0001341439
          )
          utc_now() { python -c 'from datetime import datetime, timezone; print(datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z"))'; }
          as_of="$(utc_now)"          # SEC acceptance-time cutoff, fixed before network I/O.
          recorded_at="$(utc_now)"    # explicit snapshot/receipt recording clock.
          # Assemble positional arguments without an optional empty array. The
          # self-hosted Macs run Bash 3.2, where expanding an empty array under
          # `set -u` raises "unbound variable" before the operator can start.
          set -- "${targets[@]}"
          if [ "${{ inputs.bootstrap_forensics_sources }}" = "true" ]; then
            echo "::warning title=fundamental_forensics_wave2::creating the initial private SEC-source snapshot (restore deliberately omitted)"
          else
            set -- "$@" --restore
          fi

          python -m scripts.run_fundamental_forensics_wave2 \
            "$@" --acquire --require-complete-acquisition \
            --max-tickers 12 --as-of "$as_of" --recorded-at "$recorded_at" --computed-at "$recorded_at"

          computed_at="$(utc_now)"   # sampled after all retained SEC receipts exist.
          python -m scripts.run_fundamental_forensics_wave2 \
            "${targets[@]}" --build-projections --sync \
            --max-tickers 12 --as-of "$as_of" --recorded-at "$recorded_at" --computed-at "$computed_at"
          python -m scripts.build_fundamental_forensics --publish-private
      - name: research vault ingest (hourly)
        id: ingest
        if: ${{ !inputs.qualify_discovery_only }}
        # `set +e` + exit 0 keeps the SALVAGE step below reachable — it must run
        # even when the plane failed, so whatever WAS published still reaches git.
        # The captured rc is re-emitted by the final step, which is what actually
        # reds the lane. Before Wave 4 the rc was captured and then never used, so
        # an hour in which ingestion accomplished nothing concluded green.
        # --require-store: on the scheduled run, "no store configured" means the R2
        # secrets did not reach the runner, not "nothing to do".
        env:
          MATERIALIZE_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.materialize_only }}
          PRODUCER_RELEASE: ${{ vars.RESEARCH_VAULT_PRODUCER_RELEASE }}
        run: |
          set +e
          # Pinned-producer mode (RV). When the repo variable selects a release,
          # the ingest runs ONLY through that pinned offline bundle. Preparation
          # is verified here against the fixed installation prefix (release
          # bundle present, manifest.json SHA-256 equal to the selector, fixed
          # interpreter present) before anything is launched, and every refusal
          # or nonzero launch records a nonzero rc in GITHUB_OUTPUT. There is
          # deliberately NO legacy fallback: silently falling forward to the
          # legacy CLI would republish from an unverified producer. The launcher
          # itself verifies secure config and release bytes and retains the
          # private evidence; this workflow adds no recovery authority and prints
          # no private config or log body — refusal messages are fixed strings.
          # The launcher uses --require-store and an absolute --repo-dir at the
          # configured public_checkout/data/research_vault. Installation must bind
          # public_checkout to this runner's GITHUB_WORKSPACE so salvage/freshness
          # below consume this run's snapshots. Private child logs use an absolute
          # retention root outside that checkout; the child cwd is its pinned tree.
          # Poppler remains a qualified host dependency in BOTH producer modes;
          # the legacy venv is still used by freshness and optional census steps.
          if [ -n "${PRODUCER_RELEASE:-}" ]; then
            pinned_rc=1
            if [ "$MATERIALIZE_ONLY" = "true" ]; then
              echo "::error title=research-ingest::pinned producer cannot execute materialize_only; legacy fallback is not permitted"
              echo "rc=$pinned_rc" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            bundle="/Volumes/Mastermind/runtime/research-producer/releases/$PRODUCER_RELEASE"
            pinned_python="/Volumes/Mastermind/runtime/research-producer/dependencies/0c43d2132a6afaba75e5b5720c234d1b565679b650d7c04c024a1a12d711206a/venv/bin/python"
            if [ -f "$bundle/manifest.json" ] && [ -f "$bundle/producer.json" ] \
               && [ -x "$pinned_python" ]; then
              if command -v shasum >/dev/null 2>&1; then
                manifest_digest="$(shasum -a 256 "$bundle/manifest.json" 2>/dev/null | awk '{print $1}')"
              elif command -v sha256sum >/dev/null 2>&1; then
                manifest_digest="$(sha256sum "$bundle/manifest.json" 2>/dev/null | awk '{print $1}')"
              else
                manifest_digest=""
              fi
              if [ "$manifest_digest" = "$PRODUCER_RELEASE" ]; then
                # Verified archives live under commit-named roots, as required
                # by the incumbent verifier. Resolve only a bounded manifest's
                # strict commit identifier; never source config or fall back.
                mastermind_commit="$("$pinned_python" -I -B - "$bundle/manifest.json" "$PRODUCER_RELEASE" <<'PYCOMMIT'
          import hashlib, json, re, sys
          def unique(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError()
                  result[key] = value
              return result
          try:
              with open(sys.argv[1], 'rb') as stream:
                  raw = stream.read(4 * 1024 * 1024 + 1)
              if (len(raw) > 4 * 1024 * 1024
                      or hashlib.sha256(raw).hexdigest() != sys.argv[2]):
                  raise ValueError()
              document = json.loads(raw, object_pairs_hook=unique)
              if (type(document) is not dict
                      or document.get('schema') != 'mastermind.research_read_stage.v1'
                      or document.get('state') != 'INERT_CANDIDATE'):
                  raise ValueError()
              commit = document.get('mastermind_commit')
              if type(commit) is not str or re.fullmatch(r'[0-9a-f]{40}', commit) is None:
                  raise ValueError()
              print(commit)
          except Exception:
              raise SystemExit(1)
          PYCOMMIT
          )"
                preparation_rc=$?
                launcher="$bundle/mastermind/$mastermind_commit/ops/research_producer/launch.py"
                if [ "$preparation_rc" = "0" ] && [ "${#mastermind_commit}" -eq 40 ] \
                   && [ -f "$launcher" ]; then
                  "$pinned_python" -I -B "$launcher" --config "$bundle/producer.json" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --execute
                  pinned_rc=$?
                  if [ "$pinned_rc" != "0" ]; then
                    echo "::error title=research-ingest::pinned producer launch FAILED (rc=$pinned_rc); legacy fallback is not permitted"
                  fi
                else
                  echo "::error title=research-ingest::pinned producer release preparation refused; nothing was ingested and legacy mode is not permitted"
                fi
              else
                echo "::error title=research-ingest::pinned producer release preparation refused; nothing was ingested and legacy mode is not permitted"
              fi
            else
              echo "::error title=research-ingest::pinned producer release preparation refused; nothing was ingested and legacy mode is not permitted"
            fi
            echo "rc=$pinned_rc" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$MATERIALIZE_ONLY" = "true" ]; then
            python -m scripts.ingest_research --require-store --materialize-only
          else
            python -m scripts.ingest_research --require-store
          fi
          echo "rc=$?" >> "$GITHUB_OUTPUT"
          exit 0
      - name: read-only full-body resource qualification
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.qualify_discovery_only }}
        run: |
          python -m engine.research_vault.fulltext_qualification \
            --scratch-root /Volumes/Mastermind/runtime/research-producer/retention
      # Salvage-push the repo snapshots regardless of the ingest step's rc
      # (never-raise: the CLI exits 0 even on internal error). Commit ONLY the
      # catalog + first-pages-excerpt snapshots (both are what the nightly render
      # reads) — the PDFs + corpus.sqlite live in R2, never in git. The excerpts
      # payload is deterministic + timestamp-free, so an hour with no new/changed
      # reports produces no diff and no commit.
      # A refused first-step admission skips checkout. Never salvage stale runner
      # files or run the optional census/upload without this run's checkout.
      - name: commit catalog snapshot (salvage-push)
        if: ${{ always() && steps.checkout.outcome == 'success' && !inputs.materialize_only && !inputs.qualify_discovery_only }}
        run: |
          . "${GITHUB_WORKSPACE:-.}/scripts/ci/push_retry.sh"
          git config user.name "dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/research_vault/catalog.json data/research_vault/excerpts.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "no catalog change"; exit 0; fi
          git commit -m "research_vault: catalog $(date -u +%FT%H:%MZ)"
          for i in 1 2 3 4 5; do
            # Untracked-collision sweep (mirrors commodity-sentinel.yml): a mid-run
            # commit on origin/main can TRACK a path this job wrote as an untracked
            # side-effect; drop the local throwaway so the rebase checkout succeeds.
            git fetch origin main || true
            comm -12 <(git ls-files --others --exclude-standard | LC_ALL=C sort) \
                     <(git ls-tree -r --name-only origin/main | LC_ALL=C sort) \
              | while IFS= read -r f; do rm -f -- "$f" || true; done
            git pull --rebase --autostash -X theirs origin main && push_autostash_ok && git push && exit 0
            echo "push attempt $i failed; retrying"; sleep $((i*3))
          done
          echo "::warning::could not push research_vault catalog after 5 attempts (non-fatal)"
      # Source-content liveness is distinct from publication-plane liveness. The
      # catalog above may publish cleanly every hour while the MarketDesk producer
      # has stopped admitting reports. Capture this semantic rc after salvage so a
      # stale-source failure never prevents preservation of the last valid catalog.
      # Skip when checkout failed — a missing tree is runner breakage, not a
      # producer verdict (MINOR 5).
      - name: grade Research Vault source-content freshness
        id: source_freshness
        if: ${{ always() && steps.checkout.outcome == 'success' && !inputs.qualify_discovery_only }}
        env:
          RESEARCH_VAULT_SOURCE_MAX_AGE_HOURS: ${{ vars.RESEARCH_VAULT_SOURCE_MAX_AGE_HOURS }}
          RESEARCH_VAULT_SOURCE_OUTAGE_ACK: ${{ vars.RESEARCH_VAULT_SOURCE_OUTAGE_ACK }}
        run: |
          set +e
          args=(--catalog data/research_vault/catalog.json)
          if [ -n "${RESEARCH_VAULT_SOURCE_MAX_AGE_HOURS:-}" ]; then
            args+=(--max-age-hours "${RESEARCH_VAULT_SOURCE_MAX_AGE_HOURS}")
          fi
          if [ "${RESEARCH_VAULT_SOURCE_OUTAGE_ACK:-}" = "true" ]; then
            args+=(--ack-producer-stale)
          fi
          python -m scripts.check_research_vault_source_freshness "${args[@]}"
          echo "rc=$?" >> "$GITHUB_OUTPUT"
          exit 0
      # READ-ONLY correction audit (Wave 4). Manual only: it lists every object in
      # the vault, which is far too expensive for the hourly cadence. Runs BEFORE
      # the failure step so a census is still taken on an hour whose ingest failed
      # — that is exactly the hour whose id sets an operator wants to see.
      - name: research vault id-set census (read-only)
        if: ${{ always() && steps.checkout.outcome == 'success' && github.event_name == 'workflow_dispatch' && inputs.run_census && !inputs.qualify_discovery_only }}
        run: |
          python -m scripts.research_vault_census --json "$RUNNER_TEMP/rv_census.json"
      - name: upload census report
        if: ${{ always() && steps.checkout.outcome == 'success' && github.event_name == 'workflow_dispatch' && inputs.run_census && !inputs.qualify_discovery_only }}
        uses: actions/upload-artifact@v4
        with:
          name: research-vault-census
          path: ${{ runner.temp }}/rv_census.json
          if-no-files-found: warn
      # Publication-plane and source-content failures are independent. Both are
      # observed only after salvage and the optional census have had their chance.
      # A green publisher with a stale newest report is now a red lane, not a
      # healthy-looking timestamp-only commit. The typed guard has already applied
      # any stale-only acknowledgement; every nonzero rc here remains fatal.
      - name: fail the lane if ingest or source freshness failed
        if: ${{ always() && !inputs.qualify_discovery_only }}
        run: |
          ingest_rc="${{ steps.ingest.outputs.rc }}"
          source_rc="${{ steps.source_freshness.outputs.rc }}"
          failed=0

          if [ -z "$ingest_rc" ]; then
            echo "::error title=research-ingest::the ingest step recorded no exit code — it did not run to completion"
            failed=1
          elif [ "$ingest_rc" != "0" ]; then
            echo "::error title=research-ingest::research vault ingestion FAILED (rc=$ingest_rc); the salvage push above ran regardless. See the ingest step's annotations for the specific plane failure."
            failed=1
          fi

          if [ -z "$source_rc" ]; then
            if [ "${{ steps.checkout.outcome }}" != "success" ]; then
              echo "::error title=research-vault-source::source-freshness skipped — checkout did not succeed (runner/setup failure, not a typed producer verdict)"
            else
              echo "::error title=research-vault-source::the source-freshness step recorded no exit code (step did not emit a typed verdict)"
            fi
            failed=1
          elif [ "$source_rc" != "0" ]; then
            echo "::error title=research-vault-source::Research Vault source freshness FAILED (rc=$source_rc); catalog salvage was preserved. The typed guard already applied any PRODUCER_STALE-only acknowledgement, so this rc is an integrity, configuration, clock, or transport failure and remains fatal."
            failed=1
          fi

          if [ "$failed" != "0" ]; then
            exit 1
          fi
          echo "research vault ingestion and source-content freshness completed (rc=0)"
