name: deploy-alpaca-secrets
# Seat/operator-triggered: refreshes the Alpaca Market Data key pair on the VPS from the
# repository secrets ALPACA_API_KEY_ID / ALPACA_API_SECRET_KEY — the same pair
# .github/workflows/marketing-press-wire.yml consumes successfully — into the two env files
# that hold the VPS copy: /etc/macro-live.env (marketing-press-feeds.service) and
# /etc/macro-ticker-news.env (the macro-ticker-news writer; app/deploy/ticker-news-setup.sh
# requires exactly one unquoted, CR-free line per key).
# Why: the pair was rotated 2026-08-04 (secrets updated 05:22Z) and the VPS kept the
# pre-rotation copy, so every VPS Alpaca consumer has been answered HTTP 401 since
# 2026-08-04T04:04Z (DSC:VPS-ALPACA-CREDENTIALS-SILENTLY-REJECTED-SINCE-2026-08-04;
# DEC:VPS-ALPACA-PAIR-REFRESHED-FROM-REPO-SECRETS-BY-DISPATCH-WORKFLOW).
# Idiom = deploy-api-secrets.yml / deploy-analytics.yml: the SSH key rides in as the
# VPS_DEPLOY_KEY secret, materialized 0600 in RUNNER_TEMP for the job only; secret values
# travel via stdin, never in command args, never echoed; each target file is backed up
# (0600, timestamped) before its two ALPACA_* lines are replaced; the job prints line COUNTS
# only. It restarts nothing by default: marketing-press-feeds is restarted only on the
# explicit input, and the ticker-news writer is re-armed by its own
# ticker-news-setup.sh --disarm / --arm (it reads env only at start).
on:
  workflow_dispatch:
    inputs:
      restart_press_feeds:
        description: "Also restart marketing-press-feeds.service so it re-reads /etc/macro-live.env"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-alpaca-secrets
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: refresh ALPACA_API_KEY_ID / ALPACA_API_SECRET_KEY on the VPS
        env:
          AK: ${{ secrets.ALPACA_API_KEY_ID }}
          AS: ${{ secrets.ALPACA_API_SECRET_KEY }}
          SSH_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
          RESTART_PRESS: ${{ inputs.restart_press_feeds }}
        run: |
          set -euo pipefail
          [ -n "$AK" ] || { echo "::error::ALPACA_API_KEY_ID secret is empty/absent"; exit 1; }
          [ -n "$AS" ] || { echo "::error::ALPACA_API_SECRET_KEY secret is empty/absent"; exit 1; }
          [ -n "$SSH_KEY" ] || { echo "::error::VPS_DEPLOY_KEY secret is empty/absent"; exit 1; }
          # One token per line: strip CR/LF/space exactly like deploy-api-secrets.yml's _add.
          ak="$(printf '%s' "$AK" | tr -d '\r\n ')"
          as="$(printf '%s' "$AS" | tr -d '\r\n ')"
          { [ -n "$ak" ] && [ -n "$as" ]; } || { echo "::error::an Alpaca secret is whitespace only"; exit 1; }
          echo "key_id_len=${#ak} secret_len=${#as}"
          case "${RESTART_PRESS:-false}" in true) RP=1 ;; *) RP=0 ;; esac
          umask 077
          KEYFILE="$RUNNER_TEMP/vps_key"
          printf '%s\n' "$SSH_KEY" > "$KEYFILE"
          chmod 600 "$KEYFILE"
          trap 'rm -f "$KEYFILE"' EXIT
          printf 'ALPACA_API_KEY_ID=%s\nALPACA_API_SECRET_KEY=%s\n' "$ak" "$as" | ssh -i "$KEYFILE" \
            -o StrictHostKeyChecking=accept-new -o BatchMode=yes -o ConnectTimeout=15 \
            root@146.190.142.17 "export RP=$RP;" '
            set -euo pipefail
            umask 077
            INPUT=$(cat)
            ts=$(date -u +%Y%m%dT%H%M%SZ)
            for f in /etc/macro-live.env /etc/macro-ticker-news.env; do
              [ -f "$f" ] || { echo "::error::$f is missing on the VPS"; exit 1; }
              cp -p "$f" "$f.bak-alpaca-$ts"
              chmod 600 "$f.bak-alpaca-$ts"
              grep -vE "^ALPACA_API_(KEY_ID|SECRET_KEY)=" "$f" > "$f.new" || true
              printf "%s\n" "$INPUT" >> "$f.new"
              chmod 600 "$f.new"
              mv "$f.new" "$f"
              k=$(grep -c "^ALPACA_API_KEY_ID=" "$f" || true)
              s=$(grep -c "^ALPACA_API_SECRET_KEY=" "$f" || true)
              cr=$(grep -cP "\r" "$f" || true)
              echo "$f: key_id_lines=$k secret_lines=$s cr_lines=$cr backup=$f.bak-alpaca-$ts"
              { [ "$k" = 1 ] && [ "$s" = 1 ] && [ "$cr" = 0 ]; } || { echo "::error::$f does not hold exactly one clean line per Alpaca key"; exit 1; }
            done
            if [ "${RP:-0}" = 1 ]; then
              systemctl try-restart marketing-press-feeds.service
              sleep 2
              echo "marketing-press-feeds: $(systemctl is-active marketing-press-feeds.service || true)"
            else
              echo "marketing-press-feeds: not restarted (input restart_press_feeds=false)"
            fi
            echo "alpaca pair refreshed at $ts"
          '
          echo "deployed: VPS Alpaca pair refreshed from repository secrets (values never printed)"
