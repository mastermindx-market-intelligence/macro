name: fences
# ALWAYS-ON metabolism cage fences — the three check contexts the arming runbook
# (docs/METABOLISM_ARMING_CHECKLIST.md, Act 2) makes REQUIRED on main.
#
# WHY A SEPARATE WORKFLOW: the same three guards also live in ci.yml, but ci.yml
# is `on: pull_request` with a large `paths:` filter — it does NOT run on a PR
# that touches only, say, site/ or engine/. A branch-protection rule that
# REQUIRES a path-gated check blocks every PR that does not trigger it (the
# required context never reports → "Expected — Waiting for status"). This
# workflow has NO paths filter, so the three required contexts report on EVERY
# PR and every push to main.
#
# One runner executes all three guards, then publishes the exact historical
# check-run contexts (self-mod-fence / capability-broker / grader-manifest).
# Previously GitHub provisioned three VMs, each repeating checkout, Python setup,
# and pip install. GITHUB_TOKEN creates these check runs as the GitHub Actions
# app (integration 15368), so the existing ruleset contract and immune-lane
# classification stay intact while runner allocation falls from three to one.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  checks: write

concurrency:
  # Only the newest commit on a PR (or newest descendant on main) needs to prove
  # these read-only fences.  This coalesces agent push bursts before they consume
  # hosted runner slots.
  group: fences-${{ github.event.pull_request.number || github.ref }}
  # cancel-in-progress became EVENT-CONDITIONAL 2026-08-09. On a PR it is still
  # `true` — a newer commit obsoletes the older fence result, and coalescing agent
  # push bursts is the whole reason this line exists. On MAIN it must be `false`,
  # because coalescing-by-cancel there does not merely waste a run, it makes a
  # concluded run IMPOSSIBLE.
  #
  # THE MEASUREMENT. This workflow is one of the two main proofs that
  # merge_on_green.main_proof reads (MAIN_PROOF_WORKFLOWS, scripts/merge_on_green.py),
  # and it is the only one with a `push` trigger — so it is the proof that is
  # supposed to stay continuously fresh. But main receives wire/nightly pushes
  # every ~30-90 seconds, and every one of them landed in `fences-refs/heads/main`
  # and killed its predecessor: five runs between 11:40:38Z and 11:43:04Z on
  # 2026-08-09, each cancelling the one before. Over the sweeper's 10-run walk that
  # is not "a large minority superseded" (the 2 of 8 measured 2026-08-08) but ALL
  # TEN — the sweep at 11:44:42Z reported main's fences proof as "NO clean name …
  # (fences.yml's newest 10 completed run(s) on main were all cancelled)". A run
  # that takes longer than the gap between pushes can NEVER conclude. That is
  # structural, not load-dependent.
  #
  # With `false` the running fence finishes while the pending slot keeps coalescing
  # the burst (GitHub replaces the one PENDING run per group regardless of this
  # flag), so main gets a concluded fence proof every few minutes. Each one
  # refreshes the sweeper's resolver, which in steady state removes the need for
  # ci.yml baseline dispatches altogether. The cost is bounded and already handled:
  # the concluded run may be for a main SHA one or two pushes behind the tip, and
  # the sweeper's ancestry check accepts an older main SHA by design.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fence-pack:
    name: fence-pack
    # A pull_request token is read-only for forks and cannot publish the three
    # historical check contexts. Rare fork PRs use the fallback jobs below;
    # same-repository agent PRs and main pushes take this one-runner fast path.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The old fetch-depth:0 shape fetched every branch/tag in a repository
          # with hundreds of stale agent refs, then materialized ~74.5k tracked
          # paths. 2026-08-20 run 32381887910 spent about an hour here and died
          # with early EOF / invalid index-pack before a single fence test ran.
          #
          # A fence needs only a bounded commit graph plus the files its four
          # guards actually read. Depth 256 covers ordinary PR ancestry. The live
          # self-mod step below probes the exact synthetic parents locally first;
          # when an older valid PR exceeds that window it performs one finite,
          # blobless deepening of those immutable parent SHAs. It never resolves a
          # mutable branch/PR ref or falls back to an unbounded history checkout.
          filter: blob:none
          fetch-depth: 256
          sparse-checkout: |
            /.github/
            /agentos/
            /config/
            /engine/metabolism/
            /engine/neuralweb/
            /engine/foresight_leadlag.py
            /engine/theme_placebo.py
            /engine/qledger_falsifier.py
            /lib/
            /scripts/
            /templates/
            /tests/
            /site/chat.html
            /data/neuralweb/capability_audit.jsonl
            /data/metabolism/key_ledger.jsonl
            /data/metabolism/journal/
            /data/ai_costs/usage.jsonl
            /config.yml
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # jinja2/markupsafe are for the chat-nav guard below, which RENDERS
      # _site_nav.html.j2 rather than grepping it. CI packs install minimal deps,
      # not requirements.txt — an unlisted import here is an ImportError, not a
      # skip, and the --selftest path additionally imports lib.pages (which pulls
      # lib.config → pyyaml).
      - name: install minimal deps
        run: pip install pytest pyyaml jinja2 markupsafe

      - name: self-mod-fence selftest (all four cases proven)
        id: self_mod_selftest
        continue-on-error: true
        run: python3 scripts/check_self_mod_fence.py --selftest
      - name: self-mod-fence live check (loop PR + immutable → BLOCKED)
        id: self_mod_live
        continue-on-error: true
        # On push events there is no PR head/base; the selftest above already
        # proves the discriminating behaviour, so the live diff check only runs
        # for pull_request events. For a PR, GitHub's tested SHA is a synthetic
        # two-parent merge. Those exact parents are immutable proof identity; do
        # not re-fetch mutable main/head refs while making the attribution call.
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          read -r MERGE_SHA TESTED_BASE_SHA SUBJECT_HEAD_SHA EXTRA_PARENT \
            < <(git rev-list --parents -n 1 "$GITHUB_SHA")
          if [ "$MERGE_SHA" != "$GITHUB_SHA" ] || [ -z "$TESTED_BASE_SHA" ] || \
             [ -z "$SUBJECT_HEAD_SHA" ] || [ -n "${EXTRA_PARENT:-}" ]; then
            echo "::error::self-mod-fence: expected one synthetic merge with exactly two parents — fail-closed." >&2
            exit 1
          fi
          if ! MERGE_BASE=$(git merge-base "$TESTED_BASE_SHA" "$SUBJECT_HEAD_SHA"); then
            echo "::notice title=self-mod-fence ancestry::initial bounded checkout did not reach the exact PR merge base; deepening immutable synthetic parents."
            if ! git fetch \
              --no-tags \
              --no-recurse-submodules \
              --filter=blob:none \
              --deepen=4096 \
              origin \
              "+$TESTED_BASE_SHA:refs/ci-fence/base" \
              "+$SUBJECT_HEAD_SHA:refs/ci-fence/head"; then
              echo "::error::self-mod-fence: exact-parent ancestry deepening failed — fail-closed." >&2
              exit 1
            fi
            if ! MERGE_BASE=$(git merge-base "$TESTED_BASE_SHA" "$SUBJECT_HEAD_SHA"); then
              echo "::error::self-mod-fence: could not establish exact PR ancestry after bounded exact-parent deepening; could not establish exact PR ancestry inside the bounded checkout — fail-closed." >&2
              exit 1
            fi
          fi
          BRANCH="${{ github.head_ref }}"
          SELF_MOD_INPUT_DIR="$RUNNER_TEMP/self-mod-fence"
          FILES_FILE="$SELF_MOD_INPUT_DIR/changed-files.json"
          TRAILERS_FILE="$SELF_MOD_INPUT_DIR/commit-messages.txt"
          mkdir -p "$SELF_MOD_INPUT_DIR"
          # PR #5898 / run 32546500471 proved that both populations can exhaust
          # execve before Python starts. Keep the exact attribution above, but
          # carry Git's unbounded outputs only through files. The changed paths
          # use the canonical CI_CHANGED_FILES_FILE JSON representation; -z
          # preserves every legal Git pathname without a shell split.
          git diff --name-only -z "$MERGE_BASE" "$SUBJECT_HEAD_SHA" |
            python3 scripts/check_self_mod_fence.py \
              --write-files-file-from-nul "$FILES_FILE"
          git log --format="%B" "$MERGE_BASE..$SUBJECT_HEAD_SHA" > "$TRAILERS_FILE"
          python3 scripts/check_self_mod_fence.py \
            --branch "$BRANCH" \
            --files-file "$FILES_FILE" \
            --trailers-file "$TRAILERS_FILE"
      - name: self-mod-fence test suite
        id: self_mod_tests
        continue-on-error: true
        run: python -m pytest tests/test_self_mod_fence.py tests/test_fence_checkout_contract.py tests/test_fence_publication.py -q

      # #6601/#6633 proved malformed Agent OS records could merge before the
      # semantic pack reached them. Reuse the canonical whole-store validator
      # here and fold its outcome into self-mod-fence; this is earlier
      # observation of the same law, not a second merge authority.
      - name: agent-os record contract
        id: agent_os_record_contract
        continue-on-error: true
        run: python3 scripts/agentos.py validate

      - name: capability-redline selftest (planted secret caught; clean real files pass)
        id: capability_selftest
        continue-on-error: true
        run: python3 scripts/check_capability_redline.py --selftest
      - name: capability-redline live scan (hard fail on secret values or value-capture)
        id: capability_live
        continue-on-error: true
        run: python3 scripts/check_capability_redline.py

      - name: grader-manifest selftest (drift detection + fail-closed proof)
        id: grader_selftest
        continue-on-error: true
        run: python3 scripts/check_grader_manifest.py --selftest
      - name: grader-manifest live check (hash drift is a hard failure)
        id: grader_live
        continue-on-error: true
        run: python3 scripts/check_grader_manifest.py

      # chat-nav drift: HERE because the ci-pack copy is too SLOW, not missing.
      # templates/chat.html cannot {% include %} the shared nav (plain-copy page,
      # byte-matched to site/chat.html), so its header is GENERATED from
      # _site_nav.html.j2 by scripts/sync_chat_nav.py. The same guard already runs
      # in ci-pack pack 0 — ci.yml's paths: filter has covered templates/** since
      # 2026-07-03 and names both nav partials explicitly. Coverage was never the
      # gap: ci-pack takes ~2h, so the red lands AFTER the merge. #4666's ci run
      # started 03:43:06Z and the PR merged 03:51:36Z, 8m30s later; #4637 merged
      # ~6 min before its pack-0 failed. Both times the drift reddened MAIN, not
      # the PR (three occurrences: #4637, #4666, #4721).
      #
      # This workflow is the always-on fast lane — no paths: filter, ~1-2 min —
      # and the guard is a pure static check (render a Jinja template, compare
      # strings, ~1s), so the red now arrives while the PR is still open. The
      # ci-pack copy stays as defence in depth; it costs nothing there.
      #
      # NOTE: these deliberately do NOT feed the publish step below. The three
      # published contexts are the branch-protection ruleset's contract; adding a
      # fourth, or folding chat-nav into one of the three, is an operator
      # decision. They gate the fence-pack JOB check instead, via the aggregation
      # step at the bottom.
      - name: chat-nav selftest (gate fires on a hand-edited header; --fix keeps ?v=/defer)
        id: chat_nav_selftest
        continue-on-error: true
        run: python3 scripts/sync_chat_nav.py --selftest
      - name: chat.html's header must match _site_nav.html.j2
        id: chat_nav_live
        continue-on-error: true
        run: python3 scripts/sync_chat_nav.py

      - name: publish required fence contexts
        id: publish
        if: always()
        uses: actions/github-script@v7
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SELF_MOD_SELFTEST: ${{ steps.self_mod_selftest.outcome }}
          SELF_MOD_LIVE: ${{ steps.self_mod_live.outcome }}
          SELF_MOD_TESTS: ${{ steps.self_mod_tests.outcome }}
          AGENT_OS_RECORD_CONTRACT: ${{ steps.agent_os_record_contract.outcome }}
          CAPABILITY_SELFTEST: ${{ steps.capability_selftest.outcome }}
          CAPABILITY_LIVE: ${{ steps.capability_live.outcome }}
          GRADER_SELFTEST: ${{ steps.grader_selftest.outcome }}
          GRADER_LIVE: ${{ steps.grader_live.outcome }}
        with:
          # Action-level retries are pinned to zero so the ONE-create/
          # ONE-read recovery contract below stays the only path after a
          # lost response; every call ALSO carries request: { retries: 0 }.
          retries: 0
          script: |
            // Response-loss recovery for the three required fence contexts.
            //
            // checks.create has NO server-side idempotency key. When the call throws
            // (Original 500 / mid-flight network loss) the write MAY still have landed,
            // so the old fire-and-forget loop could leave a required context
            // permanently unreported — and a blind retry could double-write the same
            // binding. The contract below:
            //
            //   * at most ONE create per context per invocation, always with an explicit
            //     `request: { retries: 0 }` (no octokit-layer retry) and the step itself
            //     pinned to action-level `retries: 0`;
            //   * binding inputs are validated BEFORE any create: HEAD_SHA must be a full
            //     40-hex commit SHA and RUN_ID / RUN_ATTEMPT must be canonical positive
            //     integers (/^[1-9][0-9]*$/ — never "0", "007", a slash or any other
            //     non-canonical text). The details_url is assembled from exactly those
            //     validated parts, so re-comparing it against its own template would be
            //     tautological — the only meaningful local check left on it is its https
            //     shape;
            //   * a thrown call OR a malformed success body is AMBIGUOUS and is resolved
            //     with exactly ONE bounded, read-only listForRef page (exact head +
            //     check_name, filter: all, per_page: 100, page: 1) — no paging, no
            //     polling, no retry, no update;
            //   * that page is trusted only while it is provably the LAST page: a
            //     non-empty Link header (checked case-insensitively) fails closed BEFORE
            //     total_count is even considered — a next page or a truncated list never
            //     resolves an unknown, even when the count looks aligned;
            //   * then EVERY row must be a real check-run object: a null, string, number
            //     or array row rejects the whole page instead of being silently skipped.
            //     The exact binding is found by CENSUS on external_id alone and must
            //     appear EXACTLY once BEFORE any other field is validated; sibling
            //     records from older runs (a different external_id) are normal and do
            //     not block recovery. Only then is the full receipt validated (GitHub
            //     Actions app 15368, repo, head, run, attempt, check name, terminal
            //     status/conclusion, output title+summary, submitted details_url or
            //     the strictly bound GitHub Actions check self-links). Any omitted or
            //     mismatched field fails closed: absence NEVER means no-write;
            //   * anything unresolvable raises a fixed EFFECT_UNKNOWN error and stops
            //     every later create in this invocation. This is per-invocation only; it
            //     does NOT assert global exactly-once;
            //   * thrown error text is NEVER interpolated into logs or errors — failure
            //     reasons are fixed internal classification tokens only, so an upstream
            //     error body can never leak into the Actions log.
            //
            // external_id is PROVENANCE, not server idempotency: a deterministic,
            // length-safe (sha256 hex, <= 64 chars) binding of repo/head/run/attempt/
            // check and the canonical repo/run details_url.
            const crypto = require('crypto');

            const EXPECTED_APP_ID = 15368; // GitHub Actions app — see the workflow header.
            const PAGE_SIZE = 100;

            const HEAD_SHA = String(process.env.HEAD_SHA || '').toLowerCase();
            const RUN_ID = String(process.env.RUN_ID || '');
            const RUN_ATTEMPT = String(process.env.RUN_ATTEMPT || '');
            const SERVER_URL = String(context.serverUrl || '').replace(/\/+$/, '');
            const API_URL = String(context.apiUrl || '').replace(/\/+$/, '');
            const OWNER = String((context.repo && context.repo.owner) || '');
            const REPO = String((context.repo && context.repo.repo) || '');
            const DETAILS_URL = `${SERVER_URL}/${OWNER}/${REPO}/actions/runs/${RUN_ID}`;

            const pass = values => values.every(value => ['success', 'skipped'].includes(value));
            const checks = [
              {
                name: 'self-mod-fence',
                values: [
                  process.env.SELF_MOD_SELFTEST,
                  process.env.SELF_MOD_LIVE,
                  process.env.SELF_MOD_TESTS,
                  process.env.AGENT_OS_RECORD_CONTRACT,
                ],
              },
              {
                name: 'capability-broker',
                values: [
                  process.env.CAPABILITY_SELFTEST,
                  process.env.CAPABILITY_LIVE,
                ],
              },
              {
                name: 'grader-manifest',
                values: [
                  process.env.GRADER_SELFTEST,
                  process.env.GRADER_LIVE,
                ],
              },
            ];

            // Every binding input is validated BEFORE any create is attempted:
            // invalid input fails closed without touching the API.
            function requireInput(value, label) {
              if (value === '') {
                throw new Error(`INVALID_INPUT: fence publish is missing ${label}; failing closed before any create`);
              }
              return value;
            }

            function validateBindingInputs(name, externalId) {
              requireInput(SERVER_URL, 'context.serverUrl');
              requireInput(OWNER, 'context.repo.owner');
              requireInput(REPO, 'context.repo.repo');
              requireInput(HEAD_SHA, 'HEAD_SHA');
              requireInput(RUN_ID, 'RUN_ID');
              requireInput(RUN_ATTEMPT, 'RUN_ATTEMPT');
              requireInput(name, 'check name');
              if (!/^[0-9a-f]{40}$/.test(HEAD_SHA)) {
                throw new Error(`INVALID_INPUT: HEAD_SHA is not a full commit SHA (${JSON.stringify(HEAD_SHA)}); failing closed before any create`);
              }
              // Run ids and attempts are canonical positive integers: 1, 2, 3, ... "0",
              // a leading zero, a slash or any other text means this is not the trusted
              // GitHub-provided binding and fails closed before any create.
              if (!/^[1-9][0-9]*$/.test(RUN_ID)) {
                throw new Error(`INVALID_INPUT: RUN_ID is not a canonical positive run id (${JSON.stringify(RUN_ID)}); failing closed before any create`);
              }
              if (!/^[1-9][0-9]*$/.test(RUN_ATTEMPT)) {
                throw new Error(`INVALID_INPUT: RUN_ATTEMPT is not a canonical positive run attempt (${JSON.stringify(RUN_ATTEMPT)}); failing closed before any create`);
              }
              // DETAILS_URL was assembled above from exactly the parts validated here,
              // so comparing it against its own template again would be tautological;
              // the meaningful remaining local check is its https shape.
              if (!/^https:\/\//.test(DETAILS_URL)) {
                throw new Error('INVALID_INPUT: canonical repo/run details_url is not an https URL; failing closed before any create');
              }
              if (externalId.length > 64) {
                throw new Error('INVALID_INPUT: external_id exceeds the 64 character check-run limit; failing closed before any create');
              }
            }

            // Deterministic provenance for this exact repo/head/run/attempt/check
            // plus the canonical repo/run details_url.
            function externalId(name) {
              const canonical = [
                `repo=${OWNER}/${REPO}`,
                `head=${HEAD_SHA}`,
                `run=${RUN_ID}`,
                `attempt=${RUN_ATTEMPT}`,
                `check=${name}`,
                `details_url=${DETAILS_URL}`,
              ].join('\u0000');
              return crypto.createHash('sha256').update(canonical, 'utf8').digest('hex');
            }

            // GitHub Actions can normalize details_url to the created check's own
            // /runs/{check-id} URL. Accept only that exact same-repo self-link, with
            // matching HTML/API identities; the external_id above still binds the
            // submitted workflow run and attempt. Missing/mismatched links fail closed.
            function detailsUrlMatches(record, expected) {
              if (record.details_url === expected.details_url) return true;
              if (!Number.isSafeInteger(record.id) || record.id <= 0) return false;
              if (!/^https:\/\//.test(API_URL)) return false;
              const checkUrl = `${SERVER_URL}/${OWNER}/${REPO}/runs/${record.id}`;
              const apiUrl = `${API_URL}/repos/${OWNER}/${REPO}/check-runs/${record.id}`;
              return record.details_url === checkUrl
                && record.html_url === checkUrl
                && record.url === apiUrl;
            }

            // Returns null only when `record` is a COMPLETE receipt that exactly
            // matches the binding; otherwise a short reason. An API response that
            // omits a field yields a reason — equality is never claimed across a
            // missing field.
            function receiptReason(record, expected) {
              if (!record || typeof record !== 'object' || Array.isArray(record)) return 'response is not a check run object';
              if (typeof record.name !== 'string' || record.name !== expected.name) return 'name';
              if (typeof record.head_sha !== 'string' || record.head_sha.toLowerCase() !== HEAD_SHA) return 'head_sha';
              if (!record.app || typeof record.app !== 'object' || record.app.id !== EXPECTED_APP_ID) return 'app is not the GitHub Actions app (15368)';
              if (typeof record.external_id !== 'string' || record.external_id !== expected.external_id) return 'external_id';
              if (record.status !== 'completed') return 'status is not terminal';
              if (record.conclusion !== expected.conclusion) return 'conclusion';
              if (!record.output || typeof record.output !== 'object' || Array.isArray(record.output)) return 'output';
              if (record.output.title !== expected.title) return 'output.title';
              if (record.output.summary !== expected.summary) return 'output.summary';
              if (typeof record.details_url !== 'string' || !detailsUrlMatches(record, expected)) return 'details_url';
              return null;
            }

            function unknown(expected, reason) {
              core.error(`EFFECT_UNKNOWN: ${expected.name} on ${HEAD_SHA} (${reason})`);
              throw new Error(`EFFECT_UNKNOWN: could not confirm ${expected.name} on ${HEAD_SHA}: ${reason}. No further fence context is created in this invocation.`);
            }

            // ONE create per context. Confirmed only on a COMPLETE, fully validated
            // receipt; anything else — a thrown call OR a malformed success body — is
            // ambiguous and needs the recovery read. A thrown call's message is never
            // carried any further: only the fixed classification token below is.
            async function createOnce(expected) {
              let response;
              try {
                response = await github.rest.checks.create({
                  owner: OWNER,
                  repo: REPO,
                  name: expected.name,
                  head_sha: HEAD_SHA,
                  status: 'completed',
                  conclusion: expected.conclusion,
                  external_id: expected.external_id,
                  details_url: expected.details_url,
                  output: { title: expected.title, summary: expected.summary },
                  request: { retries: 0 },
                });
              } catch (err) {
                return { confirmed: false, reason: 'create call threw' };
              }
              const reason = receiptReason(response && response.data, expected);
              return reason === null
                ? { confirmed: true }
                : { confirmed: false, reason: `create returned a malformed receipt: ${reason}` };
            }

            // Value of a response's Link header, or '' when it is absent or empty.
            // Header names are case-insensitive; both plain header objects and Headers
            // instances are handled.
            function linkHeaderValue(headers) {
              if (!headers) return '';
              if (typeof headers.get === 'function') {
                const value = headers.get('link');
                return value === null || value === undefined ? '' : String(value);
              }
              if (typeof headers === 'object') {
                for (const key of Object.keys(headers)) {
                  if (String(key).toLowerCase() === 'link') return String(headers[key]);
                }
              }
              return '';
            }

            // The ONE bounded recovery read: read-only, exact head + check_name, first
            // page only, no retry. The page proves the retained write only when it is
            // provably the last page, every row is a real check-run object, the exact
            // external_id binding appears EXACTLY once, and that single record fully
            // matches the binding. Every other outcome is EFFECT_UNKNOWN.
            async function reconcileOnce(expected, createReason) {
              let response;
              try {
                response = await github.rest.checks.listForRef({
                  owner: OWNER,
                  repo: REPO,
                  ref: HEAD_SHA,
                  check_name: expected.name,
                  filter: 'all',
                  per_page: PAGE_SIZE,
                  page: 1,
                  request: { retries: 0 },
                });
              } catch (err) {
                unknown(expected, `recovery read failed after ${createReason}`);
                return;
              }
              // A non-empty Link header means this is not the whole list. Reject it
              // BEFORE total_count is considered: a next page or a truncated list never
              // resolves an unknown, even when the count on this page looks aligned.
              if (linkHeaderValue(response && response.headers) !== '') {
                unknown(expected, `recovery read page advertises more pages after ${createReason}`);
                return;
              }
              const data = response && response.data;
              if (!data || typeof data !== 'object' || Array.isArray(data)) {
                unknown(expected, `recovery read returned no data after ${createReason}`);
                return;
              }
              const runs = data.check_runs;
              if (!Array.isArray(runs)
                || typeof data.total_count !== 'number'
                || !Number.isInteger(data.total_count)
                || data.total_count !== runs.length
                || runs.length > PAGE_SIZE) {
                unknown(expected, `recovery read page is incomplete or malformed after ${createReason}`);
                return;
              }
              // EVERY row must be a real check-run object BEFORE it can participate in
              // the census: a null/string/number/array row makes the whole page
              // untrustworthy and fails closed instead of being silently skipped.
              for (const row of runs) {
                if (!row || typeof row !== 'object' || Array.isArray(row)) {
                  unknown(expected, `recovery read page contains a malformed row after ${createReason}`);
                  return;
                }
              }
              // Census on external_id ALONE, before any other field is validated.
              // Sibling records from older runs with a different external_id are normal;
              // the exact binding must appear EXACTLY once on this page.
              const bound = runs.filter(record => record.external_id === expected.external_id);
              if (bound.length === 0) {
                // One page without our binding never proves no-write.
                unknown(expected, `recovery read found no record for the exact binding after ${createReason}`);
                return;
              }
              if (bound.length > 1) {
                unknown(expected, `recovery read found ${bound.length} records for the exact binding after ${createReason}`);
                return;
              }
              const reason = receiptReason(bound[0], expected);
              if (reason !== null) {
                unknown(expected, `recovery read found a conflicting exact-binding record (${reason}) after ${createReason}`);
              }
            }

            for (const check of checks) {
              const ok = pass(check.values);
              const name = check.name;
              const expected = {
                name,
                conclusion: ok ? 'success' : 'failure',
                title: `${name}: ${ok ? 'passed' : 'failed'}`,
                summary: check.values.join(', '),
                details_url: DETAILS_URL,
                external_id: externalId(name),
              };
              validateBindingInputs(name, expected.external_id);
              const attempt = await createOnce(expected);
              if (!attempt.confirmed) {
                await reconcileOnce(expected, attempt.reason);
              }
            }
      - name: fail pack when any fence failed
        if: always()
        env:
          SELF_MOD_SELFTEST: ${{ steps.self_mod_selftest.outcome }}
          SELF_MOD_LIVE: ${{ steps.self_mod_live.outcome }}
          SELF_MOD_TESTS: ${{ steps.self_mod_tests.outcome }}
          AGENT_OS_RECORD_CONTRACT: ${{ steps.agent_os_record_contract.outcome }}
          CAPABILITY_SELFTEST: ${{ steps.capability_selftest.outcome }}
          CAPABILITY_LIVE: ${{ steps.capability_live.outcome }}
          GRADER_SELFTEST: ${{ steps.grader_selftest.outcome }}
          GRADER_LIVE: ${{ steps.grader_live.outcome }}
          CHAT_NAV_SELFTEST: ${{ steps.chat_nav_selftest.outcome }}
          CHAT_NAV_LIVE: ${{ steps.chat_nav_live.outcome }}
          PUBLISH: ${{ steps.publish.outcome }}
        run: |
          set -euo pipefail
          for outcome in \
            "$SELF_MOD_SELFTEST" "$SELF_MOD_LIVE" "$SELF_MOD_TESTS" \
            "$AGENT_OS_RECORD_CONTRACT" \
            "$CAPABILITY_SELFTEST" "$CAPABILITY_LIVE" \
            "$GRADER_SELFTEST" "$GRADER_LIVE" \
            "$CHAT_NAV_SELFTEST" "$CHAT_NAV_LIVE" "$PUBLISH"; do
            case "$outcome" in
              success|skipped) ;;
              *) echo "::error::fence pack failed ($outcome)"; exit 1 ;;
            esac
          done

  # Fork fallback: GitHub itself creates these named job check runs, so no
  # checks:write token is needed. The high-volume same-repository path above
  # remains one runner; public contributors retain the original fail-closed
  # behavior instead of being stuck on missing required contexts.
  fork-self-mod-fence:
    name: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'self-mod-fence' || 'fork-self-mod-fence-unused' }}
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest pyyaml
      - run: python3 scripts/check_self_mod_fence.py --selftest
      - name: self-mod-fence live check (loop PR + immutable → BLOCKED)
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git fetch origin ${{ github.base_ref || 'main' }}
          BRANCH="${{ github.head_ref }}"
          SELF_MOD_INPUT_DIR="$RUNNER_TEMP/self-mod-fence"
          FILES_FILE="$SELF_MOD_INPUT_DIR/changed-files.json"
          TRAILERS_FILE="$SELF_MOD_INPUT_DIR/commit-messages.txt"
          mkdir -p "$SELF_MOD_INPUT_DIR"
          git diff --name-only -z origin/${{ github.base_ref || 'main' }}...HEAD |
            python3 scripts/check_self_mod_fence.py \
              --write-files-file-from-nul "$FILES_FILE"
          git log --format="%B" origin/${{ github.base_ref || 'main' }}..HEAD > "$TRAILERS_FILE"
          python3 scripts/check_self_mod_fence.py \
            --branch "$BRANCH" \
            --files-file "$FILES_FILE" \
            --trailers-file "$TRAILERS_FILE"
      - run: python3 scripts/agentos.py validate
      - run: python -m pytest tests/test_self_mod_fence.py -q

  fork-capability-broker:
    name: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'capability-broker' || 'fork-capability-broker-unused' }}
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest pyyaml
      - run: python3 scripts/check_capability_redline.py --selftest
      - run: python3 scripts/check_capability_redline.py

  fork-grader-manifest:
    name: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'grader-manifest' || 'fork-grader-manifest-unused' }}
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest pyyaml
      - run: python3 scripts/check_grader_manifest.py --selftest
      - run: python3 scripts/check_grader_manifest.py
