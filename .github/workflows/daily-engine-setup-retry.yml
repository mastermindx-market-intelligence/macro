name: daily-engine-setup-retry

# A self-hosted Mac runner can disappear before repository code starts. Two
# production signatures are known: the older Set up job cancellation race, and
# a runner shutdown while actions/checkout owns the process.  daily.yml's long
# downstream graph can keep moving after either loss, leaving the sole
# authoritative engine (and therefore Prophet/seasonality) dark.
#
# This is not a generic retry lane. After a daily attempt is fully terminal it
# asks a fail-closed controller to re-run exactly one engine job only when one of
# those bounded pre-code signatures matches. GitHub re-runs that job plus its
# dependents. Timeouts after repository code starts, ordinary checkout failures,
# mass/operator cancellations, untrusted refs, and attempt 2+ are hard no-ops.
on:
  workflow_run:
    workflows: [daily]
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: daily-engine-setup-retry-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  retry-setup-cancelled-engine:
    if: >-
      github.event.workflow_run.head_branch == github.event.repository.default_branch
      && github.event.workflow_run.head_repository.full_name == github.repository
      && (github.event.workflow_run.event == 'schedule'
      || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          filter: blob:none
          sparse-checkout: scripts/ci/retry_daily_engine_setup_cancel.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: evaluate bounded pre-code engine loss and retry once
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/ci/retry_daily_engine_setup_cancel.py
