name: seo-director
# Weekly SEO audit of the rendered site (Beacon dept, engine.marketing.seo_director).
# Runs Sunday 15:00 UTC — off the nightly (daily) and weekly batch (Saturday 14:00 UTC) lanes.
# Manual dispatch always runs regardless of the var gate.
on:
  schedule:
    - cron: "0 15 * * 0"    # Sunday 15:00 UTC — clear of nightly + Saturday batch
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Share the pipeline-batch lane with weekly/backfill; never blocks the daily pipeline.
  group: pipeline-batch
  cancel-in-progress: false

jobs:
  seo-audit:
    permissions:
      contents: write
      pull-requests: write
    # Gate: manual dispatch always runs; scheduled runs only when var is true.
    # Unset var = off / dark (safe default — won't run on first deploy until operator enables).
    if: github.event_name == 'workflow_dispatch' || vars.SEO_DIRECTOR_ENABLED == 'true'
    runs-on: [self-hosted, macstudio]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: python 3.12 (Homebrew venv - self-hosted runner)
        run: |
          VENV="$HOME/.cache/mm-venv-${RUNNER_NAME:-default}"
          [ -x "$VENV/bin/python" ] || /opt/homebrew/bin/python3.12 -m venv "$VENV"
          echo "$VENV/bin" >> "$GITHUB_PATH"
          "$VENV/bin/python" -m pip install --quiet --upgrade pip

      - run: pip install -r requirements.txt

      - name: run SEO director audit
        run: |
          python -m engine.marketing.seo_director --root .
          echo "seo_director: audit complete"

      - name: search console ingest (credentials-gated)
        if: always()
        env:
          GSC_SA_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$GSC_SA_JSON" ]; then
            echo "GSC credentials not configured — writing unavailable state"
          fi
          python -m engine.marketing.seo_search_console --root . || echo "::warning::gsc ingest crashed (non-fatal)"

      - name: IndexNow submit
        if: always()
        run: |
          # No secrets: the IndexNow key is PUBLIC by protocol design (ownership is
          # proven by serving site/<key>.txt, which the edge allowlists). Submits only
          # the genuine new/changed/deleted diff vs data/marketing/seo/indexnow_state.json,
          # which the commit step below ships. Fail-soft — never fails the audit.
          python -m engine.marketing.indexnow --root . || echo "::warning::indexnow crashed (non-fatal)"

      - name: commit data/marketing/seo artifacts
        if: always()
        run: |
          set -uo pipefail
          . "${GITHUB_WORKSPACE:-.}/scripts/ci/push_retry.sh"
          PUSH_LABEL="seo-director"
          # workflow_dispatch accepts any ref; publishing HEAD to main from a
          # feature branch would land unreviewed commits with no PR and no CI.
          # Off-main dispatches still run the audit above — only the push is
          # withheld, so dispatching this lane on a branch stays a legitimate
          # way to read its diagnostic output.
          if ! push_on_main_ok; then exit 0; fi
          git config user.name "dashboard-bot"
          git config user.email "actions@users.noreply.github.com"

          # Stage ONLY the seo artifact directory — never touch other paths.
          git add data/marketing/seo 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "no seo audit changes to commit"
            exit 0
          fi

          git commit -m "seo-director: weekly audit $(date -u +%F)"

          # Publish through the shared policy (scripts/ci/push_retry.sh):
          # push_do carries the publication preflight and its sticky terminal
          # receipt, so a PENDING/UNKNOWN publication stop can never enter a
          # second rebase/write, and push_lost keeps a lost publication RED
          # instead of a warning-only success. Ceiling/budget preserved from
          # the old deterministic ladder (5 attempts inside its ~90s envelope).
          PUSH_MAX_ATTEMPTS=5
          PUSH_BUDGET_SECS=90
          push_retry_init "seo-director audit artifacts"
          while push_attempt; do
            git fetch origin main || true
            # Remove any untracked files that shadow origin/main paths (stranded-data guard).
            comm -12 <(git ls-files --others --exclude-standard | LC_ALL=C sort) \
                     <(git ls-tree -r --name-only origin/main | LC_ALL=C sort) \
              | while IFS= read -r f; do rm -f -- "$f" || true; done
            if git pull --rebase --autostash origin main && push_autostash_ok && push_do origin HEAD:main; then
              echo "seo-director: pushed audit artifacts on attempt $PUSH_ATTEMPT"
              push_won
              exit 0
            fi
            push_abort_rebase
            push_backoff
          done
          push_lost
          echo "::error title=seo-director NOT pushed::$PUSH_ATTEMPT rebase/push attempts failed ($PUSH_STOP) — the seo audit artifacts commit exists only on the runner and is discarded by the next clean checkout; re-run this workflow"
          exit 1

      - name: summary
        if: always()
        run: |
          SC=data/marketing/seo/seo_scorecard.json
          if [ -f "$SC" ]; then
            python -c "import json; sc=json.load(open('data/marketing/seo/seo_scorecard.json')); print('health_score:', sc.get('health_score')); print('issues:', sc.get('issue_counts_by_severity')); print('deltas_vs_prior:', sc.get('deltas_vs_prior'))" || true
          else
            echo "no scorecard artifact (dry run or audit failed)"
          fi
