name: portfolio-recovery-wire-deadman-ci-once

on:
  push:
    branches:
      - ops/portfolio-recovery-acceptance-20260912
    paths:
      - .github/workflows/portfolio-recovery-acceptance-once.yml

permissions:
  contents: write

concurrency:
  group: portfolio-recovery-wire-deadman-ci-20260912
  cancel-in-progress: false

jobs:
  wire-focused-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the exact PR branch
        uses: actions/checkout@v4
        with:
          ref: claude/portfolio-decision-deadman-20260912
          filter: blob:none
          fetch-depth: 1
          sparse-checkout: |
            /*
            !/site/
            !/data/
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refuse a moved implementation head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "c4679532fa0f1b0abcbbc7fa8d5521e5b3119c9b"

      - name: Wire the focused suite into the code gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/ci/legacy-jobs.yml')
          text = path.read_text(encoding='utf-8')
          marker = '  portfolio-decision-deadman:\n'
          if marker in text:
              raise SystemExit('portfolio-decision-deadman job already exists')
          expression = '$' + '{{ false }}'
          snippet = f'''  portfolio-decision-deadman:
            if: {expression}
            gate: code
            paths:
              - ".github/workflows/portfolio-decision-deadman.yml"
              - "scripts/portfolio_decision_deadman.py"
              - "tests/test_portfolio_decision_deadman*.py"
            runs-on: ubuntu-latest
            steps:
              - uses: actions/checkout@v4
              - uses: actions/setup-python@v5
                with: {{ python-version: "3.12" }}
              - name: install focused test deps
                run: pip install pytest
              - name: portfolio decision dead-man contract
                run: >-
                  python -m pytest -q
                  tests/test_portfolio_decision_deadman.py
                  tests/test_portfolio_decision_deadman_cli.py
                  tests/test_portfolio_decision_deadman_contract.py
                  tests/test_portfolio_decision_deadman_execution.py
                  tests/test_portfolio_decision_deadman_governed.py
                  tests/test_portfolio_decision_deadman_release.py

          '''
          anchor = 'jobs:\n'
          if text.count(anchor) != 1:
              raise SystemExit('legacy job manifest anchor is not unique')
          path.write_text(text.replace(anchor, anchor + snippet, 1), encoding='utf-8')
          PY
          git diff --check

      - name: Prove the focused suite and manifest contract
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest pyyaml
          python -m pytest -q \
            tests/test_portfolio_decision_deadman.py \
            tests/test_portfolio_decision_deadman_cli.py \
            tests/test_portfolio_decision_deadman_contract.py \
            tests/test_portfolio_decision_deadman_execution.py \
            tests/test_portfolio_decision_deadman_governed.py \
            tests/test_portfolio_decision_deadman_release.py
          python scripts/run_ci_pack.py \
            --workflow .github/ci/legacy-jobs.yml \
            --pack-index 0 \
            --pack-count 12 \
            --validate-only
          git fetch --depth=1 origin c78d5a4fd3662bf36092c547abcf0dec9d34691a
          python scripts/check_contract_delta.py --base c78d5a4fd3662bf36092c547abcf0dec9d34691a

      - name: Commit the proven CI ownership edge
        shell: bash
        run: |
          set -euo pipefail
          git config user.name MastermindX1
          git config user.email team1@mastermind-x.com
          git add .github/ci/legacy-jobs.yml
          git commit -m "ci(portfolio): own the decision dead-man suite"
          git push origin HEAD:refs/heads/claude/portfolio-decision-deadman-20260912
