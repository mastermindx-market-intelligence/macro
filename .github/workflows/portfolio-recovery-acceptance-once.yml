name: portfolio-recovery-governed-hold-red-once

on:
  push:
    branches:
      - ops/portfolio-recovery-acceptance-20260912
    paths:
      - .github/workflows/portfolio-recovery-acceptance-once.yml

permissions:
  contents: read

concurrency:
  group: portfolio-recovery-governed-hold-red-20260912
  cancel-in-progress: false

jobs:
  governed-hold-regression-red:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b3c04dd789878db88c873586a0dbbd870d8d50c0
          filter: blob:none
          persist-credentials: false
          sparse-checkout: |
            scripts/portfolio_decision_deadman.py
            tests/test_portfolio_decision_deadman.py
            tests/test_portfolio_decision_deadman_governed.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pytest
      - run: python -m pytest -q tests/test_portfolio_decision_deadman_governed.py
