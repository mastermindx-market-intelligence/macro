name: debt-maturity-drip
# Off-render nightly registration for packet B-F09-3's debt-maturity ladder
# producer (META-CEO ruling round 2, B1: "refresh_cache_for_cik is called for
# every issuer the stock library builds, inside the existing collector/
# nightly step that already fetches companyfacts (never a network call on
# the render path)").
#
# collectors/edgar_facts.py._statements_for() already fetches each filer's
# full SEC companyfacts document for the ~1,334-ticker fundamentals universe
# (the same universe the stock library builds pages for) and now warms
# engine/debt_maturity.py's bounded per-issuer cache from that SAME response
# (no second SEC round trip) -- see _dm_wire_cache() in that file. That
# collector's own docstring already claimed a "weekly, resumable, capped
# drip (REFRESH_DAYS=30, max_new=200/run)" but had no automatic schedule of
# its own -- only workflow_dispatch via edgar_flow_ops.yml. This workflow is
# the missing registration: it runs the SAME pre-existing, already-tested,
# non-force universe pass (scripts/backfill_edgar_flow.py --max N, no
# --force, so it respects the 30-day staleness guard and is safe to run
# nightly) on its own schedule, on a light runner, entirely separate from
# edgar_flow_ops.yml's heavy manual `--force --max 9999` full-universe
# actions and from daily.yml's already-timing-constrained engine job.
#
# House law: heavy compute goes off the render path (see filing-forensics-sec.yml
# for the identical off-render pattern applied to a different SEC source).
#
# W8B F09-11 fix (META-CEO FROZEN SPEC R1/R2/R3): the old header claimed the
# drip shared a runner workspace with daily.yml's engine job and that a broad
# workspace sweep on the next run would carry the writes forward. That premise
# failed twice: actions/checkout@v4 defaults to clean: true so the FIRST
# subsequent checkout on any registration deletes untracked writes (daily.yml
# itself documents this exact failure mode for other artifacts), and the
# macstudio runner label spans several registrations (each with its own
# _work tree) so the drip and the engine job rarely share a tree. The
# nightly engine job also never calls collectors.edgar_facts /
# backfill_edgar_flow / build_debt_maturity, so nothing on the nightly path
# writes the cache. Result: the cache ran green three nights and wrote zero
# commits to main.
#
# R2 (typed artifact, not a forward ledger): both data/debt_maturity/cache/
# (per-CIK JSON with fetched_at) and data/edgar/statements.parquet (PIT
# snapshot with as_of) are re-derivable fetch-time caches with no
# forward-only accrual semantics, so the nightly-sole-advancer law does not
# gate them. This job now commits and pushes ONLY those two paths and
# nothing else.
#
# The persist step (added by W8B F09-11) runs scripts/debt_maturity_drip_push
# under DEBT_MATURITY_DRIP_PUSH=1; that helper takes the path-scoped GATE →
# STAGE → EMPTY → CEILING → COMMIT → PUSH(retry) shape, refuses any payload
# above 48 MiB, refuses any push that drops a path the old HEAD still
# carried, and exits 0 on every refusal so the drip stays fail-soft. The
# workflow_dispatch ``push`` input (default "1") is the kill switch; pass
# ``push=0`` to land a no-op drip run that does not commit.
#
# W4 risk disclosure: a repository ruleset can reject bot pushes with GH013
# (postmortem 2026-08-17). On rejection the helper's refusal path leaves the
# cache on the runner and exits 0, so the drip stays fail-soft -- the cache
# goes stale, never wrong.
on:
  schedule:
    - cron: "50 2 * * *"
  workflow_dispatch:
    inputs:
      max_new:
        description: "Max tickers to fetch this run (bounded, resumable, respects 30-day staleness)"
        required: false
        default: "200"
      push:
        description: "1 = commit and push the two output paths to main; 0 = leave them on the runner"
        required: false
        default: "1"

permissions:
  contents: write

concurrency:
  group: debt-maturity-drip
  cancel-in-progress: false

jobs:
  drip:
    runs-on: [self-hosted, macstudio]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: python 3.12 (Homebrew venv — self-hosted runner)
        run: |
          VENV="$HOME/.cache/mm-venv-${RUNNER_NAME:-default}"
          [ -x "$VENV/bin/python" ] || /opt/homebrew/bin/python3.12 -m venv "$VENV"
          echo "$VENV/bin" >> "$GITHUB_PATH"
          "$VENV/bin/python" -m pip install --quiet --upgrade pip

      - run: pip install -r requirements.txt

      - name: bounded universe drip (statements.parquet + debt-maturity cache; fail-soft)
        run: |
          MAX_NEW="${{ github.event.inputs.max_new || '200' }}"
          echo "=== debt-maturity-drip: max_new=$MAX_NEW (no --force; respects 30-day staleness) ===" >&2
          python -m scripts.backfill_edgar_flow --max "$MAX_NEW" \
            2>&1 | tee "$RUNNER_TEMP/debt_maturity_drip.log"; rc=${PIPESTATUS[0]}
          echo "=== exit code: $rc ===" >&2
          if [ "$rc" -ne 0 ]; then
            echo "::warning::debt-maturity-drip exited $rc — check log (fail-soft; cache goes stale, not wrong)"
          fi
          echo "=== data/edgar/statements.parquet + data/debt_maturity/cache updated on runner. ==="
          exit 0

      - name: persist cache + statements to main (bounded, rebase-free, [skip ci])
        env:
          DEBT_MATURITY_DRIP_PUSH: ${{ github.event.inputs.push || '1' }}
        run: python -m scripts.debt_maturity_drip_push --base main