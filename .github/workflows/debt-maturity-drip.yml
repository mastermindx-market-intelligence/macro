name: debt-maturity-drip
# Packet W8B_F09_11 (META-CEO B, 2026-09-13).
#
# What this workflow writes, and how the writes reach origin/main:
#   scripts/backfill_edgar_flow --max N refreshes two fetch-time caches on
#   the runner — data/edgar/statements.parquet and the per-CIK JSON under
#   data/debt_maturity/cache/. Those are the engine/debt_maturity.py inputs
#   the stock panel's maturity-wall timeline renders against. Both caches
#   are re-derivable at fetch time and carry no forward-only accrual
#   semantics (the cache JSON files carry a fetched_at; the parquet carries
#   an as_of), so the nightly-sole-advancer law does not bind — the
#   debt-maturity cache is a TYPED ARTIFACT, not a forward ledger
#   (orch/w8/W8_RULING.md, packet W8-1).
#
# Why the previous shape never reached main (R1):
#   The prior header asserted a broad `git add data/` sweep on the same
#   `macstudio` host would carry these writes forward. That premise failed
#   twice:
#     1. actions/checkout@v4 defaults to clean: true, so the first checkout
#        in ANY subsequent job on the same runner registration runs
#        `git clean -ffdx + git reset --hard` and deletes the untracked
#        cache directory while reverting the tracked parquet to the last
#        committed state. daily.yml already documents this exact failure
#        for other artefacts (daily.yml:553, :824, :1248).
#     2. The `macstudio` label spans several runner registrations
#        (mac-builder-1 / -2 / -5 named in daily.yml's engine comment).
#        Each registration has its own _work directory, so the drip and
#        the engine job usually do not even share a tree. The 09-12 run
#        (run id 34680521723) on mac-builder-5 produced
#        "edgar_facts: 2841 universe, fetching 200 (cap 200)" then
#        "edgar_facts: cache now 1590 tickers, 9230 ticker-years" on
#        the runner — the writes happened — yet data/debt_maturity/ on
#        origin/main stays empty (`git ls-tree -r origin/main
#        data/debt_maturity/ | wc -l` = 0) and data/edgar/statements.parquet
#        was last committed 5a22028be442 on 2026-08-11.
#
# The one shape that lands (R3): this job is its OWN committer of
# exactly its two output paths. The push step runs
# scripts.debt_maturity_drip_push, which is GATE → STAGE → EMPTY →
# CEILING → COMMIT → PUSH(rebase-free re-checkout cycle), stages ONLY
# the two allowed paths, refuses oversized payloads at 48 MiB, never
# reads a secret, and exits 0 on every refusal — the drip is fail-soft
# (cache goes stale, not wrong). The workflow_dispatch input `push`
# defaults to "1" so the schedule path pushes on the first run after
# merge; setting it to "0" via the GitHub UI is the kill switch.
on:
  schedule:
    - cron: "50 2 * * *"
  workflow_dispatch:
    inputs:
      max_new:
        description: "Max tickers to fetch this run (bounded, resumable, respects 30-day staleness)"
        required: false
        default: "200"
      push:
        description: "1 = commit and push the two output paths to main; 0 = leave them on the runner"
        required: false
        default: "1"

permissions:
  contents: write

concurrency:
  group: debt-maturity-drip
  cancel-in-progress: false

jobs:
  drip:
    runs-on: [self-hosted, macstudio]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: python 3.12 (Homebrew venv — self-hosted runner)
        run: |
          VENV="$HOME/.cache/mm-venv-${RUNNER_NAME:-default}"
          [ -x "$VENV/bin/python" ] || /opt/homebrew/bin/python3.12 -m venv "$VENV"
          echo "$VENV/bin" >> "$GITHUB_PATH"
          "$VENV/bin/python" -m pip install --quiet --upgrade pip

      - run: pip install -r requirements.txt

      - name: bounded universe drip (statements.parquet + debt-maturity cache; fail-soft)
        run: |
          MAX_NEW="${{ github.event.inputs.max_new || '200' }}"
          echo "=== debt-maturity-drip: max_new=$MAX_NEW (no --force; respects 30-day staleness) ===" >&2
          python -m scripts.backfill_edgar_flow --max "$MAX_NEW" \
            2>&1 | tee "$RUNNER_TEMP/debt_maturity_drip.log"; rc=${PIPESTATUS[0]}
          echo "=== exit code: $rc ===" >&2
          if [ "$rc" -ne 0 ]; then
            echo "::warning::debt-maturity-drip exited $rc — check log (fail-soft; cache goes stale, not wrong)"
          fi

      - name: persist cache + statements to main (bounded, rebase-free, [skip ci])
        env:
          DEBT_MATURITY_DRIP_PUSH: ${{ github.event.inputs.push || '1' }}
        run: python -m scripts.debt_maturity_drip_push --base main
