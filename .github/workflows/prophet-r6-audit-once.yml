name: Prophet R6 frozen board audit (one shot)

on:
  push:
    branches:
      - sol/prophet-absolute-downside-research-20260910
    paths:
      - .github/workflows/prophet-r6-audit-once.yml

permissions:
  contents: read

concurrency:
  group: prophet-r6-frozen-audit
  cancel-in-progress: false

jobs:
  audit:
    if: "${{ github.event.head_commit.message == 'research(prophet): execute frozen R6 board audit once' }}"
    name: Frozen R6 audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install frozen research dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            'numpy==2.3.3' 'pandas==3.0.5' 'pyarrow==25.0.1'

      - name: Materialize frozen harness and immutable input
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/prophet-r6"
          mkdir -p "$root"

          cat \
            .github/r6/board_coherence_audit.py.gz.b64.part1 \
            .github/r6/board_coherence_audit.py.gz.b64.part2 \
            | base64 --decode | gzip -dc > "$root/board_coherence_audit.py"
          cat \
            .github/r6/test_board_coherence_audit.py.gz.b64.part1 \
            .github/r6/test_board_coherence_audit.py.gz.b64.part2 \
            | base64 --decode | gzip -dc > "$root/test_board_coherence_audit.py"
          base64 --decode .github/r6/run_mutations.py.gz.b64 \
            | gzip -dc > "$root/run_mutations.py"

          cat > "$root/harness.sha256" <<'HASHES'
          8ebe68da6f1e81162b91d6724ee87b9ea1d24317b36098d2b223f80b8af2bca5  board_coherence_audit.py
          b7863b16795de945ebfffb2eb8c0580927a8ccbda0c4e04cba32b76e4a60c8f4  test_board_coherence_audit.py
          0599457f3086a0ba248f21a69e8b42cc0b4b0becb838d4aae50b557e1866274e  run_mutations.py
          HASHES
          (cd "$root" && sha256sum --check harness.sha256)

          frozen=bbf6c1e65fc9cad1ba40efa26126cc60036713d0
          frozen_path=data/us_board_ledger/retro_grades.parquet
          git cat-file -e "$frozen^{commit}"
          test "$(git rev-parse "$frozen:$frozen_path")" = \
            af8bdb5a0cedfcfe3c3ea0de37c86e79f7736462
          git show "$frozen:$frozen_path" > "$root/retro_grades.parquet"
          printf '%s  %s\n' \
            fecaf0aa3e454ad93bd04cebd28b916f6bc71f50d71946ce5f03c5c50aa43399 \
            retro_grades.parquet > "$root/input.sha256"
          (cd "$root" && sha256sum --check input.sha256)

      - name: Verify harness contracts
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/prophet-r6"
          cd "$root"
          python -m py_compile \
            board_coherence_audit.py test_board_coherence_audit.py run_mutations.py
          python -m unittest -v test_board_coherence_audit.py 2>&1 | tee unit-tests.log
          python run_mutations.py 2>&1 | tee mutations.log
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('mutation_results.json').read_text())
          assert report['killed'] == report['total'] == 20, report
          PY

      - name: Execute frozen audit once
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/prophet-r6"
          test ! -e "$root/results"
          cd "$root"
          python board_coherence_audit.py \
            retro_grades.parquet results \
            --expected-sha256 fecaf0aa3e454ad93bd04cebd28b916f6bc71f50d71946ce5f03c5c50aa43399
          python - <<'PY'
          import hashlib
          import json
          import platform
          from pathlib import Path
          import numpy
          import pandas
          import pyarrow

          root = Path('.')
          summary = json.loads((root / 'results/summary.json').read_text())
          manifest = {
              'workflow_commit': '${{ github.sha }}',
              'workflow_run_id': '${{ github.run_id }}',
              'python': platform.python_version(),
              'numpy': numpy.__version__,
              'pandas': pandas.__version__,
              'pyarrow': pyarrow.__version__,
              'files': {},
          }
          for path in [
              root / 'board_coherence_audit.py',
              root / 'test_board_coherence_audit.py',
              root / 'run_mutations.py',
              root / 'mutation_results.json',
              root / 'results/coverage.csv',
              root / 'results/boards.csv',
              root / 'results/summary.json',
          ]:
              payload = path.read_bytes()
              manifest['files'][str(path)] = {
                  'bytes': len(payload),
                  'sha256': hashlib.sha256(payload).hexdigest(),
              }
          (root / 'manifest.json').write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + '\n'
          )
          brief = {
              'kind': summary['kind'],
              'status': summary['status'],
              'input': summary['input'],
              'harness_sha256': summary['harness_sha256'],
              'price_basis_row_counts': summary['price_basis_row_counts'],
              'by_horizon': summary['summary']['by_horizon'],
              'clean_basis_sensitivity': summary['summary']['clean_basis_sensitivity'],
          }
          print('R6_BRIEF_JSON_BEGIN')
          print(json.dumps(brief, indent=2, sort_keys=True))
          print('R6_BRIEF_JSON_END')
          print('R6_MANIFEST_JSON_BEGIN')
          print(json.dumps(manifest, indent=2, sort_keys=True))
          print('R6_MANIFEST_JSON_END')
          PY
          tar -czf prophet-r6-results.tgz \
            board_coherence_audit.py test_board_coherence_audit.py run_mutations.py \
            mutation_results.json unit-tests.log mutations.log manifest.json \
            results/coverage.csv results/boards.csv results/summary.json
          sha256sum prophet-r6-results.tgz

      - name: Upload immutable audit evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prophet-r6-frozen-audit
          path: |
            ${{ runner.temp }}/prophet-r6/prophet-r6-results.tgz
            ${{ runner.temp }}/prophet-r6/manifest.json
            ${{ runner.temp }}/prophet-r6/results/summary.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
