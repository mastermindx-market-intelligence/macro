schema: runner_policy.v2
phase: p3b-b-production-route
repository_visibility: public
ordinary_pr_ci: github-hosted

runtime_runner_group:
  name: macro-home-canary
  repository: mastermindx-market-intelligence/macro
  allows_public_repositories: true
  restricted_to_workflows: true
  selected_workflows:
    - mastermindx-market-intelligence/macro/.github/workflows/selfhosted-ci-canary.yml@refs/heads/main
    - mastermindx-market-intelligence/macro/.github/workflows/m1-runner-canary.yml@refs/heads/main
    - mastermindx-market-intelligence/macro/.github/workflows/engine-render.yml@refs/heads/main
    - mastermindx-market-intelligence/macro/.github/workflows/render.yml@refs/heads/main
    - mastermindx-market-intelligence/macro/.github/workflows/trusted-ci-executor.yml@refs/heads/main

scenario_routes:
  same_repo_ordinary_pr: github-hosted
  fork_pr: github-hosted
  trusted_dispatch_canary: pc-ci-canary
  trusted_executor_dispatch: pc-ci

trusted_executor_route:
  workflow: .github/workflows/trusted-ci-executor.yml
  job: trusted-pack
  group: macro-home-canary
  labels: [ci-linux]
  call_enabled: true
  production_enabled: true

protected_hosted_routes:
  - workflow: .github/workflows/ci.yml
    jobs: [ci-plan, ci-pack, ci-gate]
  - workflow: .github/workflows/fences.yml
    jobs: [fence-pack, fork-self-mod-fence, fork-capability-broker, fork-grader-manifest]
  - workflow: .github/workflows/merge-on-green.yml
    jobs: [sweep]

custom_routes:
  - workflow: .github/workflows/selfhosted-ci-canary.yml
    job: selfhosted-pack
    event: workflow_dispatch
    labels: [self-hosted, ci-linux-canary, ci-linux]
  - workflow: .github/workflows/selfhosted-ci-canary.yml
    job: cache-negative-control
    event: workflow_dispatch
    labels: [self-hosted, ci-linux-canary]
  - workflow: .github/workflows/selfhosted-ci-canary.yml
    job: contamination-probe
    event: workflow_dispatch
    labels: [self-hosted, ci-linux-canary]
  - workflow: .github/workflows/selfhosted-ci-canary.yml
    job: render-reservation-probe
    event: workflow_dispatch
    labels: [self-hosted, render-linux]
  - workflow: .github/workflows/m1-runner-canary.yml
    job: m1-service-canary
    event: workflow_dispatch
    labels: [self-hosted, m1-theta]

pool_topology:
  pc-ci-canary:
    slots: 1
    labels: [self-hosted, ci-linux-canary]
    forbidden_labels: [render-linux]
  pc-ci:
    slots: 3
    labels: [self-hosted, ci-linux]
    forbidden_labels: [render-linux]
    # ── PENDING FOURTH SLOT (rule R14, added 2026-09-01) ──────────────────────
    # `slots` is the LIVE, routable inventory and stays at three. The fourth slot
    # is declared here as ARCHITECTURE ONLY: the code, units, cleanup roots and
    # receipts support four candidates, but no fourth listener is registered and
    # none is routable. The split exists because "code supports four" and "four
    # slots are carrying traffic" are different facts, and collapsing them is how
    # a policy file starts claiming capacity that does not exist.
    #
    # `pending_labels` is deliberately platform/architecture identity ONLY. The
    # fourth runner is bootstrapped WITHOUT `ci-linux` so its roster, service,
    # PID, root and cgroup can be proved online but unroutable. Adding `ci-linux`
    # here, or adding pc-ci-4 to any label_registry carried_by list, is the live
    # activation act — it belongs to a separate audited carrier that first
    # confirms GitHub reports the exact runner online/idle, never to this one.
    pending_slots: 1
    pending_carriers: [pc-ci-4]
    pending_labels: [self-hosted, Linux, X64]
  pc-render:
    # `slots: 1` is R7's architectural RESERVATION — one host held for the serial
    # renderer, disjoint from the CI pool — and R7 requires exactly one. It is not
    # a claim that the slot is routable today: as of the 2026-09-25 receipt
    # pc-render-1 is online and idle but carries only {self-hosted, Linux, X64}, so
    # it can route nothing the render lanes address. `labels` stays the contract the
    # reserved host is SUPPOSED to satisfy; `missing_labels` is the measured gap.
    # Closing that gap is the operator restore act, never an edit to this file —
    # and `scripts/check_runner_queue_hostage.py` is what notices if it reopens.
    slots: 1
    labels: [self-hosted, Linux, X64, render-linux]
    missing_labels: [render-linux]
    forbidden_labels: [ci-linux, ci-linux-canary]
  m1-theta-canary:
    slots: 1
    labels: [self-hosted, m1-theta]
    forbidden_labels: [macstudio, macstudio-light, theta-m1, codex, render-heavy]

# ── LABEL REGISTRY (rules R11/R12, added 2026-08-17) ─────────────────────────
# WHY THIS EXISTS. Runner labels are assigned through the runners API and live
# ONLY in API state — nothing in the repo pinned them, so deregistering a host
# silently orphaned every label it carried. `theta-m1` died with mac-builder-1/2
# and daily.yml's collect_tail became unschedulable from ~2026-08-15. A job
# queued on a label with no live runner holds its run open until GitHub's 24h
# queued-job kill; that run holds its per-cron concurrency group; the next
# night's real slot then pends with ZERO jobs created. That cascade froze every
# Prophet board 2026-08-14→17 with no red anywhere
# (research/PROPHET_OUTAGE_2026_08_17_POSTMORTEM.md,
# DSC:QUEUED-JOB-HOSTAGE-HOLDS-THE-NIGHTLY-CRON-GROUP). That discovery's own
# falsifier names this section: "a checked-in registry that fails CI when a
# workflow references a label absent from the live pool would close the
# orphaned-label class at PR time."
#
# WHAT IT IS AND IS NOT. This is the STATIC, checked-in model of the pool, not a
# liveness probe: listing runners needs an admin-scoped token CI does not carry,
# so `status` is operator-maintained documentation, refreshed by hand from
# `gh api repos/{owner}/{repo}/actions/runners`. The rules are therefore about
# DECLARATION, not observation:
#   R11  every literal runs-on label in every workflow appears below — so an
#        invented or renamed label is a PR-time red, not a silent queue-forever.
#   R12  a label marked `orphaned` may not be used by a workflow carrying a
#        `schedule:` trigger unless its entry declares a dated
#        `scheduled_use_waiver` — so the next host deregistration reds a PR
#        instead of freezing a nightly.
#   R15  (2026-09-25) the same bar for EVERY automatic trigger, not just `schedule:`.
#        `push:` is equally unattended and fires far more often — main takes ~25
#        pushes a day here against one cron line — so a push-only lane on a dead
#        label wedges harder, not softer. render.yml and engine-render.yml are
#        push-only and were therefore exempt from R12 by trigger alone while they
#        sat dark for three days.
# `offline` is deliberately NOT blocked: those hosts are registered and return (the
# PC pool is powered down between canary waves). An `offline` label on an unattended
# lane is still a queue risk worth watching, just not a merge stop. THE LOAD-BEARING
# WORD IS "RETURN" — `render-linux` was carried as `offline` while its declared
# hosts had been gone five weeks and its one live host had been de-labelled. A label
# with zero carriers is `orphaned`, whatever the reason; `offline` is for a pool that
# is powered down, not for one that no longer exists.
#
# AND NEITHER RULE CAN SEE A FACT NOBODY WROTE DOWN. `status` is hand-maintained
# documentation (no admin token in CI), so R11/R12/R15 are DECLARATION gates: they
# fire when a human records a death, never when one happens. That is why they were
# silent through both the 2026-08-17 and 2026-09-25 outages, and why the actual
# dead-man switch is `scripts/check_runner_queue_hostage.py`, which observes the
# live Actions API for the queued-with-no-runner symptom and needs no declaration
# to be correct. Keep this file honest, but never rely on it to notice.
#
# Verified against the live pool 2026-09-25 (gh api
# orgs/mastermindx-market-intelligence/actions/runners + repos/{repo}/actions/runners):
# 12 self-hosted hosts online, `render-linux` carried by none.
label_registry:
  ubuntu-latest:
    status: github-hosted
    carried_by: []
    note: GitHub-hosted; the Wave B/C default for every ordinary PR job.
  self-hosted:
    status: live
    carried_by: [mac-builder-3, mac-builder-4, mac-builder-5, mac-builder-light,
                 m1-light-1, m1-nightly-1, m1-nightly-2,
                 pc-ci-1, pc-ci-2, pc-ci-3, pc-render-1]
    note: >
      Never sufficient on its own — every self-hosted job pairs it with a
      capability label below, which is exactly why it proves nothing: pc-render-1
      carries `self-hosted` while carrying no capability label at all, so a
      `[self-hosted, render-linux]` job still has nowhere to run. pc-ci-4 also
      carries it live but is deliberately ABSENT here — R14 makes entering a live
      roster the activation act for the fourth PC CI slot, so it stays declared
      only as pool_topology.pc-ci.pending_labels.
  macOS:
    status: live
    carried_by: [mac-builder-3, mac-builder-4, mac-builder-5, mac-builder-light]
    note: Implicit OS label on every Mac Studio runner.
  ARM64:
    status: live
    carried_by: [mac-builder-3, mac-builder-4, mac-builder-5, mac-builder-light]
    note: Implicit architecture label on every Mac Studio runner.
  macstudio:
    status: live
    carried_by: [mac-builder-5, mac-builder-light]
    note: >
      The general production pool — TWO hosts, not five. This is the label the
      nightly, closing-bell, asia-close and the close-pass backstop all share,
      so it is one slot deep whenever closing-bell is holding the window.
  macstudio-light:
    status: live
    carried_by: [mac-builder-3]
    note: >
      Single host, disjoint from `macstudio`: live/light lanes that must not
      queue behind a multi-hour bake.
  parked:
    status: live
    carried_by: [mac-builder-4, mac-builder-5]
    note: >
      Referenced by no workflow today. Registered because it is NOT an exclusion
      — `parked` never prevented routing, and mac-builder-5 carries it alongside
      `macstudio`, so a `parked` job would consume a production slot.
  merge-control:
    status: live
    carried_by: [mac-builder-4]
    note: >
      Rollback-only merge-on-green capacity on the M2 through W5. W1-B routes the
      production sweep to GitHub-hosted capacity; do not retire this live registration.
  render-heavy:
    status: live
    carried_by: [mac-builder-light]
    note: >
      Reserves one host for the serial renderer. Shares that host with
      `macstudio`, so a heavy render and a production bake do contend.
  theta-m1:
    status: live
    carried_by: [mac-builder-3]
    note: >
      INTERIM RESTORE 2026-08-17. Originally the store-bearing M1 (mac-builder-1/2)
      that held the ThetaData Terminal and the 60GB thetadata_eod store; that host
      was deregistered and the label went with it, which is what made daily.yml's
      collect_tail unschedulable and froze the nightly. Restored onto
      mac-builder-3 so the label resolves, but mac-builder-3 is NOT the
      store-bearing host — tape lanes self-skip there by design (#3644,
      probe-only Terminal law). Re-point at the real store host when it returns.
  Linux:
    status: live
    carried_by: [pc-ci-1, pc-ci-2, pc-ci-3, pc-render-1]
    note: >
      Implicit OS label on the PC pool. Was declared `offline` against
      pc-render-2/3/4 until 2026-09-25; five Linux hosts are in fact online
      (pc-ci-4 among them, kept out of this roster per R14). An implicit platform
      label is never a capability — see `render-linux`.
  X64:
    status: live
    carried_by: [pc-ci-1, pc-ci-2, pc-ci-3, pc-render-1]
    note: >
      Implicit architecture label on the PC pool. Corrected from `offline`
      2026-09-25. pc-ci-4 carries it live but stays out of this roster per R14.
  render-linux:
    status: orphaned
    carried_by: []
    note: >
      ZERO CARRIERS since 2026-09-23T12:05Z — the 2026-09-25 render-lane outage.
      pc-render-1 is online and IDLE but its custom labels were stripped to the
      read-only set {self-hosted, Linux, X64}; it keeps org runner id 15, so the
      host was never re-registered, only de-labelled. pc-render-2/3/4 have been
      absent from the live pool since 2026-08-17. Declared `offline` until
      2026-09-25, which is what exempted it from R12 — `offline` means "registered
      and returns", and neither half is true here.
      RECEIPTS. Last job ever assigned: run 35819881039, started 2026-09-23T09:45:34Z
      on pc-render-1, done 12:05:08Z. Next job, created 12:05:09Z (run 35855143666),
      never assigned and killed at +24h00m00s exactly. Successor 35989213316 took
      the slot at 12:05:10Z and sat queued >20h. ~25 pushes behind it were
      superseded as `pending`, each one's updatedAt equal to the next run's
      createdAt. Consumers dark: render.yml, engine-render.yml (push),
      sector-intelligence.yml (push+schedule); selfhosted-ci-canary.yml's
      render-reservation-probe is dispatch-only. 1,479 committed site pages went
      stale behind it (research/RENDER_LANE_OUTAGE_2026_09_25_POSTMORTEM.md).
      RESTORE IS OPERATOR-OWNED: re-add the label to pc-render-1
      (`POST /orgs/{org}/actions/runners/15/labels`) or bring a labelled render host
      back. Not taken in-session — the strip has no recorded cause, so it may be
      deliberate, and re-labelling immediately releases a scope=all bake plus a
      three-day backlog onto a production host.
    scheduled_use_waiver:
      since: '2026-09-25'
      reason: >
        R12/R15 waiver of the DECLARATION gate only, so correcting this entry to
        the truth does not red main while the restore is operator-gated. It
        silences nothing: `scripts/check_runner_queue_hostage.py` observes the live
        Actions API three times a day and pages on the queued-with-no-runner
        symptom regardless of waiver state — that check, not this waiver, is the
        instrument that was missing for three days. Remove this waiver in the same
        act that restores the carrier.
  ci-linux:
    status: live
    carried_by: [pc-ci-1, pc-ci-2, pc-ci-3]
    note: >
      P2-accepted three-slot PC CI pool. Ordinary same-repository PR execution
      defaults to GitHub-hosted Linux/x64; this pool remains the explicit
      CI_EXECUTION_ROUTE=pc fallback/benchmark path through the protected-main
      trusted executor. Fork/untrusted PR execution, planning, anchors and the
      semantic gate remain GitHub-hosted.
  ci-linux-canary:
    status: live
    carried_by: [pc-ci-1]
    note: >
      P1-accepted single-slot PC canary carried by pc-ci-1; dispatch-only.
  m1-theta:
    status: live
    carried_by: [m1-nightly-2]
    note: >
      The M1 return canary. CARRIED AGAIN as of the 2026-09-25 receipt: m1-nightly-2
      (org runner 17) holds it, so the condition this canary existed to detect has
      been met — it sat declared `orphaned` after the host returned, which is the
      same hand-maintenance gap that hid `render-linux`. Dispatch-only, so nothing
      was starved.
      Dispatch-only (m1-runner-canary.yml). Note the label is `m1-theta`, the
      REVERSE of the production `theta-m1`; they are different labels and only
      this one is a canary.
  codex:
    status: orphaned
    carried_by: []
    note: >
      Died with mac-builder-1/2. codex-research.yml has not run since
      2026-08-13T11:11Z: run 32040094079 sat `queued` 8h+ and 32077100100
      `pending` behind it, with every firing in between `cancelled`. NOT
      re-routable in-repo — the codex CLI and ~/.codex/auth.json are host-local
      (CRX-R8) and config/codex_lane.yml is operator-immutable (CRX-R7), so a
      macstudio re-route would fail preflight while burning a production slot.
      Restore is host-side and operator-owned. This lane is a CONFIRMED queued-job
      hostage, not merely dark. 2026-09-25 receipts: run 35994988547 (created
      2026-09-24T11:46:30Z) is STILL `queued` 22h later and holds the concurrency
      group; 36032578502, 36062008421 and 36078078689 each entered `pending`
      behind it and were superseded 1s after the next firing was created;
      36109614790 (2026-09-25T07:49:21Z) holds the pending slot now. GitHub's
      24h queued-job kill lands on 35994988547 at 2026-09-25T11:46:30Z, after
      which the pending successor is promoted to `queued` and re-wedges — the
      wedge cycles, it does not self-heal.
    scheduled_use_waiver:
      since: '2026-08-17'
      reason: >
        The orphan-use gate is waived because restore is host-side and
        operator-owned (CRX-R7/CRX-R8 above), NOT because the lane is harmless.
        The original 2026-08-17 reason argued that a single-job run's queued
        firing sits `pending` and is superseded by the next 2-hourly line rather
        than holding the group for 24h; the receipts above FALSIFY that
        mechanism. GitHub supersedes `pending` runs — the runs blocked BY the
        group — and never the run holding it, and a run whose only job cannot be
        assigned sits `queued`, i.e. it is the holder. So a single-job lane is no
        safer here than daily.yml's collect_tail; being small only means it takes
        one unassignable job instead of several. Waived rather than silenced:
        scripts/check_runner_queue_hostage.py reports this lane's queue age on
        every nightly-liveness run, and this entry is the standing record that it
        is dark pending an operator host restore.
