# Static ISP, US, USER-mode pool template. One line per slot; a slot is consumed
# exclusively by one child for the life of the account (law: 1:1 sticky). Port
# order is the allocation order. Never print the password in logs.
#
# The addresses below are RFC 5737 documentation addresses on purpose: the real
# endpoint list is purchased inventory, it identifies the pool, and it belongs in
# the gitignored live file only. Copy this to proxies.yml, put the provider's
# actual host:port values in, and supply BART_USER/BART_PASS (or export them) —
# tools/xguerrilla/proxies.yml is gitignored and never committed or rsynced.
pool: proxy-pool-us-16
scheme: http
inventory:
  - 192.0.2.10:8000:${BART_USER}:${BART_PASS}
  - 192.0.2.11:8001:${BART_USER}:${BART_PASS}
  - 192.0.2.12:8002:${BART_USER}:${BART_PASS}
  - 192.0.2.13:8003:${BART_USER}:${BART_PASS}
  - 192.0.2.14:8004:${BART_USER}:${BART_PASS}
  - 192.0.2.15:8005:${BART_USER}:${BART_PASS}
  - 192.0.2.16:8006:${BART_USER}:${BART_PASS}
  - 192.0.2.17:8007:${BART_USER}:${BART_PASS}
  - 192.0.2.18:8008:${BART_USER}:${BART_PASS}
  - 192.0.2.19:8009:${BART_USER}:${BART_PASS}
  - 192.0.2.20:8010:${BART_USER}:${BART_PASS}
  - 192.0.2.21:8011:${BART_USER}:${BART_PASS}
  - 192.0.2.22:8012:${BART_USER}:${BART_PASS}
  - 192.0.2.23:8013:${BART_USER}:${BART_PASS}
  - 192.0.2.24:8014:${BART_USER}:${BART_PASS}
  - 192.0.2.25:8015:${BART_USER}:${BART_PASS}
